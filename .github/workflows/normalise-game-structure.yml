# .github/workflows/normalise-game-structure.yml
name: Normalise Game Structure

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Tenant (default: bv)'
        required: false
        default: 'bv'

permissions:
  contents: write

jobs:
  normalise:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run normalise
        run: node scripts/normalise-game-structure.js ${{ github.event.inputs.tenant }}
