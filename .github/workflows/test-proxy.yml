# .github/workflows/test-proxy.yml
name: Test Profile Proxy
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Concurrent requests per batch'
        required: false
        default: '10'
      num_batches:
        description: 'Number of sequential batches'
        required: false
        default: '3'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test
        env:
          PLAYHQ_PROXY_SECRET: ${{ secrets.PLAYHQ_PROXY_SECRET }}
        run: |
          node --input-type=module << 'NODEOF'
          import crypto from 'crypto';
          const PROXY_URL    = 'https://playhq-profile-proxy.insanoflash.workers.dev';
          const PROXY_SECRET = process.env.PLAYHQ_PROXY_SECRET;
          const BATCH_SIZE   = parseInt('${{ inputs.batch_size }}');
          const NUM_BATCHES  = parseInt('${{ inputs.num_batches }}');
          const HEADERS = {
            'accept': '*/*', 'origin': 'https://www.playhq.com',
            'user-agent': 'PlayHQ/1.47.2 Android/28 (Android SDK built for x86)',
            'tenant': 'basketball-victoria', 'content-type': 'application/json',
          };
          const API_URL = 'https://api.playhq.com/graphql';
          const Q = `query ProfileSeasonStatistics($profileID: ID!) {
            publicProfileStatistics(profileID: $profileID) {
              seasonStatistics { statistics { season { id } } }
            }
          }`;

          // UUIDs that returned 403 in the fetch script log
          const UUIDS = [
            '00ffd8c9-77bd-4d96-934d-98dbeabb4df9',
            '00c416f6-3bb4-4587-b9f5-9295fe531dbb',
            '008555c4-3878-49fd-b488-6622dd58e385',
            '00cdc8cb-63d2-42ee-a50e-d9cd76cb7c67',
            '00278e1c-9622-43d8-822a-964f68d1a7d6',
            '009c78f7-73d4-41d0-ae52-5786e9fbdc88',
            '0071ef3d-0000-0000-0000-000000000000',
            '0049aa5d-0000-0000-0000-000000000000',
            '0076a77c-0000-0000-0000-000000000000',
            '002ed89f-3351-4a61-ae69-48c12ea094b1',
            '000e88f5-0000-0000-0000-000000000000',
            '00e81d7d-0000-0000-0000-000000000000',
            '00ddc2df-0000-0000-0000-000000000000',
            '0098673d-0000-0000-0000-000000000000',
            '00938cda-9a91-4317-b7ce-8631d94cd59a',
            '00be9518-0000-0000-0000-000000000000',
            '00c17138-0000-0000-0000-000000000000',
            '0053b338-0000-0000-0000-000000000000',
            '00685a99-0000-0000-0000-000000000000',
            '00c78eb8-0000-0000-0000-000000000000',
          ];

          const authRes = await fetch(API_URL, {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID() },
            body: JSON.stringify({ operationName: 'ProfileSearch', variables: { fullName: 'a' },
              query: 'query ProfileSearch($fullName: String!) { profileSearch(fullName: $fullName) { result { id } } }' }),
          });
          const raw = authRes.headers.get('set-cookie');
          const cookie = raw.split(',').map(c => c.trim().split(';')[0]).join('; ');
          console.log(`Cookie: ${cookie.split(';').map(p=>p.trim().split('=')[0]).join(', ')}`);
          console.log(`Testing ${UUIDS.length} UUIDs that returned 403 in fetch script\n`);

          async function callUUID(uuid, n) {
            const start = Date.now();
            const res = await fetch(PROXY_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'X-Proxy-Secret': PROXY_SECRET },
              body: JSON.stringify({ cookie, graphql: { operationName: 'ProfileSeasonStatistics', variables: { profileID: uuid }, query: Q } }),
            });
            const ms = Date.now() - start;
            let result;
            if (res.status === 403) { result = '403_FORBIDDEN'; }
            else {
              try {
                const json = await res.json();
                if (json.errors) result = `NOT_FOUND`;
                else result = json?.data?.publicProfileStatistics ? `PRESENT(${json.data.publicProfileStatistics.seasonStatistics?.length}s)` : 'NULL';
              } catch { result = 'PARSE_ERR'; }
            }
            const icon = result.startsWith('PRESENT') ? '✓' : result === 'NOT_FOUND' ? '○' : result === '403_FORBIDDEN' ? '🔒' : '✗';
            console.log(`    ${icon} #${String(n).padStart(2)} [${uuid.slice(0,8)}] ${result.padEnd(12)} HTTP ${res.status} ${ms}ms`);
            return result;
          }

          for (let b = 0; b < NUM_BATCHES; b++) {
            const batch = UUIDS.slice(b * BATCH_SIZE, (b+1) * BATCH_SIZE);
            if (!batch.length) break;
            console.log(`── Batch ${b+1} (${batch.length} concurrent) ──`);
            const results = await Promise.all(batch.map((uuid,i) => callUUID(uuid, b*BATCH_SIZE+i+1)));
            const p=results.filter(r=>r.startsWith('PRESENT')).length;
            const nf=results.filter(r=>r==='NOT_FOUND').length;
            const f=results.filter(r=>r==='403_FORBIDDEN').length;
            console.log(`  PRESENT:${p} NOT_FOUND:${nf} 403:${f}\n`);
          }
          NODEOF
