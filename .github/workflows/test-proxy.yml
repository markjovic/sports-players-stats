# .github/workflows/test-proxy.yml
# Determines actual WAF quota: batch size, window duration, concurrent vs sequential behaviour.
# No checkout needed.

name: Test Profile Proxy

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: 'UUID to test with'
        required: false
        default: '00aad449-07ad-43c2-ba28-e03f112d1d87'
      test:
        description: 'Which test to run'
        type: choice
        options:
          - sequential-50       # 50 sequential calls — find where it breaks
          - concurrent-20       # 20 concurrent — does it fail faster than sequential?
          - batch-delay         # 2 batches of 10 with configurable delay between
        default: sequential-50
      delay_ms:
        description: 'Delay between batches in ms (batch-delay test only)'
        required: false
        default: '5000'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test
        env:
          PLAYHQ_PROXY_SECRET: ${{ secrets.PLAYHQ_PROXY_SECRET }}
        run: |
          node --input-type=module << 'NODEOF'
          import crypto from 'crypto';

          const PROXY_URL    = 'https://playhq-profile-proxy.insanoflash.workers.dev';
          const PROXY_SECRET = process.env.PLAYHQ_PROXY_SECRET;
          const UUID         = '${{ inputs.uuid }}';
          const TEST         = '${{ inputs.test }}';
          const DELAY_MS     = parseInt('${{ inputs.delay_ms }}');

          const HEADERS = {
            'accept': '*/*', 'origin': 'https://www.playhq.com',
            'user-agent': 'PlayHQ/1.47.2 Android/28 (Android SDK built for x86)',
            'tenant': 'basketball-victoria', 'content-type': 'application/json',
          };
          const API_URL = 'https://api.playhq.com/graphql';
          const Q = `query ProfileSeasonStatistics($profileID: ID!) {
            publicProfileStatistics(profileID: $profileID) {
              seasonStatistics { statistics { season { id } } }
            }
          }`;

          // Get session
          const authRes = await fetch(API_URL, {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID() },
            body: JSON.stringify({ operationName: 'ProfileSearch', variables: { fullName: 'a' },
              query: 'query ProfileSearch($fullName: String!) { profileSearch(fullName: $fullName) { result { id } } }' }),
          });
          const raw = authRes.headers.get('set-cookie');
          const cookie = raw.split(',').map(c => c.trim().split(';')[0]).join('; ');
          console.log(`Cookie parts: ${cookie.split(';').map(p => p.trim().split('=')[0]).join(', ')}`);
          console.log(`Test: ${TEST} | UUID: ${UUID}\n`);

          async function call(n, concurrent = false) {
            const start = Date.now();
            const res = await fetch(PROXY_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'X-Proxy-Secret': PROXY_SECRET },
              body: JSON.stringify({ cookie, graphql: { operationName: 'ProfileSeasonStatistics', variables: { profileID: UUID }, query: Q } }),
            });
            const ms = Date.now() - start;
            let result;
            try {
              const json = await res.json();
              if (json.errors) result = `ERROR: ${json.errors[0]?.message?.slice(0,40)}`;
              else result = json?.data?.publicProfileStatistics ? 'PRESENT' : 'NULL';
            } catch { result = `PARSE_ERROR`; }
            const icon = result === 'PRESENT' ? '✓' : result.startsWith('ERROR') ? '✗' : '○';
            console.log(`  #${String(n).padStart(2)}: ${icon} ${result} — HTTP ${res.status} — ${ms}ms${concurrent ? ' [concurrent]' : ''}`);
            return result;
          }

          if (TEST === 'sequential-50') {
            console.log('── 50 sequential calls — finding where it breaks ──────');
            let failures = 0;
            for (let i = 1; i <= 50; i++) {
              const r = await call(i);
              if (!r.startsWith('PRESENT')) failures++;
              if (failures >= 3) { console.log(`\n  → 3 consecutive failures at call #${i}, stopping`); break; }
              else if (!r.startsWith('PRESENT')) failures = 0;
            }

          } else if (TEST === 'concurrent-20') {
            console.log('── 20 concurrent calls ────────────────────────────────');
            const results = await Promise.all(
              Array.from({ length: 20 }, (_, i) => call(i + 1, true))
            );
            const present = results.filter(r => r === 'PRESENT').length;
            const errors  = results.filter(r => !r.startsWith('PRESENT') && r !== 'NULL').length;
            console.log(`\n  PRESENT: ${present}/20 | ERRORS: ${errors}/20`);

          } else if (TEST === 'batch-delay') {
            console.log(`── Batch 1 (10 concurrent) ────────────────────────────`);
            const b1 = await Promise.all(Array.from({ length: 10 }, (_, i) => call(i + 1, true)));
            const b1ok = b1.filter(r => r === 'PRESENT').length;
            console.log(`  Batch 1: ${b1ok}/10 PRESENT`);

            console.log(`\n  Waiting ${DELAY_MS}ms...`);
            await new Promise(r => setTimeout(r, DELAY_MS));

            console.log(`\n── Batch 2 (10 concurrent) ────────────────────────────`);
            const b2 = await Promise.all(Array.from({ length: 10 }, (_, i) => call(i + 11, true)));
            const b2ok = b2.filter(r => r === 'PRESENT').length;
            console.log(`  Batch 2: ${b2ok}/10 PRESENT`);

            console.log(`\n  Delay ${DELAY_MS}ms — Batch 1: ${b1ok}/10, Batch 2: ${b2ok}/10`);
          }
          NODEOF
