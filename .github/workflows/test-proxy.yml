# .github/workflows/test-proxy.yml
# Tests the Cloudflare proxy for publicProfileStatistics — no checkout needed.
# Tests session, proxy connectivity, and a sample of UUIDs with full verbose output.

name: Test Profile Proxy

on:
  workflow_dispatch:
    inputs:
      uuids:
        description: 'Comma-separated UUIDs to test (leave blank for built-in samples)'
        required: false
        default: '00aad449-07ad-43c2-ba28-e03f112d1d87,0026fcee-f2b4-464a-821b-d78b55ff1022,d5fdad36-60a7-422c-b219-93aaeb438e3c'
      count:
        description: 'Times to call each UUID (tests rate limiting)'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test proxy
        env:
          PLAYHQ_PROXY_SECRET: ${{ secrets.PLAYHQ_PROXY_SECRET }}
        run: |
          node --input-type=module << 'NODEOF'
          import crypto from 'crypto';

          const PROXY_URL    = 'https://playhq-profile-proxy.insanoflash.workers.dev';
          const PROXY_SECRET = process.env.PLAYHQ_PROXY_SECRET;
          const UUIDS        = '${{ inputs.uuids }}'.split(',').map(s => s.trim()).filter(Boolean);
          const COUNT        = parseInt('${{ inputs.count }}');

          const HEADERS = {
            'accept': '*/*', 'origin': 'https://www.playhq.com',
            'user-agent': 'PlayHQ/1.47.2 Android/28 (Android SDK built for x86)',
            'tenant': 'basketball-victoria', 'content-type': 'application/json',
          };
          const API_URL = 'https://api.playhq.com/graphql';

          const Q = `query ProfileSeasonStatistics($profileID: ID!) {
            publicProfileStatistics(profileID: $profileID) {
              seasonStatistics { statistics { season { id } } }
            }
          }`;

          console.log('═══════════════════════════════════════════════════');
          console.log('  PlayHQ Profile Proxy Test');
          console.log('═══════════════════════════════════════════════════');
          console.log(`  Proxy URL    : ${PROXY_URL || '(not set — will test direct)'}`);
          console.log(`  Proxy Secret : ${PROXY_SECRET ? '✓ set' : '✗ NOT SET'}`);
          console.log(`  UUIDs        : ${UUIDS.length}`);
          console.log(`  Calls each   : ${COUNT}`);
          console.log('');

          // ── Step 1: Session ──────────────────────────────────────────
          console.log('── Step 1: Get session cookie ──────────────────────');
          const authRes = await fetch(API_URL, {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID() },
            body: JSON.stringify({
              operationName: 'ProfileSearch', variables: { fullName: 'a' },
              query: 'query ProfileSearch($fullName: String!) { profileSearch(fullName: $fullName) { result { id } } }',
            }),
          });
          const raw = authRes.headers.get('set-cookie');
          if (!raw) { console.log('  ✗ FAILED — no Set-Cookie header'); process.exit(1); }
          const cookie = raw.split(',').map(c => c.trim().split(';')[0]).join('; ');
          console.log(`  ✓ Cookie: ${cookie.slice(0, 48)}...`);
          console.log(`  Cookie parts: ${cookie.split(';').map(p => p.trim().split('=')[0]).join(', ')}`);
          console.log('');

          // ── Step 2: Proxy connectivity ───────────────────────────────
          if (PROXY_URL && PROXY_SECRET) {
            console.log('── Step 2: Proxy connectivity check ────────────────');
            try {
              const pingRes = await fetch(PROXY_URL, { method: 'GET', headers: { 'X-Proxy-Secret': PROXY_SECRET } });
              console.log(`  HTTP ${pingRes.status} — ${pingRes.status === 405 ? '✓ Worker is live' : '? unexpected status'}`);
            } catch(e) {
              console.log(`  ✗ Could not reach proxy: ${e.message}`);
              process.exit(1);
            }
            console.log('');
          }

          // ── Step 3: Profile requests ─────────────────────────────────
          const useProxy = !!(PROXY_URL && PROXY_SECRET);
          console.log(`── Step 3: Profile requests (via ${useProxy ? 'PROXY' : 'DIRECT'}) ─────────────`);

          async function fetchProfile(uuid, attempt) {
            const start = Date.now();
            let res;
            if (useProxy) {
              res = await fetch(PROXY_URL, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'X-Proxy-Secret': PROXY_SECRET },
                body: JSON.stringify({ cookie, graphql: { operationName: 'ProfileSeasonStatistics', variables: { profileID: uuid }, query: Q } }),
              });
            } else {
              res = await fetch(API_URL, {
                method: 'POST',
                headers: { ...HEADERS, 'request-id': crypto.randomUUID(), 'Cookie': cookie },
                body: JSON.stringify({ operationName: 'ProfileSeasonStatistics', variables: { profileID: uuid }, query: Q }),
              });
            }
            const ms = Date.now() - start;
            let body;
            try { body = await res.json(); } catch(e) {
              return { status: res.status, result: 'PARSE_ERROR', ms, error: e.message };
            }
            if (body.errors) return { status: res.status, result: 'ERROR', ms, error: body.errors[0]?.message };
            const pps = body?.data?.publicProfileStatistics;
            return { status: res.status, result: pps ? `PRESENT (${pps.seasonStatistics?.length} seasons)` : 'NULL', ms };
          }

          let totalPresent = 0, totalNull = 0, totalError = 0;
          for (const uuid of UUIDS) {
            console.log(`\n  UUID: ${uuid}`);
            for (let i = 1; i <= COUNT; i++) {
              const r = await fetchProfile(uuid, i);
              const icon = r.result.startsWith('PRESENT') ? '✓' : r.result === 'NULL' ? '○' : '✗';
              console.log(`    #${i}: ${icon} ${r.result} — HTTP ${r.status} — ${r.ms}ms${r.error ? ` — ${r.error}` : ''}`);
              if (r.result.startsWith('PRESENT')) totalPresent++;
              else if (r.result === 'NULL') totalNull++;
              else totalError++;
            }
          }

          console.log('\n═══════════════════════════════════════════════════');
          console.log('  Results');
          console.log('═══════════════════════════════════════════════════');
          console.log(`  PRESENT : ${totalPresent}`);
          console.log(`  NULL    : ${totalNull}`);
          console.log(`  ERROR   : ${totalError}`);
          console.log(`  Via     : ${useProxy ? 'PROXY ✓' : 'DIRECT (proxy not configured)'}`);
          NODEOF
