# .github/workflows/audit-uuid-recovery-misattribution.yml
name: Audit UUID Recovery Misattribution (read-only)

# Quantifies a suspected correlation bug in recover-uuids-from-git-history.js:
# it paired current and pre-migration attendee-array entries by INDEX
# POSITION, which is unsafe for games/bv's p[] field (rewritten wholesale by
# nightly-crawl.js from live data, so its order can drift over time). Confirmed
# in practice on 2026-07-11 -- a recovered uuid didn't match any real player
# in the game it was attributed to.
#
# Needs TWO historical snapshots of games/bv, found by commit message:
#   pre-migration: the commit right before migrate-uuid-truncation.js's own
#                  commits -- same reference point recover-uuids-from-git-history.js
#                  used originally.
#   pre-recovery:  the commit right before recover-uuids-from-git-history.js's
#                  own commits -- gives back the ORIGINAL truncated prefix at
#                  each slot, which recovery's own commit overwrote and which
#                  is otherwise no longer visible anywhere.
#
# Each snapshot is fetched via a plain second/third `actions/checkout` at a
# pinned SHA into its own path -- the SAME two-checkout architecture already
# proven to work for recover-uuids-from-git-history.js's own workflow earlier
# this session. (An earlier version of this workflow used `git archive`
# against the partial-clone -- that made git negotiate missing blobs on the
# fly and was far slower than expected; a plain checkout at a pinned ref is
# the standard, fast path and doesn't need anything cleverer.)
#
# Read-only. Writes only reports/uuid-recovery-misattribution-audit.json.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current (full history for commit search; sparse content)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            games
            scripts
            reports
            players/indexes
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: Locate pre-migration and pre-recovery reference commits
        run: |
          set -e
          echo "Searching for migrate-uuid-truncation.js's first commit..."
          MIGRATION_FIRST=$(git log --all --reverse --format="%H" --grep="migrate-uuid-truncation" | head -1)
          if [ -z "$MIGRATION_FIRST" ]; then
            echo "FATAL: no commit found matching 'migrate-uuid-truncation' in the message."
            echo "This workflow needs manual adjustment -- find the right commit SHA by hand"
            echo "(the one right before games/bv ids were first truncated) and hardcode it below."
            exit 1
          fi
          PRE_MIGRATION=$(git rev-parse "${MIGRATION_FIRST}^")
          echo "migrate-uuid-truncation first commit: $MIGRATION_FIRST"
          echo "pre-migration reference commit:        $PRE_MIGRATION"

          echo "Searching for recover-uuids-from-git-history.js's first commit..."
          RECOVERY_FIRST=$(git log --all --reverse --format="%H" --grep="recover-uuids-from-git-history:" | head -1)
          if [ -z "$RECOVERY_FIRST" ]; then
            echo "FATAL: no commit found matching 'recover-uuids-from-git-history:' in the message."
            exit 1
          fi
          PRE_RECOVERY=$(git rev-parse "${RECOVERY_FIRST}^")
          echo "recover-uuids-from-git-history first commit: $RECOVERY_FIRST"
          echo "pre-recovery reference commit:                $PRE_RECOVERY"

          echo "PRE_MIGRATION=$PRE_MIGRATION" >> "$GITHUB_ENV"
          echo "PRE_RECOVERY=$PRE_RECOVERY"   >> "$GITHUB_ENV"

      - name: List every commit touching games/ between the two reference points (for manual verification)
        run: |
          # This step exists purely so the commit selection above can be checked
          # by eye instead of trusted. recover-uuids-from-git-history.js's own
          # header comments mention three earlier, abandoned attempts (including
          # runs killed by SIGTERM) before the version whose commits the grep
          # above matches. If any of those earlier attempts made partial commits
          # under a different message, they would sit between PRE_MIGRATION and
          # PRE_RECOVERY undetected by the grep -- this lists everything in that
          # range so that possibility can be ruled in or out directly, rather
          # than assumed away.
          echo "All commits touching games/ from PRE_MIGRATION to PRE_RECOVERY (inclusive):"
          echo "-------------------------------------------------------------------------"
          git log --reverse --format="%H  %ad  %s" --date=iso-strict "${PRE_MIGRATION}..${PRE_RECOVERY}" -- games/ | nl
          echo ""
          echo "Commit counts by message prefix (first 40 chars) in that range -- anything"
          echo "other than the two expected script names below is worth a manual look:"
          echo "-------------------------------------------------------------------------"
          git log --format="%s" "${PRE_MIGRATION}..${PRE_RECOVERY}" -- games/ | cut -c1-40 | sort | uniq -c | sort -rn

      - name: Checkout pre-migration snapshot (games/bv only, pinned SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRE_MIGRATION }}
          path: pre-migration
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            games
          sparse-checkout-cone-mode: false

      - name: Checkout pre-recovery snapshot (games/bv only, pinned SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRE_RECOVERY }}
          path: pre-recovery
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            games
          sparse-checkout-cone-mode: false

      - name: Verify snapshots landed
        run: |
          echo "pre-migration files: $(ls pre-migration/games/bv | wc -l)"
          echo "pre-recovery files:  $(ls pre-recovery/games/bv | wc -l)"

      - name: Run audit
        run: node scripts/audit-uuid-recovery-misattribution.js
