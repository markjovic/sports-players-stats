# .github/workflows/diagnose-grade-pagination.yml
name: Diagnose Grade Pagination (read-only)

# READ-ONLY. Verifies a correction to playhq_api_reference.md: the doc claims
# gradePlayerStatistics is capped at 50 results with no pagination, but that
# was measured using a query missing the $filter argument. This checks live,
# against the same known grade (c952bf59) already used in
# diagnose-namespace-mismatch.js's known-case validation, whether
# filter.pagination actually pages past the first 50.
#
# No writes, no commits, no lock. Job shape mirrors the proven fetch job in
# fetch-profile-stats-matrix.yml (no actions/setup-node step).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts/diagnose-grade-pagination.js
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run diagnostic (read-only)
        run: node scripts/diagnose-grade-pagination.js
