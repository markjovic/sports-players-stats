# .github/workflows/probe-registrations.yml
name: Probe Registrations

# READ-ONLY. No writes, no commits, no data-write lock.
#
# 1,115,172 appearances sit in games where the player holds a registration for
# that SEASON but not for either TEAM. The rosters are verified correct against
# PlayHQ's own API (2026-08-18: 55 games re-fetched, zero cases of the live box
# holding anyone we lack), so the games are real and the registration list is
# short.
#
# fetch-profile-stats.js writes registrations ONLY from
# publicProfileStatistics.seasonStatistics. Two candidates remain, needing
# OPPOSITE responses:
#   A. PlayHQ HAS the registration and seasonStatistics does not surface it.
#      publicProfileTeams returns every registration regardless of statistics, so
#      the fix would be to source them there.
#   B. The player was a FILL-IN and never registered. publicProfileTeams would not
#      list them either, the appearance is real, and the 1.1M is EXPECTED.
#
# This asks publicProfileTeams for players who have such appearances and reports
# whether it lists the teams in question. One API call per player, paced.
#
# NO actions/setup-node (this job fetches api.playhq.com — absolute rule).

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many affected players to probe (one API call each)'
        required: false
        default: '40'
        type: string
      seed:
        description: 'Sampling seed — the same seed probes the SAME players'
        required: false
        default: '20260818'
        type: string
      uuid:
        description: 'Optional: restrict to ONE player uuid'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe registrations
        run: |
          ARGS="--sample=${{ inputs.sample }} --seed=${{ inputs.seed }}"
          if [ -n "${{ inputs.uuid }}" ]; then ARGS="$ARGS --uuid=${{ inputs.uuid }}"; fi
          node --max-old-space-size=8192 scripts/probe-registrations.js $ARGS
