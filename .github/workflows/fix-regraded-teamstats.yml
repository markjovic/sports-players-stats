# .github/workflows/fix-regraded-teamstats.yml

name: Fix Regraded Team Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run fix
        run: node scripts/fix-regraded-teamstats.js

      - name: Final push (safety net)
        if: always()
        run: |
          git add team-stats/bv/ || true
          git diff --staged --quiet || git commit -m "fix-regraded-teamstats: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
