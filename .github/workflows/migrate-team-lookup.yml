# .github/workflows/migrate-team-lookup.yml
name: Migrate Team Lookup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report only, no files written'
        required: false
        default: false
        type: boolean

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run migration
        run: node migrate-team-lookup.js ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit final results
        run: |
          STASHED=$(git stash 2>&1)
          git pull --rebase=false --no-edit -X ours
          if echo "$STASHED" | grep -q "Saved"; then git stash pop; fi
          git add players/ team-lookup/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Team lookup migration: final commit"
            git push
          fi
