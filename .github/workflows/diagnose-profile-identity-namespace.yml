# .github/workflows/diagnose-profile-identity-namespace.yml
name: Diagnose Profile Identity Namespace Mismatch (read-only)

# Tests whether api.playhq.com and spectator.playhq.com can disagree on
# which uuid identifies the same real player (confirmed directly for 3 of 13
# players in one sampled game -- William Mallen, Charlie Raynor, Jack
# Delaney). Our own capture only ever sees spectator.playhq.com's profileID;
# the separate profile-stats backfill queries api.playhq.com's
# publicProfileStatistics using that same uuid. If that only recognizes its
# own namespace, players whose ids have diverged get a false "private"/"not
# found" result -- unrelated to any real privacy setting.
#
# This calls the project's existing Cloudflare Worker
# (solitary-snowflake-cb3e.insanoflash.workers.dev/profile/{id}?tenant=bv)
# rather than api.playhq.com directly -- the Worker gets its PlayHQ session
# from Cloudflare's own network, so this workflow never fights GitHub
# Actions' IP reputation against PlayHQ's CloudFront WAF at all. No matrix/
# parallel-attempt workaround needed for that reason.
#
# No writes, no git commits, no changes to games/ or players/ -- console
# output only.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run diagnostic
        run: node scripts/diagnose-profile-identity-namespace.js
