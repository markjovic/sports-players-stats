# .github/workflows/clear-stats-checked.yml
name: Clear Stats Checked

on:
  workflow_dispatch:
    inputs:
      nameless_only:
        description: 'Only clear players with no name (use after fix-corrupt-player-names)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clear statsChecked
        run: |
          ARGS=""
          if [ "${{ inputs.nameless_only }}" = "true" ]; then ARGS="--nameless-only"; fi
          node scripts/clear-stats-checked.js $ARGS
