# .github/workflows/diagnose-hidden-gaps.yml
name: Diagnose Hidden Game Gaps

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run diagnostic
        run: node diagnose-hidden-gaps.js
