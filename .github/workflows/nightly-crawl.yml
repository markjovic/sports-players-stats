# .github/workflows/nightly-crawl.yml
name: Nightly Crawl

# `dry_run` input REMOVED 2026-08-01, deliberately — do not re-add it without reading this.
# It was declared `type: boolean` and gated eight jobs with `if: ${{ inputs.dry_run != 'true' }}`.
# GitHub coerces mismatched types to numbers for comparison: true->1, false->0, and the STRING
# 'true'->NaN. Nothing equals NaN, so `!=` was ALWAYS true and every gated job ran regardless —
# a "dry run" still wrote team-stats, win-loss, team-index, venue-lookup and venue-indexes, and
# dispatched the matrix. Only the bash guard inside the crawl step worked, because bash renders
# the boolean as the string `true`. Removing the input changed NO runtime behaviour; the jobs
# already always ran. It removed a switch that lied.
# If a dry run is ever wanted again: gate in BASH, or use the robust form
# `inputs.x == true || inputs.x == 'true'` (claude_context, boolean-input rule / trap T3).

on:
  schedule:
    - cron: '0 15 * * *'   # 01:00 AEST (UTC+10) daily
  workflow_dispatch:
    inputs:
      rounds_back:
        description: 'Rounds to look back (default 2; use 4-6 for backfill)'
        required: false
        default: '2'
        type: string
      season:
        description: 'Single season ID (leave blank for all active)'
        required: false
        type: string
      force_recheck:
        description: 'Ignore round-complete markers and re-fetch every round'
        required: false
        default: false
        type: boolean
      consecutive_zeros:
        description: 'Consecutive zero-progress runs — do not set manually'
        required: false
        default: '0'
        type: string
      no_round_refresh:
        description: 'Turn OFF the per-grade fixture refresh entirely (restores the pre-2026-11-22 behaviour: no forward fetch, no deletions)'
        required: false
        default: false
        type: boolean
      refresh_rounds_ahead:
        description: 'Unplayed rounds beyond the current one to re-fetch per grade (default 2)'
        required: false
        default: '2'
        type: string
      refresh_dry_run:
        description: 'Refresh fetches and reports, but deletes nothing and writes no fingerprint'
        required: false
        default: false
        type: boolean
      baseline_grades_per_run:
        description: 'How many never-seen grades may take their first full pass this run (default 2000). The rest wait for a later night and are reported.'
        required: false
        default: '2000'
        type: string
      runaway_stop:
        description: 'Hard halt if one run would delete more than this many games (default 20000). A runaway stop, NOT a review gate.'
        required: false
        default: '20000'
        type: string
      max_deletes:
        description: 'Advisory per-run deletion threshold (default 500). Exceeding it WARNS and proceeds — every deletion is archived to data/withdrawn-games/ and restorable.'
        required: false
        default: '500'
        type: string
      max_deletes_per_season:
        description: 'Advisory per-season deletion threshold (default 100). Warns and proceeds, same as max_deletes.'
        required: false
        default: '100'
        type: string
      fail_on_delete_cap:
        description: 'Fail the run if the runaway stop fires. Default off: the crawl itself succeeded, and failing it skips team-stats, win-loss, team-index and the chain for the whole night.'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      games_remaining: ${{ steps.status.outputs.games_remaining }}
      games_processed: ${{ steps.status.outputs.games_processed }}
      new_players:     ${{ steps.status.outputs.new_players }}
      stats_rechecks:  ${{ steps.status.outputs.stats_rechecks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run nightly crawl
        # ⚠ A SCHEDULED RUN RECEIVES NO INPUTS (T27). Every value below is
        # resolved through an explicit fallback at its use site, so the nightly
        # cron gets the documented defaults rather than empty strings — an empty
        # `--refresh-rounds-ahead=` would parse as NaN and an empty `--max-deletes=`
        # would read as 0, which silently disables the very thing that protects
        # the data.
        #
        # The refresh inputs go through `env:` and are gated in bash rather than
        # interpolated into the command line: these are the arguments that govern
        # deletion, and a guard must fail toward doing LESS (T3). Anything that is
        # not a whole number refuses rather than being passed through.
        env:
          NO_ROUND_REFRESH:  ${{ inputs.no_round_refresh }}
          REFRESH_AHEAD:     ${{ inputs.refresh_rounds_ahead }}
          REFRESH_DRY_RUN:   ${{ inputs.refresh_dry_run }}
          BASELINE_PER_RUN:  ${{ inputs.baseline_grades_per_run }}
          MAX_DELETES:       ${{ inputs.max_deletes }}
          MAX_DELETES_SEAS:  ${{ inputs.max_deletes_per_season }}
          RUNAWAY_STOP:      ${{ inputs.runaway_stop }}
          FAIL_ON_CAP:       ${{ inputs.fail_on_delete_cap }}
        run: |
          set -euo pipefail

          # ⚠ PRINT WHAT GITHUB ACTUALLY PASSED, BEFORE ANY GATING.
          # On 2026-11-22 a run that was dispatched with refresh_dry_run ticked
          # reached the script WITHOUT --refresh-dry-run, and deleted live up to
          # the per-season cap. The gating below reads correctly and the failure
          # could not be reproduced, so the next occurrence has to diagnose
          # itself rather than rest on anyone's recollection. These five lines
          # are the raw inputs context as the runner received it.
          echo "::group::Resolved dispatch inputs (raw)"
          echo "  no_round_refresh        = '${NO_ROUND_REFRESH:-<unset>}'"
          echo "  refresh_dry_run         = '${REFRESH_DRY_RUN:-<unset>}'"
          echo "  refresh_rounds_ahead    = '${REFRESH_AHEAD:-<unset>}'"
          echo "  baseline_grades_per_run = '${BASELINE_PER_RUN:-<unset>}'"
          echo "  max_deletes             = '${MAX_DELETES:-<unset>}'"
          echo "  max_deletes_per_season  = '${MAX_DELETES_SEAS:-<unset>}'"
          echo "  runaway_stop            = '${RUNAWAY_STOP:-<unset>}'"
          echo "  fail_on_delete_cap      = '${FAIL_ON_CAP:-<unset>}'"
          echo "  event_name              = '${GITHUB_EVENT_NAME:-<unset>}'"
          echo "::endgroup::"

          ARGS="--rounds-back=${{ inputs.rounds_back || '2' }}"
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          if [ "${{ inputs.force_recheck }}" = "true" ]; then ARGS="$ARGS --force-recheck"; fi

          num_or_die () {   # $1 = value, $2 = default, $3 = name
            v="${1:-$2}"
            case "$v" in
              # >&2: this runs inside a command substitution, so anything on
              # stdout is captured into ARGS and never reaches the log. The first
              # version swallowed its own error annotation.
              ''|*[!0-9]*) echo "::error::$3 must be a whole number, got '$v'" >&2; exit 1 ;;
            esac
            printf '%s' "$v"
          }

          if [ "${NO_ROUND_REFRESH:-false}" = "true" ]; then
            ARGS="$ARGS --no-round-refresh"
          else
            ARGS="$ARGS --refresh-rounds-ahead=$(num_or_die "${REFRESH_AHEAD:-}" 2 refresh_rounds_ahead)"
            ARGS="$ARGS --baseline-grades-per-run=$(num_or_die "${BASELINE_PER_RUN:-}" 2000 baseline_grades_per_run)"
            ARGS="$ARGS --max-deletes=$(num_or_die "${MAX_DELETES:-}" 500 max_deletes)"
            ARGS="$ARGS --max-deletes-per-season=$(num_or_die "${MAX_DELETES_SEAS:-}" 100 max_deletes_per_season)"
            ARGS="$ARGS --runaway-stop=$(num_or_die "${RUNAWAY_STOP:-}" 20000 runaway_stop)"
            if [ "${REFRESH_DRY_RUN:-false}" = "true" ]; then ARGS="$ARGS --refresh-dry-run"; fi
            if [ "${FAIL_ON_CAP:-false}"    = "true" ]; then ARGS="$ARGS --fail-on-delete-cap"; fi
          fi

          case "$ARGS" in
            *--no-round-refresh*) echo "MODE: refresh DISABLED" ;;
            *--refresh-dry-run*)  echo "MODE: refresh DRY RUN — nothing will be deleted" ;;
            *)                    echo "MODE: refresh LIVE — withdrawn fixtures WILL be deleted (caps apply)" ;;
          esac
          echo "running: node scripts/nightly-crawl.js $ARGS"
          node scripts/nightly-crawl.js $ARGS

      - name: Read status
        id: status
        if: always()
        run: |
          if [ -f .nightly-status.json ]; then
            remaining=$(node -e "console.log(require('./.nightly-status.json').gamesRemaining || 0)")
            processed=$(node -e "console.log(require('./.nightly-status.json').gamesProcessed || 0)")
            stubbed=$(node -e "console.log(require('./.nightly-status.json').stubbed || 0)")
          else
            remaining=0
            processed=0
            stubbed=0
          fi
          echo "games_remaining=$remaining" >> $GITHUB_OUTPUT
          echo "games_processed=$processed" >> $GITHUB_OUTPUT
          echo "new_players=$stubbed" >> $GITHUB_OUTPUT
          if [ -f "needs-matrix-shards.json" ]; then
            rechecks=$(node -e "console.log(JSON.parse(require('fs').readFileSync('needs-matrix-shards.json')).length)")
          else
            rechecks=0
          fi
          echo "stats_rechecks=$rechecks" >> $GITHUB_OUTPUT
          echo "Remaining: $remaining  Processed: $processed  New players: $stubbed  Rechecks: $rechecks"
          # The refresh's own result, raised to the run summary. A deletion cap
          # abort does not fail the job by default, so without this line the only
          # record of it is a ::warning:: part-way up a long log.
          if [ -f .nightly-status.json ]; then
            deleted=$(node -e "console.log(require('./.nightly-status.json').refreshDeleted || 0)")
            capped=$(node -e "console.log(require('./.nightly-status.json').refreshCapHit ? 'YES' : 'no')")
            echo "Withdrawn fixtures deleted: $deleted   deletion cap hit: $capped"
            echo "Withdrawn fixtures deleted: **$deleted**, deletion cap hit: **$capped**" >> $GITHUB_STEP_SUMMARY
          fi

  team-stats:
    needs: crawl
    runs-on: ubuntu-latest
    # ⚠️ RAISED 60 -> 240 on 2026-09-09. IT MUST STAY ABOVE THE PUSH RETRY BUDGET (T55).
    # build-team-stats.js's gitCommit is the house loop: 60 attempts with 1-91s random
    # jitter, which is ~89 minutes of sleeping plus ~20 minutes of fetch/merge/push
    # cycles — about 109 minutes for a SINGLE commit. And it commits every 50 seasons
    # (COMMIT_EVERY), so a run makes several. 60 sat inside that budget from the day
    # the loop was added on 2026-07-28: contention killed the job mid-retry and the log
    # showed a timeout instead of the real push error.
    #
    # Also fixed the same day: its stage/commit failure used to print and return, so
    # only a push failure could turn the job red.
    #
    # If COMMIT_EVERY, the attempt count or the jitter range change, re-check this.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: main is LOAD-BEARING (2026-08-04, trap T21). Without it, checkout
          # uses github.sha — the tree AS OF THE RUN TRIGGER, frozen before the
          # crawl wrote anything. Every consumer job in this workflow was computing
          # against YESTERDAY'S games, every night, since the job split: the
          # one-game W/L lag Mark found was this. ref: main fetches main as of
          # THIS JOB'S start, i.e. including the crawl's pushes.
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build team stats (active seasons)
        run: node scripts/build-team-stats.js --active-only

  team-index:
    needs: crawl
    runs-on: ubuntu-latest
    # ⚠️ RAISED 15 -> 150 on 2026-09-08. IT MUST STAY ABOVE THE PUSH RETRY BUDGET.
    # update-team-index.js had no push retry and a try/catch that printed the error
    # and exited ZERO, so a lost push showed green. It now retries 60 times with up
    # to 90s jitter and THROWS on exhaustion — roughly 114 minutes worst case, plus
    # ~10 minutes to scan 418k player files. A timeout of 15 sits INSIDE that and
    # would kill the job mid-retry, hiding the real cause. That is exactly what
    # happened to build-venue-indexes at 45 and again at 120 in August 2026.
    #
    # The cost: this job can now hold the run's data-write lock for longer under
    # heavy contention. That is the right trade — a slow correct run beats a fast
    # green one that wrote nothing. `crawl` already reserves 300 for the same reason.
    #
    # If the retry count or the jitter range ever changes, re-check this number.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: main is LOAD-BEARING (2026-08-04, trap T21). Without it, checkout
          # uses github.sha — the tree AS OF THE RUN TRIGGER, frozen before the
          # crawl wrote anything. Every consumer job in this workflow was computing
          # against YESTERDAY'S games, every night, since the job split: the
          # one-game W/L lag Mark found was this. ref: main fetches main as of
          # THIS JOB'S start, i.e. including the crawl's pushes.
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/update-team-index.js

  venue-lookup:
    needs: crawl
    runs-on: ubuntu-latest
    # ⚠️ RAISED 30 -> 180 on 2026-09-09, BECAUSE THE SCRIPT CHANGED (T55).
    # 30 was correct for the loop update-venue-lookup.js used to have: 10 attempts with
    # a short backoff, about 8 minutes worst case. But that loop also SWALLOWED a total
    # push failure and returned, so the job went green having written nothing, and its
    # merge was missing --no-stat (the ENOBUFS class). It is now on the house pattern —
    # 60 attempts, 1-91s jitter, throws on exhaustion — which is ~109 minutes worst
    # case, and 30 would now kill it mid-retry.
    #
    # This is the trap in both directions: raising a retry loop makes a timeout that
    # was correct yesterday wrong today. Change one, re-check the other.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: main is LOAD-BEARING (2026-08-04, trap T21). Without it, checkout
          # uses github.sha — the tree AS OF THE RUN TRIGGER, frozen before the
          # crawl wrote anything. Every consumer job in this workflow was computing
          # against YESTERDAY'S games, every night, since the job split: the
          # one-game W/L lag Mark found was this. ref: main fetches main as of
          # THIS JOB'S start, i.e. including the crawl's pushes.
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          node scripts/update-venue-lookup.js $ARGS

  # venue-indexes MOVED to post-drain-chain.yml (2026-08-07): post-drain by
  # construction, so the matrix-storm push contention that forced its 240-minute
  # backstop is gone at the source instead of tolerated.


  profile-stats-matrix:
    # 2026-07-31: `win-loss` added to needs. It was [crawl, team-stats] only, and
    # win-loss also hangs off crawl — so the two ran in PARALLEL and the matrix was
    # dispatched as soon as team-stats finished, while build-win-loss.js could still
    # be writing player files for up to another 120 minutes.
    #
    # The dispatched matrix is a SEPARATE workflow run with no data-write lock, so it
    # started immediately and its apply-and-commit wrote players/ concurrently with
    # win-loss. Both push; `merge -X ours` keeps whichever lands second and silently
    # discards the other's version of any file they both touched. That is the win-loss
    # race that already cost data, and this workflow's own data-write lock cannot stop
    # it — the lock only covers runs IN the group, and the matrix run is not.
    #
    # Ordering, not locking: putting a concurrency group on the matrix's
    # apply-and-commit would make it queue behind this workflow (which holds
    # data-write for its whole run, up to 300+ min) and stall the chain. `needs` costs
    # nothing and removes the overlap entirely.
    #
    # `always()` below is preserved deliberately: a FAILED win-loss must not skip the
    # matrix, only a still-RUNNING one should delay it.
    needs: [crawl, team-stats, win-loss]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.crawl.outputs.new_players != '0' || needs.crawl.outputs.stats_rechecks != '0')
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: main is LOAD-BEARING (2026-08-04, trap T21). Without it, checkout
          # uses github.sha — the tree AS OF THE RUN TRIGGER, frozen before the
          # crawl wrote anything. Every consumer job in this workflow was computing
          # against YESTERDAY'S games, every night, since the job split: the
          # one-game W/L lag Mark found was this. ref: main fetches main as of
          # THIS JOB'S start, i.e. including the crawl's pushes.
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dispatch retry helper
        # A chain-critical `gh workflow run` is never one-shot (directive 14). On
        # 2026-07-27 a single HTTP 500 stopped the matrix chain — no retrigger, no
        # terminal, no build-team-stats — so rosters silently went stale repo-wide
        # while every player file was correct. The four dispatches in this file are
        # worse: two of them are WEEKLY, so one lost call costs a full week's sweep
        # and the run still shows green. Helper copied VERBATIM from
        # fetch-profile-stats-matrix.yml (the proven site) — not retyped.
        # /tmp is per-job, so each dispatching job installs its own copy.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Trigger targeted matrix shards
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: |
          new_players="${{ needs.crawl.outputs.new_players }}"
          rechecks="${{ needs.crawl.outputs.stats_rechecks }}"
          echo "New players: $new_players  |  Stat rechecks: $rechecks"

          # Built as an ARRAY. The old form interpolated $shards_arg unquoted, so any
          # whitespace inside the JSON would word-split it; the helper takes "$@" and
          # an array preserves each --field as one argument. For a well-formed
          # needs-matrix-shards.json the dispatched value is byte-identical to before.
          args=( --field "run_number=1" --field "consecutive_zeros=0" )
          if [ -f "needs-matrix-shards.json" ]; then
            shards="$(tr -d '[:space:]' < needs-matrix-shards.json)"
            echo "Targeted shards: $shards"
            args+=( --field "shards=$shards" )
          fi
          # No file => no shards field => the matrix's own default '[]' => all 256.
          # Unchanged: the old code passed an empty $shards_arg in that case.

          /tmp/gh-dispatch.sh fetch-profile-stats-matrix.yml "${args[@]}"

  win-loss:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: main is LOAD-BEARING (2026-08-04, trap T21). Without it, checkout
          # uses github.sha — the tree AS OF THE RUN TRIGGER, frozen before the
          # crawl wrote anything. Every consumer job in this workflow was computing
          # against YESTERDAY'S games, every night, since the job split: the
          # one-game W/L lag Mark found was this. ref: main fetches main as of
          # THIS JOB'S start, i.e. including the crawl's pushes.
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build win-loss records (active seasons)
        run: node scripts/build-win-loss.js --active-only

  retrigger:
    needs: crawl
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.crawl.outputs.games_remaining != '0' &&
      needs.crawl.outputs.games_remaining != ''
    steps:
      - name: Install dispatch retry helper
        # A chain-critical `gh workflow run` is never one-shot (directive 14). On
        # 2026-07-27 a single HTTP 500 stopped the matrix chain — no retrigger, no
        # terminal, no build-team-stats — so rosters silently went stale repo-wide
        # while every player file was correct. The four dispatches in this file are
        # worse: two of them are WEEKLY, so one lost call costs a full week's sweep
        # and the run still shows green. Helper copied VERBATIM from
        # fetch-profile-stats-matrix.yml (the proven site) — not retyped.
        # /tmp is per-job, so each dispatching job installs its own copy.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Check consecutive zeros and retrigger
        run: |
          remaining=${{ needs.crawl.outputs.games_remaining }}
          processed=${{ needs.crawl.outputs.games_processed }}
          zeros=${{ inputs.consecutive_zeros || '0' }}
          if [ "$processed" = "0" ]; then new_zeros=$((zeros + 1)); else new_zeros=0; fi
          if [ "$new_zeros" -ge 3 ]; then
            echo "🛑 Zero progress for 3 consecutive runs with $remaining games remaining."
            exit 1
          fi
          echo "↺ $remaining games remaining — re-triggering (consecutive zeros: $new_zeros)"
          /tmp/gh-dispatch.sh nightly-crawl.yml \
            --field "rounds_back=${{ inputs.rounds_back || '2' }}" \
            --field "consecutive_zeros=${new_zeros}"
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}

  # graduate job MOVED to post-drain-chain.yml's tail (2026-08-07, OUTSTANDING §2.7):
  # dispatching graduation after the chain releases data-write removes the last waiter
  # that could share the one-slot pending queue with anything.

  # discover-seasons / discover-fixtures-weekly REMOVED 2026-08-10: both were
  # dispatched HERE, at the same instant as post-drain-chain, and all three claim
  # the data-write group. GitHub keeps exactly ONE pending run per group, so the
  # third arrival cancelled the waiter — on 2026-08-09 Discover Seasons spent 51
  # minutes queued behind a 41-minute chain and re-attempted twice. Both weekly
  # dispatches now hang off graduate-seasons.yml's tail (chain-discovery job),
  # which is the LAST hop of the overnight chain, so discovery arrives when
  # nothing else is holding the lock. The weekday gates moved verbatim.

  post-drain-chain:
    needs: crawl
    runs-on: ubuntu-latest
    # Mirror-image gate of profile-stats-matrix (2026-08-07): on nights the matrix
    # is NOT triggered (no new players, no rechecks), its terminal never fires, so
    # before this job those nights ran NO post-drain builds and fired NO Deploy
    # Pages workflow_run trigger — the crawl's data sat unpublished. Gated to
    # terminal drain like the weekly jobs: a retriggered nightly is itself a
    # data-write contender, and dispatching the chain mid-retrigger would put two
    # waiters into the one-waiter queue (trap T19). When the matrix IS triggered,
    # the matrix terminal dispatches the chain instead — one chain, two entry
    # points, never both on the same night.
    if: |
      always() &&
      needs.crawl.outputs.games_remaining == '0' &&
      needs.crawl.outputs.new_players == '0' &&
      needs.crawl.outputs.stats_rechecks == '0'
    steps:
      - name: Install dispatch retry helper
        # A chain-critical `gh workflow run` is never one-shot (directive 14). On
        # 2026-07-27 a single HTTP 500 stopped the matrix chain — no retrigger, no
        # terminal, no build-team-stats — so rosters silently went stale repo-wide
        # while every player file was correct. The four dispatches in this file are
        # worse: two of them are WEEKLY, so one lost call costs a full week's sweep
        # and the run still shows green. Helper copied VERBATIM from
        # fetch-profile-stats-matrix.yml (the proven site) — not retyped.
        # /tmp is per-job, so each dispatching job installs its own copy.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."
      - name: Trigger post-drain chain (matrix-skipped night)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: |
          /tmp/gh-dispatch.sh post-drain-chain.yml
