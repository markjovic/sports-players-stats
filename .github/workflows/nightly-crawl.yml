# .github/workflows/nightly-crawl.yml
name: Nightly Crawl

on:
  schedule:
    - cron: '0 15 * * *'   # 01:00 AEST (UTC+10) daily
  workflow_dispatch:
    inputs:
      rounds_back:
        description: 'Rounds to look back (default 2; use 4-6 for backfill)'
        required: false
        default: '2'
        type: string
      season:
        description: 'Single season ID (leave blank for all active)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — no writes or commits'
        required: false
        default: false
        type: boolean
      force_recheck:
        description: 'Ignore round-complete markers and re-fetch every round'
        required: false
        default: false
        type: boolean
      consecutive_zeros:
        description: 'Consecutive zero-progress runs — do not set manually'
        required: false
        default: '0'
        type: string

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      games_remaining: ${{ steps.status.outputs.games_remaining }}
      games_processed: ${{ steps.status.outputs.games_processed }}
      new_players:     ${{ steps.status.outputs.new_players }}
      stats_rechecks:  ${{ steps.status.outputs.stats_rechecks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run nightly crawl
        run: |
          ARGS="--rounds-back=${{ inputs.rounds_back || '2' }}"
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force_recheck }}" = "true" ]; then ARGS="$ARGS --force-recheck"; fi
          node scripts/nightly-crawl.js $ARGS

      - name: Read status
        id: status
        if: always()
        run: |
          if [ -f .nightly-status.json ]; then
            remaining=$(node -e "console.log(require('./.nightly-status.json').gamesRemaining || 0)")
            processed=$(node -e "console.log(require('./.nightly-status.json').gamesProcessed || 0)")
            stubbed=$(node -e "console.log(require('./.nightly-status.json').stubbed || 0)")
          else
            remaining=0
            processed=0
            stubbed=0
          fi
          echo "games_remaining=$remaining" >> $GITHUB_OUTPUT
          echo "games_processed=$processed" >> $GITHUB_OUTPUT
          echo "new_players=$stubbed" >> $GITHUB_OUTPUT
          if [ -f "needs-matrix-shards.json" ]; then
            rechecks=$(node -e "console.log(JSON.parse(require('fs').readFileSync('needs-matrix-shards.json')).length)")
          else
            rechecks=0
          fi
          echo "stats_rechecks=$rechecks" >> $GITHUB_OUTPUT
          echo "Remaining: $remaining  Processed: $processed  New players: $stubbed  Rechecks: $rechecks"

  team-stats:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build team stats (active seasons)
        run: node scripts/build-team-stats.js --active-only

  team-index:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/update-team-index.js

  venue-lookup:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          node scripts/update-venue-lookup.js $ARGS

  venue-indexes:
    needs: venue-lookup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/build-venue-indexes.js

  profile-stats-matrix:
    needs: [crawl, team-stats]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.dry_run != 'true' &&
      (needs.crawl.outputs.new_players != '0' || needs.crawl.outputs.stats_rechecks != '0')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger targeted matrix shards
        run: |
          new_players="${{ needs.crawl.outputs.new_players }}"
          rechecks="${{ needs.crawl.outputs.stats_rechecks }}"
          echo "New players: $new_players  |  Stat rechecks: $rechecks"

          shards_arg=""
          if [ -f "needs-matrix-shards.json" ]; then
            shards=$(cat needs-matrix-shards.json)
            echo "Targeted shards: $shards"
            shards_arg="--field shards=$shards"
          fi

          gh workflow run fetch-profile-stats-matrix.yml \
            --repo "${{ github.repository }}" \
            --field "run_number=1" \
            --field "consecutive_zeros=0" \
            $shards_arg
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}

  win-loss:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build win-loss records (active seasons)
        run: node scripts/build-win-loss.js --active-only

  discover-seasons:
    needs: crawl
    runs-on: ubuntu-latest
    # Fire the sharded season-discovery matrix AFTER the crawl fully drains
    # (games_remaining == 0), so it never runs mid-crawl. Discovery's reduce carries
    # concurrency group data-write, so it also can't write sports-index.json while this
    # crawl workflow (same group) still holds the lock — it queues until we finish.
    # Gated to Sundays: a full sweep is ~1.5-2h and ~200k PlayHQ calls for near-zero
    # ongoing yield, so weekly is plenty. To run it every terminal night instead,
    # delete the `dow` check below. all_players stays false here — the one-time
    # historical backlog pass is a manual dispatch with all_players=true.
    if: |
      always() &&
      inputs.dry_run != 'true' &&
      needs.crawl.outputs.games_remaining == '0'
    steps:
      - name: Trigger season discovery matrix (weekly, Sundays)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          dow=$(date -u +%u)   # 1=Mon … 7=Sun
          if [ "$dow" != "7" ]; then
            echo "Not Sunday (dow=$dow) — skipping weekly season discovery."
            exit 0
          fi
          echo "Sunday — triggering discover-seasons-matrix."
          gh workflow run discover-seasons-matrix.yml \
            --repo "${{ github.repository }}" \
            --field "all_players=false" \
            --field "concurrency=25"

  retrigger:
    needs: crawl
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.dry_run != 'true' &&
      needs.crawl.outputs.games_remaining != '0' &&
      needs.crawl.outputs.games_remaining != ''
    steps:
      - name: Check consecutive zeros and retrigger
        run: |
          remaining=${{ needs.crawl.outputs.games_remaining }}
          processed=${{ needs.crawl.outputs.games_processed }}
          zeros=${{ inputs.consecutive_zeros || '0' }}
          if [ "$processed" = "0" ]; then new_zeros=$((zeros + 1)); else new_zeros=0; fi
          if [ "$new_zeros" -ge 3 ]; then
            echo "🛑 Zero progress for 3 consecutive runs with $remaining games remaining."
            exit 1
          fi
          echo "↺ $remaining games remaining — re-triggering (consecutive zeros: $new_zeros)"
          gh workflow run nightly-crawl.yml \
            --repo "${{ github.repository }}" \
            --field "rounds_back=${{ inputs.rounds_back || '2' }}" \
            --field "consecutive_zeros=${new_zeros}"
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
