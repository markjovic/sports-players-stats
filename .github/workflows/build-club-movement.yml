# .github/workflows/build-club-movement.yml
# Builds one club's player-movement collection and COMMITS it as movement/bv/{club}-{gender}.json,
# merging that club into movement/bv/index.json. The page lives in markjovic/stattrack and fetches
# these files, so a page change needs no run here at all — only a data change does.
#
# Run it once per club you want in the dropdown. Other clubs' entries are merged, never rebuilt.
#
# The collection carries aggregates and pseudonymous player codes (P001…) only — no player id, no
# player name, no roster data — which is why it is safe to commit to a public repo.
#
# Needs a PLAIN full checkout: it reads every player file on the competition's rosters, and a
# sparse/blobless clone fetches each one over the network.

name: Build Club Movement

on:
  workflow_dispatch:
    inputs:
      club:
        description: 'Club (as PlayHQ records it on the team)'
        required: true
        default: 'Maroondah Magic Basketball Club'
        type: choice
        options:
          - 'Maroondah Magic Basketball Club'
          - 'Mt Lilydale Lakers Basketball Club (MLBC)'
          - 'SEBC Saints'
          - 'Mt Evelyn Meteors Basketball Club'
          - 'Crossover United Basketball Club'
          - 'Eastern Eagles Basketball Club'
          - 'Kilsyth Heat Basketball Club'
          - 'Montrose Vikings Basketball Club'
          - 'Fosters Phantoms Basketball Club'
          - 'South Croydon Youth Club Scorpions Basketball Club (SCYC)'
      gender:
        description: 'Which teams to draw'
        required: true
        default: 'Boys'
        type: choice
        options: [ 'Boys', 'Girls', 'All' ]
      drop_ungraded:
        description: 'Leave out club teams whose age group cannot be read (default: fail and list them instead)'
        required: false
        default: false
        type: boolean
      deploy:
        description: 'Dispatch Deploy Pages afterwards (without it the page keeps serving the previous data)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

# Writes to the repo, so it takes the same lock as every other writer — T25: push contention here
# is path-agnostic, there is no exemption for "different directories".
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and commit
        env:
          CLUB: ${{ inputs.club }}
          GENDER: ${{ inputs.gender }}
          DROP_UNGRADED: ${{ inputs.drop_ungraded }}
          COMMIT: 'true'
        run: node scripts/build-club-movement.js

      - name: Dispatch Deploy Pages
        if: ${{ inputs.deploy == true || inputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if gh workflow run deploy-pages.yml --ref main; then echo "dispatched"; exit 0; fi
            echo "dispatch attempt $i failed"; sleep $((i * 10))
          done
          echo "::error::could not dispatch Deploy Pages — the data is committed but the site still serves the previous build"
          exit 1
