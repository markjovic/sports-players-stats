# .github/workflows/deploy-pages.yml
name: Deploy Pages

# Publishes the data store to GitHub Pages via the Actions deploy path (NOT
# branch auto-build). Once Settings → Pages → Source is set to "GitHub Actions",
# pushes to main no longer trigger a Pages build — only this workflow does — so
# the nightly/matrix push storm stops superseding builds. StatTrack reads its
# data from https://markjovic.github.io/sports-players-stats, so this must run
# after the data changes.
#
#   workflow_run     — fires when a data pipeline finishes, so publishing is the
#                      last step of the existing scheduled work (no separate cron
#                      that could fire mid-pipeline). The listed workflows are the
#                      TERMINAL ones:
#                        - "Weekly Indexes"  — end of the weekly run.
#                        - the three nightly derived-data builds fired by the
#                          matrix on completion (leaderboards / search / records).
#                      NOT the matrix itself (it retriggers ~150×) and NOT the
#                      mid-pipeline builds (team-stats/win-loss finish earlier).
#   workflow_dispatch — manual publish for ad-hoc changes; also lets any workflow
#                      trigger it via: gh workflow run deploy-pages.yml
#                      (graduate-seasons.yml dispatches it after flipping
#                      archivedAt flags — active/locked split, 2026-08-07)
#
# workflow_run matches each workflow's `name:` field (NOT its filename). The four
# names below were confirmed against the Actions run list on 2026-07-19.

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Weekly Indexes"                              # weekly-indexes.yml
      - "Build Leaderboards (Full)"                   # build-leaderboards.yml
      - "Build Search Index"                          # build-search-index.yml
      - "Build Single-Game Records"                   # build-records.yml
      - "Fold diverged players (api-canonical maintenance)"  # fold-diverged-players.yml
    types: [completed]

# Standard Pages permissions for the Actions deploy path.
permissions:
  contents: read
  pages: write
  id-token: write

# The three nightly builds finish within minutes of each other, each firing a
# workflow_run. cancel-in-progress collapses them: each new trigger cancels the
# prior in-flight deploy and starts fresh, so exactly one deploy runs, capturing
# all three builds' output. (A cancelled deploy is harmless — the previous live
# deployment stays until a new one succeeds.)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if the triggering pipeline failed — don't publish half-built data.
    # (Manual dispatch always runs.)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout working tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Drop everything StatTrack never fetches. The keep/strip split was derived
      # 2026-08-06 by grepping the deployed app for every BASE-relative fetch path:
      # SERVED (must stay): players/ games/ team-stats/ leaderboard/ search/
      #   venue-lookup/ date-venue-index/ records/ data/ and root JSON files.
      # NEVER FETCHED (stripped): scripts/ reports/ explore-results/
      #   roster-results/ and the markdown docs.
      # Total recovery ≈ 600 KB compressed — measured against a failure margin of
      # ~973 KB (last success 1,210,614,006 bytes; first failure 1,211,586,679),
      # so this is a bridge measured in DAYS of nightly growth, not a fix. The
      # real headroom comes from the split-origin work (OUTSTANDING §2.1).
      - name: Strip non-served files
        run: |
          rm -rf .git .github scripts reports explore-results roster-results
          # data/ split (2026-08-06): StatTrack fetches exactly four files here —
          # sports-index, venue-index, team-index, season-venue-index. The other
          # four are pipeline bookkeeping read from the repo checkout by scripts,
          # never over HTTP; stripping them from the ARTIFACT touches nothing.
          rm -f data/forfeit-games.json data/seasons-discovered.json \
                data/seasons-invalid.json data/seasons-skipped.json
          # Root bookkeeping, same category: written by the pipeline, read from the
          # checkout, never fetched by StatTrack. zero-team-seasons is stripped at
          # both paths — root (where the re-sweep wrongly wrote it) and data/ (its
          # correct home after the rename), so this line survives the move.
          rm -f zero-team-seasons.json needs-matrix-shards.json data/zero-team-seasons.json
          find . -maxdepth 1 -name '*.md' -delete
          echo "Artifact contents after strip:"
          du -sh */ | sort -rh

      # Active/locked split (2026-08-07): drop every per-season file whose season
      # is verified LIVE on the archive origin — archivedAt in sports-index is set
      # only by graduate-seasons.yml, and only AFTER probing the season's file on
      # the archive, so nothing stripped here is ever unserved. ~440 MB leaves
      # this artifact once the first graduation lands. Zero archived seasons =
      # no-op (normal until then); structural failures ABORT the deploy — a wrong
      # artifact must not publish silently.
      - name: Strip archived seasons (active/locked split)
        run: |
          cat > /tmp/strip-archived.cjs << 'SCRIPT_EOF'
          // Active-artifact strip for the active/locked Pages split. Lives embedded in
          // .github/workflows/deploy-pages.yml. Deletes from the artifact tree every
          // per-season file (games/bv, team-stats/bv, leaderboard/season) whose season
          // carries archivedAt in data/sports-index.json — those seasons are verified
          // live on the archive origin, which is the only writer of that flag. Zero
          // archived seasons is the normal state until the first graduation: continue.
          // Structural failures abort — a wrong artifact must not publish silently.
          'use strict';
          const fs = require('fs');
          const path = require('path');

          const ROOT = process.env.SCAN_ROOT || '.';
          const DIRS = ['games/bv', 'team-stats/bv', 'leaderboard/season'];
          function fail(msg) { console.error('ABORT: ' + msg); process.exit(1); }

          const indexPath = path.join(ROOT, 'data/sports-index.json');
          if (!fs.existsSync(indexPath)) fail('data/sports-index.json not found — cannot decide the strip');
          const rawIndex = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (!rawIndex || typeof rawIndex !== 'object' || Array.isArray(rawIndex)) fail('top level of sports-index.json is not an object');
          const seasonsObj = rawIndex.seasons;
          if (!seasonsObj || typeof seasonsObj !== 'object' || Array.isArray(seasonsObj)) fail('.seasons is not an object keyed by season id');

          const archived = new Set();
          for (const [sid, s] of Object.entries(seasonsObj)) {
            if (s && typeof s === 'object' && s.archivedAt) archived.add(sid);
          }
          console.log('seasons with archivedAt: ' + archived.size);
          if (archived.size === 0) {
            console.log('nothing to strip — artifact unchanged (normal until the first graduation)');
            process.exit(0);
          }

          function* walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) yield* walk(p);
              else if (e.isFile()) yield p;
            }
          }
          function sidForFile(relPath) {
            const parts = relPath.split(path.sep);
            const base = parts[parts.length - 1].replace(/\.json$/i, '');
            if (seasonsObj[base]) return base;
            for (let i = 0; i < parts.length - 1; i++) if (seasonsObj[parts[i]]) return parts[i];
            return null;
          }

          let deleted = 0, deletedBytes = 0, kept = 0;
          const samples = [];
          for (const dir of DIRS) {
            const abs = path.join(ROOT, dir);
            if (!fs.existsSync(abs)) fail(dir + ' does not exist in the artifact tree');
            for (const f of walk(abs)) {
              const sid = /\.json$/i.test(f) ? sidForFile(path.relative(abs, f)) : null;
              if (sid && archived.has(sid)) {
                deletedBytes += fs.statSync(f).size;
                fs.unlinkSync(f);
                deleted++;
                if (samples.length < 3) samples.push(dir + '/' + path.relative(abs, f));
              } else kept++;
            }
          }
          console.log('stripped ' + deleted + ' archived-season files (' + (deletedBytes / 1048576).toFixed(1) + ' MiB raw) across ' + archived.size + ' seasons; kept ' + kept + ' files');
          if (samples.length) console.log('  samples: ' + samples.join(', '));
          if (deleted === 0) console.log('  ⚠ archivedAt seasons exist but no files matched — worth a look, not fatal (files may already be absent)');
          SCRIPT_EOF
          node /tmp/strip-archived.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
