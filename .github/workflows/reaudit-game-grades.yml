# .github/workflows/reaudit-game-grades.yml
#
# Fixes per-game grade names (gn/gid) for regraded teams.
# Runs in three phases — all resumable via progress files.
#
# Phase 1: scan player files for multi-reg seasons (~2 min)
# Phase 2: re-fetch player profiles with concurrency to build game→grade map
# Phase 3: rewrite game entries with correct gn/gid
#
# If the job times out, re-run — it resumes from where it left off.

name: Reaudit Game Grades

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent API requests for phase 2 (default: 20)'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run reaudit-game-grades
        run: node scripts/reaudit-game-grades.js --concurrency=${{ inputs.concurrency || '20' }}

      - name: Final push (safety net)
        if: always()
        run: |
          git add games/bv/ scripts/.reaudit-phase2-progress.json scripts/.reaudit-phase3-progress.json scripts/.reaudit-grade-map.json || true
          git diff --staged --quiet || git commit -m "reaudit-game-grades: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
