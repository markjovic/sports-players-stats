# .github/workflows/fix-game-status.yml
name: Fix Game Status

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no writes)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  fix-status:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fix game status
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node fix-game-status.js $ARGS

      - name: Final commit
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git add games/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix game status: final flush"
            git pull --rebase=false --no-edit -X ours
            git push
          fi
