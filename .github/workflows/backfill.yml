name: Manual Backfill Sweep

on:
  workflow_dispatch:

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backfill Loop
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Runs 20 seasons per manual trigger
          for i in {1..20}; do
            echo "Starting iteration $i..."
            node backfill-fixtures.js
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Changes committed and pushed."
            elif [ $EXIT_CODE -eq 101 ]; then
              echo "No changes in this season, moving to next."
            else
              echo "Failure detected at iteration $i. Stopping."
              exit $EXIT_CODE
            fi
            sleep 5
          done