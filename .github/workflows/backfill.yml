name: Infinite Backfill Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Infinite Backfill Loop
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run the script. If exit code is 101, it means 'no changes found', 
          # so we just continue to the next loop iteration.
          for i in {1..20}; do
            echo "Starting iteration $i..."
            node backfill-fixtures.js
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Script finished successfully with changes."
            elif [ $EXIT_CODE -eq 101 ]; then
              echo "Script signaled 101: No changes found, skipping season."
            else
              echo "Script failed with code $EXIT_CODE. Stopping."
              exit $EXIT_CODE
            fi
            
            # Brief pause to avoid API rate limits
            sleep 5
          done