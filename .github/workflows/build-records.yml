# .github/workflows/build-records.yml

name: Build Single-Game Records

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full re-scan (ignore resume progress)'
        required: false
        # 2026-07-30: was `default: 'false'` — a STRING default on a `type: boolean`
        # input. Harmless here (the only consumer is a bash `=` compare, where the
        # value renders as a string either way), but it is the same type-mismatch
        # family as the job-level gate bug of 2026-07-21, so it is corrected rather
        # than left as a trap for whoever next adds an expression-context gate.
        default: false
        type: boolean

# Serialize against nightly-crawl / weekly-indexes / the discover reduce (2026-08-06).
# This workflow writes to the repo but held NO lock, so when the matrix terminal fanned
# it out it rewrote main underneath the still-running nightly: nightly-crawl's
# venue-indexes job finished its own work in 20 SECONDS and then spent 40 MINUTES stuck
# in fetch/merge/push against a repo three lockless writers were rewriting, until the
# job timeout killed it. The paths never conflicted — push contention on a 6 GB repo is
# path-agnostic, every push must merge the others' commits. cancel-in-progress stays
# false: queued, never killed.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-node is safe in THIS job: build-records.js makes no network calls
      # at all (the unused HEADERS_API const that implied otherwise was removed
      # 2026-07-30). The no-setup-node rule applies only to jobs that fetch
      # api.playhq.com.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run build-records
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/build-records.js --force
          else
            node scripts/build-records.js
          fi
