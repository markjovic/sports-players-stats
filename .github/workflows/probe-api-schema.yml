# .github/workflows/probe-api-schema.yml
name: Probe API Schema

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'PlayHQ tenant to probe (default: bv)'
        required: false
        default: 'bv'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run schema probe
        run: node probe-api-schema.js --tenant=${{ github.event.inputs.tenant }}

      - name: Commit HTML report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-api-schema.html
          git diff --cached --quiet || git commit -m "API schema probe: ${{ github.event.inputs.tenant }} [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git pull --rebase origin main
          git push
