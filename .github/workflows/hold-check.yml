# .github/workflows/hold-check.yml
# THROWAWAY local diagnostic — delete after use. No API, no writes.
name: Hold Check (throwaway)

on:
  workflow_dispatch:
    inputs:
      sids:
        description: 'Comma-separated season IDs to check on disk'
        required: true
        default: '68279835,913d1397,ee5d2724'
        type: string

permissions:
  contents: read

jobs:
  hold-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hold-check
        run: node scripts/hold-check.js "${{ inputs.sids }}"
