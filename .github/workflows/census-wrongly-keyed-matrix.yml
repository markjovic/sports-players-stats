# .github/workflows/census-wrongly-keyed-matrix.yml
name: Census Wrongly Keyed (Matrix)

# Tests EVERY player file key across the whole store, sharded 256 ways.
#
# WHY A MATRIX. The full candidate population is 418,250 and a single-threaded
# pass measured 0.9 seconds per key — about 105 hours. At 256 shards with 20 in
# parallel that is a few hours.
#
# STRUCTURE COPIED FROM fetch-profile-stats-matrix.yml, which is the proven
# pattern in this repo:
#   * one job per two-hex-character player bucket
#   * max-parallel 20 — api.playhq.com is shared with the nightly, and gameView
#     was MEASURED clean at 5 concurrent and hitting a sustained 403 wall at 25
#   * sparse checkout of only that shard's players, aliases and index
#   * NO git operation in a shard job at all — each writes one artifact
#   * ONE aggregator job that collects every shard and makes a SINGLE commit
#   * NO actions/setup-node anywhere (these jobs fetch api.playhq.com)
#
# OUTPUT. reports/wrongly-keyed-census.json, in the same shape the gated census
# produced, so seed-apiid-from-playhq-pairs reads it with no change.
#
# It writes nothing to players/, games/ or players/aliases/. It measures and
# recovers api ids; the repair is still seed-apiid + fold, run separately.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Shards to run, e.g. ["00","01"]. Blank = all 256.'
        required: false
        default: ''
        type: string
      all_players:
        description: 'Test EVERY player, not just private ones'
        required: false
        default: true
        type: boolean
      games_per_player:
        description: 'Games to try per player when recovering an api id'
        required: false
        default: '3'
        type: string
      max_games:
        description: 'Cap on game reads per shard'
        required: false
        default: '100000'
        type: string

concurrency:
  group: census-matrix
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        env:
          INPUT_SHARDS: ${{ inputs.shards }}
        run: |
          shards=$(python3 - << 'PYEOF'
          import json, os, re
          raw = (os.environ.get('INPUT_SHARDS') or '').strip()
          inner = raw[1:-1] if raw.startswith('[') and raw.endswith(']') else raw
          toks = [t.strip().strip('"').strip("'") for t in inner.split(',')]
          toks = [t.lower() for t in toks if re.fullmatch(r'[0-9a-fA-F]{2}', t or '')]
          if not toks:
              toks = [format(i, '02x') for i in range(256)]
          print(json.dumps(toks))
          PYEOF
          )
          n=$(printf '%s' "$shards" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "Shards selected: $n"
          echo "shards=$shards" >> $GITHUB_OUTPUT

  census:
    needs: generate-shards
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Hardcoded, as it is in fetch-profile-stats-matrix.yml: GitHub does not
      # accept an expression here. A max_parallel INPUT was offered on this
      # workflow at first and did nothing at all — a control that silently is not
      # wired up is worse than no control.
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.generate-shards.outputs.shards) }}
    steps:
      # Only this shard's players. No game files: recovery reads games from the
      # player's own games[] and asks PlayHQ, so games/bv is not needed here.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/census-wrongly-keyed-players.js
            scripts/lib
            players/${{ matrix.shard }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Census shard ${{ matrix.shard }}
        env:
          ALL_PLAYERS: ${{ (inputs.all_players == true || inputs.all_players == 'true') && 'true' || '' }}
        run: |
          ARGS=(--shard=${{ matrix.shard }} --games-per-player=${{ inputs.games_per_player }} --max-games=${{ inputs.max_games }})
          [ -n "$ALL_PLAYERS" ] && ARGS+=(--all-players)
          node scripts/census-wrongly-keyed-players.js "${ARGS[@]}"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-shard-${{ matrix.shard }}
          path: reports/census-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 3

  aggregate:
    needs: census
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            reports
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download every shard result
        uses: actions/download-artifact@v4
        with:
          pattern: census-shard-*
          path: /tmp/shards
          merge-multiple: true

      # Merged into the SAME shape the gated census wrote, so the seeder reads it
      # unchanged. A shard that produced no artifact is counted and named — a
      # missing shard must never look like a shard with nothing to report.
      # MERGES with what is already committed — it does not replace it.
      #
      # 2026-08-30: a two-shard re-run of the stragglers OVERWROTE a completed
      # 254-shard sweep, because download-artifact only ever sees THIS run's
      # artifacts and the merge wrote whatever it found. 3,420 wrongly-keyed
      # players became 24. The report was recoverable from git, but a report that
      # can be silently replaced by a partial run is a report nobody can trust.
      #
      # Rows are now filed per shard under byShard, so a run replaces ONLY the
      # shards it actually produced and every other shard is carried forward
      # untouched. A report written before this change has no byShard, so its rows
      # are carried as "legacy" and de-duplicated by player id — that keeps the
      # existing sweep intact on the first merged run.
      - name: Merge into reports/wrongly-keyed-census.json
        run: |
          python3 - << 'PYEOF'
          import json, os, glob, datetime
          OUT = 'reports/wrongly-keyed-census.json'

          prev = {}
          if os.path.exists(OUT):
              try:
                  prev = json.load(open(OUT))
                  print(f'  existing report found: {len(prev.get("wrong", []))} wrong row(s)')
              except Exception as e:
                  print(f'  existing report unreadable ({e}) — treating as absent')
                  prev = {}

          by_shard = dict(prev.get('byShard') or {})
          legacy_wrong  = [] if prev.get('byShard') else list(prev.get('wrong') or [])
          legacy_failed = [] if prev.get('byShard') else list(prev.get('recoveryFailed') or [])
          legacy_unknown= [] if prev.get('byShard') else list(prev.get('unknownKeys') or [])
          if legacy_wrong or legacy_failed:
              print(f'  carrying {len(legacy_wrong)} wrong and {len(legacy_failed)} failed row(s) '
                    f'forward from a report written before per-shard filing')

          files = sorted(glob.glob('/tmp/shards/census-shard-*.json'))
          print(f'  {len(files)} shard result(s) in THIS run')
          for f in files:
              sh = os.path.basename(f)[13:15]
              try:
                  d = json.load(open(f))
              except Exception as e:
                  print(f'  UNREADABLE {f}: {e}')
                  continue
              by_shard[sh] = {
                'scan': d.get('scan', {}),
                'counts': d.get('counts', {}),
                'wrong': d.get('wrong', []),
                'recoveryFailed': d.get('recoveryFailed', []),
                'unknownKeys': d.get('unknownKeys', []),
              }

          # Flatten. Legacy rows first so a shard that has since re-run wins on
          # de-duplication rather than the older copy.
          wrong, failed, unknown = list(legacy_wrong), list(legacy_failed), list(legacy_unknown)
          for sh in sorted(by_shard):
              wrong  += by_shard[sh]['wrong']
              failed += by_shard[sh]['recoveryFailed']
              unknown+= by_shard[sh]['unknownKeys']

          def dedupe(rows, key):
              seen, out = set(), []
              for r in rows:
                  k = r.get(key)
                  if k in seen: continue
                  seen.add(k); out.append(r)
              return out
          before_w, before_f = len(wrong), len(failed)
          wrong  = dedupe(wrong, 'resolvesTo')
          failed = dedupe(failed, 'uuid')
          unknown = sorted(set(unknown))
          if before_w != len(wrong) or before_f != len(failed):
              print(f'  de-duplicated: {before_w - len(wrong)} wrong, {before_f - len(failed)} failed')

          expected = {format(i, '02x') for i in range(256)}
          missing = sorted(expected - set(by_shard) - ({'legacy'} if legacy_wrong else set()))
          # A shard is only "missing" if no run has ever reported it. Legacy rows
          # cannot be attributed to a shard, so when they are present the missing
          # list is advisory rather than exact and says so.
          totals = {
            'shardsReported': len(by_shard),
            'shardsMissing': len(missing),
            'playerFilesScanned': sum(v['scan'].get('files', 0) for v in by_shard.values()),
            'privateTrue': sum(v['scan'].get('privateTrue', 0) for v in by_shard.values()),
            'candidates': sum(v['scan'].get('candidates', 0) for v in by_shard.values()),
            'wronglyKeyed': sum(v['counts'].get('wronglyKeyed', 0) for v in by_shard.values()),
            'wronglyKeyedPrivate': sum(v['counts'].get('wronglyKeyedPrivate', 0) for v in by_shard.values()),
            'wronglyKeyedPublic': sum(v['counts'].get('wronglyKeyedPublic', 0) for v in by_shard.values()),
            'apiIdsRecovered': len(wrong),
            'recoveryFailed': len(failed),
            'keysUnknown': len(unknown),
            'legacyRowsCarried': len(legacy_wrong),
          }
          print('──── TOTALS (this run merged with everything already committed) ────')
          for k, v in totals.items():
              print(f'  {k}: {v:,}' if isinstance(v, int) else f'  {k}: {v}')
          if legacy_wrong:
              print('\n  NOTE: rows carried from a pre-per-shard report cannot be attributed to a')
              print('  shard, so shardsMissing counts only shards never reported since. It is')
              print('  advisory this run and exact from the next one.')
          if missing:
              print(f'\n  {len(missing)} shard(s) never reported: ' + ', '.join(missing[:40]) + (' …' if len(missing) > 40 else ''))

          out = {
            'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'source': 'census-wrongly-keyed-matrix',
            'complete': not missing,
            'shardsMissing': missing,
            'totals': totals,
            'wrong': wrong,
            'recoveryFailed': failed,
            'unknownKeys': unknown,
            'byShard': by_shard,
          }
          os.makedirs('reports', exist_ok=True)
          json.dump(out, open(OUT, 'w'), indent=2)
          print(f'\n  wrote {OUT} — {len(wrong):,} row(s) for the seeder')
          PYEOF

      - name: Commit
        run: |
          git add -- reports/wrongly-keyed-census.json
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git diff --staged --shortstat
          git commit -q -m "census matrix: full-store sweep, every player key tested"
          for i in $(seq 1 40); do
            git fetch origin main \
              && git merge -q -X ours FETCH_HEAD --no-edit --no-stat \
              && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 60 + 1))
          done
          echo "push failed after 40 attempts"; exit 1
