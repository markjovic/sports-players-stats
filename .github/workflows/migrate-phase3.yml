# .github/workflows/migrate-phase3.yml
name: Migrate Phase 3

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migrate-phase3.js
        run: node migrate-phase3.js

      - name: Final commit (safety net)
        run: |
          git add search || true
          git diff --staged --quiet || git commit -m "migrate-phase3: final state"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
