# .github/workflows/fix-player-names.yml
name: Fix Player Names

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fix player names
        run: node scripts/fix-player-names.js ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
