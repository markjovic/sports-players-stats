# .github/workflows/diagnose-win-loss.yml
name: Diagnose Win-Loss Coverage

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Number of players to sample (default 10)'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnose win-loss coverage gaps
        run: node scripts/diagnose-win-loss.js --sample=${{ inputs.sample || '10' }}
