name: Advanced Player Search

on:
  workflow_dispatch:
    inputs:
      team_ids:
        description: 'Team IDs (Comma-separated, leave blank to ignore)'
        required: false
        type: string
      season_ids:
        description: 'Season IDs (Comma-separated, leave blank to ignore)'
        required: false
        type: string
      grades:
        description: 'Grade Names (Comma-separated, exact match e.g. A Grade, U16 Boys)'
        required: false
        type: string

jobs:
  search-players:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            players
            scripts
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Search Script
        run: |
          node scripts/find-players-by-team.js \
            --teams="${{ inputs.team_ids }}" \
            --seasons="${{ inputs.season_ids }}" \
            --grades="${{ inputs.grades }}"
