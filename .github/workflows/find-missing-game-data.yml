# .github/workflows/find-missing-game-data.yml
name: Find Missing Game Data Fields

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Parallel Async File Read Streams'
        required: false
        default: '64'
        type: string

jobs:
  audit-missing-attributes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Increase Node.js Memory Allocation
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> $GITHUB_ENV

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Season Game Attribute Audit Scan
        run: node find-missing-game-data.js --concurrency=${{ github.event.inputs.concurrency }}