# .github/workflows/test-gps-count.yml
name: Test GPS Count

on:
  workflow_dispatch:
    inputs:
      gradeId:
        description: 'Grade ID to test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/test-gps-count.js
          sparse-checkout-cone-mode: false
      - run: node scripts/test-gps-count.js ${{ inputs.gradeId }}
