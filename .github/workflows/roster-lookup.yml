# .github/workflows/roster-lookup.yml
name: Roster Lookup

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: 'Grade ID, Team ID, or Competition (Season) ID to look up'
        required: true
        default: '5afff92b'
        type: string
      target_type:
        description: 'What the target ID refers to'
        required: false
        default: 'grade'
        type: choice
        options:
          - 'grade - show all teams and registered players in this grade'
          - 'team  - find this team''s active grade, then show all opposition'
          - 'comp  - show full roster breakdown for every grade in this competition'
      mode:
        description: 'Data fetch mode'
        required: false
        default: '3 - Local lookup only (instant, no API calls)'
        type: choice
        options:
          - '1 - Full re-fetch (all players, overwrites existing data, slow ~30min)'
          - '2 - Fill gaps (fetch only players missing teams data, incremental)'
          - '3 - Local lookup only (instant, no API calls)'
      concurrency:
        description: 'Concurrent API requests during teams fetch (modes 1 and 2 only)'
        required: false
        default: '200'
        type: string

jobs:
  roster-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build args
        id: args
        run: |
          TARGET_TYPE="${{ github.event.inputs.target_type }}"
          TARGET_ID="${{ github.event.inputs.target_id }}"
          MODE="${{ github.event.inputs.mode }}"

          if [[ "$TARGET_TYPE" == team* ]]; then
            ARGS="--team=$TARGET_ID"
          elif [[ "$TARGET_TYPE" == comp* ]]; then
            ARGS="--comp=$TARGET_ID"
          else
            ARGS="--grade=$TARGET_ID"
          fi

          ARGS="$ARGS --concurrency=${{ github.event.inputs.concurrency }}"

          if [[ "$MODE" == 1* ]]; then
            ARGS="$ARGS --force-fetch"
          elif [[ "$MODE" == 2* ]]; then
            ARGS="$ARGS --fetch-teams"
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Running with: $ARGS"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run roster lookup
        run: node roster-lookup.js ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit results
        run: |
          git stash
          git pull --rebase origin main
          git stash pop
          git add players/ roster-results/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Roster lookup: ${{ github.event.inputs.target_type }} ${{ github.event.inputs.target_id }} ($(date -u +%Y-%m-%d))"
            git push
          fi
