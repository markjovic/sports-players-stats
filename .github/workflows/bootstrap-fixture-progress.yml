# .github/workflows/bootstrap-fixture-progress.yml
name: Bootstrap Fixture Progress

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run bootstrap
        run: node bootstrap-fixture-progress.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discover-fixtures-progress.json zero-team-seasons.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bootstrap fixture progress + zero-team seasons report"
            git push
          fi
