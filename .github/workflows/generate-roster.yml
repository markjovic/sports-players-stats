name: Generate Roster Report

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'ID (Season, Grade, or Team)'
        required: true
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Report
        shell: bash
        run: |
          TARGET_ID="${{ github.event.inputs.id }}"
          echo "🔍 Searching for ID: $TARGET_ID"
          
          node -e "
            const fs = require('fs');
            const path = require('path');
            const target = '$TARGET_ID';
            const playersDir = path.join(process.cwd(), 'players');
            const report = { type: 'report', data: {} };

            const walk = (dir) => {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                    if (entry.isDirectory()) walk(path.join(dir, entry.name));
                    else if (entry.name.endsWith('.json') && !entry.name.startsWith('index')) {
                        try {
                            const raw = fs.readFileSync(path.join(dir, entry.name), 'utf8');
                            const p = JSON.parse(raw);
                            
                            // SAFETY: Only proceed if p.seasons exists and is an array
                            if (p.seasons && Array.isArray(p.seasons)) {
                                p.seasons.forEach(s => {
                                    if (s.regs && Array.isArray(s.regs)) {
                                        s.regs.forEach(r => {
                                            if (s.sid === target || r.gid === target || r.tid === target) {
                                                if (!report.data[r.tid]) {
                                                    report.data[r.tid] = { 
                                                        teamName: r.tn, 
                                                        gradeName: r.gn, 
                                                        seasonName: s.sn, 
                                                        players: [] 
                                                    };
                                                }
                                                report.data[r.tid].players.push(p.name);
                                            }
                                        });
                                    }
                                });
                            }
                        } catch (e) {
                            // Silently skip corrupted files
                        }
                    }
                }
            };
            walk(playersDir);
            console.log(JSON.stringify(report, null, 2));
          "
