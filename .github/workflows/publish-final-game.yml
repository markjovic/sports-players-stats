# .github/workflows/publish-final-game.yml
name: Publish Final Game

# FAST PUBLISH ON FINAL.
#
# Dispatched by markjovic/fixture-watch the moment a watched team's game flips to
# FINAL, so the result, the box score and the players' profile stats land within
# minutes instead of waiting for the 01:00 nightly.
#
# ⚠ THIS IS THE ONLY WORKFLOW IN THE REPO DISPATCHED FROM OUTSIDE IT. Everything
# it is allowed to do is bounded by that:
#   - it writes games/ and players/ and NOTHING ELSE
#   - it DELETES NOTHING (publish-final-game.js never removes a game; withdrawal
#     is Phase 2R's job inside nightly-crawl.js and is deliberately not reachable
#     from here)
#   - season, grade and round are all REQUIRED, with no defaults, so a malformed
#     dispatch stops rather than widening into a repo-wide run
#   - the script refuses outright if PlayHQ says the grade belongs to a different
#     season than the one dispatched
#
# It holds `data-write` (T25) because it writes players/.
#
# ⚠ THE CHECKOUT IS THE JOB. MEASURED 2026-11-23 on run #1: `actions/checkout@v4`
#   took 8m 15s of an 8m 22s job, for a script that ran in 3 SECONDS. The sparse
#   set was `everything except games/bv`, which spared about 1 MB: `du -sh` on that
#   run read .git 906M, players 3.4G, data 4.8M, games 920K. A full tree on the
#   same repo (the `probe` workflow) is 5m52s, so the sparse set was costing MORE
#   than no sparse set at all.
#
#   The fix is a blobless partial clone plus a SECOND, narrower checkout: the
#   publish needs roughly ten player files out of ~370,000, but which ten is not
#   known until the box scores are back. So the script runs in two phases and the
#   shards are added to the sparse set in between. See the steps below.
#
# ⚠ W/L IS NOT UPDATED HERE. build-win-loss.js has no season or team scope and
# opens with a pre-pass over every player file — it is the ~11-minute job on the
# nightly chain and it stays there. A player's win/loss record lags until 01:00.
#
# ⚠ TEAM-STATS IS NOT DISPATCHED HERE, deliberately. build-team-stats.js READS
# players/ to build roster stats, and the matrix this workflow dispatches WRITES
# players/ in a separate run that no lock here covers. Dispatching both would be
# the exact ordering race nightly-crawl.yml solved with `needs:` — and `needs:`
# cannot reach across two dispatched runs. The team page's fixture and result come
# from games/bv and are correct immediately; its roster aggregate waits for the
# nightly. Revisit with a measurement of what is actually stale, not a guess.

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season ID (REQUIRED) — e.g. 3d25b666'
        required: true
        type: string
      grade:
        description: 'Grade ID (REQUIRED) — e.g. 7d0c2383'
        required: true
        type: string
      round:
        description: 'Round NAME (REQUIRED) — e.g. Round 7. The round id is resolved here, never carried across repos.'
        required: true
        type: string
      games:
        description: 'Comma-separated game ids the dispatcher saw flip to FINAL. Reported only — the whole round is fetched regardless.'
        required: false
        default: ''
        type: string
      source:
        description: 'Who dispatched this (e.g. fixture-watch). Logged so an unexpected run can be traced.'
        required: false
        default: 'manual'
        type: string
      dry_run:
        description: 'Fetch and report, write and commit nothing'
        required: false
        default: false
        type: boolean
      skip_matrix:
        description: 'Do not dispatch the profile-stats matrix afterwards (the game and box score are still published)'
        required: false
        default: false
        type: boolean
      test_shards:
        description: 'TESTING ONLY. Space-separated shards (e.g. "0a 11") to add to the sparse checkout even when the round needs none. Exercises the git mechanics without touching data. Ignored when the round has its own shards.'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards:      ${{ steps.run.outputs.shards }}
      shard_count: ${{ steps.run.outputs.shard_count }}
      season:      ${{ steps.run.outputs.season }}
      games:       ${{ steps.run.outputs.games }}
    steps:
      # ⚠ BLOBLESS AND SPARSE, cone mode OFF so single files can be named.
      # `filter: blob:none` means git fetches blobs on demand rather than the whole
      # history's contents — the 906M .git measured on run #1 was almost entirely
      # blobs for files this job never opens. players/ is NOT here: only the index
      # and alias shards the fetch phase needs to resolve spectator ids. The player
      # files themselves are added after the box scores name their shards.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          # ⚠ LEADING SLASHES ARE DELIBERATE. Without one, git reads a non-cone
          # pattern as matching at ANY depth rather than naming a single file, and
          # says so: "pass a leading slash before paths such as ... (see NON-CONE
          # PROBLEMS in the git-sparse-checkout manual)". Measured 2026-11-23: the
          # unanchored form happened to resolve correctly, but four warnings on
          # every run is how a step's warnings stop being read.
          sparse-checkout: |
            /scripts/publish-final-game.js
            /scripts/lib
            /data/sports-index.json
            /data/forfeit-games.json
            /games/bv/${{ inputs.season }}.json
            /players/indexes
            /players/aliases
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: What was dispatched, and what it cost to check out
        # Printed BEFORE the run so an unexpected dispatch is traceable even when
        # the script then refuses. Inputs go through env: — never interpolated into
        # the script body (T30).
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_GRADE:  ${{ inputs.grade }}
          IN_ROUND:  ${{ inputs.round }}
          IN_GAMES:  ${{ inputs.games }}
          IN_SOURCE: ${{ inputs.source }}
          IN_DRY:    ${{ inputs.dry_run }}
          IN_SKIPM:  ${{ inputs.skip_matrix }}
        run: |
          echo "::group::Dispatch"
          printf '  season     = %s\n' "${IN_SEASON}"
          printf '  grade      = %s\n' "${IN_GRADE}"
          printf '  round      = %s\n' "${IN_ROUND}"
          printf '  games      = %s\n' "${IN_GAMES}"
          printf '  source     = %s\n' "${IN_SOURCE}"
          printf '  dry_run    = %s\n' "${IN_DRY}"
          printf '  skip_matrix= %s\n' "${IN_SKIPM}"
          printf '  actor      = %s\n' "${GITHUB_ACTOR}"
          echo "::endgroup::"
          echo "::group::Checkout size BEFORE the player shards are added"
          du -sh .git players games data 2>/dev/null || true
          echo "::endgroup::"

      # ── Phase 1 ────────────────────────────────────────────────────────────
      # Writes the round and pulls the box scores. Touches NO player files, so it
      # needs none of them checked out. Hands its state to phase 2 on disk, OUTSIDE
      # the repo — a state file inside it would be a blob of player ids in a public
      # repository and would collide with the nightly.
      - name: Fetch the round and the box scores
        id: fetch
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_GRADE:  ${{ inputs.grade }}
          IN_ROUND:  ${{ inputs.round }}
          IN_GAMES:  ${{ inputs.games }}
          IN_DRY:    ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          # Booleans arrive as a real boolean from the UI and as a STRING when
          # chained or sent over the API. Both forms, always (directive 13 / T27).
          ARGS=( "--season=${IN_SEASON}" "--grade=${IN_GRADE}" "--round=${IN_ROUND}"
                 "--phase=fetch" "--state=${RUNNER_TEMP}/pfg-state.json" )
          if [ -n "${IN_GAMES}" ]; then ARGS+=( "--games=${IN_GAMES}" ); fi
          if [ "${IN_DRY}" = "true" ] || [ "${IN_DRY}" = "True" ]; then ARGS+=( "--dry-run" ); fi
          node scripts/publish-final-game.js "${ARGS[@]}"

      # ── The narrow second checkout ─────────────────────────────────────────
      # ⚠ `git sparse-checkout add` is CONE-MODE ONLY. This checkout is non-cone, so
      #   the whole pattern list is re-set — the original patterns plus one per
      #   shard. Blobs for the newly matched files are fetched on demand, which is
      #   what the blobless clone above buys.
      #
      # ⚠ THIS STEP IS THE ONLY GENUINELY NEW MACHINERY HERE and it only runs when
      #   the round produced box scores — which, outside a Friday evening, it never
      #   does, because the nightly has already processed everything. `test_shards`
      #   exists so the git mechanics can be exercised on demand against shards that
      #   are checked out and then ignored, rather than first running for real at
      #   22:00 on a Friday.
      - name: Add just the player shards this round touched
        if: |
          (steps.fetch.outputs.fetch_shard_count != '0' && steps.fetch.outputs.fetch_shard_count != '')
          || inputs.test_shards != ''
        env:
          SHARDS:      ${{ steps.fetch.outputs.fetch_shards }}
          TEST_SHARDS: ${{ inputs.test_shards }}
          IN_SEASON:   ${{ inputs.season }}
        run: |
          set -euo pipefail
          # The round's own shards always win. test_shards is a fallback for a run
          # that produced none, never an override of a real one.
          if [ -z "${SHARDS}" ]; then
            SHARDS="${TEST_SHARDS}"
            echo "⚠ no shards from this round — using test_shards='${TEST_SHARDS}' to exercise the sparse-checkout path. NO DATA IS AFFECTED: these files are checked out and then not written to."
          fi
          # The SAME patterns as the checkout above, leading slashes included —
          # this re-sets the whole list, so any drift between the two silently
          # changes what is checked out.
          PATTERNS=( /scripts/publish-final-game.js /scripts/lib
                     /data/sports-index.json /data/forfeit-games.json
                     "/games/bv/${IN_SEASON}.json"
                     /players/indexes /players/aliases )
          n=0
          for sh in ${SHARDS}; do
            # Two hex characters and nothing else. A shard name is derived from a
            # uuid, so anything else means the state file is not what it claims and
            # the pattern must not reach git.
            case "${sh}" in
              [0-9a-f][0-9a-f]) PATTERNS+=( "/players/${sh}" ); n=$((n+1)) ;;
              *) echo "::error::refusing shard name '${sh}' — expected two hex characters"; exit 1 ;;
            esac
          done
          echo "Adding ${n} player shard(s): ${SHARDS}"
          git sparse-checkout set --no-cone "${PATTERNS[@]}"
          echo "::group::Checkout size AFTER the player shards are added"
          du -sh .git players games data 2>/dev/null || true
          echo "::endgroup::"

      # ── Phase 2 ────────────────────────────────────────────────────────────
      - name: Clear statsChecked and stub new players
        id: run
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_GRADE:  ${{ inputs.grade }}
          IN_ROUND:  ${{ inputs.round }}
          IN_DRY:    ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=( "--season=${IN_SEASON}" "--grade=${IN_GRADE}" "--round=${IN_ROUND}"
                 "--phase=players" "--state=${RUNNER_TEMP}/pfg-state.json" )
          if [ "${IN_DRY}" = "true" ] || [ "${IN_DRY}" = "True" ]; then ARGS+=( "--dry-run" ); fi
          node scripts/publish-final-game.js "${ARGS[@]}"

  # ── Profile stats ───────────────────────────────────────────────────────────
  # The box score does NOT produce the numbers on a player's profile: gp/pts/fg/
  # ft/3pt/fouls come from PlayHQ's own publicProfileStatistics, fetched by
  # fetch-profile-stats.js, which only touches players whose statsChecked has been
  # cleared. The publish job clears it; this dispatch is what makes it visible.
  #
  # The existing matrix is dispatched rather than reimplemented: it already fans
  # out per shard, writes nothing from the shard jobs, and funnels every change
  # through ONE apply-and-commit. Reproducing that here would be a second writer
  # of players/ with no lock between them.
  matrix:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.shard_count != '0' &&
      needs.publish.outputs.shard_count != '' &&
      (inputs.skip_matrix != true && inputs.skip_matrix != 'true' && inputs.skip_matrix != 'True') &&
      (inputs.dry_run != true && inputs.dry_run != 'true' && inputs.dry_run != 'True')
    steps:
      - name: Install dispatch retry helper
        # A chain-critical `gh workflow run` is never one-shot (directive 14).
        # Copied VERBATIM from nightly-crawl.yml — not retyped.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Dispatch targeted matrix shards
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
          SHARDS:   ${{ needs.publish.outputs.shards }}
        run: |
          set -euo pipefail
          # An EMPTY or malformed shard list must NOT fall through to the matrix's
          # own '[]' default, which means ALL 256 SHARDS. A fast publish that
          # accidentally sweeps the whole database is the one outcome here that is
          # worse than doing nothing.
          compact="$(printf '%s' "${SHARDS}" | tr -d '[:space:]')"
          case "${compact}" in
            '['*']') : ;;
            *) echo "::error::shard list is not a JSON array: '${SHARDS}'. Refusing to dispatch — an unrecognised value would sweep all 256 shards."; exit 1 ;;
          esac
          if [ "${compact}" = "[]" ]; then
            echo "::error::shard list is empty but shard_count said otherwise. Refusing to dispatch."; exit 1
          fi
          echo "Targeted shards: ${compact}"
          /tmp/gh-dispatch.sh fetch-profile-stats-matrix.yml \
            --field "run_number=1" \
            --field "consecutive_zeros=0" \
            --field "shards=${compact}"
