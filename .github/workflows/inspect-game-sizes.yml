# .github/workflows/inspect-game-sizes.yml
name: Inspect Game File Sizes

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run inspection
        run: node inspect-game-sizes.js
