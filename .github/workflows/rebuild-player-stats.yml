# .github/workflows/rebuild-player-stats.yml

name: Rebuild Player Stats

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which phases to run'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - stats-only
          - scores-only
      active_only:
        description: 'Only process players in active (unlocked) seasons'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'Starting concurrency (default: 200, backs off automatically on 429s)'
        required: false
        default: '200'
      force:
        description: 'Ignore progress file and start fresh'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build args
        id: args
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "stats-only" ]; then ARGS="$ARGS --stats-only"; fi
          if [ "${{ inputs.mode }}" = "scores-only" ]; then ARGS="$ARGS --scores-only"; fi
          if [ "${{ inputs.active_only }}" = "true" ]; then ARGS="$ARGS --active-only"; fi
          if [ -n "${{ inputs.concurrency }}" ]; then ARGS="$ARGS --concurrency=${{ inputs.concurrency }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run rebuild-player-stats
        run: node scripts/rebuild-player-stats.js ${{ steps.args.outputs.args }}

      - name: Final push (safety net)
        if: always()
        run: |
          git add players/ games/bv/ || true
          for f in scripts/.rebuild-player-stats-progress.json scripts/.rebuild-player-stats-corrections.json scripts/.rebuild-player-stats-p2-progress.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "rebuild-player-stats: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
