# .github/workflows/backfill-missing-players.yml
name: Backfill Missing Players (games/bv-derived, one-off)

# Creates player records for full-length uuids in games/bv attendee lists that
# have no players/indexes/ entry in any shard. For each: probes
# publicProfileStatistics directly; on failure, reconstructs name+tid from a
# spectator re-fetch and attempts namespace-mismatch recovery (grade-tid ->
# grade-roster name-only -> profileSearch). Recovered ids get a full real
# record (apiId stored); genuinely-private ones get a stub (private:true, real
# captured name if available) with stats reconstructed from spectator data.
#
# Resumable by construction: candidates are recomputed fresh every run by
# scanning games/bv/*.json for full-length uuids missing from every shard
# index -- once a uuid is written (and indexed), it drops out of the candidate
# set on the next run. No separate progress file needed.
#
# NO actions/setup-node STEP. This is deliberate and load-bearing: adding
# setup-node@v4 changes the runner's outbound network fingerprint and makes
# CloudFront's WAF 403 every request (session acquisition included), which
# reliably kills the run at "Failed to obtain session after 10 attempts". The
# ubuntu-latest runner already ships a recent Node, and every working
# diagnostic / the proven fetch-profile-stats matrix job in this repo invokes
# `node` directly with no setup-node step. Do NOT re-add setup-node.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - report only, no writes or commits'
        required: false
        default: false
        type: boolean
      max:
        description: 'Limit candidates processed this run (leave blank for no limit — useful for a small test run first)'
        required: false
        default: ''
        type: string
      sample:
        description: 'Measurement only: process a REPRESENTATIVE random N (use with dry_run for an accurate collision rate). Overrides max when set.'
        required: false
        default: ''
        type: string
      seed:
        description: 'Measurement only: RNG seed for --sample. Vary this (1,2,3…) across dry runs to accumulate independent random samples.'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout (sparse — games/, players/indexes/, scripts/, reports/, data/; blob:none filter)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            games
            players/indexes
            scripts
            reports
            data
          sparse-checkout-cone-mode: false

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: Run backfill
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run --count-collisions"; fi
          if [ -n "${{ inputs.sample }}" ]; then
            ARGS="$ARGS --sample=${{ inputs.sample }} --seed=${{ inputs.seed }}"
          elif [ -n "${{ inputs.max }}" ]; then
            ARGS="$ARGS --max=${{ inputs.max }}"
          fi
          node scripts/backfill-missing-players.js $ARGS
