# .github/workflows/backfill-missing-players.yml
name: Backfill Missing Players

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent API requests (default: 80)'
        required: false
        default: '80'
      save_every:
        description: 'Save and commit every N players (default: 500)'
        required: false
        default: '500'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run backfill
        run: |
          node backfill-missing-players.js \
            --concurrency=${{ github.event.inputs.concurrency }} \
            --save-every=${{ github.event.inputs.save_every }}
