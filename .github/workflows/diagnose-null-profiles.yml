# .github/workflows/diagnose-null-profiles.yml

name: Diagnose Null Profiles

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Number of UUIDs to sample'
        default: '30'
      min_gp:
        description: 'Minimum games played to include'
        default: '5'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run diagnostic
        run: node scripts/diagnose-null-profiles.js --sample=${{ inputs.sample }} --min-gp=${{ inputs.min_gp }}
