# .github/workflows/requeue-repointed-players.yml
name: Requeue repointed players

# Clears sports.Basketball.statsChecked on exactly the players whose record was
# changed by an alias repoint, then dispatches the matrix at only their shards.
#
# WHY NOT A SHARD SWEEP. The obvious route was a forced matrix run over the 44
# shards those players sit in - about 70,000 profile fetches to correct 24
# records. fetch-profile-stats skips anyone carrying statsChecked, so deleting
# that one field from the files that need it puts those players, and only those
# players, back in the queue. The shard list stays the same size but each shard
# then has one or two players to fetch instead of 1,600.
#
# BOTH SIDES OF EVERY REPOINT. The losing player's x lists games they no longer
# hold; the gaining player's x was computed before the games arrived. Working from
# the losing side alone leaves the other half stale.
#
# THE LIST COMES FROM reports/misrouted-appearances.json, not an embedded table -
# that report is regenerated by every run of find-misrouted-appearances, so a
# hardcoded copy would be wrong the moment it is. If the report has been
# regenerated since the apply, this correctly finds nothing to do.
#
# A player whose record collapsed entirely - every appearance moved away, so
# build-player-games deleted the file - is reported and skipped, not treated as an
# error.
#
# data-write: writes player files.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = report which players would be requeued, write nothing. apply = clear statsChecked and dispatch the matrix at their shards.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  # Required for the targeted matrix dispatch. It uses WORKFLOW_PAT - GITHUB_TOKEN
  # cannot trigger another workflow.
  actions: write

jobs:
  requeue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full, never sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Syntax check
        run: node --check scripts/requeue-repointed-players.js

      # Inputs go through env, never straight into the command line. An input
      # interpolated into a run: block is substituted by GitHub BEFORE bash sees
      # it, so anything in it becomes shell source text.
      - name: Requeue
        env:
          IN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          FLAG=""
          if [ "$IN_MODE" = "apply" ]; then FLAG="--apply"; fi
          node scripts/requeue-repointed-players.js $FLAG

      - name: Install dispatch retry helper
        if: ${{ inputs.mode == 'apply' }}
        # Copied VERBATIM from fetch-profile-stats-matrix.yml, the proven site.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Dispatch targeted re-fetch
        if: ${{ inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: |
          if [ ! -f refetch-shards.json ]; then
            echo "refetch-shards.json not present. Nothing to dispatch."
            exit 0
          fi
          shards="$(tr -d '[:space:]' < refetch-shards.json)"
          echo "Re-fetch shards: ${shards}"
          # An EMPTY list must not be forwarded. The matrix reads shards='[]' as
          # "all 256" - its own T9 trap - so passing it would turn "nothing to
          # requeue" into a full 256-shard sweep. The script writes [] on every
          # dry run for exactly this reason.
          if [ -z "$shards" ] || [ "$shards" = "[]" ]; then
            echo "Nothing was requeued. Not dispatching."
            exit 0
          fi
          # force is NOT set. The requeued players have had statsChecked removed,
          # so the matrix picks them up on its own; force would clear the flag on
          # every player in those shards and re-fetch all of them, which is the
          # 70,000-call sweep this script exists to avoid.
          /tmp/gh-dispatch.sh fetch-profile-stats-matrix.yml \
            --field "run_number=1" \
            --field "consecutive_zeros=0" \
            --field "shards=${shards}"

      - name: What to expect
        if: always()
        run: |
          echo "The matrix will re-fetch only the requeued players - the other"
          echo "~1,600 in each shard still carry statsChecked and are skipped."
          echo ""
          echo "Afterwards their x and c arrays are rebuilt against their corrected"
          echo "games list. Check William Warren:"
          echo "  players/62/622098f3-be0a-4720-805f-46ddb3bc964f.json"
          echo "  78 games, gp 78, and x should be gone."
