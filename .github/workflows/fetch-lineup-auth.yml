# .github/workflows/fetch-lineup-auth.yml
name: Fetch Lineup (Authenticated)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Bearer token from PlayHQ (copy full "Bearer eyJ..." value)'
        required: true
      grade_id:
        description: 'Grade ID (default: 5afff92b)'
        required: false
        default: '5afff92b'
      tenant:
        description: 'Tenant (default: bv)'
        required: false
        default: 'bv'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch authenticated lineups
        run: node fetch-lineup-auth.js --grade=${{ github.event.inputs.grade_id }} --tenant=${{ github.event.inputs.tenant }} --token="${{ github.event.inputs.token }}"

      - name: Commit HTML report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lineup-result.html
          git diff --cached --quiet || git commit -m "Lineup fetch: ${{ github.event.inputs.grade_id }} [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git pull --rebase origin main
          git push
