# .github/workflows/probe-lineup.yml
name: Probe Lineup

on:
  workflow_dispatch:
    inputs:
      grade_id:
        description: 'Grade ID to probe (default: 5afff92b)'
        required: false
        default: '5afff92b'
      tenant:
        description: 'PlayHQ tenant (default: bv)'
        required: false
        default: 'bv'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run lineup probe
        run: node probe-lineup.js --grade=${{ github.event.inputs.grade_id }} --tenant=${{ github.event.inputs.tenant }}

      - name: Commit HTML report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-lineup.html
          git diff --cached --quiet || git commit -m "Lineup probe: ${{ github.event.inputs.grade_id }} [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git pull --rebase origin main
          git push
