# .github/workflows/build-player-games.yml

name: Build Player Games

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore progress file and start fresh'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build args
        id: args
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run build-player-games
        run: node scripts/build-player-games.js ${{ steps.args.outputs.args }}

      - name: Final push (safety net)
        if: always()
        run: |
          git add players/ scripts/.build-player-games-progress.json || true
          git diff --staged --quiet || git commit -m "build-player-games: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
