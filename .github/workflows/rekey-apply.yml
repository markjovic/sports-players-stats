# .github/workflows/rekey-apply.yml
name: Rekey APPLY (migration 3b-2, DESTRUCTIVE)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = guard check + action report only (no fetching, no writes, no commit). apply = re-fetch merges+promotes (resumable via committed checkpoints), rewrite/delete player files, ONE destructive commit. Re-running apply after a CloudFront block or fetch errors resumes from the checkpoint."
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions:
  contents: write

concurrency:
  group: rekey-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Plain depth-1 checkout - the mutate phase touches files scattered across
      # all 256 players buckets, so sparse is not usable here (blobless reads
      # outside the sparse set cost ~1s/file). Budgeted into timeout-minutes.
      # NO actions/setup-node - this workflow fetches from PlayHQ and setup-node
      # changes the runner's outbound fingerprint (CloudFront 403s).
      - name: Checkout working tree
        uses: actions/checkout@v4

      # The script does its own git - checkpoint commits of the fetch cache
      # during phase 1 (sanctioned progress-file pattern), and the single
      # destructive commit at the end of phase 2. Exit 1 with a committed
      # checkpoint means re-run to resume; exit 1 with GUARD FAILED means the
      # tree does not match the reviewed plan - stop and investigate.
      - name: Run rekey-apply
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            node scripts/rekey-apply.js
          else
            node scripts/rekey-apply.js --dry-run
          fi
