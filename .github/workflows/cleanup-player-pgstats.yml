# .github/workflows/cleanup-player-pgstats.yml

name: Cleanup Player PG Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run cleanup
        run: node scripts/cleanup-player-pgstats.js

      - name: Final push (safety net)
        if: always()
        run: |
          git add players/ || true
          git diff --staged --quiet || git commit -m "cleanup-player-pgstats: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
