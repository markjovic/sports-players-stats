# .github/workflows/inspect-failed-games.yml
name: Inspect Failed Games

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Number of random failed games to show (ignored if --all)'
        required: false
        default: '50'
        type: string
      mode:
        description: 'Output mode'
        required: false
        default: 'sample'
        type: choice
        options:
          - 'sample - show random sample with full summary stats'
          - 'all - show every failed game (may be long)'
          - 'csv - output as CSV for analysis'
      season:
        description: 'Filter to a specific season ID (optional)'
        required: false
        default: ''
        type: string
      tenant:
        description: 'Tenant'
        required: false
        default: 'bv'
        type: choice
        options:
          - bv

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            inspect-failed-games.js
            games
            backfill-progress.json
            sports-index.json
            seasons-discovered.json
            team-lookup
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run inspection
        run: |
          MODE="${{ github.event.inputs.mode }}"
          ARGS="--tenant=${{ github.event.inputs.tenant }} --sample=${{ github.event.inputs.sample }}"
          if [[ "$MODE" == all* ]]; then
            ARGS="$ARGS --all"
          elif [[ "$MODE" == csv* ]]; then
            ARGS="$ARGS --all --csv"
          fi
          SEASON="${{ github.event.inputs.season }}"
          if [ -n "$SEASON" ]; then ARGS="$ARGS --season=$SEASON"; fi
          node inspect-failed-games.js $ARGS
