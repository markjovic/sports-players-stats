# .github/workflows/add-player.yml
name: Add Player

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: 'PlayHQ player UUID (from profile URL: /public/profile/<uuid>/statistics)'
        required: true
        type: string

jobs:
  add-player:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch player
        run: node fetch-playhq.js --mode=player --uuid=${{ github.event.inputs.uuid }}

      - name: Commit result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add players/ players-index/
          if git diff --staged --quiet; then
            echo "No changes — player may already be up to date"
          else
            git commit -m "Add player: ${{ github.event.inputs.uuid }}"
            git push
          fi
