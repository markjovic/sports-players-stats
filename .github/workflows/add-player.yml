# .github/workflows/add-player.yml
name: Add Player

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: 'PlayHQ player UUID'
        required: true
        type: string
      name:
        description: 'Player display name (optional — fetched from PlayHQ if blank)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  add-player:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get shard prefix
        id: shard
        run: |
          uuid="${{ inputs.uuid }}"
          prefix="${uuid:0:2}"
          echo "prefix=$prefix" >> $GITHUB_OUTPUT
          echo "Shard prefix: $prefix"

      - name: Checkout (sparse — player shard only)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/fetch-profile-stats.js
            data/forfeit-games.json
            players/indexes/${{ steps.shard.outputs.prefix }}.json
            players/${{ steps.shard.outputs.prefix }}
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stub player if not already present
        id: stub
        run: |
          node --input-type=module << 'EOF'
          import fs    from 'fs';
          import path  from 'path';
          import https from 'https';
          import crypto from 'crypto';

          const uuid        = '${{ inputs.uuid }}';
          const inputName   = '${{ inputs.name }}' || null;
          const shard       = uuid.slice(0, 2).toLowerCase();
          const ROOT        = process.cwd();
          const indexPath   = path.join(ROOT, 'players', 'indexes', `${shard}.json`);
          const playerPath  = path.join(ROOT, 'players', shard, `${uuid}.json`);

          // ── Fetch name from PlayHQ if not supplied ──────────────────────────

          async function fetchPlayerName(uuid) {
            // Step 1: get session cookie
            const sessionBody = JSON.stringify({
              operationName: 'TenantConfig', variables: {},
              query: 'query TenantConfig { tenantConfiguration { label } }'
            });
            const HEADERS = {
              'accept': '*/*', 'origin': 'https://www.playhq.com',
              'user-agent': 'PlayHQ/1.47.2 Android/28 (Android SDK built for x86)',
              'tenant': 'basketball-victoria', 'content-type': 'application/json',
            };
            function post(body, cookie) {
              return new Promise((resolve, reject) => {
                const h = { ...HEADERS, 'request-id': crypto.randomUUID(),
                            'content-length': Buffer.byteLength(body) };
                if (cookie) h['Cookie'] = cookie;
                const req = https.request(
                  { hostname: 'api.playhq.com', path: '/graphql', method: 'POST',
                    headers: h, agent: new https.Agent({ keepAlive: false }) },
                  res => {
                    const c = [];
                    res.on('data', d => c.push(d));
                    res.on('end', () => resolve({ status: res.statusCode,
                      headers: res.headers, body: Buffer.concat(c).toString() }));
                  }
                );
                req.on('error', reject); req.write(body); req.end();
              });
            }
            const sess = await post(sessionBody, null);
            const raw  = sess.headers['set-cookie'];
            if (!raw) throw new Error('No session cookie');
            const parts = (Array.isArray(raw) ? raw.join(', ') : raw)
              .split(',').map(c => c.trim().split(';')[0]);
            const get = n => parts.find(p => p.startsWith(n + '=')) || null;
            const cookie = `${get('phq_tier')}; ${get('phq_session')}; ${get('phq_sub')}`;

            // Step 2: fetch profile name
            const nameBody = JSON.stringify({
              operationName: 'ProfileSeasonStatistics',
              variables: { profileID: uuid },
              query: `query ProfileSeasonStatistics($profileID: ID!) {
                publicProfileStatistics(profileID: $profileID) {
                  seasonStatistics { name }
                }
              }`
            });
            const res  = await post(nameBody, cookie);
            if (res.status === 403) return null; // private profile
            const json = JSON.parse(res.body);
            return json?.data?.publicProfileStatistics?.seasonStatistics?.[0]?.name || null;
          }

          // ── Load index ──────────────────────────────────────────────────────

          let index = {};
          if (fs.existsSync(indexPath)) {
            index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          }

          if (index[uuid]) {
            console.log(`Player already in index — will trigger matrix to re-fetch stats.`);
            if (fs.existsSync(playerPath)) {
              const player = JSON.parse(fs.readFileSync(playerPath, 'utf8'));
              if (player?.sports?.Basketball?.statsChecked !== undefined) {
                delete player.sports.Basketball.statsChecked;
                fs.writeFileSync(playerPath, JSON.stringify(player), 'utf8');
                console.log('  statsChecked cleared.');
              }
            }
            process.exit(0);
          }

          // ── Resolve name ────────────────────────────────────────────────────

          let name = inputName;
          if (!name) {
            console.log('No name supplied — fetching from PlayHQ...');
            try {
              name = await fetchPlayerName(uuid);
              if (name) console.log(`  Name: ${name}`);
              else      console.log('  Private profile — no name available.');
            } catch (e) {
              console.log(`  Name fetch failed: ${e.message} — continuing without name.`);
            }
          }

          // ── Create stub ─────────────────────────────────────────────────────

          const now  = new Date().toISOString();
          const stub = {
            uuid,
            ...(name ? { name } : {}),
            sports:    { Basketball: { maxGamePTS: 0, maxGameThreePt: 0, foulOuts: {} } },
            seasons:   [],
            teams:     [],
            updatedAt: now,
          };

          fs.mkdirSync(path.dirname(playerPath), { recursive: true });
          fs.writeFileSync(playerPath, JSON.stringify(stub), 'utf8');

          index[uuid] = { ...(name ? { name } : {}), history: {} };
          fs.writeFileSync(indexPath, JSON.stringify(index), 'utf8');

          console.log(`Stubbed: ${uuid}${name ? ' (' + name + ')' : ' (no name — private profile)'}`);
          EOF

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit stub
        run: |
          git stash
          git fetch origin main
          git merge -X ours FETCH_HEAD
          git stash pop
          git add "players/indexes/${{ steps.shard.outputs.prefix }}.json" \
                  "players/${{ steps.shard.outputs.prefix }}/${{ inputs.uuid }}.json" \
                  2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "add-player: stub ${{ inputs.uuid }}"
            git push origin main
          fi

      - name: Trigger matrix for this shard
        run: |
          shard='["${{ steps.shard.outputs.prefix }}"]'
          echo "Triggering matrix for shard: $shard"
          gh workflow run fetch-profile-stats-matrix.yml \
            --repo "${{ github.repository }}" \
            --field "run_number=1" \
            --field "consecutive_zeros=0" \
            --field "shards=$shard"
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
