# .github/workflows/rebuild-player-index.yml
name: Rebuild player index (migration 3b-3)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = derive + field census + report only (nothing written, no commit). apply = overwrite all 256 players/indexes shards keyed by api id and commit once. Run dry-run first and check the field census."
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Plain depth-1 checkout - reads every player file, so sparse is unusable.
      - name: Checkout working tree
        uses: actions/checkout@v4

      - name: Rebuild index
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            node scripts/rebuild-player-index.js
          else
            node scripts/rebuild-player-index.js --dry-run
          fi

      # One commit: 256 shards + report. Explicit paths, never -A. Proven push
      # pattern - 60 attempts, random 1-91s jitter, merge --abort cleanup,
      # merge -X ours.
      - name: Commit (push-with-retry)
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add players/indexes reports/rebuild-player-index.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "rebuild-player-index: re-key to api ids (3b-3)"
          for i in $(seq 1 60); do
            git merge --abort 2>/dev/null || true
            if git fetch origin "$GITHUB_REF_NAME" \
              && git merge -X ours "origin/$GITHUB_REF_NAME" -m "merge before reindex push" \
              && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep $(( (RANDOM % 91) + 1 ))
          done
          echo "push failed after 60 attempts"
          exit 1
