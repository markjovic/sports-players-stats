# .github/workflows/test-profile-query.yml
# Tests a UUID both inline (no checkout) AND from the checked-out repo
# to isolate whether the repo environment affects the result.

name: Test Profile Query

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: 'Player UUID to test'
        required: true

permissions:
  contents: read

jobs:
  test-inline:
    name: Test inline (no checkout)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run inline
        run: |
          node --input-type=module << 'NODEOF'
          import crypto from 'crypto';
          const uuid = '${{ inputs.uuid }}';
          const HEADERS = {
            'accept': '*/*', 'origin': 'https://www.playhq.com',
            'user-agent': 'PlayHQ/1.47.2 Android/28 (Android SDK built for x86)',
            'tenant': 'basketball-victoria', 'content-type': 'application/json',
          };
          const authRes = await fetch('https://api.playhq.com/graphql', {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID() },
            body: JSON.stringify({ operationName: 'ProfileSearch', variables: { fullName: 'a' },
              query: 'query ProfileSearch($fullName: String!) { profileSearch(fullName: $fullName) { result { id } } }' }),
          });
          const cookie = authRes.headers.get('set-cookie').split(';')[0];
          console.log('Cookie:', cookie.slice(0, 30) + '...');
          const Q = `query ProfileSeasonStatistics($profileID: ID!) {
            publicProfileStatistics(profileID: $profileID) {
              seasonStatistics { statistics { season { id } } }
            }
          }`;
          const res = await fetch('https://api.playhq.com/graphql', {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID(), 'Cookie': cookie },
            body: JSON.stringify({ operationName: 'ProfileSeasonStatistics', variables: { profileID: uuid }, query: Q }),
          });
          const json = await res.json();
          const pps = json?.data?.publicProfileStatistics;
          console.log('HTTP:', res.status);
          console.log('Result:', pps === null ? 'NULL' : pps === undefined ? 'UNDEFINED' : `PRESENT (${pps.seasonStatistics?.length} seasons)`);
          if (json.errors) console.log('Errors:', JSON.stringify(json.errors[0]?.message));
          NODEOF

  test-from-repo:
    name: Test from checked-out repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run from repo
        run: |
          node --input-type=module << 'NODEOF'
          import crypto from 'crypto';
          const uuid = '${{ inputs.uuid }}';
          const HEADERS = {
            'accept': '*/*', 'origin': 'https://www.playhq.com',
            'user-agent': 'PlayHQ/1.47.2 Android/28 (Android SDK built for x86)',
            'tenant': 'basketball-victoria', 'content-type': 'application/json',
          };
          const authRes = await fetch('https://api.playhq.com/graphql', {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID() },
            body: JSON.stringify({ operationName: 'ProfileSearch', variables: { fullName: 'a' },
              query: 'query ProfileSearch($fullName: String!) { profileSearch(fullName: $fullName) { result { id } } }' }),
          });
          const cookie = authRes.headers.get('set-cookie').split(';')[0];
          console.log('Cookie:', cookie.slice(0, 30) + '...');
          const Q = `query ProfileSeasonStatistics($profileID: ID!) {
            publicProfileStatistics(profileID: $profileID) {
              seasonStatistics { statistics { season { id } } }
            }
          }`;
          const res = await fetch('https://api.playhq.com/graphql', {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID(), 'Cookie': cookie },
            body: JSON.stringify({ operationName: 'ProfileSeasonStatistics', variables: { profileID: uuid }, query: Q }),
          });
          const json = await res.json();
          const pps = json?.data?.publicProfileStatistics;
          console.log('HTTP:', res.status);
          console.log('Result:', pps === null ? 'NULL' : pps === undefined ? 'UNDEFINED' : `PRESENT (${pps.seasonStatistics?.length} seasons)`);
          if (json.errors) console.log('Errors:', JSON.stringify(json.errors[0]?.message));
          NODEOF
