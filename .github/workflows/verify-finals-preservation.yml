# .github/workflows/verify-finals-preservation.yml

name: Verify Finals Preservation

# One-off read-only check for OUTSTANDING_TASKS §A1 checkbox 2 (2026-07-21):
# compares the PRE-finals-run career values still sitting in
# leaderboard/all-time.json against the post-run player files for the top
# finals/gfApps veterans. Red job = career values shrank or locked-season
# flags vanished (the pre-fix bug's signature) — do not proceed to A2.
# Deletion candidate once A1 is signed off.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Top-N entries per category to check (default 50)'
        required: false
        default: '50'
        type: string
      baseline_ref:
        description: 'Commit sha of the PRE-rebuild all-time.json (use the "build-finals-stats: remove progress file" commit). Blank = working tree (only valid before the chained leaderboards rebuild).'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run verification
        run: |
          ARGS="--limit=${{ inputs.limit || '50' }}"
          if [ -n "${{ inputs.baseline_ref }}" ]; then ARGS="$ARGS --baseline-ref=${{ inputs.baseline_ref }}"; fi
          node scripts/verify-finals-preservation.js $ARGS
