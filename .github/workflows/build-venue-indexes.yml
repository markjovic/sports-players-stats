# .github/workflows/build-venue-indexes.yml

name: Build Venue Indexes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run build-venue-indexes
        run: node scripts/build-venue-indexes.js

      - name: Final push (safety net)
        if: always()
        run: |
          git add venue-lookup/ date-venue-index/ data/season-venue-index.json || true
          git diff --staged --quiet || git commit -m "build-venue-indexes: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
