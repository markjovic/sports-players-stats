# .github/workflows/migrate-phase2.yml
name: Migrate Phase 2

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migrate-phase2.js
        run: node --max-old-space-size=4096 migrate-phase2.js

      - name: Final commit (safety net)
        run: |
          git add team-stats venue-lookup migrate-phase2-progress.json || true
          git diff --staged --quiet || git commit -m "migrate-phase2: final state"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
