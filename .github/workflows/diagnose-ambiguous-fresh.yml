# .github/workflows/diagnose-ambiguous-fresh.yml
name: Diagnose Ambiguous Players (Fresh API)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch fresh API data for ambiguous players
        run: node scripts/diagnose-ambiguous-fresh.js
