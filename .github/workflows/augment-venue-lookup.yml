# .github/workflows/augment-venue-lookup.yml

name: Augment Venue Lookup

on:
  workflow_dispatch:

jobs:
  augment:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run augment-venue-lookup
        run: node scripts/augment-venue-lookup.js

      - name: Final push (safety net)
        if: always()
        run: |
          git add venue-lookup/ scripts/.augment-venue-progress.json || true
          git diff --staged --quiet || git commit -m "augment-venue-lookup: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
