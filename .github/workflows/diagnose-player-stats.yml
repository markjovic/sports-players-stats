# .github/workflows/diagnose-player-stats.yml

name: Diagnose Player Stats

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: 'Player UUID to diagnose'
        required: true
        default: '72102d56-7c91-4bc2-9dd4-c05aa9cfb434'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run diagnostic
        run: node scripts/diagnose-player-stats.js ${{ inputs.uuid }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-${{ inputs.uuid }}
          path: diagnose-${{ inputs.uuid == '' && 'none' || inputs.uuid[:8] }}.json
          retention-days: 7
