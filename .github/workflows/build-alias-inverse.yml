# .github/workflows/build-alias-inverse.yml
#
# 3b-0: invert players/aliases/ into players/alias-inverse/ (api -> spectator
# aliases), sharded by api prefix. Single runner, read-only over players/aliases.
# NO actions/setup-node.

name: Build alias inverse (migration 3b-0)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit players/alias-inverse/ (uncheck for report-only dry look)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            players/aliases
            players/alias-inverse

      - name: Invert alias index
        run: node scripts/build-alias-inverse.js

      - name: Commit
        if: ${{ github.event.inputs.commit != 'false' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add players/alias-inverse
          if git diff --cached --shortstat | grep -q .; then
            git commit -m "build-alias-inverse: api -> spectator aliases"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge -X ours FETCH_HEAD --no-edit || true
              if git push origin HEAD:main; then break; fi
              sleep $((attempt * 5))
            done
          else
            echo "No inverse changes."
          fi
