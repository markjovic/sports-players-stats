# .github/workflows/recover-missing-seasons.yml
name: Recover Missing Seasons

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no writes)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      concurrency:
        description: 'Concurrent API requests'
        required: false
        default: '20'
        type: string

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            recover-missing-seasons.js
            sports-index.json
            seasons-discovered.json
            team-lookup
            games
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Recover missing seasons
        run: |
          ARGS="--concurrency=${{ github.event.inputs.concurrency }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node recover-missing-seasons.js $ARGS
