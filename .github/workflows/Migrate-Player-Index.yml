name: Migrate Player Index

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration
        run: node migrate-player-index.js

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sports-index.json
          git add players/
          git diff --staged --quiet || git commit -m "chore: migrate player index to split format"
          git pull --no-rebase --no-edit -X ours
          git push
