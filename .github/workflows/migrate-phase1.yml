# .github/workflows/migrate-phase1.yml
name: Migrate Phase 1

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migrate-phase1.js
        run: node migrate-phase1.js

      - name: Final commit (safety net)
        run: |
          git add games/bv players/indexes team-index.json venue-index.json migrate-phase1-progress.json || true
          git diff --staged --quiet || git commit -m "migrate-phase1: final state"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
