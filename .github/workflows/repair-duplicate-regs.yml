# .github/workflows/repair-duplicate-regs.yml
name: Repair duplicate regs (one-off)

# Merges regs duplicating the same (team, grade) registration. See the header of
# scripts/repair-duplicate-regs.js for the finding, the merge rule and what it
# deliberately refuses to touch.
#
# Safe to run as a one-off: the generator (discover-seasons.js mutating gid in
# place) was fixed 2026-08-01, so this set is static. Regrades and null-grade regs
# are NOT merged.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = scan and report, write nothing (START HERE). apply = merge duplicates, single commit."
        type: choice
        options: [dry-run, apply]
        default: dry-run
      shard:
        description: "Optional single 2-hex shard (e.g. 0a) to rehearse on. Blank = all 256."
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Plain full checkout: reads and rewrites player files across all 256 shards.
      # No actions/setup-node - nothing here touches the PlayHQ API.
      - name: Checkout working tree
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Guard in bash, not only in a GitHub expression (trap T3): an unrecognised
      # mode must mean refuse, never proceed.
      - name: Run repair
        env:
          MODE:  ${{ inputs.mode }}
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run) ARGS="--dry-run" ;;
            apply)   ARGS="" ;;
            *) echo "::error::unrecognised mode '$MODE' - refusing to run"; exit 1 ;;
          esac
          if [ -n "$SHARD" ]; then
            case "$SHARD" in
              [0-9a-f][0-9a-f]) ARGS="$ARGS --shard=$SHARD" ;;
              *) echo "::error::shard '$SHARD' is not two lowercase hex digits - refusing"; exit 1 ;;
            esac
          fi
          echo "resolved ARGS: $ARGS"
          node --max-old-space-size=6144 scripts/repair-duplicate-regs.js $ARGS
