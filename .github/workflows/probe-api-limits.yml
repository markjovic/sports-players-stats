# .github/workflows/probe-api-limits.yml
name: Probe API Limits

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Seed season ID (grades discovered via API)'
        required: false
        default: '15908988'
        type: string
      op:
        description: 'grade | fixture'
        required: false
        default: 'grade'
        type: string
      levels:
        description: 'Concurrency levels (CSV)'
        required: false
        default: '25,50,100,200,400'
        type: string
      calls:
        description: 'Calls per level'
        required: false
        default: '400'
        type: string
      cooldown:
        description: 'Cooldown between levels (ms)'
        required: false
        default: '10000'
        type: string
      recover:
        description: 'After a block, poll until the IP recovers (measures window)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Sparse checkout: grab ONLY the probe script, never the ~8.6GB data tree.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/probe-api-limits.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probe
        run: |
          node scripts/probe-api-limits.js \
            --season=${{ inputs.season }} \
            --op=${{ inputs.op }} \
            --levels=${{ inputs.levels }} \
            --calls=${{ inputs.calls }} \
            --cooldown=${{ inputs.cooldown }} \
            ${{ inputs.recover && '--recover' || '' }}
