# .github/workflows/classify-flagged-merges.yml
name: Classify flagged merges (migration 3b-2 review aid, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: classify-flagged-merges
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sparse (scripts, reports)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            reports

      - name: Classify
        run: node scripts/classify-flagged-merges.js

      - name: Commit report (push-with-retry)
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/rekey-flagged-classified.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "classify-flagged-merges: 3b-2 review buckets"
          for i in $(seq 1 60); do
            git merge --abort 2>/dev/null || true
            if git fetch origin "$GITHUB_REF_NAME" \
              && git merge -X ours "origin/$GITHUB_REF_NAME" -m "merge before classify push" \
              && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep $(( (RANDOM % 91) + 1 ))
          done
          echo "push failed after 60 attempts"
          exit 1
