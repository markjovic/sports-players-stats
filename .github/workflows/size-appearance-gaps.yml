# .github/workflows/size-appearance-gaps.yml
name: Size Appearance Gaps (read-only)

# The non-circular residue measure: PlayHQ's own per-season gp (reg stats, T20-deduped)
# vs local appearance counts (player.games[] attributed via a gid→sid map). Positive gaps
# are appearances we cannot name — the spectator-rescue target, covering both the
# hidden/grading games AND the re-sweep's fixture-only games. Zero-team correlation is
# measured directly per season. FULL checkout (player detail files). READ-ONLY.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run appearance-gap scan
        run: node scripts/size-appearance-gaps.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-appearance-gaps-report
          path: /tmp/size-appearance-gaps-report.json
          retention-days: 7
          if-no-files-found: warn
