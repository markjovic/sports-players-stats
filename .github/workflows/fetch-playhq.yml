name: PlayHQ Sports Scraper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: crawl | update | discover | lock'
        required: true
        default: 'update'
        type: choice
        options:
          - crawl
          - update
          - discover
          - lock
          - probe
          - crawl-all
      season:
        description: 'Season ID (required for crawl / discover / lock)'
        required: false
        default: ''
      tenant:
        description: 'PlayHQ tenant (bv=basketball, afl=footy, ca=cricket)'
        required: false
        default: 'bv'
      sport:
        description: 'Sport name for labelling (basketball, australian-rules, cricket)'
        required: false
        default: 'basketball'
      concurrency:
        description: 'Concurrent API requests (default 30, reduce if seeing 429s)'
        required: false
        default: '30'

  schedule:
    # Update active seasons every Monday and Thursday at 6am AEST (8pm UTC Sunday/Wednesday)
    - cron: '0 20 * * 0,3'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          MODE="${{ github.event.inputs.mode || 'update' }}"
          SEASON="${{ github.event.inputs.season || '' }}"
          TENANT="${{ github.event.inputs.tenant || 'bv' }}"
          SPORT="${{ github.event.inputs.sport || 'basketball' }}"

          ARGS="--tenant=$TENANT --sport=$SPORT --mode=$MODE"
          if [ -n "$SEASON" ] && [ "$MODE" != "crawl-all" ] && [ "$MODE" != "update" ] && [ "$MODE" != "probe" ]; then
            ARGS="$ARGS --season=$SEASON"
          fi
          node fetch-playhq.js $ARGS

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sports-index.json
          git add games/ 2>/dev/null || true
          git add players/ 2>/dev/null || true
          if ls queue-*.json 1> /dev/null 2>&1; then
            git add queue-*.json
          else
            git rm --cached queue-bv-priority.json queue-bv-backlog.json 2>/dev/null || true
          fi
          # If progress file exists, crawl was interrupted — commit it so next run can resume
          # Commit any progress files (tenant-namespaced, e.g. progress-bv.json)
          if ls progress-*.json 1> /dev/null 2>&1; then
            git add progress-*.json
          else
            git rm --cached progress-*.json 2>/dev/null || true
          fi
          # Only commit if something changed
          git diff --staged --quiet || git commit -m "chore: update sports data [$TENANT $(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase=false --no-edit -X ours
          git push
