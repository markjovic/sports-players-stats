# .github/workflows/build-finals-stats.yml

name: Build Finals Stats

on:
  workflow_dispatch:
    inputs:
      active_only:
        description: 'Only process active (unlocked) seasons'
        required: false
        default: false
        type: boolean
      chain_leaderboards:
        description: 'On success, dispatch Build Leaderboards (active-only) — set by the weekly fixtures chain'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write          # writes players/ — same lock as every player-file writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write             # chain-leaderboards job dispatches build-leaderboards.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run build-finals-stats
        run: |
          ARGS=""
          if [ "${{ inputs.active_only }}" = "true" ]; then ARGS="$ARGS --active-only"; fi
          node scripts/build-finals-stats.js $ARGS

  # Weekly chain link (2026-07-21, §C7): fixtures sweep → finals → leaderboards.
  # Default success-gating on `needs: build` means a failed or cancelled finals
  # run never triggers a leaderboards rebuild from bad/partial data.
  chain-leaderboards:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.chain_leaderboards == true || inputs.chain_leaderboards == 'true' }}
    steps:
      # 2026-07-31: was a BARE `gh workflow run`. House rule (claude_context): every
      # dispatch site uses the retry helper, because a one-shot chain-critical API
      # call is how the matrix chain silently stopped on 2026-07-27 (HTTP 500 — no
      # retrigger, no terminal, roster data quietly stale). This link is the weekly
      # fixtures -> finals -> leaderboards chain, so a lost dispatch here means the
      # leaderboards never rebuild and the run still shows green.
      # Helper copied VERBATIM from fetch-profile-stats-matrix.yml — not retyped.
      - name: Install dispatch retry helper
        # Every chain link in this workflow is a single `gh workflow run` API
        # call. On 2026-07-27 one of them returned HTTP 500 and the matrix chain
        # simply stopped — no retrigger, no terminal, no build-team-stats, so the
        # roster data silently went stale. A chain-critical network call is never
        # one-shot (same rule as the push retry).
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Dispatch Build Leaderboards (active-only)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: /tmp/gh-dispatch.sh build-leaderboards.yml --field "active_only=true"
