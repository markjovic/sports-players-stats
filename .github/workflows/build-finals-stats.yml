# .github/workflows/build-finals-stats.yml

name: Build Finals Stats

on:
  workflow_dispatch:
    inputs:
      active_only:
        description: 'Only process active (unlocked) seasons'
        required: false
        default: false
        type: boolean
      chain_leaderboards:
        description: 'On success, dispatch Build Leaderboards (active-only) — set by the weekly fixtures chain'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write          # writes players/ — same lock as every player-file writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write             # chain-leaderboards job dispatches build-leaderboards.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run build-finals-stats
        run: |
          ARGS=""
          if [ "${{ inputs.active_only }}" = "true" ]; then ARGS="$ARGS --active-only"; fi
          node scripts/build-finals-stats.js $ARGS

  # Weekly chain link (2026-07-21, §C7): fixtures sweep → finals → leaderboards.
  # Default success-gating on `needs: build` means a failed or cancelled finals
  # run never triggers a leaderboards rebuild from bad/partial data.
  chain-leaderboards:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.chain_leaderboards == 'true' }}
    steps:
      - name: Dispatch Build Leaderboards (active-only)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh workflow run build-leaderboards.yml \
            --repo "${{ github.repository }}" \
            --field "active_only=true"
