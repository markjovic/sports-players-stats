# .github/workflows/probe-stale-grade-membership.yml
name: Probe Stale Grade Membership

# READ-ONLY. No writes, no commits, NO data-write lock — it cannot block anything.
# One DiscoverGrade call per grade examined (default 8).
#
# THE QUESTION. The `sup` flag marks a stale fixture when the team has a PLAYED
# game elsewhere that DAY, so it can never touch fixtures in the FUTURE. On
# 2026-11-24 B11 Spirit Magic 1 had moved to BR by 20 Nov and still held grade-D
# fixtures for Rounds 9-16 (Dec-Mar). Those inflate "still to play" and no
# same-day rule can see them.
#
# The display pass that used to hide them inferred from shape — "last played grade
# is BR, so the D fixtures are residue" — and was deleted on purpose. B11 Raptors
# 1 shows why that is unsafe: B -> AR -> B, so leaving a grade does not mean not
# returning.
#
# So this asks whether a NON-inferential signal exists: does PlayHQ drop a
# regraded team from the old grade's LADDER while still serving its fixtures?
#
# ⚠ THE CONTROL IS THE POINT. "Absent" means nothing on its own — probe-grade-
# ladder.js was written in August precisely because some grades return NO ladder
# at all. So the probe also checks teams whose last PLAYED game is in that grade,
# which unambiguously belong. If the control teams are absent too, the ladder is
# not a membership signal and nothing may be built on it.
#
# ⚠⚠ 2026-11-25 — WHY THE SWEEP CLASSIFIES RATHER THAN COUNTS.
# The 2026-11-24 run found 3 grades in 3d25b666 absent from DiscoverSeason. Two
# were regrade residue. The third, fb2c151b "Friday U13 Boys E", was 12 games ALL
# PLAYED and 0 unplayed — a COMPLETED grade PlayHQ has dropped from the season
# list. Competitions hide completed grading rounds, and showing them is a major
# reason StatTrack exists; the copy held here may be the only one. So absence
# from DiscoverSeason is NOT evidence of staleness, and the sweep separates the
# two classes on a LOCAL fact (does the grade hold any unplayed game) that no
# endpoint can get wrong. seasons=all is read-only and holds no lock.
#
# ⚠ 2026-11-25 — THE 2026-11-24 RESULT, and why null_control exists.
# Control 10/10 in both grades that had one, so the ladder IS a membership signal.
# But BOTH interpretable suspects were LISTED: PlayHQ still has them in the old
# grade while serving the fixtures. Ladder absence is therefore not available as
# a signal for them. 13 of the 15 suspects were in two grades that answered
# `discoverGrade is NULL` — PlayHQ does not know the grade id at all, which is a
# DIFFERENT answer from an empty ladder and from the August finding.
# null_control measures whether NULL means anything, from two endpoints:
# DiscoverSeason (one call, its control is the grades it does list) and
# DiscoverGrade on N grades that are unambiguously live. A NULL from any live
# grade kills it. Until that has been run, NULL is an observation, not evidence.
#
# --no-playhq does the LOCAL half only and contacts nothing: it reports how big
# the population is without spending a PlayHQ run. Start there.
#
# NO actions/setup-node (this job fetches api.playhq.com — absolute rule).

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season id to probe. Leave blank when using seasons=all'
        required: false
        type: string
      seasons:
        description: 'SWEEP: all, or a comma-separated list of season ids. One DiscoverSeason call each. Overrides season'
        required: false
        default: ''
        type: string
      sleep_ms:
        description: 'Sweep pacing — ms between seasons'
        required: false
        default: '250'
        type: string
      grades:
        description: 'How many grades to read the ladder for (one API call each)'
        required: false
        default: '8'
        type: string
      no_playhq:
        description: 'Local half only — report the population size and contact PlayHQ not at all'
        required: false
        default: false
        type: boolean
      null_control:
        description: 'Control the NULL answer: probe N unambiguously LIVE grades (0 = off). Costs N+1 extra calls'
        required: false
        default: '0'
        type: string
      live_days:
        description: 'A grade counts as LIVE if it has a PLAYED game within this many days'
        required: false
        default: '14'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe stale grade membership
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_GRADES: ${{ inputs.grades }}
          IN_NOPHQ:  ${{ inputs.no_playhq }}
          IN_NULLC:  ${{ inputs.null_control }}
          IN_LIVED:  ${{ inputs.live_days }}
          IN_SEASONS: ${{ inputs.seasons }}
          IN_SLEEP:   ${{ inputs.sleep_ms }}
        run: |
          set -euo pipefail
          ARGS=( "--season=$IN_SEASON" "--grades=${IN_GRADES:-8}" )
          if [ -n "${IN_SEASONS:-}" ]; then ARGS+=( "--seasons=$IN_SEASONS" "--sleep-ms=${IN_SLEEP:-250}" ); fi
          ARGS+=( "--null-control=${IN_NULLC:-0}" "--live-days=${IN_LIVED:-14}" )
          # T3 form: true for BOTH the boolean and the string shape.
          if [ "$IN_NOPHQ" = "true" ]; then ARGS+=( --no-playhq ); fi
          echo "args: ${ARGS[*]}"
          node scripts/probe-stale-grade-membership.js "${ARGS[@]}"
