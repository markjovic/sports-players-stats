# .github/workflows/restore-deleted-file.yml
name: Restore Deleted File

on:
  workflow_dispatch:
    inputs:
      filepath:
        description: 'Path of the deleted file to restore (e.g. team-index.json)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Restore deleted file
        run: |
          FILEPATH="${{ inputs.filepath }}"
          LAST_COMMIT=$(git log --full-history -- "$FILEPATH" | grep '^commit ' | sed -n '2p' | awk '{print $2}')
          if [ -z "$LAST_COMMIT" ]; then
            echo "❌ Could not find $FILEPATH in recent history"
            exit 1
          fi
          echo "Restoring $FILEPATH from commit $LAST_COMMIT"
          git show "$LAST_COMMIT:$FILEPATH" > "$FILEPATH"
          git add --sparse "$FILEPATH"
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "restore: $FILEPATH from git history"
          git fetch origin main
          git merge -X ours FETCH_HEAD --no-edit
          git push origin main
          echo "✅ Restored $FILEPATH"
