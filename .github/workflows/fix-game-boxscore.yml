# .github/workflows/fix-game-boxscore.yml

name: Fix Game Box Score

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game key from games/bv/{sid}.json (e.g. 7cdd49b8)'
        required: true
      fix:
        description: 'Apply corrections (false = dry run only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run fix-game-boxscore
        run: |
          if [ "${{ inputs.fix }}" = "true" ]; then
            node scripts/fix-game-boxscore.js ${{ inputs.game_id }} --fix
          else
            node scripts/fix-game-boxscore.js ${{ inputs.game_id }} --dry-run
          fi

      - name: Final push (safety net)
        if: always()
        run: |
          git add games/bv/ || true
          git diff --staged --quiet || git commit -m "fix-game-boxscore: safety-net commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
