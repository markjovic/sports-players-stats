# .github/workflows/find-game-id.yml
name: Find Game ID

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game ID to search for'
        required: true
        default: '53968080'

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Find game
        run: node find-game-id.js ${{ github.event.inputs.game_id }}
