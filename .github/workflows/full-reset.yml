# .github/workflows/full-reset.yml
#
# ONE-TIME workflow — run tonight to bring all data to a clean authoritative state.
# After this completes, delete this file and use the regular nightly-crawl.yml going forward.
#
# Sequence:
#   1. Nightly crawl (rounds-back=6 to catch up on recent games)
#   2. build-finals-stats (historical backfill — fixes finalsPerSeason + 26k missing players)
#   3. Matrix force=true (re-fetch all 369k players with updated fetch-profile-stats.js)
#      → matrix self-triggers until complete
#      → on completion: triggers build-leaderboards + build-search-index automatically
#
# After this workflow completes, run db-audit.yml manually to verify.
# Then re-enable the schedule in nightly-crawl.yml.

name: Full Reset (One-Time)

on:
  workflow_dispatch:

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run nightly crawl (rounds-back=6)
        run: node scripts/nightly-crawl.js --rounds-back=6

  build-finals-stats:
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run build-finals-stats
        run: node scripts/build-finals-stats.js

  trigger-matrix:
    needs: build-finals-stats
    runs-on: ubuntu-latest
    steps:
      - name: Trigger matrix force run
        run: |
          gh workflow run fetch-profile-stats-matrix.yml \
            --repo "${{ github.repository }}" \
            --field "run_number=1" \
            --field "consecutive_zeros=0" \
            --field "force=true" \
            --field "shards=[]"
          echo "✅ Matrix triggered with force=true"
          echo "   Matrix will self-trigger until all 369k players are fetched."
          echo "   On completion it will automatically trigger build-leaderboards + build-search-index."
          echo "   Run db-audit.yml manually after the matrix completes to verify."
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
