# .github/workflows/inspect-player-file.yml
name: Inspect Player File

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: 'Player UUID to inspect'
        required: false
        default: '366f654d-c574-4317-ba5d-2c8b524b98f8'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect player file
        run: node scripts/inspect-player-file.js ${{ github.event.inputs.uuid }}
