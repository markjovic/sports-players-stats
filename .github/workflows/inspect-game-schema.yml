# .github/workflows/inspect-game-schema.yml
name: Inspect Game Database Schema

on:
  workflow_dispatch: # Allows you to manually trigger this anytime from the GitHub Actions UI

jobs:
  run-schema-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Database Schema Inspection
        run: node inspect-game-schema.js