# .github/workflows/patch-team-stats-fixtures.yml
name: Patch Team Stats Fixtures

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run patch
        run: node scripts/patch-team-stats-fixtures.js

      - name: Final commit (safety net)
        run: |
          git add team-stats patch-fixtures-progress.json || true
          git diff --staged --quiet || git commit -m "patch-fixtures: final state"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
