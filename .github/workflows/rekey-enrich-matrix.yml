# .github/workflows/rekey-enrich-matrix.yml
#
# 3b-1: additively add spectatorIds[] to player files already keyed by their api
# id. Diverged-new files are skipped (3b-2 relocates them). Matrix by api prefix;
# each shard commits its own players/{bucket}/ (merge -X ours handles the race)
# and emits a tiny counts file. A single reduce job aggregates all counts into
# ONE overall summary. NO actions/setup-node.
#
# Run first with Bucket = "3a" + Dry run on to see what WOULD change (still gives
# one aggregate summary), then Bucket blank + Dry run off for the full pass.

name: Rekey enrich spectatorIds (migration 3b-1)

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Single api-prefix bucket, e.g. 3a. Leave blank to run all 256."
        required: false
        default: ""
      dry_run:
        description: "Dry run: count what would change, no writes/commits."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: rekey-enrich
  cancel-in-progress: false

jobs:
  generate-shards:
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.gen.outputs.buckets }}
    steps:
      - id: gen
        env:
          BUCKET: ${{ github.event.inputs.bucket }}
        run: |
          if [ -n "$BUCKET" ]; then
            arr=$(python3 -c "import json,os;print(json.dumps([os.environ['BUCKET'].strip().lower()]))")
          else
            arr=$(python3 -c "import json;print(json.dumps(['%02x'%i for i in range(256)]))")
          fi
          echo "buckets=$arr" >> "$GITHUB_OUTPUT"

  enrich:
    needs: generate-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8   # per-shard commits to main — limit push contention
      matrix:
        bucket: ${{ fromJson(needs.generate-shards.outputs.buckets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            players/${{ matrix.bucket }}
            players/alias-inverse/${{ matrix.bucket }}.json

      - name: git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enrich bucket
        run: |
          FLAGS="--bucket ${{ matrix.bucket }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          node scripts/rekey-enrich.js $FLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: enrichcounts-${{ matrix.bucket }}
          path: reports/rekey-enrich-counts/${{ matrix.bucket }}.json
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: enrich
    if: ${{ !cancelled() }}   # one overall summary even if some shards failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            reports/rekey-enrich-report.json

      - uses: actions/download-artifact@v4
        with:
          pattern: enrichcounts-*
          path: dl
          merge-multiple: true

      - name: Aggregate into one summary
        env:
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - << 'PY'
          import json, glob, os
          tot={'buckets':0,'scanned':0,'changed':0,'unchanged':0,'skippedDiverged':0,'skippedNonUuid':0}
          for f in glob.glob('dl/*.json'):
              d=json.load(open(f)); tot['buckets']+=1
              for k in ('scanned','changed','unchanged','skippedDiverged','skippedNonUuid'):
                  tot[k]+=d.get(k,0)
          dry = os.environ.get('DRY')=='true'
          os.makedirs('reports',exist_ok=True)
          json.dump(tot, open('reports/rekey-enrich-report.json','w'), indent=2)
          ss=os.environ.get('GITHUB_STEP_SUMMARY')
          if ss:
              with open(ss,'a') as s:
                  s.write(f"## Rekey enrich — overall report{' (dry run)' if dry else ''}\n\n")
                  s.write("| metric | value |\n|---|---|\n")
                  s.write(f"| buckets processed | {tot['buckets']} |\n")
                  s.write(f"| player files scanned | {tot['scanned']} |\n")
                  s.write(f"| enriched (spectatorIds set) | {tot['changed']} |\n")
                  s.write(f"| already correct (no-op) | {tot['unchanged']} |\n")
                  s.write(f"| skipped: diverged-new (3b-2 handles) | {tot['skippedDiverged']} |\n")
          print("aggregate:", json.dumps(tot))
          PY

      - name: Commit report
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/rekey-enrich-report.json
          if git diff --cached --shortstat | grep -q .; then
            git commit -m "rekey-enrich: overall report"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge -X ours FETCH_HEAD --no-edit || true
              if git push origin HEAD:main; then break; fi
              sleep $((attempt * 5))
            done
          else
            echo "Report unchanged."
          fi
