# explore-playhq-auth.yml
name: Explore PlayHQ Auth

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'PlayHQ tenant (bv=basketball, afl=footy)'
        required: false
        default: 'bv'
      profile:
        description: 'Player profile UUID to test with'
        required: false
        default: '94b31aeb-647e-4f5d-80ea-cdeccf1370cd'

jobs:
  explore:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run explorer
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.tenant }}" ]; then
            ARGS="$ARGS --tenant=${{ github.event.inputs.tenant }}"
          fi
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            ARGS="$ARGS --profile=${{ github.event.inputs.profile }}"
          fi
          node explore-playhq-auth.js $ARGS

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add explore-results/ explore-cookie.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: explore PlayHQ auth results"
          git push
