          deleted=0; skipped=0

          remove_file() {
            local f="$1"
            if [ -f "$f" ]; then
              if [ "$DRY_RUN" = "true" ]; then echo "  would rm: $f"; else git rm --ignore-unmatch -f "$f" >/dev/null; echo "  rm: $f"; fi
              deleted=$((deleted+1))
            else
              echo "  skip (absent): $f"; skipped=$((skipped+1))
            fi
          }
          remove_dir() {
            local d="$1"
            if [ -d "$d" ]; then
              if [ "$DRY_RUN" = "true" ]; then echo "  would rm -r: $d"; else git rm --ignore-unmatch -rf "$d" >/dev/null; echo "  rm -r: $d"; fi
              deleted=$((deleted+1))
            else
              echo "  skip (absent): $d"; skipped=$((skipped+1))
            fi
          }

          echo "── STAGE 1: scripts ──"
          for f in "${SCRIPTS[@]}";    do remove_file "$f"; done
          echo "── STAGE 1: workflows ──"
          for f in "${WORKFLOWS[@]}";  do remove_file "$f"; done
          echo "── STAGE 1: root files ──"
          for f in "${ROOT_FILES[@]}"; do remove_file "$f"; done
          echo "── STAGE 1: report files ──"
          for f in "${REPORT_FILES[@]}"; do remove_file "$f"; done
          echo "── STAGE 1: html files ──"
          for f in "${HTML_FILES[@]}"; do remove_file "$f"; done
          echo "── STAGE 1: directories ──"
          for d in "${DIRS[@]}";       do remove_dir "$d"; done

          if [ "$INCLUDE_GATED" = "true" ]; then
            echo "── STAGE 2 (gated): scripts ──"
            for f in "${GATED_SCRIPTS[@]}";   do remove_file "$f"; done
            echo "── STAGE 2 (gated): workflows ──"
            for f in "${GATED_WORKFLOWS[@]}"; do remove_file "$f"; done
            echo "── STAGE 2 (gated): directories ──"
            for d in "${GATED_DIRS[@]}";      do remove_dir "$d"; done
          else
            echo "── STAGE 2 skipped (include_gated=false). build-alias-index.js,"
            echo "   fix-uuid-prefix-length.js, cleanup-dead-artifacts.js, reports/backfill-collisions/,"
            echo "   players/alias-inverse/ NOT touched. Enable include_gated once their gates are cleared."
          fi

          echo ""
          echo "=== Summary ==="
          echo "  To delete: $deleted   Already absent: $skipped"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "DRY RUN complete — no changes staged, nothing committed."
            echo "Re-run with dry_run=false to apply STAGE 1 (and include_gated=true for STAGE 2)."
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit — all listed files already absent."
          else
            git commit -m "chore: delete obsolete + migration-era scripts, workflows, reports, orphaned progress files"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge -X ours FETCH_HEAD --no-edit --no-stat || true
              if git push origin main; then echo "Committed and pushed."; break; fi
              sleep $((attempt * 5))
            done
          fi
