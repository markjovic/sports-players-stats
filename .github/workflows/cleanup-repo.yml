# .github/workflows/cleanup-repo.yml
name: Cleanup Repo

# EXTENDED 2026-07-16: added the api-canonical migration-era scripts/workflows/reports
# that the full file audit (REPO_MANIFEST.md) confirmed complete, plus the scripts/-level
# orphaned progress dotfiles the original manifest missed. Added a DRY-RUN mode that lists
# every deletion and commits NOTHING — run that first and eyeball the list before a live run.
#
# ORDERING SAFETY (see REPO_MANIFEST.md §6): a few deletions are gated on ordering and are
# therefore split into a SECOND list (STAGE 2) that only runs when explicitly enabled:
#   - build-alias-index.js MUST be deleted BEFORE (or with) reports/backfill-collisions/ —
#     never leave build-alias-index runnable without its only redirect source, and never
#     run `build-alias-index --all` post-migration (it would emit zero redirects).
#   - fix-uuid-prefix-length.js should only be deleted AFTER diagnose-id-field-lengths.js
#     confirms zero 10-char ids remain.
#   - cleanup-dead-artifacts.js must be RUN ONCE (to clear team-lookup/) before it is deleted;
#     deleting it here is fine only if team-lookup/ is already gone.
# STAGE 2 is opt-in via the `include_gated` input so these can't be deleted by accident.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list every deletion, commit NOTHING (run this FIRST)'
        required: false
        default: true
        type: boolean
      include_gated:
        description: 'STAGE 2: also delete ordering-gated files (build-alias-index, fix-uuid-prefix-length, cleanup-dead-artifacts, backfill-collisions/). Only after their gates are cleared — see header.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (sparse — scripts, workflows, reports, root, no blobs)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            reports
            players/aliases
            players/alias-inverse
            /*.json
            /*.md
            /*.html
          sparse-checkout-cone-mode: false

      # SAFETY: before deleting anything on a LIVE run, push a permanent tag at the
      # current commit so the exact pre-cleanup state is recoverable with one click
      # (GitHub UI → tag → "Browse files" / restore). Skipped in dry-run (a preview
      # must not create tags). Idempotent: if the tag already exists (e.g. a prior
      # live run today), it is reused, not recreated — the workflow does not fail.
      - name: Tag pre-cleanup state (live runs only)
        if: ${{ inputs.dry_run != true }}
        env:
          TAG: pre-cleanup-${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — reusing it."
          else
            git tag -a "$TAG" -m "State immediately before cleanup-repo deletion run"
            git push origin "refs/tags/$TAG"
            echo "Tagged pre-cleanup state as: $TAG"
          fi
          echo "TO RECOVER ANY DELETED FILE LATER:"
          echo "  GitHub → Code → the tag dropdown → select $TAG → open the file → Raw → copy,"
          echo "  or restore-deleted-file.yml with the path (it reads from history)."

      - name: Delete stale files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          DRY_RUN: ${{ inputs.dry_run }}
          INCLUDE_GATED: ${{ inputs.include_gated }}
        run: |
          set -e

          if [ "$DRY_RUN" != "true" ]; then
            # Only touch the remote when we intend to write. COMMIT-before-MERGE order
            # is not needed here (deletions are staged then committed), but we still
            # sync first so the push is fast-forwardable.
            git fetch origin main
            git merge -X ours FETCH_HEAD --no-edit --no-stat
          fi

          # ────────────────────────────────────────────────────────────────────
          # STAGE 1 — always deleted (no ordering constraints)
          # ────────────────────────────────────────────────────────────────────

