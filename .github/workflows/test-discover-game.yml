# .github/workflows/test-discover-game.yml
name: Test Discover Game

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game ID to query (e.g. 10591e07)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query discoverGame
        run: |
          node --input-type=module << 'EOF'
          import crypto from 'crypto';
          const gameId  = '${{ inputs.game_id }}';
          const HEADERS = {
            'accept': '*/*', 'origin': 'https://www.playhq.com',
            'user-agent': 'PlayHQ/1.47.2 Android/28 (Android SDK built for x86)',
            'tenant': 'basketball-victoria', 'content-type': 'application/json',
          };
          const authRes = await fetch('https://api.playhq.com/graphql', {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID() },
            body: JSON.stringify({ operationName: 'TenantConfig', variables: {},
              query: 'query TenantConfig { tenantConfiguration { label } }' }),
          });
          const raw   = authRes.headers.get('set-cookie');
          const parts = raw.split(',').map(c => c.trim().split(';')[0].trim());
          const get   = n => parts.find(p => p.startsWith(n + '=')) || null;
          const cookie = `${get('phq_tier')}; ${get('phq_session')}; ${get('phq_sub')}`;
          console.log('Session obtained');

          const Q = `query discoverGame($gameID: ID!) {
            discoverGame(gameID: $gameID) {
              id
              status { name value }
              result {
                outcome { name value }
                winner { name value }
                home {
                  outcome { name value }
                  gameOutcomeDescription
                  statistics { count type { value } }
                }
                away {
                  outcome { name value }
                  gameOutcomeDescription
                  statistics { count type { value } }
                }
              }
              home { ... on DiscoverTeam { id name } }
              away { ... on DiscoverTeam { id name } }
              round { name number isFinalsRound }
              date
            }
          }`;

          const res  = await fetch('https://api.playhq.com/graphql', {
            method: 'POST',
            headers: { ...HEADERS, 'request-id': crypto.randomUUID(), 'Cookie': cookie },
            body: JSON.stringify({ operationName: 'discoverGame',
              variables: { gameID: gameId }, query: Q }),
          });
          const json = await res.json();
          if (json.errors) {
            console.log('Errors:', JSON.stringify(json.errors, null, 2));
          } else {
            const g = json.data?.discoverGame;
            if (!g) {
              console.log('discoverGame returned null — game is hidden or inaccessible');
            } else {
              console.log(JSON.stringify(g, null, 2));
              console.log('\n── Key fields ──');
              console.log('  status:          ', g.status?.value);
              console.log('  result.outcome:  ', g.result?.outcome?.value);
              console.log('  result.winner:   ', g.result?.winner?.value);
              console.log('  home outcome:    ', g.result?.home?.outcome?.value);
              console.log('  away outcome:    ', g.result?.away?.outcome?.value);
              console.log('  home desc:       ', g.result?.home?.gameOutcomeDescription);
              console.log('  away desc:       ', g.result?.away?.gameOutcomeDescription);
              const hs  = g.result?.home?.statistics?.find(s=>s.type?.value==='TOTAL_SCORE')?.count;
              const as_ = g.result?.away?.statistics?.find(s=>s.type?.value==='TOTAL_SCORE')?.count;
              console.log('  score:           ', `${hs??'?'} – ${as_??'?'}`);
            }
          }
          EOF
