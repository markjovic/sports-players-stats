# .github/workflows/reorganise-repo.yml
name: Reorganise Repo

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would change without applying'
        required: false
        default: true
        type: boolean

jobs:
  reorganise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reorganise
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node reorganise-repo.js --dry-run
          else
            node reorganise-repo.js
          fi
