# .github/workflows/probe-team-members.yml
name: Probe Team Members

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Bearer token from PlayHQ'
        required: true
      tenant:
        description: 'Tenant (default: bv)'
        required: false
        default: 'bv'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run team members probe
        run: node probe-team-members.js --tenant=${{ github.event.inputs.tenant }} --token="${{ github.event.inputs.token }}"

      - name: Commit HTML report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-team-members.html
          git diff --cached --quiet || git commit -m "Team members probe [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git pull --rebase origin main
          git push
