# .github/workflows/db-audit.yml
name: DB Audit

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Per-season game breakdown (top 20)'
        required: false
        default: false
        type: boolean
      no_size:
        description: 'Skip repo size report (faster)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run audit
        run: |
          ARGS=""
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          if [ "${{ inputs.no_size }}" = "true" ]; then ARGS="$ARGS --no-size"; fi
          node scripts/db-audit.js $ARGS
