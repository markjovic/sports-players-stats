# .github/workflows/weekly-indexes.yml
name: Weekly Indexes

on:
  schedule:
    - cron: '0 2 * * 0'   # 12:00 AEST Sunday (02:00 UTC Sunday)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — no writes or commits'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # fold-backstop job uses `gh workflow run`

jobs:
  team-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build team stats
        run: |
          ARGS="--active-only"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/build-team-stats.js $ARGS

  player-games:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build player games index
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/build-player-games.js $ARGS

  win-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build win-loss records (full)
        run: node scripts/build-win-loss.js

  fold-diverged:
    # Backstop for the fold. The fetch-profile-stats matrix triggers the fold at
    # the tail of each cycle that drains to `stuck`, but that chain is a series of
    # separate dispatches — a single failed dispatch skips the fold for that cycle.
    # This weekly trigger sweeps up any diverged players that were missed. The fold
    # is idempotent (only touches apiId-bearing files), so a redundant run is a no-op.
    # Gated behind the three player-writing jobs so it never races them on player
    # files / the index (they share the workflow's data-write concurrency group, but
    # within one workflow run jobs are otherwise parallel — `needs` serialises it).
    needs: [team-stats, player-games, win-loss]
    if: ${{ !cancelled() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger fold of diverged players (apply)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh workflow run fold-diverged-players.yml \
            --repo "${{ github.repository }}" \
            --field "mode=apply"
