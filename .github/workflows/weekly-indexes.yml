# .github/workflows/weekly-indexes.yml
name: Weekly Indexes

on:
  schedule:
    - cron: '0 2 * * 0'   # 12:00 AEST Sunday (02:00 UTC Sunday)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — no writes or commits'
        required: false
        default: false
        type: boolean
      fixtures_concurrency:
        description: 'discover-fixtures concurrency. 20 is the measured ceiling — see the job comment before raising it.'
        required: false
        default: '20'
        type: string

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # fold-backstop job uses `gh workflow run`

jobs:
  discover-fixtures:
    # Fetches the FULL round list — including FUTURE fixtures — for active seasons
    # via discoverTeamFixture. nightly-crawl only fetches the current + previous
    # rounds, so without this nothing ever ingests future fixtures and StatTrack can
    # only show ~1-2 weeks ahead. Runs FIRST (the build jobs below `needs` it) so
    # this run's indexes build on the refreshed game data. discover-fixtures.js now
    # uses the proven fetch + merge -X ours + 60-attempt push, so it's safe under
    # contention too.
    # NO setup-node — this job fetches api.playhq.com; setup-node changes the
    # runner's outbound fingerprint and causes CloudFront 403s.
    #
    # ⚠️ CONCURRENCY WAS 40 AND IS NOW 20. The 2026-10-04 run spent FOUR HOURS AND 45
    # MINUTES on the FIRST of 378 seasons and collected nothing: a wall of
    # "TeamFixture: HTTP 403" from team 240 onward, retried four times each at five
    # seconds, for every remaining team.
    #
    # The cause is not a block, a fingerprint or an IP range — it is a REQUEST BUDGET
    # on the session cookie, measured at roughly 290 calls (clean to team 280, 403;
    # recovered; clean again to 580, 403). discover-fixtures.js now rotates the
    # session proactively at 250 calls, which is granted instantly, where a refresh
    # requested AFTER the 403 sits inside a penalty window and costs two minutes of
    # backoff.
    #
    # 250 is tuned for ~20 calls in flight. At 40 the overshoot is twice as large and
    # more of them land past the line, which is the condition that produced the
    # four-hour run. Raising this needs a measurement, not an assumption.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Discover fixtures (current seasons — full round list incl. future)
        run: |
          ARGS="--current-only --concurrency=${{ inputs.fixtures_concurrency || '20' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/discover-fixtures.js $ARGS

  team-stats:
    needs: [discover-fixtures]
    if: ${{ !cancelled() }}   # build even if fixture discovery failed — indexes fall back to existing games
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build team stats
        run: |
          ARGS="--active-only"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/build-team-stats.js $ARGS

  player-games:
    # 2026-08-13 — MOVED LAST, and this is the bug that cost 2026-08-13 entirely.
    # build-player-games derives players' games[] ENTIRELY from p[] in games/bv, so
    # it must run after everything that writes games/bv has finished. It previously
    # ran in PARALLEL with discover-fixtures' 360-minute window and with the other
    # two player-file writers, checking out its own snapshot at job start. Result:
    # it derived from a partial view and reported 9,353 files updated, while the very
    # same script run standalone afterwards updated 13,046 and correctly filled in a
    # player who had 473 roster entries and a games[] of 30. Nothing was broken in
    # the script, the resolver, the alias index or the game data — only the ordering.
    # Anything added here that writes games/bv must be placed BEFORE this job.
    needs: [team-stats, win-loss]
    if: ${{ !cancelled() && needs.team-stats.result != 'cancelled' && needs.win-loss.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      # NO actions/setup-node — repo-wide rule. Neither of these scripts fetches
      # PlayHQ so it was harmless here, but it is one edit away from causing the
      # CloudFront 403s documented for every other job, and the runner's
      # preinstalled Node is what the rest of the pipeline uses.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build player games index
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/build-player-games.js $ARGS

  win-loss:
    # 2026-08-13: serialised behind team-stats. These jobs all WRITE player files and
    # all check out INDEPENDENTLY, and the workflow-level data-write group serialises
    # this workflow against OTHER workflows — not its own jobs against each other
    # (see the fold-diverged comment below, which says exactly that). Run in parallel
    # they each pushed with `merge -X ours`, i.e. "on conflict keep my copy", which is
    # a lost-update path, not merely a staleness one.
    needs: [team-stats]
    if: ${{ !cancelled() && needs.team-stats.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      # NO actions/setup-node — repo-wide rule. Neither of these scripts fetches
      # PlayHQ so it was harmless here, but it is one edit away from causing the
      # CloudFront 403s documented for every other job, and the runner's
      # preinstalled Node is what the rest of the pipeline uses.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build win-loss records (full)
        run: node scripts/build-win-loss.js

  fold-diverged:
    # Backstop for the fold. The fetch-profile-stats matrix triggers the fold at
    # the tail of each cycle that drains to `stuck`, but that chain is a series of
    # separate dispatches — a single failed dispatch skips the fold for that cycle.
    # This weekly trigger sweeps up any diverged players that were missed. The fold
    # is idempotent (only touches apiId-bearing files), so a redundant run is a no-op.
    # Gated behind the three player-writing jobs so it never races them on player
    # files / the index (they share the workflow's data-write concurrency group, but
    # within one workflow run jobs are otherwise parallel — `needs` serialises it).
    needs: [player-games]   # 2026-08-13: player-games is now last in the chain, so this alone gates on all three
    if: ${{ !cancelled() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger fold of diverged players (apply)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh workflow run fold-diverged-players.yml \
            --repo "${{ github.repository }}" \
            --field "mode=apply"
