# .github/workflows/measure-credited-coverage.yml
#
# READ-ONLY MEASUREMENT. Dispatch only, no cron.
#
# Two questions:
#   1. How much of "captured but not credited" is already explained by player.u,
#      the forfeit index and the no-registration-season rule, and how much is
#      left over. The leftover is the only thing a stored gamesAPI array adds.
#   2. Of the games IN player.u, how many does PlayHQ credit anyway. `u` is
#      presented in StatTrack as an appearance for a team the player never
#      registered with; if PlayHQ credits them, it holds a registration we do
#      not, and the field means something different from what it says.
#
# One report file per stratum: reports/measure-credited-coverage-<stratum>.json.
# Running a second stratum never disturbs the first.
#
# NO actions/setup-node ANYWHERE IN THIS FILE. This job fetches api.playhq.com,
# and setup-node changes the runner's outbound fingerprint, which produces a
# CloudFront 403 on every single request. The runner's preinstalled Node is used
# instead. This is the same rule that applies to nightly-crawl.yml.
#
# FULL checkout, never sparse. Sparse checkout creates a blobless clone that
# fetches roughly one file per second over the network and is unusable at 400k+
# files; it also caused the 2026-07-26 matrix failure. A full checkout of this
# repo takes about 7 minutes on a runner.
#
# Concurrency: its own group, NOT data-write. This job writes only
# reports/measure-credited-coverage.json and uses the 60-attempt push retry, so
# it does not need to hold the data-write lock for its whole runtime — and
# holding it would block the nightly for the duration (T19's one-slot queue).

name: Measure credited coverage

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many players to sample (1200 is roughly 15 minutes)'
        required: false
        default: '1200'
        type: string
      stratum:
        description: 'Which players to sample. all = uniform. withu = only players that already have a u array. nou = only players without one.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - withu
          - nou
      seed:
        description: 'Sampling seed. The same seed continues the same sample on a resume.'
        required: false
        default: '20260831'
        type: string
      commit_every:
        description: 'Commit the report after this many players'
        required: false
        default: '100'
        type: string
      fresh:
        description: 'Discard any existing report and start over'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

concurrency:
  group: measure-credited-coverage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout (full, never sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Show Node version (runner preinstalled, no setup-node)
        run: node --version

      - name: Syntax check
        run: node --check scripts/measure-credited-coverage.js

      # Inputs go through env, never straight into the command line. An input
      # interpolated into a run: block is substituted by GitHub BEFORE bash sees
      # it, so anything in it becomes shell source text.
      - name: Measure
        env:
          IN_SAMPLE:  ${{ inputs.sample }}
          IN_STRATUM: ${{ inputs.stratum }}
          IN_SEED:    ${{ inputs.seed }}
          IN_EVERY:   ${{ inputs.commit_every }}
          IN_FRESH:   ${{ inputs.fresh }}
        run: |
          set -euo pipefail
          FRESH_FLAG=""
          if [ "$IN_FRESH" = "yes" ]; then
            FRESH_FLAG="--fresh"
          fi
          node scripts/measure-credited-coverage.js \
            "--sample=$IN_SAMPLE" \
            "--stratum=$IN_STRATUM" \
            "--seed=$IN_SEED" \
            "--commit-every=$IN_EVERY" \
            $FRESH_FLAG

      - name: Report location
        if: always()
        env:
          IN_STRATUM: ${{ inputs.stratum }}
        run: |
          echo "Report: reports/measure-credited-coverage-$IN_STRATUM.json"
          echo "One file per stratum, so running a second stratum never disturbs"
          echo "the first. The rollup is stored inside that file under .rollup and"
          echo "is recomputed from .players at every commit, so a blocked run keeps"
          echo "its measurement. Re-dispatch with the SAME sample, stratum and seed"
          echo "to continue it."
