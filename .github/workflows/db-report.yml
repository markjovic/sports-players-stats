# .github/workflows/db-report.yml
name: Database Report

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show per-season breakdown (top 20)'
        required: false
        default: false
        type: boolean
      include_players:
        description: 'Include player detail file count (slower checkout)'
        required: false
        default: false
        type: boolean
      verify_migration:
        description: 'Run full migration verification (Phases 1–3)'
        required: false
        default: false
        type: boolean

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/db-report.js
            sports-index.json
            players/indexes
            team-lookup
            venue-lookup
            team-index.json
            venue-index.json
            team-stats
            search
            games
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run report
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          if [ "${{ github.event.inputs.include_players }}" = "true" ]; then ARGS="$ARGS --include-players"; fi
          if [ "${{ github.event.inputs.verify_migration }}" = "true" ]; then ARGS="$ARGS --verify-migration"; fi
          node scripts/db-report.js $ARGS
