# .github/workflows/db-report.yml
name: Database Report

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show per-season breakdown (top 20)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            db-report.js
            sports-index.json
            players-index
            team-lookup
            venue-lookup
            games
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run report
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            ARGS="--verbose"
          fi
          node db-report.js $ARGS
