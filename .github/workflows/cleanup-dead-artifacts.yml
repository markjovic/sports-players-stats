# .github/workflows/cleanup-dead-artifacts.yml
name: Cleanup Dead Artifacts (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (sparse — only the paths being touched)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            discover-reduce-manifest.json
            team-lookup
            scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run cleanup script
        run: node scripts/cleanup-dead-artifacts.js
