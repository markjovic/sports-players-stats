# .github/workflows/reconcile-people.yml
name: Reconcile people count (migration 3b-2 diagnostic, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reconcile-people
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Plain depth-1 checkout: gives the full working tree of the tip (all player files)
      # without the ~140-min full-history download. This is the path verify-enrich used.
      - name: Checkout (working tree only)
        uses: actions/checkout@v4

      - name: Run reconcile (read-only scan)
        run: node scripts/reconcile-people.js

      # One committer, one file. Follows the proven fetch-profile-stats.js push pattern:
      # 60 attempts, random 1-91s jitter, merge --abort cleanup before each retry, merge -X ours.
      - name: Commit report (push-with-retry)
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/reconcile-people.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "reconcile-people: 3b-2 diagnostic report"
          for i in $(seq 1 60); do
            git merge --abort 2>/dev/null || true
            if git fetch origin "$GITHUB_REF_NAME" \
              && git merge -X ours "origin/$GITHUB_REF_NAME" -m "merge before reconcile push" \
              && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep $(( (RANDOM % 91) + 1 ))
          done
          echo "push failed after 60 attempts"
          exit 1
