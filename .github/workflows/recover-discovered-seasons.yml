# recover-discovered-seasons.yml
name: Recover Discovered Seasons

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull --rebase=false --no-edit -X ours

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fill season metadata
        run: node recover-discovered-seasons.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seasons-discovered.json seasons-invalid.json queue-bv-priority.json queue-bv-backlog.json
          git diff --staged --quiet || git commit -m "chore: fill season metadata"
          git push
