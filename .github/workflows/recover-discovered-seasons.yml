name: Recover Discovered Seasons

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull --rebase=false --no-edit -X ours

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run recovery script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node recover-discovered-seasons.js

      - name: Commit updated queue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue-bv-priority.json queue-bv-backlog.json seasons-discovered.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: recover discovered seasons from run logs"
          git push
