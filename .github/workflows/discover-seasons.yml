# .github/workflows/discover-seasons.yml
name: Discover Seasons (detection)

on:
  # No schedule: the sharded matrix (discover-seasons-matrix.yml) is the production
  # path. This standalone remains for manual/adhoc use (--uuid seed, diagnostics) —
  # its whole-population sweep runs on ONE IP and walls at scale, so don't schedule it.
  workflow_dispatch:
    inputs:
      uuid:
        description: 'Player UUIDs, comma-separated — one or thousands. Probes each for publicProfileTeams and writes any new registration. Use season_ids below instead for a whole competition.'
        required: false
        default: ''
        type: string
      full:
        description: 'Probe every current-season player (no early stop)'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Probe at most N players (cheap test run; blank = no cap)'
        required: false
        default: ''
        type: string
      uuids_from_seasons:
        description: 'Season ids, comma-separated. Probes every player holding a registration in them — selected from players/, so list size does not matter. Use instead of uuid for a whole competition.'
        required: false
        type: string
      team_name:
        description: 'With season ids: narrow to teams whose name contains this (e.g. Ringwood). Blank = every player in those seasons.'
        required: false
        type: string
      backfill_teams:
        description: 'WRITE the registrations found, not just print them. REQUIRED to populate rosters — without it the probe reports and writes nothing (the registration write is gated on it). Tick this.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Report only — no writes or commit'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'AIMD concurrency cap (default 25; self-tunes down on the WAF wall)'
        required: false
        default: '25'
        type: string

# Shares the data-write group so it can never run while nightly-crawl or
# weekly-indexes are writing player files or the index (avoids -X ours clobber).
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # NO actions/setup-node — this job fetches PlayHQ, and setup-node's fingerprint
      # change makes CloudFront 403-block every request including session acquisition
      # (proven 2026-07-20 on the instrumented matrix shard 00; same-day nightly-crawl
      # without setup-node worked). Preinstalled node only.

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Directive 13 / T27: inputs reach bash through env: ONLY. `uuid` now accepts
      # a comma-separated LIST (2026-10-13), so this field carries tens of
      # thousands of characters of dispatcher-supplied text — exactly the string
      # that must not be spliced into the script the runner executes.
      - name: Run discovery
        env:
          IN_UUID:  ${{ inputs.uuid }}
          IN_FROMS: ${{ inputs.uuids_from_seasons }}
          IN_BACKFILL: ${{ inputs.backfill_teams }}
          IN_TEAMNAME: ${{ inputs.team_name }}
          IN_FULL:  ${{ inputs.full }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_DRY:   ${{ inputs.dry_run }}
          IN_CONC:  ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          ARGS=()
          ok() { case "$1" in ''|*[!A-Za-z0-9,.-]*) return 1;; *) return 0;; esac; }
          add() {
            [ -n "$1" ] || return 0
            ok "$1" || { echo "::error::$2 rejected — unexpected characters"; exit 1; }
            ARGS+=("$2=$1")
          }
          add "$IN_UUID"  --uuid
          add "$IN_FROMS" --uuids-from-seasons
          if [ -n "$IN_TEAMNAME" ]; then
            case "$IN_TEAMNAME" in
              *\"*|*\$*|*\`*) echo "::error::team_name rejected — quotes and shell metacharacters are not accepted"; exit 1;;
            esac
            ARGS+=("--team-name=$IN_TEAMNAME")
          fi
          add "$IN_LIMIT" --limit
          add "$IN_CONC"  --concurrency
          [ "$IN_FULL" = "true" ] && ARGS+=(--full) || true
          [ "$IN_BACKFILL" = "true" ] && ARGS+=(--backfill-teams) || true
          [ "$IN_DRY" = "true" ] && ARGS+=(--dry-run) || true
          echo "args: ${#ARGS[@]} argument(s)"
          node scripts/discover-seasons.js ${ARGS[@]+"${ARGS[@]}"}
