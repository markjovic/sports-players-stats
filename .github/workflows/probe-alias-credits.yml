# .github/workflows/probe-alias-credits.yml
name: Probe Alias Credits

# READ-ONLY as far as player and game data goes. Writes one report artifact.
# No data-write lock.
#
# THE QUESTION. players/aliases holds ~498,000 entries mapping a spectator id to an
# api profile. Every one was written by matchFromGrade or matchFromGradeRosterByName
# in lib/namespace-resolve.cjs, which decide by EXACT NAME — plus team id in the
# first, name alone within one grade in the second. NEITHER EVER CHECKED whether
# the profile it picked actually credits the games that alias delivers.
#
# The worked example, established 2026-08-23:
#   900f4fe6-bec3   appears in PlayHQ box scores as "Jida McCrae-Cooper" and is NOT
#                   a PlayHQ profile — the case aliases exist for.
#   our alias sends it to d6c25c0c-e1e4-… , a DIFFERENT PlayHQ profile with a
#                   similar name and different statistics.
#   60eeeaa9-ab28-… is the profile that actually credits those games (310 of them).
# So ~198 appearances sit on the wrong player. size-report listed this alias third
# in "worst offenders" and the cause was never established until now.
#
# This applies the test the matcher should have used: does the TARGET profile's
# publicProfileStatistics credit the games this alias delivers?
#   SUPPORTED    it credits at least one — backed by PlayHQ
#   UNSUPPORTED  it credits NONE of them — the shape of the error above
#   NO ANSWER    private, throttled, or no games located — no verdict
#
# UNSUPPORTED is not proof on its own: a profile can be private, or PlayHQ can omit
# a season. It is the population to inspect, and nothing is changed here.
#
# NO actions/setup-node (this job fetches api.playhq.com — absolute rule).

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Aliases to audit. Start with 200 — the supported/unsupported ratio is what decides whether this is a handful or thousands.'
        required: false
        default: '200'
        type: string
      all:
        description: 'Audit EVERY name-matched alias instead of a sample. Only worth it once the sample shows the scale.'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'Profile calls in flight. The first version was SERIAL with a 1s sleep, making a full audit a 23-hour job — that pace came from a spectator.playhq.com probe and does not apply to api.playhq.com. 8 is what repair-players-batch uses. Backs off automatically. Capped at 50.'
        required: false
        default: '8'
        type: string
      save_every:
        description: 'Write the report and cache every N profiles. Lower = less lost if the job is killed, more writes.'
        required: false
        default: '250'
        type: string
      refresh_every:
        description: 'Re-obtain the session every N profile calls. The 2026-08-23 run died at 503 because the session went stale and was never refreshed — fetch-profile-stats refreshes every batch.'
        required: false
        default: '250'
        type: string
      chain:
        description: 'Re-dispatch itself when the audit is still PARTIAL. 54,328 profiles will not fit in one job; each link resumes from the cache.'
        required: false
        default: true
        type: boolean
      pace:
        description: 'Extra milliseconds between CHUNKS. 0 normally — concurrency and the backoff do the pacing. Raise only if the endpoint pushes back.'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # A 54,328-profile audit will not fit in one job. Verdicts are cached and
      # restored so each dispatch continues instead of restarting. First run has no
      # artifact and download-artifact FAILS the step rather than returning empty,
      # so continue-on-error is required, not defensive.
      - name: Restore previous verdict cache
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: alias-credit-cache
          path: /tmp/cache

      - name: Stage the restored cache
        run: |
          mkdir -p reports
          n=0
          for f in alias-credit-cache.json alias-resolve-cache.json; do
            if [ -f "/tmp/cache/$f" ]; then cp "/tmp/cache/$f" reports/; n=$((n+1)); fi
          done
          if [ "$n" -gt 0 ]; then echo "  restored $n cache file(s) from the previous run";
          else echo "  no previous cache — starting cold"; fi

      - name: Probe alias credits
        run: |
          ARGS="--sample=${{ inputs.sample }} --pace=${{ inputs.pace }} --concurrency=${{ inputs.concurrency }} --save-every=${{ inputs.save_every }} --refresh-every=${{ inputs.refresh_every }}"
          if [ "${{ inputs.all }}" = "true" ] || [ "${{ inputs.all }}" = "True" ]; then ARGS="$ARGS --all"; fi
          node --max-old-space-size=8192 scripts/probe-alias-credits.js $ARGS

      # contents: read, so the report cannot be committed — it must be an artifact
      # or it dies with the runner, as the first duplicate-pair report did.
      # BOTH files, always. The report is written incrementally, so even a run
      # killed at the job ceiling leaves a usable partial result — the failure mode
      # that lost an hour of calls on 2026-08-21.
      - name: Upload the audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alias-credit-audit
          path: |
            reports/alias-credit-audit.json
            reports/alias-credit-cache.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload the verdict cache for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alias-credit-cache
          path: |
            reports/alias-credit-cache.json
            reports/alias-resolve-cache.json
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      # ⚠ MUST COME AFTER THE CACHE UPLOAD. Dispatched first, the next link could
      # start before its cache artifact existed and would redo everything this run
      # just did.
      # Chain the next link ONLY while the report says partial. Reading the report
      # rather than the exit code means a run that finished early because it was
      # already complete does not spawn a pointless dispatch.
      - name: Chain the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
          CHAIN: ${{ (inputs.chain == true || inputs.chain == 'true') && 'true' || '' }}
        run: |
          if [ -z "$CHAIN" ]; then echo "  chaining disabled"; exit 0; fi
          if [ ! -f reports/alias-credit-audit.json ]; then echo "  no report — not chaining"; exit 0; fi
          PARTIAL=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('reports/alias-credit-audit.json','utf8')).partial?'yes':'no')}catch(e){console.log('no')}")
          if [ "$PARTIAL" != "yes" ]; then echo "  audit COMPLETE — not chaining"; exit 0; fi
          echo "  audit is partial — dispatching the next link"
          # A chain-critical dispatch is never one-shot; fail FAST on HTTP 4xx
          # because retrying a bad input buries the real error.
          for i in $(seq 1 10); do
            if out=$(gh workflow run probe-alias-credits.yml --repo "$GH_REPO" \
                 --field all=true \
                 --field concurrency=${{ inputs.concurrency }} \
                 --field save_every=${{ inputs.save_every }} \
                 --field refresh_every=${{ inputs.refresh_every }} \
                 --field pace=${{ inputs.pace }} \
                 --field chain=true 2>&1); then
              echo "  ✓ dispatched (attempt $i)"; exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ permanent error — not retrying"; exit 1
            fi
            sleep $(( i * 10 ))
          done
          echo "  ✗ dispatch failed after 10 attempts"; exit 1
