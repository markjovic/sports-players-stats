# .github/workflows/verify-p-redundancy.yml
name: Verify p[] Redundancy (one-off diagnostic)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Limit to first N season files (blank = all, full population)'
        required: false
        default: ''
        type: string
      examples:
        description: 'Raw example games to keep per category, for the artifact'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (sparse — only games/ and scripts/ needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            games
            scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run verification
        run: |
          ARGS=""
          if [ -n "${{ inputs.seasons }}" ]; then ARGS="$ARGS --seasons=${{ inputs.seasons }}"; fi
          if [ -n "${{ inputs.examples }}" ]; then ARGS="$ARGS --examples=${{ inputs.examples }}"; fi
          node scripts/verify-p-redundancy.js $ARGS

      - name: Upload example games
        uses: actions/upload-artifact@v4
        with:
          name: p-redundancy-examples
          path: p-redundancy-examples.json
          retention-days: 7
