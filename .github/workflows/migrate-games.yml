name: Migrate Games Files

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run migration
        run: bash migrate-games.sh

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/
          git rm --cached games-bv-*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: reorganise games files into games/{tenant}/ folders"
          git pull --rebase
          git push
