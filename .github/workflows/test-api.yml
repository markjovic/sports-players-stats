# .github/workflows/test-api.yml
name: Test API

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: concurrency | profile | game | schema | gps | fixture'
        required: true
        default: 'fixture'
        type: string
      args:
        description: 'Args, e.g. --grade=<gradeId> (or a uuid/gameId for profile/game)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test-api
        run: node scripts/test-api.js ${{ inputs.mode }} ${{ inputs.args }}
