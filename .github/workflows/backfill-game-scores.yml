# .github/workflows/backfill-game-scores.yml
name: Backfill Game Scores

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'backfill'
        type: choice
        options:
          - 'backfill - fetch missing scores'
          - 'review-failed - re-queue future games from failed set'
      concurrency:
        description: 'Concurrent API requests (backfill mode only)'
        required: false
        default: '500'
        type: string
      tenant:
        description: 'Tenant'
        required: false
        default: 'bv'
        type: choice
        options:
          - bv

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run backfill
        run: |
          MODE="${{ github.event.inputs.mode }}"
          ARGS="--tenant=${{ github.event.inputs.tenant }}"
          if [[ "$MODE" == review* ]]; then
            ARGS="$ARGS --review-failed"
          else
            ARGS="$ARGS --concurrency=${{ github.event.inputs.concurrency }}"
          fi
          node backfill-game-scores.js $ARGS

      - name: Commit final results
        run: |
          STASHED=$(git stash 2>&1)
          git pull --rebase=false --no-edit -X ours
          if echo "$STASHED" | grep -q "Saved"; then git stash pop; fi
          git add games/ backfill-progress.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Backfill game scores: final flush"
            git push
          fi
