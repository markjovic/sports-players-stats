# .github/workflows/backfill-game-scores.yml
name: Backfill Game Scores

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent API requests'
        required: false
        default: '200'
        type: string
      tenant:
        description: 'Tenant'
        required: false
        default: 'bv'
        type: choice
        options:
          - bv

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run backfill
        run: node backfill-game-scores.js --concurrency=${{ github.event.inputs.concurrency }} --tenant=${{ github.event.inputs.tenant }}

      - name: Commit final results
        run: |
          git stash
          git pull --rebase origin main
          STASHED=$(git stash list | head -1)
          if [ -n "$STASHED" ]; then git stash pop; fi
          git add games/ backfill-progress.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Backfill game scores: final flush"
            git push
          fi
