# .github/workflows/count-stats-checked.yml
name: Count Stats Checked

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Count statsChecked
        run: node scripts/count-stats-checked.js
