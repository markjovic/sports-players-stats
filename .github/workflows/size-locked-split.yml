# .github/workflows/size-locked-split.yml
# READ-ONLY diagnostic for the active/locked Pages split (OUTSTANDING §2.1, design approved 2026-08-06).
# Measures gzip-9 compressed size of games/bv, team-stats/bv and leaderboard/season split by the
# locked flag in data/sports-index.json (.seasons OBJECT keyed by season id — verified against the
# live file 2026-08-07). Writes nothing, commits nothing, dispatches nothing.
name: Size Locked Split

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4

      - name: Measure locked vs active compressed size
        run: |
          cat > /tmp/size-locked-split.cjs << 'SCRIPT_EOF'
          // One-off read-only diagnostic. Lives embedded in .github/workflows/size-locked-split.yml
          // Measures compressed (gzip -9) size of games/bv, team-stats/bv, leaderboard/season,
          // split by the locked flag in data/sports-index.json.
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');

          const ROOT = process.env.SCAN_ROOT || '.';
          const DIRS = ['games/bv', 'team-stats/bv', 'leaderboard/season'];
          const REFERENCE = { 'games/bv': 260, 'team-stats/bv': 159, 'leaderboard/season': 126 }; // MB, 2026-08-06 size-pages-artifact table

          function fail(msg) { console.error('ABORT: ' + msg); process.exit(1); }

          // ---- Load sports-index. Exact structure per the live file: top-level object with a
          // .seasons OBJECT keyed by season id, each value a season object carrying id + locked. ----
          const indexPath = path.join(ROOT, 'data/sports-index.json');
          if (!fs.existsSync(indexPath)) fail('data/sports-index.json not found');
          const rawIndex = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (!rawIndex || typeof rawIndex !== 'object' || Array.isArray(rawIndex)) fail('top level of sports-index.json is not an object');
          const seasonsObj = rawIndex.seasons;
          if (!seasonsObj || typeof seasonsObj !== 'object' || Array.isArray(seasonsObj)) fail('.seasons is not an object keyed by season id');

          const bySid = new Map();
          let idxLocked = 0, idxActive = 0, idxNoField = 0;
          for (const [sid, s] of Object.entries(seasonsObj)) {
            if (!s || typeof s !== 'object') fail('season entry ' + sid + ' is not an object');
            bySid.set(sid, s);
            if (s.id && s.id !== sid) bySid.set(s.id, s); // defensive; key is the authority
            if (s.locked === true) idxLocked++;
            else if (s.locked === false) idxActive++;
            else idxNoField++;
          }
          console.log('sports-index: .seasons object keyed by id, ' + Object.keys(seasonsObj).length + ' seasons');
          console.log('index counts: locked=' + idxLocked + ' active(locked:false)=' + idxActive + ' no-locked-field=' + idxNoField);
          console.log('');

          // ---- Walk the three directories, classify every file, sum raw + gzip-9 bytes ----
          function* walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) yield* walk(p);
              else if (e.isFile()) yield p;
            }
          }

          // A file belongs to a season if its basename (minus .json) is an index key, or —
          // for any nested layout — a directory segment of its path under the scanned dir is.
          function sidForFile(relPath) {
            const parts = relPath.split(path.sep);
            const base = parts[parts.length - 1].replace(/\.json$/i, '');
            if (bySid.has(base)) return base;
            for (let i = 0; i < parts.length - 1; i++) if (bySid.has(parts[i])) return parts[i];
            return null;
          }

          const BUCKETS = ['locked', 'active', 'not-in-index', 'unmatched'];
          function newTally() {
            const t = {};
            for (const b of BUCKETS) t[b] = { files: 0, raw: 0, gz: 0, samples: [] };
            return t;
          }
          const mb = (n) => (n / 1048576).toFixed(1);

          const perDir = {};
          const grand = newTally();
          const noFieldSidsWithFiles = new Set();

          for (const dir of DIRS) {
            const abs = path.join(ROOT, dir);
            if (!fs.existsSync(abs)) fail(dir + ' does not exist in the checkout');
            const tally = newTally();
            let fileCount = 0;
            for (const f of walk(abs)) {
              fileCount++;
              const rel = path.relative(abs, f);
              const isJson = /\.json$/i.test(rel);
              const sid = isJson ? sidForFile(rel) : null;
              let bucket;
              if (!isJson) bucket = 'unmatched';
              else if (!sid) bucket = 'not-in-index';
              else {
                const season = bySid.get(sid);
                if (season.locked === true) bucket = 'locked';
                else {
                  bucket = 'active';
                  if (season.locked !== false) noFieldSidsWithFiles.add(sid);
                }
              }
              const buf = fs.readFileSync(f);
              const gz = zlib.gzipSync(buf, { level: 9 }).length;
              for (const t of [tally, grand]) {
                t[bucket].files++; t[bucket].raw += buf.length; t[bucket].gz += gz;
                if ((bucket === 'not-in-index' || bucket === 'unmatched') && t[bucket].samples.length < 5) t[bucket].samples.push(rel);
              }
            }
            if (fileCount === 0) fail(dir + ' contains zero files');
            perDir[dir] = tally;
          }

          // ---- Report ----
          for (const dir of DIRS) {
            const t = perDir[dir];
            const totalGz = BUCKETS.reduce((a, b) => a + t[b].gz, 0);
            const totalFiles = BUCKETS.reduce((a, b) => a + t[b].files, 0);
            console.log('== ' + dir + ' ==');
            for (const b of BUCKETS) {
              if (t[b].files === 0 && (b === 'not-in-index' || b === 'unmatched')) continue;
              console.log('  ' + b.padEnd(13) + t[b].files.toString().padStart(6) + ' files  raw ' + mb(t[b].raw).padStart(9) + ' MB  gz ' + mb(t[b].gz).padStart(8) + ' MB');
              if (t[b].samples.length) console.log('    samples: ' + t[b].samples.join(', '));
            }
            const lockedPct = totalGz ? (100 * t.locked.gz / totalGz).toFixed(1) : '0.0';
            console.log('  TOTAL        ' + totalFiles.toString().padStart(6) + ' files  gz ' + mb(totalGz).padStart(8) + ' MB   locked share ' + lockedPct + '%');
            console.log('  reference (2026-08-06 size-pages-artifact): ~' + REFERENCE[dir] + ' MB compressed — a large mismatch means the compression method differs; the RATIO above is still valid');
            console.log('');
          }

          const archiveGz = grand.locked.gz;
          const stayGz = grand.active.gz + grand['not-in-index'].gz + grand.unmatched.gz;
          const allGz = archiveGz + stayGz;
          console.log('== SPLIT PROJECTION (three directories combined) ==');
          console.log('  would graduate to ARCHIVE (locked):        gz ' + mb(archiveGz) + ' MB  (' + grand.locked.files + ' files)');
          console.log('  would stay on ACTIVE (active seasons):     gz ' + mb(grand.active.gz) + ' MB  (' + grand.active.files + ' files)');
          if (grand['not-in-index'].files) console.log('  stays on ACTIVE — sid NOT IN INDEX:        gz ' + mb(grand['not-in-index'].gz) + ' MB  (' + grand['not-in-index'].files + ' files) ⚠ investigate — samples: ' + grand['not-in-index'].samples.join(', '));
          if (grand.unmatched.files) console.log('  stays on ACTIVE — not a .json file:        gz ' + mb(grand.unmatched.gz) + ' MB  (' + grand.unmatched.files + ' files) ⚠ investigate — samples: ' + grand.unmatched.samples.join(', '));
          console.log('  locked share overall: ' + (allGz ? (100 * archiveGz / allGz).toFixed(1) : '0.0') + '%');
          if (noFieldSidsWithFiles.size) {
            console.log('  ⚠ seasons WITH FILES whose index entry has NO locked field (counted as active): ' + noFieldSidsWithFiles.size);
          } else {
            console.log('  seasons with files lacking a locked field: 0 (expected)');
          }
          SCRIPT_EOF
          node /tmp/size-locked-split.cjs
