# .github/workflows/scan-complete-rounds.yml
name: Scan Complete Rounds (backfill)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Single season ID (blank = all seasons)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Report only — no writes or commit'
        required: false
        default: false
        type: boolean
      unlock:
        description: 'Reopen locked seasons proven incomplete (writes sports-index.json)'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Needs all season files but NOT the 369k player files — sparse-checkout games/bv only.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/scan-complete-rounds.js
            games/bv
            data/sports-index.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scan and backfill markers
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.unlock }}" = "true" ]; then ARGS="$ARGS --unlock"; fi
          node scripts/scan-complete-rounds.js $ARGS

      - name: Commit markers
        if: ${{ inputs.dry_run != true }}
        run: |
          git add games/bv data/sports-index.json
          if git diff --staged --quiet; then
            echo "No marker changes to commit."
            exit 0
          fi
          git commit -m "scan-complete-rounds: backfill roundsComplete markers"
          git fetch origin
          git merge -X ours FETCH_HEAD --no-edit
          git push
          git diff --shortstat HEAD~1 HEAD || true
