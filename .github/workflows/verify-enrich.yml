# .github/workflows/verify-enrich.yml
#
# READ-ONLY integrity check of the rekey-enrich commits. Diffs the pre-enrich
# baseline against HEAD across every player file and flags any that lost data or
# no longer parse. Writes NOTHING to the repo (contents: read) — the report is a
# downloadable artifact plus the run Summary. Reads git objects via cat-file, so
# it does NOT materialise the 400k-file working tree (no slow full checkout).
# NO actions/setup-node.

name: Verify enrich (data-loss check, read-only)

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Optional baseline commit SHA. Blank = auto-detect (parent of oldest enrich commit)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1000          # enough history to reach the pre-enrich baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts    # only the script in the working tree; blobs come from git objects

      - name: Verify (read-only)
        run: |
          if [ -n "${{ github.event.inputs.baseline }}" ]; then
            node scripts/verify-enrich.js --baseline ${{ github.event.inputs.baseline }}
          else
            node scripts/verify-enrich.js
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: verify-enrich-report
          path: reports/verify-enrich-report.json
          if-no-files-found: warn
