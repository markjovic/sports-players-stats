# .github/workflows/verify-enrich.yml
#
# READ-ONLY validity scan of every player file (parses? has uuid/structure?).
# Plain shallow checkout, NO sparse-checkout — files land on local disk so reads
# are instant. (Sparse-checkout makes a blobless clone and fetches each file over
# the network ~1s each = unusable at 400k files.) Writes nothing to the repo.
# NO actions/setup-node.

name: Verify enrich (validity scan, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4   # default shallow, full working tree (~8.6 GB, fits)

      - name: Validity scan (read-only)
        run: node scripts/verify-enrich.js

      - uses: actions/upload-artifact@v4
        with:
          name: verify-enrich-report
          path: reports/verify-enrich-report.json
          if-no-files-found: warn
