# .github/workflows/discover-seasons-matrix.yml
name: Discover Seasons (Matrix)

# Sharded, RESUMABLE season DETECTION + optional pre-season ROSTER BACKFILL.
# Each MAP job gets a FRESH runner IP and burst-probes its shard's players until the
# per-IP WAF wall hits, then stops dead (no grind) and saves a cursor. With
# --backfill-teams it ALSO emits lightweight per-player DELTAS (registrations to add)
# straight from the API response — it never reads or snapshots a player file, so
# there is nothing stale to clobber later.
#
# ONE job (reduce) then: merges discoveries + cursors, expands its OWN checkout to
# cover only the shards with pending deltas, reads each affected player file FRESH
# off disk, applies the deltas, and commits everything (index + progress + players)
# in one push — all under concurrency group data-write, the same lock nightly-crawl
# and the stats matrix use, so this can never race either of them on the same files.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'JSON array of specific shards (e.g. ["00","1a","ff"]). Empty = all 256 not already done for this mode.'
        required: false
        default: '[]'
        type: string
      all_players:
        description: 'Backlog pass: probe EVERY player (not just current-season). Slower, thorough.'
        required: false
        default: false
        type: boolean
      backfill_teams:
        description: 'Also write discovered team/grade registrations into player files (implies all_players)'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'Burst batch size per shard (default 25 — matches the proven clean-run length before a fresh IP walls)'
        required: false
        default: '25'
        type: string
      dry_run:
        description: 'Report only — writes/commits nothing'
        required: false
        default: false
        type: boolean
      fresh_start:
        description: 'Ignore/delete existing progress (re-sweep from scratch). Applies ONLY to the run you dispatch — never propagated to self-triggered continuations.'
        required: false
        default: false
        type: boolean
      run_number:
        description: 'Auto-incremented by self-trigger — do not set manually'
        required: false
        default: '1'
        type: string

permissions:
  contents: write
  actions: write

env:
  MAX_RUNS: 40   # safety cap on self-trigger chain length

jobs:
  reset-progress:
    if: inputs.fresh_start == true
    runs-on: ubuntu-latest
    # Only this job — the rare, deliberately-requested case — pays the lock cost.
    # generate-shards stays lock-free so every normal run keeps starting instantly.
    concurrency:
      group: data-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/discover-progress.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete progress file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/discover-progress.json ]; then
            echo "No progress file to reset."
            exit 0
          fi
          git rm data/discover-progress.json
          git commit -m "discover-seasons: fresh_start — reset progress"
          git fetch origin main
          git merge -X ours FETCH_HEAD --no-edit
          git push origin main
          echo "Progress reset."

  generate-shards:
    needs: reset-progress
    if: always()
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.gen.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/discover-progress.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: gen
        env:
          INPUT_SHARDS: ${{ inputs.shards }}
          ALL_PLAYERS: ${{ inputs.all_players }}
          BACKFILL_TEAMS: ${{ inputs.backfill_teams }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re

          raw = (os.environ.get('INPUT_SHARDS') or '').strip()
          inner = raw[1:-1] if raw.startswith('[') and raw.endswith(']') else raw
          toks = [t.strip().strip('"').strip("'") for t in inner.split(',')]
          toks = [t.lower() for t in toks if re.fullmatch(r'[0-9a-fA-F]{2}', t or '')]
          explicit = bool(toks)
          if not toks:
              toks = [format(i, '02x') for i in range(256)]

          # backfill_teams FORCES all_players inside the script (see discover-seasons.js)
          # — mirror that here so cursor/mode tracking never desyncs from what the
          # script actually scans (this was a real bug: mismatched cursor base).
          # It ALSO gets its own mode key ('all+backfill', not 'all') — a prior plain
          # all_players discovery pass marks shards done under mode='all', and if
          # backfill shared that key, this run would see everything already "done"
          # and skip all 256 shards, backfilling nothing. Same player list either way
          # (only what happens with the results differs), so this is a resume-state
          # label fix, not a change to what gets probed.
          backfill = os.environ.get('BACKFILL_TEAMS') == 'true'
          all_players = os.environ.get('ALL_PLAYERS') == 'true' or backfill
          mode = ('all+backfill' if backfill else 'all') if all_players else 'current'

          progress = {}
          try:
              with open('data/discover-progress.json') as f:
                  progress = json.load(f)
          except FileNotFoundError:
              pass
          except Exception as e:
              print(f'  Warning: could not parse progress file: {e}')

          targets = []
          skipped_done = 0
          for shard in toks:
              p = progress.get(shard)
              cursor = 0
              if p and p.get('mode') == mode:
                  if p.get('done'):
                      if not explicit:
                          skipped_done += 1
                          continue
                      cursor = 0
                  else:
                      cursor = p.get('cursor', 0)
              targets.append({'shard': shard, 'cursor': cursor})

          print(f'  Targets: {len(targets)}  (skipped {skipped_done} already-done shards for mode={mode})')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'targets={json.dumps(targets)}\n')
          PYEOF

  # Diagnostic: confirms GitHub's OWN resolved view of the output matches what
  # generate-shards' Python printed. If these two ever disagree, the break is
  # between the step's GITHUB_OUTPUT write and GitHub's output resolution — not in
  # generate-shards' logic itself. Cheap (one job, no checkout), keeps this
  # debuggable from logs alone without needing an Actions-UI screenshot next time.
  verify-targets:
    needs: generate-shards
    runs-on: ubuntu-latest
    steps:
      - name: Echo GitHub's resolved view of the targets output
        run: |
          echo "Raw output length (chars): ${#TARGETS}"
          echo "First 200 chars: ${TARGETS:0:200}"
          echo "$TARGETS" | python3 -c "import sys,json; print('Parsed element count:', len(json.load(sys.stdin)))"
        env:
          TARGETS: ${{ needs.generate-shards.outputs.targets }}

  map:
    needs: generate-shards
    if: fromJson(needs.generate-shards.outputs.targets)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJson(needs.generate-shards.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/discover-seasons.js
            data/sports-index.json
            players/${{ matrix.target.shard }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Burst-probe shard ${{ matrix.target.shard }} from cursor ${{ matrix.target.cursor }}
        run: |
          ARGS="--shard=${{ matrix.target.shard }} --cursor=${{ matrix.target.cursor }} --out=discover-shard-${{ matrix.target.shard }}.json --concurrency=${{ inputs.concurrency }}"
          if [ "${{ inputs.all_players }}" = "true" ]; then ARGS="$ARGS --all-players"; fi
          if [ "${{ inputs.backfill_teams }}" = "true" ]; then ARGS="$ARGS --backfill-teams"; fi
          node scripts/discover-seasons.js $ARGS

      - name: Upload shard discoveries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-shard-${{ matrix.target.shard }}
          path: discover-shard-${{ matrix.target.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  reduce:
    needs: [generate-shards, map]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      undone_shards: ${{ steps.reduce.outputs.undone_shards }}
    # THE single writer of index + progress + players for this workflow. Locked
    # against nightly-crawl / fetch-profile-stats-matrix / anything else touching
    # players/** or data/sports-index.json — this is the fix for the missing lock
    # that let the old apply-and-commit job (now removed — it never actually ran;
    # its manifest was never produced) write player files with no protection at all.
    concurrency:
      group: data-write
      cancel-in-progress: false
    steps:
      - name: Download all shard discoveries
        uses: actions/download-artifact@v4
        with:
          pattern: discover-shard-*
          path: /tmp/discoveries/
          merge-multiple: true

      - name: Determine affected shards (for the checkout below)
        id: affected
        run: |
          python3 - << 'PYEOF'
          import json, glob, os

          shards = set()
          for f in glob.glob('/tmp/discoveries/discover-shard-*.json'):
              try:
                  a = json.load(open(f))
              except Exception:
                  continue
              if a.get('playerDeltas'):
                  shards.add(a.get('shard'))

          dirs = ['players/' + s for s in sorted(shards) if s]
          print(f'  Shards with pending roster deltas: {len(dirs)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('player_dirs<<SPARSEEOF\n')
              fh.write('\n'.join(dirs) + '\n' if dirs else '')
              fh.write('SPARSEEOF\n')
          PYEOF

      # scripts + data always; players/{shard} ONLY for shards with real deltas to
      # apply. This is what lets --reduce read each affected file FRESH (not the
      # stale snapshot MAP saw, potentially a long time ago).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data
            ${{ steps.affected.outputs.player_dirs }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge, resolve grades, apply roster deltas, write + commit
        id: reduce
        run: |
          ARGS="--reduce --in=/tmp/discoveries --concurrency=${{ inputs.concurrency }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/discover-seasons.js $ARGS | tee /tmp/reduce.log

          undone=$(grep -o 'UNDONE_SHARDS_JSON=.*' /tmp/reduce.log | sed 's/UNDONE_SHARDS_JSON=//')
          if [ -z "$undone" ]; then undone='[]'; fi
          echo "undone_shards=$undone" >> $GITHUB_OUTPUT
          echo "Undone shards this sweep: $undone"

  retrigger:
    needs: reduce
    if: always() && inputs.dry_run != 'true' && needs.reduce.outputs.undone_shards != '[]' && needs.reduce.outputs.undone_shards != ''
    runs-on: ubuntu-latest
    steps:
      - name: Re-trigger for remaining shards (fresh runners)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          UNDONE: ${{ needs.reduce.outputs.undone_shards }}
        run: |
          run_number=${{ inputs.run_number }}
          if [ "$run_number" -ge "$MAX_RUNS" ]; then
            echo "⚠️ Reached $MAX_RUNS-run cap with shards still undone: $UNDONE"
            echo "Re-trigger manually to continue (progress is saved — nothing lost)."
            exit 0
          fi
          next_run=$(( run_number + 1 ))
          echo "↺ $(echo "$UNDONE" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))') shard(s) not yet done — re-triggering run $next_run on fresh runners."
          gh workflow run discover-seasons-matrix.yml \
            --repo "${{ github.repository }}" \
            --field "shards=${UNDONE}" \
            --field "all_players=${{ inputs.all_players }}" \
            --field "backfill_teams=${{ inputs.backfill_teams }}" \
            --field "concurrency=${{ inputs.concurrency }}" \
            --field "dry_run=${{ inputs.dry_run }}" \
            --field "run_number=${next_run}"
