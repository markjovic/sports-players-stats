# .github/workflows/discover-seasons-matrix.yml
name: Discover Seasons (Matrix)

# Sharded, RESUMABLE season DETECTION. Each MAP job gets a FRESH runner IP and
# burst-probes its shard's players until the per-IP WAF wall hits, then stops dead
# (no grind) and saves a cursor. One REDUCE job merges discoveries + cursors, writes
# sports-index.json + data/discover-progress.json once, then self-triggers the NEXT
# run — targeting only the shards not yet fully swept — on fresh runners, until every
# shard is done or the run cap is hit.

on:
  # No own schedule: nightly-crawl.yml triggers this AFTER the crawl drains (weekly,
  # Sundays) so discovery never overlaps the crawl's writes. Manual dispatch below is
  # for the one-time historical backlog pass (all_players=true) and ad-hoc re-runs.
  workflow_dispatch:
    inputs:
      shards:
        description: 'JSON array of specific shards (e.g. ["00","1a","ff"]). Empty = all 256 not already done for this mode.'
        required: false
        default: '[]'
        type: string
      all_players:
        description: 'Backlog pass: probe EVERY player (not just current-season). Slower, thorough.'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'Burst batch size per shard (default 25 — matches the proven clean-run length before a fresh IP walls)'
        required: false
        default: '25'
        type: string
      dry_run:
        description: 'Report only — reduce writes/commits nothing (progress file also not saved, so this cannot self-trigger meaningfully)'
        required: false
        default: false
        type: boolean
      run_number:
        description: 'Auto-incremented by self-trigger — do not set manually'
        required: false
        default: '1'
        type: string
      backfill_teams:
        description: 'Backfill pre-season teams to player files and team-lookup'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  MAX_RUNS: 40   # safety cap on self-trigger chain length (256 shards / ~sizeable per-run progress)

jobs:
  generate-shards:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.gen.outputs.targets }}
    steps:
      # Need the progress file to (a) auto-skip shards already done for this mode and
      # (b) seed each shard's starting cursor.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/discover-progress.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: gen
        env:
          INPUT_SHARDS: ${{ inputs.shards }}
          ALL_PLAYERS: ${{ inputs.all_players }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re

          raw = (os.environ.get('INPUT_SHARDS') or '').strip()
          inner = raw[1:-1] if raw.startswith('[') and raw.endswith(']') else raw
          toks = [t.strip().strip('"').strip("'") for t in inner.split(',')]
          toks = [t.lower() for t in toks if re.fullmatch(r'[0-9a-fA-F]{2}', t or '')]
          explicit = bool(toks)
          if not toks:
              toks = [format(i, '02x') for i in range(256)]

          mode = 'all' if os.environ.get('ALL_PLAYERS') == 'true' else 'current'

          progress = {}
          try:
              with open('data/discover-progress.json') as f:
                  progress = json.load(f)
          except FileNotFoundError:
              pass
          except Exception as e:
              print(f'  Warning: could not parse progress file: {e}')

          targets = []
          skipped_done = 0
          for shard in toks:
              p = progress.get(shard)
              cursor = 0
              if p and p.get('mode') == mode:
                  if p.get('done'):
                      # Auto-skip shards already fully swept for this mode — UNLESS the
                      # caller explicitly named shards (then honour the request as-is).
                      if not explicit:
                          skipped_done += 1
                          continue
                      cursor = 0   # explicit re-request of a done shard = fresh resweep
                  else:
                      cursor = p.get('cursor', 0)
              targets.append({'shard': shard, 'cursor': cursor})

          print(f'  Targets: {len(targets)}  (skipped {skipped_done} already-done shards for mode={mode})')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'targets={json.dumps(targets)}\n')
          PYEOF

  map:
    needs: generate-shards
    if: needs.generate-shards.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJson(needs.generate-shards.outputs.targets) }}
    steps:
      # Only this shard's players + a snapshot of the index (to skip already-known
      # seasons). NOT the other 255 shards, not the progress file (workflow already
      # resolved this shard's cursor into the matrix).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/discover-seasons.js
            data/sports-index.json
            players/${{ matrix.target.shard }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Burst-probe shard ${{ matrix.target.shard }} from cursor ${{ matrix.target.cursor }}
        run: |
          ARGS="--shard=${{ matrix.target.shard }} --cursor=${{ matrix.target.cursor }} --out=discover-shard-${{ matrix.target.shard }}.json --concurrency=${{ inputs.concurrency }}"
          if [ "${{ inputs.all_players }}" == "true" ]; then ARGS="$ARGS --all-players"; fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.backfill_teams }}" == "true" ]; then ARGS="$ARGS --backfill-teams"; fi
          
          node scripts/discover-seasons.js $ARGS

      - name: Upload shard discoveries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-shard-${{ matrix.target.shard }}
          path: discover-shard-${{ matrix.target.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  reduce:
    needs: [generate-shards, map]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      undone_shards: ${{ steps.reduce.outputs.undone_shards }}
    # Writes sports-index.json + discover-progress.json — serialise against
    # nightly-crawl / weekly-indexes (and any other source-tier writer).
    concurrency:
      group: data-write
      cancel-in-progress: false
    steps:
      - name: Download all shard discoveries
        uses: actions/download-artifact@v4
        with:
          pattern: discover-shard-*
          path: /tmp/discoveries/
          merge-multiple: false

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/discover-seasons.js
            data/sports-index.json
            data/discover-progress.json
            players/
            team-lookup/
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge, resolve grades, write index + progress
        id: reduce
        run: |
          ARGS="--reduce --in=/tmp/discoveries --concurrency=${{ inputs.concurrency }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/discover-seasons.js $ARGS | tee /tmp/reduce.log

          # Extract undone shards
          undone=$(grep -o 'UNDONE_SHARDS_JSON=.*' /tmp/reduce.log | sed 's/UNDONE_SHARDS_JSON=//')
          if [ -z "$undone" ]; then undone='[]'; fi
          echo "undone_shards=$undone" >> $GITHUB_OUTPUT

          # Only proceed with Git if not a dry run
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            # We already checked out the necessary files. Now we commit only the files that changed.
            # Using --sparse ensures we don't accidentally touch anything outside the scope.
            git add data/discover-progress.json data/sports-index.json players/ team-lookup/
            
            if ! git diff --cached --quiet; then
              git commit -m "update: discover seasons progress + backfilled rosters"
              git push origin main
            else
              echo "No progress or player file changes to commit."
            fi
          fi

  retrigger:
    needs: reduce
    if: always() && inputs.dry_run != 'true' && needs.reduce.outputs.undone_shards != '[]' && needs.reduce.outputs.undone_shards != ''
    runs-on: ubuntu-latest
    steps:
      - name: Re-trigger for remaining shards (fresh runners)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          UNDONE: ${{ needs.reduce.outputs.undone_shards }}
        run: |
          run_number=${{ inputs.run_number }}
          if [ "$run_number" -ge "$MAX_RUNS" ]; then
            echo "⚠️ Reached $MAX_RUNS-run cap with shards still undone: $UNDONE"
            echo "Re-trigger manually to continue (progress is saved — nothing lost)."
            exit 0
          fi
          next_run=$(( run_number + 1 ))
          echo "↺ $(echo "$UNDONE" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))') shard(s) not yet done — re-triggering run $next_run on fresh runners."
          gh workflow run discover-seasons-matrix.yml \
            --repo "${{ github.repository }}" \
            --field "shards=$UNDONE" \
            --field "all_players=${{ inputs.all_players }}" \
            --field "backfill_teams=${{ inputs.backfill_teams }}" \
            --field "concurrency=${{ inputs.concurrency }}" \
            --field "dry_run=${{ inputs.dry_run }}"
