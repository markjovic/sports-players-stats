# .github/workflows/discover-seasons-matrix.yml
name: Discover Seasons (Matrix)

# Rebuilt from the proven-working base that fanned out 256 map jobs. The matrix
# output mechanism (bare shard strings via steps.gen.outputs.targets, Python
# printing ONLY the JSON array to stdout, bash writing $GITHUB_OUTPUT, no custom
# if: on map) matches the reference self-triggering matrix
# (fetch-profile-stats-matrix.yml) — it is not the place to experiment. Added on
# top: fresh_start progress reset, a data-write lock on the single writer, and
# the delta-based roster backfill.
#
# 2026-08-03: debug scaffolding stripped (gen-step VERBOSE block + the
# verify-output job — the 2026-07-09 fan-out diagnosis they existed for is long
# closed); self-retrigger converted from a bare one-shot `gh workflow run` to the
# /tmp/gh-dispatch.sh retry helper, the sixth and last bare chain dispatch in the
# repo (OUTSTANDING §2.6); reduce + retrigger gates moved always() ->
# !cancelled() (stop-button rule, same fix the stats matrix received 2026-07-21);
# retrigger's dry_run comparison fixed to the robust boolean form (directive 13).
#
# NO actions/setup-node ANYWHERE in this file — both map and reduce fetch PlayHQ
# (map: publicProfileTeams probes; reduce: discoverSeason grade-resolve), and
# setup-node changes the runner's outbound fingerprint so CloudFront 403-blocks
# every request INCLUDING session acquisition. Confirmed 2026-07-20: instrumented
# shard 00 got "HTTP 403 CLOUDFRONT-BLOCK (919b HTML)" on session attempt 1 from a
# fresh runner WITH setup-node, while nightly-crawl (no setup-node) refreshed its
# session on attempt 1 the same day. This workflow ran WITH setup-node until
# ~2026-07-09 — that stopped working around 2026-07-10 (runner image or WAF rule
# change); do not re-add it on the strength of that old inconsistency. Use the
# runner's preinstalled node, exactly as nightly-crawl.yml does.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'JSON array of shards (e.g. ["00","1a","ff"]). Empty = all not-done for this mode.'
        required: false
        default: '[]'
        type: string
      all_players:
        description: 'Backlog pass: probe EVERY player'
        required: false
        default: false
        type: boolean
      backfill_teams:
        description: 'Backfill pre-season teams into player files (implies all_players)'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'Burst batch size'
        required: false
        default: '25'
        type: string
      dry_run:
        description: 'Report only'
        required: false
        default: false
        type: boolean
      fresh_start:
        description: 'Delete existing progress and re-sweep from scratch (only the run you dispatch)'
        required: false
        default: false
        type: boolean
      run_number:
        description: 'Auto-incremented by self-trigger — do not set manually'
        required: false
        default: '1'
        type: string

permissions:
  contents: write
  actions: write

env:
  MAX_RUNS: 40

jobs:
  generate-shards:
    runs-on: ubuntu-latest
    concurrency:
      group: data-write
      cancel-in-progress: false
    outputs:
      targets: ${{ steps.gen.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            data
            scripts
          sparse-checkout-cone-mode: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset progress (fresh_start only)
        if: inputs.fresh_start == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/discover-progress.json ]; then
            echo "No progress file to reset."
          else
            git rm data/discover-progress.json
            git commit -m "discover-seasons: fresh_start — reset progress"
            git fetch origin main
            git merge -X ours FETCH_HEAD --no-edit
            git push origin main
            echo "Progress reset."
          fi

      - id: gen
        env:
          INPUT_SHARDS: ${{ inputs.shards }}
          ALL_PLAYERS: ${{ inputs.all_players }}
          BACKFILL_TEAMS: ${{ inputs.backfill_teams }}
        run: |
          targets=$(python3 - << 'PYEOF'
          import json, os, re, sys
          raw = (os.environ.get('INPUT_SHARDS') or '').strip()
          toks = [t.strip().strip('"').strip("'") for t in (raw[1:-1] if raw.startswith('[') else raw).split(',')]
          toks = [t.lower() for t in toks if re.fullmatch(r'[0-9a-fA-F]{2}', t or '')]
          backfill = os.environ.get('BACKFILL_TEAMS') == 'true'
          all_players = os.environ.get('ALL_PLAYERS') == 'true' or backfill
          mode = ('all+backfill' if backfill else 'all') if all_players else 'current'
          progress = json.load(open('data/discover-progress.json')) if os.path.exists('data/discover-progress.json') else {}
          targets = []
          for shard in (toks if toks else [format(i, '02x') for i in range(256)]):
              p = progress.get(shard, {})
              if not (p.get('done') == True and p.get('mode') == mode and not toks):
                  targets.append(shard)   # shard string only; map job reads cursor from progress file
          # Diagnostics to STDERR so they don't pollute the stdout that bash captures.
          print(f'generate-shards: {len(targets)} targets for mode={mode}', file=sys.stderr)
          # ONLY the JSON array goes to stdout — this is what bash captures.
          print(json.dumps(targets))
          PYEOF
          )
          n=$(printf '%s' "$targets" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "Shards selected: $n"
          # BASH writes the job output (matches the working fetch-profile-stats matrix).
          echo "targets=$targets" >> $GITHUB_OUTPUT

  map:
    needs: generate-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.generate-shards.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            data
            players/${{ matrix.shard }}
          sparse-checkout-cone-mode: true
          token: ${{ secrets.GITHUB_TOKEN }}
      # setup-node REMOVED 2026-07-20 — this job fetches PlayHQ; setup-node's
      # fingerprint change caused CloudFront 403 on every request from ~2026-07-10
      # (proven via instrumented session logging on shard 00). Preinstalled node only.
      - name: Matrix position
        run: echo "shard=${{ matrix.shard }} | job ${{ strategy.job-index }} of ${{ strategy.job-total }}"
      - name: Burst-probe
        run: |
          ARGS="--shard=${{ matrix.shard }} --out=discover-shard-${{ matrix.shard }}.json --concurrency=${{ inputs.concurrency }}"
          [ "${{ inputs.all_players }}" == "true" ] && ARGS="$ARGS --all-players"
          [ "${{ inputs.backfill_teams }}" == "true" ] && ARGS="$ARGS --backfill-teams"
          node scripts/discover-seasons.js $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-shard-${{ matrix.shard }}
          path: 'discover-shard-${{ matrix.shard }}.json'
          retention-days: 1
          if-no-files-found: ignore

  reduce:
    needs: [generate-shards, map]
    # !cancelled() (not always()): still runs when shards FAIL — the aggregator
    # must never be gated on shard success — but cancelling the run now actually
    # stops the chain instead of applying + retriggering anyway (stop-button
    # rule; the same fix fetch-profile-stats-matrix.yml received 2026-07-21 —
    # this file was never audited for it until 2026-08-03).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      undone_shards: ${{ steps.reduce.outputs.undone }}
    # Single writer of index + progress + player files — locked against nightly-crawl
    # and the stats matrix so it can never race them on the same files.
    concurrency:
      group: data-write
      cancel-in-progress: false
    steps:
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: discover-shard-*
          path: /tmp/discoveries/
          merge-multiple: true

      - name: Determine affected shards
        id: affected
        run: |
          python3 - << 'PYEOF'
          import json, glob, os
          shards = set()
          for f in glob.glob('/tmp/discoveries/discover-shard-*.json'):
              try:
                  a = json.load(open(f))
              except Exception:
                  continue
              if a.get('playerDeltas'):
                  shards.add(a.get('shard'))
          dirs = ['players/' + s for s in sorted(shards) if s]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('player_dirs<<SPARSEEOF\n')
              fh.write(('\n'.join(dirs) + '\n') if dirs else '')
              fh.write('SPARSEEOF\n')
          print(f'affected player shards: {len(dirs)}')
          PYEOF

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            data
            ${{ steps.affected.outputs.player_dirs }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-node REMOVED 2026-07-20 — reduce ALSO fetches PlayHQ (discoverSeason
      # grade-resolve + grade-refresh in applyDiscoveries), so the fingerprint rule
      # applies here identically. Preinstalled node only.

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge, resolve grades, apply roster deltas, write + commit
        id: reduce
        run: |
          ARGS="--reduce --in=/tmp/discoveries --concurrency=${{ inputs.concurrency }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/discover-seasons.js $ARGS | tee /tmp/reduce.log
          undone=$(grep -o 'UNDONE_SHARDS_JSON=.*' /tmp/reduce.log | sed 's/UNDONE_SHARDS_JSON=//')
          if [ -z "$undone" ]; then undone='[]'; fi
          echo "undone=$undone" >> $GITHUB_OUTPUT
          echo "Undone shards this sweep: $undone"

  retrigger:
    needs: reduce
    # !cancelled() (not always()): cancelling a run must actually stop the
    # self-trigger chain (stop-button rule). The dry_run comparison tests BOTH
    # boolean forms (directive 13): a UI dispatch sends a real boolean, a chained
    # dispatch sends the STRING 'true'; the old `inputs.dry_run != 'true'`
    # coerced a real boolean to NaN — never equal — so the gate could not block a
    # dry-run's retrigger. KEEP THIS ON ONE LINE (claude_context T1).
    if: ${{ !cancelled() && !(inputs.dry_run == true || inputs.dry_run == 'true') && needs.reduce.outputs.undone_shards != '[]' && needs.reduce.outputs.undone_shards != '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install dispatch retry helper
        # This self-retrigger was the last chain-critical `gh workflow run` in
        # the repo still made as a bare one-shot API call (conversion deferred to
        # this scaffolding-strip pass — OUTSTANDING §2.6). One HTTP 500 on a
        # one-shot dispatch is exactly how the stats matrix chain silently
        # stopped on 2026-07-27; the push-retry rule applies to every network
        # call the chain depends on (§7.1). Helper copied VERBATIM from
        # fetch-profile-stats-matrix.yml and asserted byte-identical at install.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Re-trigger for remaining shards (fresh runners)
        run: |
          run_number=${{ inputs.run_number }}
          if [ "$run_number" -ge "$MAX_RUNS" ]; then
            echo "Reached $MAX_RUNS-run cap. Re-trigger manually to continue (progress saved)."
            exit 0
          fi
          next_run=$(( run_number + 1 ))
          echo "Re-triggering run $next_run on fresh runners."
          # Do NOT pass the undone shard list back — generate-shards recomputes it from
          # the committed progress file itself (identical to how run 1 computes it),
          # skipping shards already marked done for this mode.
          /tmp/gh-dispatch.sh discover-seasons-matrix.yml \
            --field "all_players=${{ inputs.all_players }}" \
            --field "backfill_teams=${{ inputs.backfill_teams }}" \
            --field "concurrency=${{ inputs.concurrency }}" \
            --field "dry_run=${{ inputs.dry_run }}" \
            --field "run_number=${next_run}"
