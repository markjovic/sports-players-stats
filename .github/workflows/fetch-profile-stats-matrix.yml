# .github/workflows/fetch-profile-stats-matrix.yml
name: Fetch Profile Stats (Matrix)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch even if statsChecked already present'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        run: |
          shards=$(python3 -c "
          import json
          shards = [format(i, '02x') for i in range(256)]
          print(json.dumps(shards))
          ")
          echo "shards=$shards" >> $GITHUB_OUTPUT

  fetch:
    needs: generate-shards
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.generate-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/fetch-profile-stats.js
            players/indexes/${{ matrix.shard }}.json
            players/${{ matrix.shard }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch shard ${{ matrix.shard }}
        run: |
          ARGS="--shard=${{ matrix.shard }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/fetch-profile-stats.js $ARGS
