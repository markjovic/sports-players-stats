# .github/workflows/fetch-profile-stats-matrix.yml
name: Fetch Profile Stats (Matrix)

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Auto-incremented — do not set manually'
        required: false
        default: '1'
        type: string
      consecutive_zeros:
        description: 'Consecutive runs with zero progress — do not set manually'
        required: false
        default: '0'
        type: string
      consecutive_apply_failures:
        description: 'Consecutive runs whose apply-and-commit failed — do not set manually'
        required: false
        default: '0'
        type: string
      shards:
        description: 'JSON array of specific shards to run (e.g. ["00","1a","ff"]). Empty = all 256.'
        required: false
        default: '[]'
        type: string
      force:
        description: 'Re-fetch even if statsChecked already present'
        required: false
        default: false
        type: boolean
      recheck_private:
        description: 'Also re-offer players already marked private (cheap alternative to a full re-fetch)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  clear-stats-checked:
    runs-on: ubuntu-latest
    # Boolean-input JOB gate: a UI dispatch sends a real boolean, a chained
    # `gh workflow run --field force=true` sends the STRING 'true'. A bare
    # `== true` skips the job for the string form; a bare `== 'true'` skips it
    # for the boolean form. Both comparisons, always (2026-07-21 directive).
    #
    # 2026-07-30: ALSO gated on `shards` being empty. clear-stats-checked.js takes no
    # shard argument (see the run step below) — it strips statsChecked from ALL ~413k
    # player files. Before this gate, dispatching force=true with shards=["e6"] wiped
    # statsChecked repo-wide and the retrigger then re-fetched the entire database:
    # a "targeted" run silently became a full re-sweep. Targeted forced re-fetch is now
    # done in-process via --force on the shard step instead.
    # The string/boolean pair is deliberate (directive 13); the shards comparison covers
    # the default ('[]') and empty. An unrecognised form (e.g. '[ ]') falls through to
    # TARGETED and skips the clear — i.e. it fails toward doing LESS, never toward an
    # unrequested 413k wipe.
    #
    # 2026-07-30 (SECOND attempt). The first attempt wrote this as a `>-` folded
    # scalar split across two lines with the continuation INDENTED FURTHER. YAML
    # folds only equally-indented lines, so the newline was PRESERVED, GitHub
    # received a multi-line `if`, failed to parse it as an expression, and fell
    # back to treating it as a non-empty literal string — which is TRUTHY. The job
    # ran unconditionally and wiped statsChecked from 413,364 files on a dispatch
    # that targeted one shard. `yaml.safe_load` accepted it; valid YAML is not a
    # valid GitHub expression. KEEP THIS ON ONE LINE.
    if: ${{ (inputs.force == true || inputs.force == 'true') && (inputs.shards == '' || inputs.shards == '[]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # Independent bash guard. The job-level `if` above is the first line of
      # defence, but it failed silently once already, so the destructive command no
      # longer depends on GitHub expression semantics alone. This runs in bash,
      # where behaviour is testable, and refuses the repo-wide clear whenever the
      # dispatch named specific shards. Unrecognised input falls through to
      # TARGETED (refuse), never to CLEAR.
      - name: Clear statsChecked from all player files
        env:
          INPUT_SHARDS: ${{ inputs.shards }}
        run: |
          shards="$(printf '%s' "${INPUT_SHARDS:-}" | tr -d '[:space:]')"
          if [ -n "$shards" ] && [ "$shards" != "[]" ]; then
            echo "REFUSING: dispatch targeted specific shards (shards=$shards)."
            echo "clear-stats-checked.js takes no shard argument — it would strip"
            echo "statsChecked from ALL ~413k player files, and the retrigger would"
            echo "then re-sweep the entire database."
            echo "Per-shard forced re-fetch is done in-process via --force on the"
            echo "shard step instead. Nothing cleared."
            exit 0
          fi
          echo "Untargeted dispatch (shards='${shards}') — repo-wide clear is intended."
          node scripts/clear-stats-checked.js

  generate-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        env:
          INPUT_SHARDS: ${{ inputs.shards }}
        run: |
          shards=$(python3 - << 'PYEOF'
          import json, os, re
          raw = (os.environ.get('INPUT_SHARDS') or '').strip()
          inner = raw[1:-1] if raw.startswith('[') and raw.endswith(']') else raw
          toks = [t.strip().strip('"').strip("'") for t in inner.split(',')]
          toks = [t.lower() for t in toks if re.fullmatch(r'[0-9a-fA-F]{2}', t or '')]
          if not toks:
              toks = [format(i, '02x') for i in range(256)]
          print(json.dumps(toks))
          PYEOF
          )
          n=$(printf '%s' "$shards" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "Shards selected: $n"
          echo "shards=$shards" >> $GITHUB_OUTPUT

  fetch:
    needs: [clear-stats-checked, generate-shards]
    if: always() && !cancelled() && needs.clear-stats-checked.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.generate-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/fetch-profile-stats.js
            scripts/lib
            data/sports-index.json
            players/indexes/${{ matrix.shard }}.json
            players/aliases/${{ matrix.shard }}.json
            players/${{ matrix.shard }}
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch shard ${{ matrix.shard }}
        env:
          # Boolean input in a BASH context: a UI dispatch sends a real boolean and a
          # chained `gh workflow run --field` sends a string, so both forms are tested
          # in the expression and the shell only ever sees 'true' or ''. (Bash string
          # compares are a different context from job-level `if:` gates — this is the
          # expression side, so directive 13 applies here too.)
          RECHECK_PRIVATE: ${{ (inputs.recheck_private == true || inputs.recheck_private == 'true') && 'true' || '' }}
          # 2026-07-30: the script has always had a --force flag (L77) and the matrix
          # never passed it — repo-level force was implemented ONLY by the repo-wide
          # clear-stats-checked job, so there was no way to re-fetch one shard. Passing
          # it here makes targeted forced re-fetch possible: force=true + shards=["e6"]
          # now re-fetches ~1,615 players in that shard and touches nothing else.
          # force=true + shards=[] is unchanged (repo-wide clear, then every shard).
          FORCE_FETCH: ${{ (inputs.force == true || inputs.force == 'true') && 'true' || '' }}
        run: |
          ARGS=(--shard=${{ matrix.shard }})
          [ -n "$RECHECK_PRIVATE" ] && ARGS+=(--recheck-private)
          [ -n "$FORCE_FETCH" ] && ARGS+=(--force)
          echo "ARGS=${ARGS[*]}"
          node scripts/fetch-profile-stats.js "${ARGS[@]}"

      - name: Package changed player files
        if: always()
        run: |
          git diff --name-only HEAD > /tmp/changed.txt 2>/dev/null || true
          git ls-files --others --exclude-standard players/${{ matrix.shard }}/ >> /tmp/changed.txt 2>/dev/null || true
          if [ -s /tmp/changed.txt ]; then
            tar -czf /tmp/shard-files.tar.gz -T /tmp/changed.txt
            echo "Packaged $(wc -l < /tmp/changed.txt) changed files"
          else
            echo "No changed files"
          fi

      - name: Upload shard files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-files-${{ matrix.shard }}
          path: /tmp/shard-files.tar.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload shard summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-summary-${{ matrix.shard }}
          path: shard-summary-${{ matrix.shard }}.json
          retention-days: 1

  apply-and-commit:
    needs: fetch
    runs-on: ubuntu-latest
    # !cancelled() (not always()): still runs when shards FAIL — apply-and-commit
    # must never be gated on shard success — but a deliberate run-cancel now
    # actually stops the chain instead of applying + retriggering anyway
    # (stop-button bug, same class as the backfill matrix fix; audited 2026-07-21).
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    steps:
      - name: Download all shard file artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-files-*
          path: /tmp/shard-artifacts/
          merge-multiple: false

      - name: Check if anything to apply
        id: check
        run: |
          has_files=false
          > /tmp/sparse-dirs.txt
          for dir in /tmp/shard-artifacts/shard-files-*/; do
            tarfile=$(ls "$dir"*.tar.gz 2>/dev/null | head -1)
            if [ -n "$tarfile" ] && [ -s "$tarfile" ]; then
              has_files=true
              shard=$(basename "$dir" | sed 's/shard-files-//')
              echo "players/$shard" >> /tmp/sparse-dirs.txt
            fi
          done
          echo "has_files=$has_files" >> $GITHUB_OUTPUT
          echo "Has files to apply: $has_files"
          if [ "$has_files" = "true" ]; then
            echo "Sparse checkout: $(wc -l < /tmp/sparse-dirs.txt) shard dirs"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.has_files == 'true'
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand sparse checkout to active shards
        if: steps.check.outputs.has_files == 'true'
        # players/aliases is included because shard jobs may write alias
        # discoveries there; it must be in the sparse set BEFORE the tars are
        # extracted (skip-worktree would otherwise make git add ignore them,
        # and expanding afterwards would overwrite the extracted files).
        #
        # RETRIED: this is a blobless clone, so `sparse-checkout set` triggers a
        # promisor object fetch over the network. That fetch was reset by the
        # remote on 2026-07-26 ("curl 56 Recv failure" / "fatal: early EOF" /
        # "could not fetch ... from promisor remote"), which killed apply-and-commit
        # and silently discarded a whole run's shard writes. The command is
        # idempotent, so re-running it after a transient reset is safe.
        run: |
          dirs=$(cat /tmp/sparse-dirs.txt | tr '\n' ' ')
          attempts=6
          ok=false
          for i in $(seq 1 $attempts); do
            if git sparse-checkout set --no-cone scripts players/aliases $dirs; then
              echo "  ✓ sparse-checkout expanded (attempt $i)"
              ok=true
              break
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 15 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … sparse-checkout/promisor fetch failed — retry $((i+1))/$attempts in ${delay}s"
              sleep "$delay"
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "✗ sparse-checkout failed after $attempts attempts — nothing applied this run."
            echo "  Shard writes are NOT lost data: the player files were never touched on main,"
            echo "  so those players still lack statsChecked and are re-fetched next run."
            exit 1
          fi

      - name: Configure git
        if: steps.check.outputs.has_files == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply shard changes
        if: steps.check.outputs.has_files == 'true'
        run: |
          applied=0
          skipped=0
          for dir in /tmp/shard-artifacts/shard-files-*/; do
            tarfile=$(ls "$dir"*.tar.gz 2>/dev/null | head -1)
            if [ -n "$tarfile" ] && [ -s "$tarfile" ]; then
              tar -xzf "$tarfile" --no-overwrite-dir
              applied=$((applied + 1))
            else
              skipped=$((skipped + 1))
            fi
          done
          echo "Applied: $applied shards  |  Skipped (no changes): $skipped"

      - name: Commit and push
        if: steps.check.outputs.has_files == 'true'
        # PER-PATH `git add` (never one combined add): a single
        # `git add players/ scripts/` is ATOMIC — one unmatched pathspec and
        # NOTHING stages, which is exactly how the 2026-07-19 discover-fixtures
        # run threw away 30,426 games while staying green.
        #
        # PUSH RETRY: this repo has concurrent committers (nightly chain, weekly
        # indexes, discover-fixtures, build-* jobs). A one-shot push loses the
        # race and, previously, just failed the job after the work was already
        # committed locally. House pattern (§7.1): commit-first, then 60 attempts
        # of merge --abort / fetch / `merge -X ours --no-stat` / push with pure
        # random 1-91s jitter, and THROW if all are exhausted.
        run: |
          git add -- players/
          git add -- scripts/ || echo "  (no scripts/ pathspec to stage)"

          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          count=$(git diff --staged --name-only | wc -l)
          echo "staging:"
          git diff --staged --shortstat

          git commit -m "fetch-profile-stats: matrix run ${{ inputs.run_number }} — ${count} files updated"

          pushed=false
          for attempt in $(seq 1 60); do
            # Cleanup first: a previous attempt may have left a merge in progress.
            git merge --abort 2>/dev/null || true

            # fetch/merge failures must fall through to the next attempt rather
            # than kill the step — run steps are `bash -e`, so an unguarded
            # transient fetch reset here would abort with the commit unpushed.
            if ! git fetch origin main; then
              delay=$(( (RANDOM % 91) + 1 ))
              echo "  … fetch failed — retry $((attempt+1))/60 in ${delay}s"
              sleep "$delay"
              continue
            fi
            if ! git merge -X ours FETCH_HEAD --no-edit --no-stat; then
              git merge --abort 2>/dev/null || true
              delay=$(( (RANDOM % 91) + 1 ))
              echo "  … merge failed — retry $((attempt+1))/60 in ${delay}s"
              sleep "$delay"
              continue
            fi
            if git push origin main; then
              echo "  ✓ pushed on attempt ${attempt}"
              pushed=true
              break
            fi
            delay=$(( (RANDOM % 91) + 1 ))
            echo "  … push rejected — retry $((attempt+1))/60 in ${delay}s"
            sleep "$delay"
          done

          if [ "$pushed" != "true" ]; then
            echo "✗ push failed after 60 attempts."
            exit 1
          fi
          echo "Committed and pushed: ${count} files"

  summary-and-retrigger:
    needs: apply-and-commit
    runs-on: ubuntu-latest
    # !cancelled() for the same reason as apply-and-commit — cancelling the run
    # must halt the self-trigger chain.
    if: ${{ !cancelled() }}
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install dispatch retry helper
        # Every chain link in this workflow is a single `gh workflow run` API
        # call. On 2026-07-27 one of them returned HTTP 500 and the matrix chain
        # simply stopped — no retrigger, no terminal, no build-team-stats, so the
        # roster data silently went stale. A chain-critical network call is never
        # one-shot (same rule as the push retry).
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Download all shard summaries
        uses: actions/download-artifact@v4
        with:
          pattern: shard-summary-*
          merge-multiple: true
          path: summaries

      - name: Aggregate and report
        id: aggregate
        run: |
          python3 - << 'PYEOF'
          import json, os, glob

          files = glob.glob('summaries/*.json')
          total = already_done = written = inaccessible = unchanged = errors = blocked = 0

          for f in files:
            try:
              d = json.load(open(f))
              total        += d.get('total', 0)
              already_done += d.get('already_done', 0)
              written      += d.get('written', 0)
              inaccessible += d.get('inaccessible', 0)
              unchanged    += d.get('unchanged', 0)
              errors       += d.get('errors', 0)
              if d.get('blocked'): blocked += 1
            except Exception as e:
              print(f'  Warning: could not parse {f}: {e}')

          outstanding_at_start = total - already_done

          print('')
          print('══════════════════════════════════════════════════')
          print(f'  Run ${{ inputs.run_number }}/150  |  consecutive zero-progress runs: ${{ inputs.consecutive_zeros }}')
          print(f'  apply-and-commit: ${{ needs.apply-and-commit.result }}  |  consecutive apply failures: ${{ inputs.consecutive_apply_failures }}')
          print('══════════════════════════════════════════════════')
          print(f'  Shards processed:          {len(files)}/256')
          print(f'  Outstanding at run start:  {outstanding_at_start:,}')
          print(f'  Shard writes reported:     {written:,}')
          print(f'  Not obtainable (marked):   {inaccessible:,}   (subset of writes above)')
          print(f'  Still withheld (no write): {unchanged:,}')
          print(f'  Errors:                    {errors:,}')
          print(f'  Shards blocked mid-run:    {blocked}')
          print('══════════════════════════════════════════════════')
          print('  NOTE: "shard writes reported" is what the shards WROTE TO DISK.')
          print('  It is progress only if apply-and-commit succeeded — the commit')
          print('  history is the proof of persistence, not this number.')
          print('')
          print('  "Still withheld" = already-marked withheld players re-offered by a')
          print('  --recheck-private sweep that needed no write (dirty-check). During')
          print('  such a sweep "writes" is a TRANSITION count: a player who came back')
          print('  public writes real stats, one who stayed withheld writes nothing. So')
          print('  0 written means "no further private -> public transitions", the')
          print('  correct terminal for a re-check. WITHOUT the dirty-check these')
          print('  players rewrote statsChecked every run, so written never reached 0,')
          print('  consecutive_zeros never incremented, and the chain ran to the 150-run')
          print('  cap and exited RED with the terminal fan-out never firing.')
          print('')
          print('  "Not obtainable" = withheld profiles (application-403, NOT_FOUND,')
          print('  or a 200 with a null stats object) that were marked done with')
          print('  statsChecked, after namespace recovery was attempted and failed.')
          print('  These are a SUBSET of the writes above, not a separate population —')
          print('  do not add the two together. Before 2026-07-29 the label read')
          print('  "Private profiles marked", which described only the 403 half and')
          print('  wrongly implied the rest were left untouched and retryable.')

          if inaccessible > 0:
            print('  Shards with not-obtainable profiles:')
            for f in sorted(files):
              try:
                d = json.load(open(f))
                if d.get('inaccessible', 0) > 0:
                  shard = d.get('shard', '??')
                  print(f'    shard={shard}  not_obtainable={d["inaccessible"]}')
              except: pass

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            fh.write(f'written={written}\n')
          PYEOF

      - name: Determine next action
        id: next
        env:
          APPLY_RESULT: ${{ needs.apply-and-commit.result }}
          RUN_NUMBER: ${{ inputs.run_number }}
          CONSEC_ZEROS: ${{ inputs.consecutive_zeros }}
          CONSEC_APPLY_FAILS: ${{ inputs.consecutive_apply_failures }}
          WRITTEN: ${{ steps.aggregate.outputs.written }}
        run: |
          run_number=${RUN_NUMBER:-1}
          consecutive_zeros=${CONSEC_ZEROS:-0}
          apply_fails=${CONSEC_APPLY_FAILS:-0}
          written=${WRITTEN:-0}

          # Carried forward unchanged unless a branch below changes them.
          new_zeros="$consecutive_zeros"
          new_apply_fails=0

          if [ "$APPLY_RESULT" != "success" ]; then
            # PERSISTENCE GATE: shard summaries are written by the shard jobs, so
            # `written` can be large while apply-and-commit failed and NOTHING was
            # committed. Counting that as progress (and resetting consecutive_zeros)
            # is how a failed run previously reported a healthy sweep.
            new_apply_fails=$(( apply_fails + 1 ))
            echo "⚠️  PERSISTENCE FAILURE — apply-and-commit = ${APPLY_RESULT}"
            echo "    ${written} shard writes were NOT committed."
            echo "    Those players still lack statsChecked, so they are re-fetched next run."
            echo "    consecutive_zeros carried through unchanged at ${consecutive_zeros}"
            echo "    consecutive apply failures: ${new_apply_fails}"
            if [ "$new_apply_fails" -ge 3 ]; then
              echo "status=apply_stuck" >> $GITHUB_OUTPUT
            elif [ "$run_number" -ge 150 ]; then
              echo "status=max_runs" >> $GITHUB_OUTPUT
            else
              echo "status=retrigger" >> $GITHUB_OUTPUT
            fi
          elif [ "$run_number" -ge 150 ]; then
            echo "status=max_runs" >> $GITHUB_OUTPUT
          elif [ "$written" = "0" ]; then
            new_zeros=$(( consecutive_zeros + 1 ))
            if [ "$new_zeros" -ge 3 ]; then
              echo "status=stuck" >> $GITHUB_OUTPUT
            else
              echo "status=retrigger" >> $GITHUB_OUTPUT
            fi
          else
            new_zeros=0
            echo "status=retrigger" >> $GITHUB_OUTPUT
          fi

          echo "new_consecutive_zeros=$new_zeros" >> $GITHUB_OUTPUT
          echo "new_consecutive_apply_failures=$new_apply_fails" >> $GITHUB_OUTPUT

      - name: Trigger next run
        if: steps.next.outputs.status == 'retrigger'
        env:
          NEXT_RUN: ${{ inputs.run_number }}
          NEXT_ZEROS: ${{ steps.next.outputs.new_consecutive_zeros }}
          NEXT_APPLY_FAILS: ${{ steps.next.outputs.new_consecutive_apply_failures }}
          # Set from the expression so the JSON string keeps its quotes — passing it
          # inline in the shell line would let the shell strip the embedded quotes.
          # Both boolean comparisons: a chained dispatch sends force as a STRING.
          NEXT_SHARDS: ${{ (inputs.force == true || inputs.force == 'true') && '[]' || inputs.shards }}
          # MUST be carried forward: a --recheck-private sweep spans many chained runs,
          # and dropping the flag on the retrigger would silently narrow run 2 onward
          # back to never-fetched players only. `force` is deliberately NOT carried
          # (the clear-stats-checked job must run once, not every run) — recheck_private
          # has no such one-shot side effect, so it propagates.
          NEXT_RECHECK: ${{ (inputs.recheck_private == true || inputs.recheck_private == 'true') && 'true' || 'false' }}
        run: |
          next_run=$(( NEXT_RUN + 1 ))
          /tmp/gh-dispatch.sh fetch-profile-stats-matrix.yml \
            --field "run_number=${next_run}" \
            --field "consecutive_zeros=${NEXT_ZEROS}" \
            --field "consecutive_apply_failures=${NEXT_APPLY_FAILS}" \
            --field "force=false" \
            --field "recheck_private=${NEXT_RECHECK}" \
            --field "shards=${NEXT_SHARDS}"

      # ── Terminal fan-out ────────────────────────────────────────────────────
      # Each dispatch is gated `!cancelled() && status == stuck` rather than the
      # bare status check: these five are INDEPENDENT of each other, and with
      # plain step ordering a failure in the first one skipped the remaining four
      # — including build-team-stats, the roster-freshness link. Any that throws
      # still turns the job red.

      - name: Trigger leaderboards rebuild
        if: ${{ !cancelled() && steps.next.outputs.status == 'stuck' }}
        run: |
          /tmp/gh-dispatch.sh build-leaderboards.yml --field "force=false"

      - name: Trigger search index rebuild
        if: ${{ !cancelled() && steps.next.outputs.status == 'stuck' }}
        run: |
          /tmp/gh-dispatch.sh build-search-index.yml

      - name: Trigger records rebuild
        if: ${{ !cancelled() && steps.next.outputs.status == 'stuck' }}
        run: |
          /tmp/gh-dispatch.sh build-records.yml

      - name: Trigger fold of diverged players
        if: ${{ !cancelled() && steps.next.outputs.status == 'stuck' }}
        run: |
          /tmp/gh-dispatch.sh fold-diverged-players.yml --field "mode=apply"

      - name: Trigger team-stats rebuild
        if: ${{ !cancelled() && steps.next.outputs.status == 'stuck' }}
        # Rebuild team-stats AFTER the matrix drains: roster stat lines are
        # sourced from player reg stats (players/{xx}/*.json seasons[].regs[].stats),
        # which this matrix writes. The nightly's own team-stats job runs BEFORE
        # the matrix is even triggered, so it can never see tonight's stats —
        # without this, the roster tab lagged the player view by a full day
        # (2026-07-21 roster-lag fix). active_only keeps it to unlocked seasons.
        run: |
          /tmp/gh-dispatch.sh build-team-stats.yml --field "active_only=true"

      - name: Checkout repo for cleanup
        if: ${{ !cancelled() && steps.next.outputs.status == 'stuck' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete matrix-force-pending.json
        # Deliberately NOT !cancelled(): this step depends on the checkout above
        # succeeding, unlike the independent dispatches.
        if: steps.next.outputs.status == 'stuck'
        run: |
          if [ ! -f matrix-force-pending.json ]; then
            echo "matrix-force-pending.json not present — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git rm stages the deletion itself — a follow-up `git add` on the now
          # non-existent pathspec would error and fail the step.
          git rm -f matrix-force-pending.json
          git commit -m "matrix: delete matrix-force-pending.json"

          pushed=false
          for attempt in $(seq 1 60); do
            git merge --abort 2>/dev/null || true
            if ! git fetch origin main; then
              delay=$(( (RANDOM % 91) + 1 ))
              echo "  … fetch failed — retry $((attempt+1))/60 in ${delay}s"
              sleep "$delay"
              continue
            fi
            if ! git merge -X ours FETCH_HEAD --no-edit --no-stat; then
              git merge --abort 2>/dev/null || true
              delay=$(( (RANDOM % 91) + 1 ))
              echo "  … merge failed — retry $((attempt+1))/60 in ${delay}s"
              sleep "$delay"
              continue
            fi
            if git push origin main; then
              echo "  ✓ pushed on attempt ${attempt}"
              pushed=true
              break
            fi
            delay=$(( (RANDOM % 91) + 1 ))
            echo "  … push rejected — retry $((attempt+1))/60 in ${delay}s"
            sleep "$delay"
          done

          if [ "$pushed" != "true" ]; then
            echo "✗ push failed after 60 attempts."
            exit 1
          fi

      - name: All done
        if: ${{ !cancelled() && steps.next.outputs.status == 'stuck' }}
        # "All players processed" is now accurate. Every terminal outcome writes
        # statsChecked — real data via finishOk, withheld profiles via
        # markNotObtainable — so 0 written across 3 runs means nothing is left to
        # do, not merely that nothing could be done.
        #
        # Before 2026-07-29 this message was FALSE whenever a sweep ended on the
        # 200-with-null-stats class: those players wrote nothing, so they read as
        # zero-progress while still lacking statsChecked (211 of them on
        # 2026-07-28). Anything still outstanding now shows up as Errors or as a
        # blocked shard, both of which keep the chain going.
        run: echo "✅ Matrix complete — 3 consecutive runs with 0 written. All players processed."

      - name: Halted on repeated persistence failures
        if: steps.next.outputs.status == 'apply_stuck'
        run: |
          echo "🛑 HALTED — 3 consecutive runs where apply-and-commit did not succeed."
          echo ""
          echo "   The chain is NOT being retriggered, and the terminal fan-out"
          echo "   (team-stats / leaderboards / search / records / fold) has NOT fired,"
          echo "   because nothing was persisted to commit history."
          echo ""
          echo "   No data is lost: the affected players were never written on main, so"
          echo "   they still lack statsChecked and will be re-fetched. Read the"
          echo "   apply-and-commit logs of the last three runs, fix the cause, then"
          echo "   re-dispatch with run_number = this run + 1, the same"
          echo "   consecutive_zeros, and consecutive_apply_failures = 0."
          exit 1

      - name: Max runs reached
        if: steps.next.outputs.status == 'max_runs'
        run: |
          echo "⚠️ Reached 150-run limit. Re-trigger manually if players remain."
          exit 1
