# .github/workflows/probe-rest-api.yml
name: Probe REST API

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'PlayHQ tenant (default: bv)'
        required: false
        default: 'bv'
      season_id:
        description: 'Season ID to probe (default: 0869ea69)'
        required: false
        default: '0869ea69'
      grade_id:
        description: 'Grade ID to probe (default: 5afff92b)'
        required: false
        default: '5afff92b'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run REST API probe
        run: node probe-rest-api.js --tenant=${{ github.event.inputs.tenant }} --season=${{ github.event.inputs.season_id }} --grade=${{ github.event.inputs.grade_id }}

      - name: Commit HTML report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-rest-api.html
          git diff --cached --quiet || git commit -m "REST API probe: ${{ github.event.inputs.tenant }} [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git pull --rebase origin main
          git push
