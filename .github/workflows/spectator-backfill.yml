# .github/workflows/spectator-backfill.yml
name: Spectator Backfill

# Runs the nightly's spectator step over the games it never reached — locked seasons
# and tournament comps whose player lists were never completed (probe-missing-games,
# 2026-08-06: 100/100 sampled missing appearances were spc-unset games we already
# hold). Progress is the data itself: spc:1 per game, committed every 2,000 games.
# Resume by re-dispatching — the scan skips spc-set games.
#
# 2026-08-14 (OUTSTANDING §2.12) — THE RECURRING PATH FOR PAPER-SCORED GAMES.
# On the weekly run this now dispatches Discover Game Backfill when it finishes.
# That is not a convenience, it is the only correct arrangement: that tool selects
# on `spcm > 0` (its own line 679, with the comment "so this never races ahead of
# the spectator sweep"), meaning it can ONLY see games THIS sweep has already asked
# for and been refused. A standalone weekly cron for it would fire against whatever
# the previous week happened to leave and would find nothing if it ran first.
# Chaining also captures a paper-scored game the SAME Saturday spectator retires
# it, instead of the following one.
#
# Two weekly runs, one trigger — not two crons competing for data-write, which is
# the 2026-08-10 problem. The dispatched run enters the group while this one is
# still in it and starts when this one ends.
#
# 2026-08-19 — `season` NOW TAKES A COMMA-SEPARATED LIST. One season per dispatch
# meant seven checkouts of a 6 GB repo, roughly 50 minutes of clone before any work,
# to sweep the seven seasons the grading-grade fault had left with no fixtures. A
# list costs one checkout and one scan. `--season=<sid>` alone still works.
#
# NO actions/setup-node: this job fetches playhq.com and setup-node changes the
# runner's outbound fingerprint, causing CloudFront 403s (absolute rule).

on:
  # Weekly permanent tail (2026-08-07): post-campaign, sweeps the games that aged
  # past the 30-day guard since last week — the nightly's spectator misses and any
  # deferred stragglers — so the pre-spc stranding can never rebuild. Sat 10:00 UTC
  # = 20:00 AEST Saturday: clear of the nightly (15:00 UTC) and done before the
  # archive's weekly deploy (18:00 UTC Sat) ships the results.
  #
  # RE-ENABLED 2026-08-10: the re-sweep campaign is drained (2,026,441 games swept),
  # so a scheduled run no longer competes with manual campaign dispatches. Its
  # weekly queue from here is small — games that aged past the 30-day guard since
  # last Saturday, plus any the nightly's spectator step missed.
  schedule:
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      max_games:
        description: 'Max games to fetch this run (re-dispatch to continue)'
        required: false
        default: '100000'
        type: string
      season:
        description: 'Restrict to these season ids — comma-separated, no spaces (e.g. 1ae60211,aacc7335). Blank = every season.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Scan and report the queue only — no API calls, no writes'
        required: false
        default: false
        type: boolean
      min_age_days:
        description: 'Skip games younger than this many days. The 30 default is right for the weekly tail but SKIPS A CURRENT SEASON almost entirely — use 7 when sweeping newly-discovered games in an in-progress season. spc freezes a box forever, so 0 risks freezing one still being entered.'
        required: false
        default: '30'
        type: string
      miss_attempts:
        description: 'Retire a game from the queue after this many failed spectator attempts (durable spcm counter; a later hit clears it). Default 1 — measured retry conversion is 0.003%. 0 = retry forever.'
        required: false
        default: '1'
        type: string
      retry_covered:
        description: 'One-off recovery: re-admit ALREADY-RETIRED misses in seasons captured at least this % (e.g. 95). Blank/0 = off. Only meaningful WITH the 2026-08-10 failure-classification fix — 3 of 4 sampled retired misses in >95% seasons had full box scores live on playhq.com.'
        required: false
        default: ''
        type: string
      heal_dangling:
        description: 'HEAL MODE: re-fetch spc-set games whose p[] contains ids no player resolves to (the cancelled run-3 debt) and stub their players. Self-limiting; combinable with nothing else needed.'
        required: false
        default: false
        type: boolean
      locked_only:
        description: 'Optional extra restriction to LOCKED seasons only'
        required: false
        default: false
        type: boolean
      chain_discover:
        description: 'On finish, dispatch Discover Game Backfill (the canonical-record pass over what spectator just retired). The weekly cron always does this; set yes to chain a manual run too.'
        required: false
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      include_partial:
        description: 'ALSO re-fetch games carrying a PARTIAL roster (2026-08-07 completion re-sweep: partial pre-spc lists proven to be incomplete captures of since-completed boxes). Default off = 2026-08-06 behaviour.'
        required: false
        default: false
        type: boolean

# Writes games/ and players/ — must hold the write lock (trap T25: push contention
# on a 6 GB repo is path-agnostic; every repo-writing workflow queues here).
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write             # the tail dispatches discover-game-backfill.yml

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run spectator backfill
        run: |
          ARGS="--max-games=${{ inputs.max_games }}"
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          # Scheduled runs get NO input values (workflow_dispatch defaults do not
          # apply to cron triggers) — set the weekly tail's arguments explicitly.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --include-partial --min-age-days=30"
          else
            if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ inputs.dry_run }}" = "True" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ inputs.include_partial }}" = "true" ] || [ "${{ inputs.include_partial }}" = "True" ]; then ARGS="$ARGS --include-partial"; fi
            if [ "${{ inputs.locked_only }}" = "true" ] || [ "${{ inputs.locked_only }}" = "True" ]; then ARGS="$ARGS --locked-only"; fi
            if [ -n "${{ inputs.min_age_days }}" ]; then ARGS="$ARGS --min-age-days=${{ inputs.min_age_days }}"; fi
            if [ "${{ inputs.heal_dangling }}" = "true" ] || [ "${{ inputs.heal_dangling }}" = "True" ]; then ARGS="$ARGS --heal-dangling"; fi
            if [ -n "${{ inputs.miss_attempts }}" ]; then ARGS="$ARGS --miss-attempts=${{ inputs.miss_attempts }}"; fi
            if [ -n "${{ inputs.retry_covered }}" ] && [ "${{ inputs.retry_covered }}" != "0" ]; then ARGS="$ARGS --retry-covered=${{ inputs.retry_covered }}"; fi
          fi
          node scripts/spectator-backfill.js $ARGS

      # ── Chain: canonical-record pass over what this sweep just retired ─────────
      # Cron supplies NO inputs (T27), so the schedule case is matched on
      # github.event_name and never on an input value.
      - name: Install dispatch retry helper
        if: ${{ github.event_name == 'schedule' || inputs.chain_discover == 'yes' }}
        # A chain-critical `gh workflow run` is never one-shot (directive 14). This
        # one is WEEKLY, so a single lost HTTP 500 costs a full week of paper-scored
        # games and the run still shows green. Helper copied VERBATIM from
        # fetch-profile-stats-matrix.yml (the proven site) — not retyped.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Dispatch Discover Game Backfill (canonical record)
        if: ${{ github.event_name == 'schedule' || inputs.chain_discover == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        # Field names taken from discover-game-backfill.yml as written, not from
        # memory: a wrong name is an HTTP 422, which the helper fails FAST on, and
        # that is a silently broken chain every Saturday. Values are the measured
        # ones — concurrency 5 (25 hit a sustained 403 wall after ~140 games) and
        # the same 30-day guard this sweep uses.
        run: |
          /tmp/gh-dispatch.sh discover-game-backfill.yml \
            --field "max_games=50000" \
            --field "concurrency=5" \
            --field "min_age_days=30" \
            --field "dry_run=false" 
