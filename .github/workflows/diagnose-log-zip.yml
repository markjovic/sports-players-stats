name: Diagnose Log Zip

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inspect log zip from run 217
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const zlib = require('zlib');

          const headers = {
            'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'test',
          };

          async function main() {
            // Get run ID for run #217 (the first scraper run)
            const runs = await fetch(
              'https://api.github.com/repos/markjovic/sports-players-stats/actions/workflows/285907662/runs?per_page=5',
              { headers }
            ).then(r => r.json());

            // Use the most recent run that had discovered seasons (a long one)
            // Pick run #125 which was 21 mins and likely had discoveries
            const allRuns = await fetch(
              'https://api.github.com/repos/markjovic/sports-players-stats/actions/workflows/285907662/runs?per_page=100',
              { headers }
            ).then(r => r.json());

            // Find a long run (>5 mins) which likely has discoveries
            const longRun = allRuns.workflow_runs.find(r => {
              const start = new Date(r.created_at);
              const end   = new Date(r.updated_at);
              return (end - start) > 5 * 60 * 1000;
            });

            if (!longRun) { console.log('No long run found'); return; }
            console.log(`Inspecting run #${longRun.run_number} (id=${longRun.id})`);

            // Fetch log zip
            const logRes = await fetch(
              `https://api.github.com/repos/markjovic/sports-players-stats/actions/runs/${longRun.id}/logs`,
              { headers, redirect: 'follow' }
            );
            console.log(`Log response status: ${logRes.status}`);
            const buf = Buffer.from(await logRes.arrayBuffer());
            console.log(`Zip size: ${buf.length} bytes`);

            // List files in zip
            let offset = 0;
            let fileCount = 0;
            while (offset < buf.length - 4) {
              if (buf[offset]===0x50 && buf[offset+1]===0x4b &&
                  buf[offset+2]===0x03 && buf[offset+3]===0x04) {
                const compression = buf.readUInt16LE(offset + 8);
                const compSize    = buf.readUInt32LE(offset + 18);
                const nameLen     = buf.readUInt16LE(offset + 26);
                const extraLen    = buf.readUInt16LE(offset + 28);
                const nameBytes   = buf.slice(offset + 30, offset + 30 + nameLen);
                const name        = nameBytes.toString('utf8');
                const dataOffset  = offset + 30 + nameLen + extraLen;

                // Try to read first 500 chars of first few files
                if (fileCount < 5) {
                  let text = '';
                  try {
                    if (compression === 0) {
                      text = buf.slice(dataOffset, dataOffset + Math.min(500, compSize)).toString('utf8');
                    } else if (compression === 8) {
                      text = zlib.inflateRawSync(buf.slice(dataOffset, dataOffset + compSize)).toString('utf8').slice(0, 500);
                    }
                  } catch(e) { text = `[error: ${e.message}]`; }
                  console.log(`\nFile ${fileCount+1}: "${name}" compression=${compression} size=${compSize}`);
                  console.log(`Preview: ${text.slice(0, 300).replace(/\n/g, '\\n')}`);
                }
                fileCount++;
                offset = dataOffset + compSize;
              } else {
                offset++;
              }
            }
            console.log(`\nTotal files in zip: ${fileCount}`);
          }
          main().catch(e => { console.error(e.message); process.exit(1); });
          EOF
