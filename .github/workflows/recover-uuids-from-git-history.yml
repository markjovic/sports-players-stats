# .github/workflows/recover-uuids-from-git-history.yml
name: Recover UUIDs From Git History (games/bv only)

# Prerequisite for any attempt to backfill player records for the 81,974
# players found by diagnose-missing-player-files.js to have no player file
# at all. Their id is truncated (ambiguous) and their name was already
# stripped from storage -- the only way to identify who they are is whatever
# full-length uuid existed in games/bv/*.json before today's truncation
# rollout.
#
# REBUILT 2026-07-10 after three failed attempts at a version that did
# ~1,200 individual git operations inside the Node script (one history
# lookup + one content read per file) -- that's what caused every failure
# (a slow per-file traversal, then two separate SIGTERM kills). None of that
# was necessary: every file needing recovery shares the exact same reference
# point, the single commit from right before migrate-uuid-truncation.js ever
# ran. So this workflow finds that ONE commit ONCE (the "Find pre-migration
# commit" step below) and checks it out as a second, plain directory
# (pre-migration/) using the same well-tested actions/checkout mechanism as
# the main checkout -- no custom git subprocess games, no partial-clone lazy
# blob accumulation over the course of the run. The Node script then does a
# pure filesystem diff between the two directories; the only git operations
# left anywhere are the periodic commit/push of the actual fix.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - counts only, no writes or commits'
        required: false
        default: true
        type: boolean
      fetch_depth:
        description: 'How many commits of history to fetch to find the migrate-uuid-truncation commit (measured need was 159 - this is a comfortable margin, not a full unshallow clone)'
        required: false
        default: '500'
        type: string
      force:
        description: 'Ignore saved progress and start over from scratch (normally just re-run - it resumes automatically)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current main (bounded history)
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          sparse-checkout: |
            games
            players/indexes
            scripts
            reports
          sparse-checkout-cone-mode: false

      - name: Find pre-migration commit
        id: find
        run: |
          oldest=$(git log --all --grep="^migrate-uuid-truncation:" --format=%H | tail -1)
          if [ -z "$oldest" ]; then
            echo "No migrate-uuid-truncation commit found in the fetched history - increase fetch_depth and re-run." >&2
            exit 1
          fi
          parent=$(git rev-parse "$oldest^")
          depth_used=$(git rev-list --count "$parent"..HEAD)
          echo "Oldest migrate-uuid-truncation commit: $oldest"
          echo "Pre-migration commit (its parent):     $parent"
          echo "Commits between it and HEAD:           $depth_used  (fetch_depth was ${{ inputs.fetch_depth }})"
          echo "sha=$parent" >> "$GITHUB_OUTPUT"

      - name: Checkout pre-migration games/ snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.find.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: |
            games
          sparse-checkout-cone-mode: false
          path: pre-migration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: Run recovery
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/recover-uuids-from-git-history.js $ARGS
