# .github/workflows/find-missing-players.yml
name: Find Missing Team Players

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Parallel Asynchronous Storage Workers'
        required: false
        default: '128'
        type: string

jobs:
  scan-missing-players:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Increase Node.js Memory Allocation Capacity
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> $GITHUB_ENV

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Missing Players Discovery Scan
        run: node find-missing-team-players.js --concurrency=${{ github.event.inputs.concurrency }}
