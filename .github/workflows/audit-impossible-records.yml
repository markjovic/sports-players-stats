# .github/workflows/audit-impossible-records.yml
name: Audit impossible records

# No PlayHQ calls, no writes to players/ or games/. It COMMITS exactly one file:
# reports/impossible-records.csv.
#
# ⚠️ IT USED TO BE contents: read WITH AN ARTIFACT UPLOAD, AND THAT WAS USELESS.
# populate-players.js --from-csv= takes a REPO PATH, so a CSV that exists only as
# a build artifact had to be downloaded and re-uploaded by hand to get from this
# workflow to the one it feeds. The report is now where its consumer can read it.
#
# NO CONCURRENCY LOCK, DELIBERATELY — the same call made in update-team-index.yml.
# This writes one file under reports/ that nothing else writes, so it cannot
# conflict on content. Giving it `data-write` would queue it behind the nightly and
# both sweeps, and GitHub allows only ONE waiter per group (T19). Push contention is
# handled by the 60-attempt retry in the script, which THROWS when exhausted.
#
# WHAT IT ANSWERS. Which players carry a STORED single-game record that is
# impossible — a maxGamePTS higher than any team scored in that game, or a
# maxGameThreePt above that score divided by three.
#
# WHY IT EXISTS. 2026-10-13, a finals game at Coburg: the winning side entered
# junk stats in the on-court app behind a 20-0 forfeit scoreline, and six lines
# of 100-102 PTS reached the all-time Best Game PTS board. The only guard was a
# BLOCKLIST keyed on PlayHQ's own FORFEIT label, and it had two holes:
# build-leaderboards.js published an entry when it had no gameKey to check, and
# a stored maxGamePTS is never recomputed once written. REPO_MANIFEST §6.84.
#
# build-leaderboards.js now verifies against the game's own scoreline, which
# fixes the BOARD. It does not fix the player files. This names the files, and
# its CSV feeds populate-players.js --from-csv=, which clears statsChecked so
# fetch-profile-stats.js recomputes them (it now drops impossible lines at parse
# time, so the recomputed value is correct).
#
# Unverifiable records — no gameKey, game not held, no scoreline — are NOT
# offenders. They are counted separately and never written to the CSV.
#
# TWO PASSES, AND THE TIMEOUT IS A BACKSTOP NOT A BUDGET. The first version checked
# each record as it met it, which asked for a different season on nearly every player
# against a 12-season cache — a full season-file re-parse per record. It reached
# 100,000 of 434,059 players in 90 minutes and was killed having written nothing
# (2026-10-17). Pass 1 now touches no game file; pass 2 groups by season and reads
# each file at most once. If a run ever approaches this timeout again, read the phase
# timings in the log before raising the number — the number was never the problem.
#
# Full checkout, not sparse: it walks every file in players/ and games/bv.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Rows to print in the job log. The CSV always holds every offender.'
        required: false
        default: '40'
        type: string
      min:
        description: 'Only report records exceeding the ceiling by more than this. 0 reports every impossible record.'
        required: false
        default: '0'
        type: string
      game:
        description: 'Single-game mode: dump this game id''s whole box score beside each player''s stored record. Requires season. Answers whether ONE game doubles for everyone in it — which the corpus-wide distribution cannot.'
        required: false
        type: string
      season:
        description: 'Season id for the game above. Both are required together.'
        required: false
        type: string
      ratios:
        description: 'Cross-check EVERY stored record against its spectator box score and report the stored/box ratio distribution. A spike at a whole number is double-counting in publicProfileStatistics, which would inflate season and career totals too — not just single-game maxima.'
        required: false
        default: false
        type: boolean
      no_commit:
        description: 'Produce the CSV but do not commit it. Use when you only want the numbers — populate-players cannot read an uncommitted file.'
        required: false
        default: false
        type: boolean
      min_cap:
        description: 'Treat a game whose top team score is below this as UNVERIFIABLE rather than as a ceiling. 1 trusts every non-zero scoreline. Raise it when the cap distribution shows a cluster of offenders behind implausible scorelines — those are a games-data problem, not fabricated stats.'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # TWO CHECKOUTS, GATED ON THE MODE. The corpus-wide audit genuinely reads
      # every player file and every season's games, so it takes the lot. Single-game
      # mode reads ONE season file and ~20 player files named by that game's box
      # score, so cloning games/bv (1.94 GB) to use one file in it is waste.
      # Non-cone sparse because the pattern is a single FILE, not a directory.
      - name: Checkout (full — corpus audit)
        if: ${{ inputs.game == '' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout (sparse — single game)
        if: ${{ inputs.game != '' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: "${{ secrets.GITHUB_TOKEN }}"
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /players/indexes/
            /players/aliases/
            /reports/
            /games/bv/${{ inputs.season }}.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # STAGE 2 OF THE SINGLE-GAME CHECKOUT.
      #
      # ⚠️ The sparse pattern used to list `/players/` — all 435,872 files, ~870 MB
      # — so a "sparse" single-game run still spent 6+ minutes checking out, to read
      # about twelve of them. Resolving a box-score id to a player file needs only
      # players/indexes/<2hex>.json and players/aliases/<2hex>.json (512 small
      # files; see resolveToFullUuid in scripts/lib/uuid-prefix.cjs), NOT the files
      # themselves. So stage 1 takes those, this step asks the script which player
      # files it will actually read, and sparse-checkout fetches exactly those.
      #
      # An unresolved box id is NOT fatal here: it is reported by --emit-paths on
      # stderr and the audit prints it as NOT CHECKED. An EMPTY resolution is fatal,
      # because the audit that follows would then report twelve false controls.
      - name: Fetch the roster's player files
        if: ${{ inputs.game != '' }}
        env:
          GAME:   ${{ inputs.game }}
          SEASON: ${{ inputs.season }}
        run: |
          set -euo pipefail

          case "${GAME:-}" in
            ''|*[!0-9a-fA-F]*) echo "::error::game must be a hex id"; exit 1 ;;
          esac
          case "${SEASON:-}" in
            ''|*[!0-9a-fA-F]*) echo "::error::season must be a hex id"; exit 1 ;;
          esac

          PATHS="$RUNNER_TEMP/roster-paths.txt"
          node scripts/audit-impossible-records.js \
            --game="$GAME" --season="$SEASON" --emit-paths="$PATHS"

          if [ ! -s "$PATHS" ]; then
            echo "::error::no player files resolved from the box score — the audit would report every roster entry as a false control"
            exit 1
          fi

          echo "adding $(wc -l < "$PATHS") player files to the sparse checkout"
          xargs -a "$PATHS" git sparse-checkout add

      # Inputs go through env and are gated in bash — never interpolated into
      # run:, never in an `if:` (directive 13 / T27).
      - name: Audit stored single-game records against game scorelines
        env:
          LIMIT:     ${{ inputs.limit }}
          MIN:       ${{ inputs.min }}
          MIN_CAP:   ${{ inputs.min_cap }}
          NO_COMMIT: ${{ inputs.no_commit }}
          RATIOS:    ${{ inputs.ratios }}
          GAME:      ${{ inputs.game }}
          SEASON:    ${{ inputs.season }}
        run: |
          set -euo pipefail

          ARGS=""

          case "${LIMIT:-40}" in
            ''|*[!0-9]*) echo "::error::limit must be a whole number, got '${LIMIT:-}'"; exit 1 ;;
            *)           ARGS="$ARGS --limit=${LIMIT:-40}" ;;
          esac

          case "${MIN:-0}" in
            ''|*[!0-9]*) echo "::error::min must be a whole number, got '${MIN:-}'"; exit 1 ;;
            *)           ARGS="$ARGS --min=${MIN:-0}" ;;
          esac

          case "${MIN_CAP:-1}" in
            ''|*[!0-9]*) echo "::error::min_cap must be a whole number, got '${MIN_CAP:-}'"; exit 1 ;;
            *)           ARGS="$ARGS --min-cap=${MIN_CAP:-1}" ;;
          esac

          if [ "${NO_COMMIT:-false}" = "true" ]; then ARGS="$ARGS --no-commit"; fi
          if [ "${RATIOS:-false}" = "true" ];    then ARGS="$ARGS --ratios"; fi

          # Ids are hex short-ids; anything else is rejected rather than passed through.
          for pair in "game:${GAME:-}" "season:${SEASON:-}"; do
            k="${pair%%:*}"; v="${pair#*:}"
            [ -z "$v" ] && continue
            case "$v" in
              *[!0-9a-fA-F]*) echo "::error::$k must be a hex id, got '$v'"; exit 1 ;;
              *)              ARGS="$ARGS --$k=$v" ;;
            esac
          done

          echo "running: node scripts/audit-impossible-records.js $ARGS"
          node --max-old-space-size=8192 scripts/audit-impossible-records.js $ARGS

      # Single-game mode writes no CSV. Uploading one would publish the LAST run's
      # file as if it were this run's result — a stale artifact under a fresh run id
      # is worse than no artifact.
      - name: Upload impossible-records.csv
        if: ${{ always() && inputs.game == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: impossible-records
          path: reports/impossible-records.csv
          if-no-files-found: warn
