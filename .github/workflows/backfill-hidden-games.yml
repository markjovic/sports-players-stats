# .github/workflows/backfill-hidden-games.yml
name: Backfill Hidden Games

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent API requests'
        required: false
        default: '50'
        type: string
      season:
        description: 'Single season ID (leave blank for all)'
        required: false
        default: ''
        type: string

jobs:
  backfill-hidden:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run hidden game backfill
        run: |
          rm -f backfill-hidden-cookie.json
          ARGS="--concurrency=${{ github.event.inputs.concurrency }}"
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season=${{ github.event.inputs.season }}"
          fi
          node backfill-hidden-games.js $ARGS

      - name: Find unscored games (debug)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const prog = JSON.parse(fs.readFileSync('backfill-hidden-progress.json', 'utf8'));
          const done = new Set(prog.done || []);
          const legacy = new Set(prog.legacy || []);
          const attempted = new Set([...done, ...legacy]);
          const gamesDir = path.join('games', 'bv');
          const unscored = [];
          for (const file of fs.readdirSync(gamesDir)) {
            const sg = JSON.parse(fs.readFileSync(path.join(gamesDir, file), 'utf8'));
            for (const [gameId, game] of Object.entries(sg.games || {})) {
              if (game.hs !== undefined) continue;   // already has score
              if (game.hidden || game.legacy) continue; // already flagged
              if (!attempted.has(gameId)) continue;  // not yet attempted — skip
              unscored.push({season: file.replace('.json',''), gameId, date: game.d, home: game.hn, away: game.an});
            }
          }
          if (unscored.length === 0) {
            console.log('No unscored attempted games — all good.');
          } else {
            console.log('Attempted but still unscored (' + unscored.length + '):');
            unscored.forEach(g => console.log(JSON.stringify(g)));
          }
          "

      - name: Commit final results
        run: |
          git add games/ venue-lookup/ backfill-hidden-progress.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hidden game backfill: final flush"
            git pull --rebase=false --no-edit -X ours
            git push
          fi
