# .github/workflows/backfill-hidden-games.yml
name: Backfill Hidden Games

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent API requests'
        required: false
        default: '300'
        type: string
      season:
        description: 'Single season ID (leave blank for all)'
        required: false
        default: ''
        type: string
      review_legacy:
        description: 'Re-probe legacy games to detect forfeits'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      review_unscored:
        description: 'Probe all unscored unflagged games via discoverGame'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  backfill-hidden:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run hidden game backfill
        run: |
          rm -f backfill-hidden-cookie.json
          ARGS="--concurrency=${{ github.event.inputs.concurrency }}"
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season=${{ github.event.inputs.season }}"
          fi
          if [ "${{ github.event.inputs.review_legacy }}" = "true" ]; then
            ARGS="$ARGS --review-legacy"
          fi
          if [ "${{ github.event.inputs.review_unscored }}" = "true" ]; then
            ARGS="$ARGS --review-unscored"
          fi
          node backfill-hidden-games.js $ARGS

      - name: Commit final results
        run: |
          git add games/ venue-lookup/ backfill-hidden-progress.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hidden game backfill: final flush"
            git pull --rebase=false --no-edit -X ours
            git push
          fi
