# .github/workflows/diagnose-coverage-and-uuids.yml
name: Diagnose Coverage and UUIDs

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Single season ID to limit coverage analysis (blank = all seasons, slow)'
        required: false
        default: ''
      uuid_sample:
        description: 'Number of player files to sample for UUID analysis (default: 50000)'
        required: false
        default: '50000'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run diagnostic
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season=${{ github.event.inputs.season }}"
          fi
          ARGS="$ARGS --uuid-sample=${{ github.event.inputs.uuid_sample }}"
          node scripts/diagnose-coverage-and-uuids.js $ARGS
