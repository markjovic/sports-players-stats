# .github/workflows/audit-data.yml
#
# Reads data/core.json and data/orgs/*.json and reports whether what is on disk
# agrees with the manifest. READ ONLY — there is no commit step and nothing to
# roll back.
#
# It verifies the audit before running it. An audit that reports "0 errors" is
# worthless unless it has been shown to report something when something is wrong,
# so the first step seeds fourteen defects into fixtures and confirms each is
# named. If that step fails, ignore whatever the audit says about your data.
#
# strict: treat warnings as errors too. Leave it false for now — the collapsed
# U8 grades and any round gaps are known and would fail every run.

name: Audit data

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Treat warnings as errors'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      org:
        description: 'Optional 8-character organisation code — also print a season-by-season breakdown by age group'
        required: false
        default: ''
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check scripts/audit-data.js
          node --check scripts/verify-audit.js
          echo "both files parse"

      # Prove the audit can fail before believing it when it passes.
      - name: Verify the audit
        run: node scripts/verify-audit.js

      - name: Audit the data
        env:
          AUDIT_STRICT: ${{ github.event.inputs.strict }}
          AUDIT_ORG: ${{ github.event.inputs.org }}
        run: node scripts/audit-data.js
