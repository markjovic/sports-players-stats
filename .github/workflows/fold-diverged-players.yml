# .github/workflows/fold-diverged-players.yml
name: Fold diverged players (api-canonical maintenance)

# 2026-08-31: the MERGE keeper changed. It used to be whichever record held more
# games[] entries; it is now whichever record actually holds stats. Nothing about
# this workflow's shape changed — same single job, same data-write group, same
# inputs — but the first run after the script lands should be mode=dry-run, and
# two new rows in the job summary are the ones to read:
#   "merges where the OLD comparator would have kept the stub"  — how many merges
#     this change rescues. Expect a large number the first time; the seeder's
#     2026-08-31 dry run found 528 pairs of exactly that shape.
#   "statsChecked dropped (re-fetch queued)" — how many extra profile fetches the
#     next fetch-profile-stats cycle will pick up. Only fires when both records
#     held the same class of answer and the decision came down to a tie-break.

on:
  # No schedule: the fetch-profile-stats matrix triggers this with mode=apply
  # every time a cycle completes, which sweeps ALL pending diverged files
  # (idempotent) — including stragglers from any earlier failed cycle. A cron
  # would only duplicate that. Manual dispatch remains for intervention.
  workflow_dispatch:
    inputs:
      no_refetch_dispatch:
        description: 'Do NOT dispatch a re-fetch for players this run un-checks. Set by anything that is itself downstream of the matrix, to stop the chain looping back on itself.'
        required: false
        default: false
        type: boolean
      mode:
        description: "dry-run = scan and report diverged files only (nothing written). apply = fold them to their api-id paths, move index entries, repoint orphaned aliases, single commit. repoint-only = do NOT fold; repair just the alias values orphaned by a PREVIOUS fold, reconstructing the mapping from the player files themselves (each file's spectatorIds[]) — it needs no report and no extra input. Normally triggered automatically by matrix completion with mode=apply. 2026-08-31: the merge keeper changed — run dry-run once and read the two new summary rows before letting apply run again."
        type: choice
        options:
          - dry-run
          - apply
          - repoint-only
        default: dry-run

permissions:
  contents: write
  # actions: write is required for the targeted re-fetch dispatch below. The
  # dispatch itself uses WORKFLOW_PAT, matching every other dispatch site in this
  # repo — GITHUB_TOKEN cannot trigger another workflow.
  actions: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    # 2026-08-08: the 120 minutes was never the problem — a 13,675-player fold did
    # all its work in 82 SECONDS and then spent 1h54m staging ~27,600 paths one
    # `git add` process at a time (~250 ms each against this repo's ~50 MB index),
    # dying at the timeout with nothing committed. Staging is now batched with a
    # per-path fallback (script), so the git phase is well under a minute. The
    # generous timeout stays as headroom for push contention, not for staging.
    timeout-minutes: 120
    steps:
      # Full depth-1 checkout - reads every player file and may write into any
      # of the 256 shards plus index shards. No network calls, no setup-node.
      - name: Checkout working tree
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Manual dispatch defaults to dry-run for safe inspection; the matrix
      # trigger passes mode=apply explicitly.
      # repoint-only exists because the fold is IDEMPOTENT: once it has run there
      # are zero apiId fields left, so a corrected script can never revisit the
      # aliases an earlier run orphaned.
      # It reconstructs the mapping from the PLAYER FILES (buildSpectatorMap), not
      # from reports/fold-diverged.json.
      # ⚠️ Corrected 2026-07-31: this comment and the input description above both
      # said it read reports/fold-diverged.json. That was true of the ORIGINAL
      # implementation and false after the T6 rewrite. reports/fold-diverged.json is
      # a single path overwritten by every run — trusting it is what made the
      # 2026-07-30 repair fix 0 of 284 dangling aliases. It is now advisory only.
      - name: Run fold
        run: |
          case "${{ github.event.inputs.mode }}" in
            apply)        node scripts/fold-diverged-players.js ;;
            repoint-only) node scripts/fold-diverged-players.js --repoint-only ;;
            *)            node scripts/fold-diverged-players.js --dry-run ;;
          esac

      # ── Hand the un-checked players back to the matrix ──────────────────────
      # The fold can now delete statsChecked from a merged player (see the script's
      # keeper notes). fetch-profile-stats is dispatched by nightly-crawl.yml behind
      # a gate that counts NEW players and needs-matrix-shards.json rechecks, and
      # NEITHER counts players missing statsChecked — and when it does fire it is
      # TARGETED at the shards on that list. So without this step those players hold
      # no stats and no statsChecked, and nothing ever revisits them. That is worse
      # than the bug the keeper change fixes.
      #
      # The script writes refetch-shards.json (always, and always [] on a dry run,
      # so a dry run can never cause a dispatch). This step reads it and dispatches
      # the matrix at exactly those shards.
      #
      # Cannot loop: the fold acts only on files carrying an apiId field and deletes
      # it as it goes, and its post-check throws unless zero remain — so the fold
      # that follows the matrix un-checks nobody and writes [].
      #
      # Timing is safe: this workflow holds data-write and only reaches here after
      # post-drain-chain has released it, so nightly-crawl and its win-loss job are
      # finished. That is the race nightly-crawl.yml's `needs: [crawl, team-stats,
      # win-loss]` ordering exists to prevent, and it is not in play here.
      - name: Install dispatch retry helper
        if: ${{ github.event.inputs.mode == 'apply' && github.event.inputs.no_refetch_dispatch != 'true' }}
        # Copied VERBATIM from fetch-profile-stats-matrix.yml, the proven site —
        # not retyped. A chain-critical `gh workflow run` is never one-shot
        # (directive 14): one HTTP 500 on 2026-07-27 stopped the matrix chain
        # outright and the run still showed green.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      # ── WHY THIS CAN BE TURNED OFF ──────────────────────────────────────────
      # Added 2026-08-31, and it closed a cycle nobody had before:
      #
      #   matrix -> post-drain-chain -> fold -> matrix -> ...
      #
      # The fold used to be a LEAF. This step made it an edge back to the matrix.
      # The original reasoning for why it could not loop was that the fold deletes
      # apiId as it goes — but that only covers apiId fields that already exist.
      # fetch-profile-stats.js WRITES player.apiId during namespace recovery, so
      # every matrix run can manufacture new work for the next fold, which un-checks
      # more players, which dispatches another matrix.
      #
      # Observed 2026-09-03 after the force sweep: fold #86 folded 677 and un-checked
      # 145, dispatching a matrix that fed the next fold. It converged, because each
      # round's input is smaller than the last — but it converges, it does not stop,
      # and any future force sweep restarts it.
      #
      # So: post-drain-chain.yml should pass no_refetch_dispatch=true when it
      # dispatches this workflow. The fold still un-checks the players and still
      # writes refetch-shards.json; they are simply picked up by the NEXT matrix run
      # rather than triggering one immediately. A MANUAL fold dispatch leaves it
      # false and keeps the immediate re-fetch, which is what makes the standalone
      # run useful.
      - name: Dispatch targeted re-fetch for un-checked players
        if: ${{ github.event.inputs.mode == 'apply' && github.event.inputs.no_refetch_dispatch != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: |
          if [ ! -f refetch-shards.json ]; then
            echo "refetch-shards.json not present — the fold wrote no re-fetch list. Nothing to dispatch."
            exit 0
          fi
          shards="$(tr -d '[:space:]' < refetch-shards.json)"
          echo "Re-fetch shards: ${shards}"
          # An EMPTY list must not be forwarded. The matrix reads shards='[]' as
          # "all 256" — the same trap documented in its own T9 note — so passing it
          # would turn "nobody needs re-fetching" into a full 256-shard sweep.
          if [ -z "$shards" ] || [ "$shards" = "[]" ]; then
            echo "No players had statsChecked removed. Not dispatching."
            exit 0
          fi
          /tmp/gh-dispatch.sh fetch-profile-stats-matrix.yml \
            --field "run_number=1" \
            --field "consecutive_zeros=0" \
            --field "shards=${shards}"

      # Says so out loud when the dispatch was suppressed. A step that simply does
      # not appear in the log is indistinguishable from one that failed silently,
      # and the players ARE un-checked either way — that must not be invisible.
      - name: Re-fetch dispatch suppressed
        if: ${{ github.event.inputs.mode == 'apply' && github.event.inputs.no_refetch_dispatch == 'true' }}
        run: |
          if [ -f refetch-shards.json ]; then
            shards="$(tr -d '[:space:]' < refetch-shards.json)"
          else
            shards="[]"
          fi
          echo "no_refetch_dispatch=true — NOT dispatching a re-fetch."
          echo "Shards that would have been targeted: ${shards}"
          echo "Those players have had statsChecked removed and will be picked up by"
          echo "the next matrix run. This exists to stop the chain"
          echo "matrix -> post-drain-chain -> fold -> matrix looping back on itself."
