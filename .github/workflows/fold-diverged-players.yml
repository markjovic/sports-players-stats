# .github/workflows/fold-diverged-players.yml
name: Fold diverged players (api-canonical maintenance)

on:
  # No schedule: the fetch-profile-stats matrix triggers this with mode=apply
  # every time a cycle completes, which sweeps ALL pending diverged files
  # (idempotent) — including stragglers from any earlier failed cycle. A cron
  # would only duplicate that. Manual dispatch remains for intervention.
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = scan and report diverged files only (nothing written). apply = fold them to their api-id paths, move index entries, repoint orphaned aliases, single commit. repoint-only = do NOT fold; repair just the alias values orphaned by a PREVIOUS fold, using the oldKey -> apiId pairs in reports/fold-diverged.json. Normally triggered automatically by matrix completion with mode=apply."
        type: choice
        options:
          - dry-run
          - apply
          - repoint-only
        default: dry-run

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Full depth-1 checkout - reads every player file and may write into any
      # of the 256 shards plus index shards. No network calls, no setup-node.
      - name: Checkout working tree
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Manual dispatch defaults to dry-run for safe inspection; the matrix
      # trigger passes mode=apply explicitly.
      # repoint-only exists because the fold is IDEMPOTENT: once it has run there
      # are zero apiId fields left, so a corrected script can never revisit the
      # aliases an earlier run orphaned. It reads reports/fold-diverged.json, which
      # is the only surviving record of which files that run deleted.
      - name: Run fold
        run: |
          case "${{ github.event.inputs.mode }}" in
            apply)        node scripts/fold-diverged-players.js ;;
            repoint-only) node scripts/fold-diverged-players.js --repoint-only ;;
            *)            node scripts/fold-diverged-players.js --dry-run ;;
          esac
