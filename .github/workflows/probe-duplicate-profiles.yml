# .github/workflows/probe-duplicate-profiles.yml
name: Probe Duplicate Profiles

# READ-ONLY. No writes, no commits, no data-write lock.
#
# size-duplicate-profiles found 2,895 pairs of same-named player files holding the
# SAME game ids — 122,866 duplicated appearances, one human counted twice in each.
# It cannot say which file is real: offline both are 36-char uuids carrying data.
#
# PlayHQ can. On 2026-08-21 /public/profile/20b2df06.../statistics resolved while
# /public/profile/f806d1b6.../statistics returned "There was a problem getting the
# profile". This asks that question through the API for both sides of each pair and
# sorts the answer into the four cases that need different work:
#
#   BOTH resolve  → PlayHQ really issues two profiles per person. Nothing to
#                   delete; only a merge helps, and a merge keyed on a name match
#                   is a judgement needing its own decision.
#   ONE resolves  → the other uuid is not a PlayHQ profile and that file should not
#                   exist. The only case with a clean fix — and it raises the
#                   question of what created it.
#   NEITHER       → both unknown to PlayHQ. Something invented both.
#   PRIVATE       → cannot be judged this way; a private profile still exists.
#
# Two calls per pair, de-duplicated across pairs, paced ~0.7s. A 200-pair sample is
# ~400 calls and about five minutes; --all is 5,790 calls and roughly an hour.
#
# NO actions/setup-node (this job fetches api.playhq.com — absolute rule).

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Pairs to probe. Start with 200 — the proportions decide what the fix is, and a sample gives them.'
        required: false
        default: '200'
        type: string
      all:
        description: 'Probe EVERY pair instead of a sample (~5,790 calls, ~1 hour). Only worth it once the sample says which case dominates.'
        required: false
        default: false
        type: boolean
      seed:
        description: 'Sampling seed — the same seed probes the same pairs'
        required: false
        default: '20260821'
        type: string
      pace:
        description: 'Milliseconds between calls. 700 cost 834 pairs to CloudFront on the first full run; 1500 is the floor. Raise if the wall is still hit.'
        required: false
        default: '1500'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # The previous run wrote reports/duplicate-profile-pairs.json into the runner
      # and the runner was destroyed — an hour of calls with nothing to show. This
      # workflow has `contents: read` and commits nothing, so the OUTPUT MUST BE AN
      # ARTIFACT or it does not exist.
      - name: Restore previous verdict cache
        uses: actions/download-artifact@v4
        # continue-on-error is REQUIRED, not defensive: the first run has no
        # artifact and download-artifact FAILS THE STEP rather than returning
        # empty. The 2026-08-22 run logged "Artifact not found" as an error for
        # exactly this reason — expected, and it must not stop the job.
        continue-on-error: true
        with:
          name: duplicate-profile-verdicts
          path: /tmp/cache
          # Look in this repo's previous runs of this workflow.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe duplicate profiles
        run: |
          ARGS="--sample=${{ inputs.sample }} --seed=${{ inputs.seed }}"
          if [ "${{ inputs.all }}" = "true" ] || [ "${{ inputs.all }}" = "True" ]; then ARGS="$ARGS --all"; fi
          ARGS="$ARGS --pace=${{ inputs.pace }}"
          # Reload the verdict cache from the previous run's artifact, if there was
          # one. Without this a re-dispatch re-asks the 4,677 profiles that already
          # answered — an hour of calls to learn nothing new.
          mkdir -p reports
          if [ -f /tmp/cache/duplicate-profile-verdicts.json ]; then
            cp /tmp/cache/duplicate-profile-verdicts.json reports/
            echo "  restored verdict cache from the previous run"
          fi
          node --max-old-space-size=8192 scripts/probe-duplicate-profiles.js $ARGS

      - name: Upload the pair list and verdict cache
        if: always()          # a timed-out run still has partial results worth keeping
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-profile-pairs
          path: |
            reports/duplicate-profile-pairs.json
            reports/duplicate-profile-verdicts.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload verdict cache for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-profile-verdicts
          path: reports/duplicate-profile-verdicts.json
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
