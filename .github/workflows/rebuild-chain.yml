# .github/workflows/rebuild-chain.yml
name: Rebuild Chain (one-off, post-backfill)

# ONE-OFF sequencer for the 2026-08-06 post-backfill rebuild, in the nightly's shape:
# one workflow, jobs chained with `needs`, each on its own runner with its own timeout.
#   player-games -> win-loss (full) -> finals (full) -> search -> leaderboards (force)
#   -> Deploy Pages (dispatched — its job lives in its own workflow)
#
# The data-write lock is held at WORKFLOW level for the whole chain, exactly like the
# nightly: nothing can rewrite main between steps, and the chain itself queues behind
# a running nightly instead of colliding with it (T25).
#
# Every job checks out `ref: main`, not github.sha — each must see the PREVIOUS job's
# pushes, and github.sha is frozen at trigger time (trap T21).
#
# A failed job stops the chain (needs-gating). To resume, re-dispatch with "Start at"
# set to the failed step — earlier jobs are skipped by the gate, not re-run.
#
# No setup-node anywhere: nothing here fetches PlayHQ, and the runner's default Node
# runs every script. No PAT except the final Deploy Pages dispatch (house pattern).

on:
  workflow_dispatch:
    inputs:
      start_at:
        description: 'Start at this step (earlier steps are skipped)'
        required: false
        default: 'player-games'
        type: choice
        options:
          - player-games
          - win-loss
          - finals
          - search
          - leaderboards
          - deploy

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  player-games:
    if: ${{ inputs.start_at == 'player-games' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/build-player-games.js

  win-loss:
    # !cancelled() + result gates, not plain needs: a SKIPPED upstream (start_at later
    # than it) must not skip this job, and a FAILED upstream must.
    needs: [player-games]
    # SINGLE-LINE gate (trap T1: a folded >- scalar with a deeper-indented continuation
    # keeps its newline and breaks the expression — proven failure in this repo).
    if: ${{ !cancelled() && needs.player-games.result != 'failure' && (inputs.start_at == 'player-games' || inputs.start_at == 'win-loss') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/build-win-loss.js

  finals:
    needs: [player-games, win-loss]
    if: ${{ !cancelled() && needs.player-games.result != 'failure' && needs.win-loss.result != 'failure' && (inputs.start_at == 'player-games' || inputs.start_at == 'win-loss' || inputs.start_at == 'finals') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/build-finals-stats.js

  search:
    # needs lists EVERY prior job, and the gate checks EVERY one for failure. Checking
    # only the direct parent is wrong: a failure two steps up shows as the parent being
    # SKIPPED, not failed, and the chain would resume itself past the failure (caught by
    # the gate-matrix test before delivery).
    needs: [player-games, win-loss, finals]
    if: ${{ !cancelled() && needs.player-games.result != 'failure' && needs.win-loss.result != 'failure' && needs.finals.result != 'failure' && inputs.start_at != 'leaderboards' && inputs.start_at != 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/build-search-index.js

  leaderboards:
    needs: [player-games, win-loss, finals, search]
    if: ${{ !cancelled() && needs.player-games.result != 'failure' && needs.win-loss.result != 'failure' && needs.finals.result != 'failure' && needs.search.result != 'failure' && inputs.start_at != 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: node scripts/build-leaderboards.js --force

  deploy:
    needs: [player-games, win-loss, finals, search, leaderboards]
    if: ${{ !cancelled() && needs.player-games.result != 'failure' && needs.win-loss.result != 'failure' && needs.finals.result != 'failure' && needs.search.result != 'failure' && needs.leaderboards.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dispatch retry helper
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh

      - name: Dispatch Deploy Pages
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: /tmp/gh-dispatch.sh "Deploy Pages"
