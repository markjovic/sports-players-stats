# .github/workflows/discover-fixtures.yml
name: Discover fixtures

# On-demand full-fixture discovery. nightly-crawl only fetches the current +
# previous rounds, so future fixtures are never ingested by it; this pulls the
# WHOLE round list (incl. future games) for active seasons via discoverTeamFixture.
# Dispatch with dry_run first if you want to see what it would do.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — resolve fixtures but write/commit nothing'
        required: false
        default: false
        type: boolean
      season:
        description: 'Single season id (blank = all active locked:false seasons)'
        required: false
        type: string
      all_seasons:
        description: 'Include completed (locked) seasons too'
        required: false
        default: false
        type: boolean
      current_only:
        description: 'Skip finished seasons (fast — weekly mode)'
        required: false
        default: false
        type: boolean
      locked_resweep:
        description: '§2.2 historical re-sweep: every locked && !removed season (exclusive with season / all_seasons / current_only)'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'Team fetches in parallel (blank = 20)'
        required: false
        type: string
      chain_stats:
        description: 'On success, dispatch Build Finals Stats (active-only) which chains Build Leaderboards — set by the weekly nightly-crawl dispatch'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write          # same lock as nightly-crawl / weekly-indexes — never write games/ at once
  cancel-in-progress: false

permissions:
  contents: write
  actions: write             # chain-stats job dispatches build-finals-stats.yml

jobs:
  discover-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      # NO setup-node — this job fetches api.playhq.com (discoverTeamFixture);
      # setup-node changes the runner's outbound fingerprint and causes CloudFront 403s.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Discover fixtures
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ];     then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.all_seasons }}" = "true" ]; then ARGS="$ARGS --all-seasons"; fi
          if [ "${{ inputs.current_only }}" = "true" ]; then ARGS="$ARGS --current-only"; fi
          if [ "${{ inputs.locked_resweep }}" = "true" ]; then ARGS="$ARGS --locked-resweep"; fi
          if [ -n "${{ inputs.season }}" ];            then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          if [ -n "${{ inputs.concurrency }}" ];       then ARGS="$ARGS --concurrency=${{ inputs.concurrency }}"; fi
          node scripts/discover-fixtures.js $ARGS

  # Weekly chain link (2026-07-21, §C7): fixtures sweep → finals → leaderboards.
  # Only fires when the weekly nightly-crawl dispatch passes chain_stats=true —
  # manual/historical fixture runs never trigger stat rebuilds. Default
  # success-gating on `needs:` means a failed sweep never chains.
  chain-stats:
    needs: discover-fixtures
    runs-on: ubuntu-latest
    if: ${{ inputs.chain_stats == true || inputs.chain_stats == 'true' }}
    steps:
      - name: Install dispatch retry helper
        # 2026-08-02: was a BARE `gh workflow run`. This is the SECOND HOP of the
        # weekly chain (nightly -> discover-fixtures -> finals -> leaderboards), so a
        # single HTTP 500 here lands the fixtures and silently skips both stat
        # rebuilds for the week, with this run still green. OUTSTANDING §2.6 counted
        # only the four sites in nightly-crawl.yml; fixing those alone would have
        # left this one — the same chain, one hop downstream.
        # Helper copied VERBATIM from fetch-profile-stats-matrix.yml.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Dispatch Build Finals Stats (active-only, chained)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: |
          /tmp/gh-dispatch.sh build-finals-stats.yml \
            --field "active_only=true" \
            --field "chain_leaderboards=true"
