# .github/workflows/discover-fixtures.yml
name: Discover fixtures

# On-demand full-fixture discovery. nightly-crawl only fetches the current +
# previous rounds, so future fixtures are never ingested by it; this pulls the
# WHOLE round list (incl. future games) for active seasons via discoverTeamFixture.
# Dispatch with dry_run first if you want to see what it would do.
#
# 2026-08-19 — TEAMS ARE NOW RESOLVED BY TWO ROUTES, UNIONED.
# The ladder route alone cannot see a season whose stored grades are all GRADING
# grades: a grading grade returns `ladder: []` (not an error — it is not a
# competition), so the season enumerated ZERO teams and no fixture was ever
# fetched. Seven seasons were in that state, six of them ACTIVE:
#   1ae60211 EDJBA Winter 2026 · aacc7335 Camberwell CBL Winter 2026
#   1c70d59d Diamond Valley Spring 2026 · 83a38877 Eltham Spring 2026
#   98dc2b10 BTBC Spring 2026 · e0f9dedc Respect Sports Spring 2026
#   9358e51a Waverley Spring 2023 [locked]
#
# `discoverTeams(filter:{seasonID})` returns a season's teams without a ladder.
# MEASURED on this tenant before use: EDJBA 2,093 teams / 263 grades, Camberwell
# 672 / 82, control season 385 / 51. One request per season against dozens of
# per-grade calls.
#
# It is UNIONED with the ladder sweep, never substituted for it — Camberwell
# returned 13 of the 16 grades our held games use, so it is not a strict superset.
# `--no-season-teams` restores the old behaviour if it ever needs isolating.
#
# The run also reports seasons where sports-index holds fewer grades than
# discoverTeams sees. That is harmless for the sweep itself (a team returns its
# whole fixture regardless of grade) but discover-seasons.js will not correct it —
# its grade-refresh only re-reads seasons sitting at grades:[].

on:
  # Weekly schedule added 2026-08-10, replacing the dispatch from nightly-crawl's
  # terminal fan-out (which fired this at the same instant as post-drain-chain —
  # three claimants on a group that holds ONE pending run, so the third arrival
  # cancelled the waiter). 20:00 UTC Monday = 06:00 AEST Tuesday: the overnight
  # cascade has finished, and discover-seasons had its own clear window the day
  # before.
  #
  # ⚠️ SCHEDULED RUNS RECEIVE NO INPUTS — workflow_dispatch defaults do NOT apply
  # to cron. The step below therefore sets the weekly arguments explicitly when
  # github.event_name is 'schedule' (current_only), and the chain-stats gate
  # treats a scheduled run as chain_stats=true. Without that this would silently
  # run a FULL sweep of every active season and skip the stats chain.
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — resolve fixtures but write/commit nothing'
        required: false
        default: false
        type: boolean
      season:
        description: 'Single season id (blank = all active locked:false seasons)'
        required: false
        type: string
      all_seasons:
        description: 'Include completed (locked) seasons too'
        required: false
        default: false
        type: boolean
      current_only:
        description: 'Skip finished seasons (fast — weekly mode)'
        required: false
        default: false
        type: boolean
      locked_resweep:
        description: '§2.2 historical re-sweep: every locked && !removed season (exclusive with season / all_seasons / current_only)'
        required: false
        default: false
        type: boolean
      concurrency:
        description: 'Team fetches in parallel. The weekly cron runs at 40, which is the PROVEN working value on this endpoint (2026-08-13). Blank = the script default of 20. The 2026-08-13 freeze was NOT concurrency — it was two silent-hang bugs in gql() (no request timeout, uncapped 429 retry loop), both since fixed.'
        required: false
        type: string
      no_season_teams:
        description: 'Disable the discoverTeams route and use ladders only (pre-2026-08-19 behaviour). Leave off.'
        required: false
        default: false
        type: boolean
      chain_stats:
        description: 'On success, dispatch Build Finals Stats (active-only) which chains Build Leaderboards — set by the weekly nightly-crawl dispatch'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write          # same lock as nightly-crawl / weekly-indexes — never write games/ at once
  cancel-in-progress: false

permissions:
  contents: write
  actions: write             # chain-stats job dispatches build-finals-stats.yml

jobs:
  discover-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      # NO setup-node — this job fetches api.playhq.com (discoverTeamFixture);
      # setup-node changes the runner's outbound fingerprint and causes CloudFront 403s.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Discover fixtures
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Weekly cron: same arguments the nightly used to pass.
            ARGS="--current-only"
            echo "Scheduled weekly sweep — args: $ARGS"
            node scripts/discover-fixtures.js $ARGS
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ];     then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.all_seasons }}" = "true" ]; then ARGS="$ARGS --all-seasons"; fi
          if [ "${{ inputs.current_only }}" = "true" ]; then ARGS="$ARGS --current-only"; fi
          if [ "${{ inputs.locked_resweep }}" = "true" ]; then ARGS="$ARGS --locked-resweep"; fi
          if [ "${{ inputs.no_season_teams }}" = "true" ]; then ARGS="$ARGS --no-season-teams"; fi
          if [ -n "${{ inputs.season }}" ];            then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          if [ -n "${{ inputs.concurrency }}" ];       then ARGS="$ARGS --concurrency=${{ inputs.concurrency }}"; fi
          node scripts/discover-fixtures.js $ARGS

  # Weekly chain link (2026-07-21, §C7): fixtures sweep → finals → leaderboards.
  # Only fires when the weekly nightly-crawl dispatch passes chain_stats=true —
  # manual/historical fixture runs never trigger stat rebuilds. Default
  # success-gating on `needs:` means a failed sweep never chains.
  chain-stats:
    needs: discover-fixtures
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.chain_stats == true || inputs.chain_stats == 'true' }}
    steps:
      - name: Install dispatch retry helper
        # 2026-08-02: was a BARE `gh workflow run`. This is the SECOND HOP of the
        # weekly chain (nightly -> discover-fixtures -> finals -> leaderboards), so a
        # single HTTP 500 here lands the fixtures and silently skips both stat
        # rebuilds for the week, with this run still green. OUTSTANDING §2.6 counted
        # only the four sites in nightly-crawl.yml; fixing those alone would have
        # left this one — the same chain, one hop downstream.
        # Helper copied VERBATIM from fetch-profile-stats-matrix.yml.
        run: |
          cat > /tmp/gh-dispatch.sh << 'SH'
          #!/usr/bin/env bash
          # usage: gh-dispatch.sh <workflow.yml> [--field k=v ...]
          # Retries transient failures (5xx, network) with backoff.
          # Fails FAST on permanent HTTP 4xx (422 bad input, 404 missing workflow,
          # 401/403 bad token) — retrying those burns minutes and buries the real
          # error. THROWS when attempts are exhausted: a lost dispatch is a broken
          # chain, and a broken chain must show red.
          set -uo pipefail
          wf="$1"; shift
          attempts=10
          for i in $(seq 1 $attempts); do
            if out=$(gh workflow run "$wf" --repo "$GH_REPO" "$@" 2>&1); then
              echo "  ✓ dispatched ${wf} (attempt ${i})"
              exit 0
            fi
            echo "$out"
            if printf '%s' "$out" | grep -qE 'HTTP 4[0-9][0-9]'; then
              echo "  ✗ ${wf}: permanent error — not retrying"
              exit 1
            fi
            if [ "$i" -lt "$attempts" ]; then
              delay=$(( i * 10 ))
              [ "$delay" -gt 90 ] && delay=90
              echo "  … transient failure dispatching ${wf} — retry $((i+1))/${attempts} in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "  ✗ ${wf}: dispatch failed after ${attempts} attempts"
          exit 1
          SH
          chmod +x /tmp/gh-dispatch.sh
          echo "Helper installed."

      - name: Dispatch Build Finals Stats (active-only, chained)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO:  ${{ github.repository }}
        run: |
          /tmp/gh-dispatch.sh build-finals-stats.yml \
            --field "active_only=true" \
            --field "chain_leaderboards=true"
