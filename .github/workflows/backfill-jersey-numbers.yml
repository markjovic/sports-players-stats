# .github/workflows/backfill-jersey-numbers.yml

name: Backfill Jersey Numbers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run backfill-jersey-numbers
        run: node scripts/backfill-jersey-numbers.js

      - name: Final push (safety net)
        if: always()
        run: |
          git add team-stats/bv/ scripts/.backfill-jersey-progress.json || true
          git diff --staged --quiet || git commit -m "backfill-jersey-numbers: safety-net final commit"
          git pull --rebase=false --no-edit -X ours || true
          git push || true
