# .github/workflows/discover-game-backfill.yml
name: Discover Game Backfill

# SECOND roster capture path (2026-08-11). spectator.playhq.com is the LIVE-SCORING
# service and only holds games scored in real time at the venue; games scored on
# paper and entered afterwards live in PlayHQ's canonical record and answer
# "game could not be found or was not electronically scored" on spectator. Our
# roster pipeline read spectator only, so paper-scored games have been invisible
# since day one — a scoring-METHOD split, not an era.
#
# This asks api.playhq.com/graphql (`gameView` -> discoverGame) for games spectator
# retired as misses (spcm set, no spc), and marks what it captures `dg: 1`. It
# never writes spc and never touches spcm; its own permanent failures count in dgm.
#
# NO actions/setup-node (this job fetches api.playhq.com — absolute rule).

on:
  workflow_dispatch:
    inputs:
      max_games:
        description: 'Max games to fetch this run (re-dispatch to continue)'
        required: false
        default: '50000'
        type: string
      season:
        description: 'Restrict to one season id (optional)'
        required: false
        default: ''
        type: string
      concurrency:
        description: 'Parallel gameView requests. Deliberately modest — the nightly crawl shares this endpoint.'
        required: false
        default: '25'
        type: string
      min_age_days:
        description: 'Skip games younger than this many days'
        required: false
        default: '30'
        type: string
      dry_run:
        description: 'Scan and report the queue only — no API calls, no writes'
        required: false
        default: false
        type: boolean

concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run discoverGame backfill
        run: |
          ARGS="--max-games=${{ inputs.max_games }} --concurrency=${{ inputs.concurrency }}"
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season=${{ inputs.season }}"; fi
          if [ -n "${{ inputs.min_age_days }}" ]; then ARGS="$ARGS --min-age-days=${{ inputs.min_age_days }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ inputs.dry_run }}" = "True" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/discover-game-backfill.js $ARGS
