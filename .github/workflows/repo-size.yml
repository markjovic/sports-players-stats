# .github/workflows/repo-size.yml
name: Repo Size Report

on:
  workflow_dispatch:
    inputs:
      top:
        description: 'Number of largest files to show'
        required: false
        default: '20'
        type: string

jobs:
  repo-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run size report
        run: node repo-size.js --top=${{ github.event.inputs.top }}
