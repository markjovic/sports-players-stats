# .github/workflows/find-misrouted-appearances.yml
name: Find misrouted appearances

# READ-ONLY. No PlayHQ calls. Reads players/, players/aliases/ and games/bv,
# writes one report. Changes no player file and no alias.
#
# WHAT IT LOOKS FOR. Found 2026-09-05 on Jordan Uppal, who exists as two PlayHQ
# profiles:
#
#   8a30488e-5554-4926-8780-10377baa2b7f  "Jordan singh Uppal"  gp 34,  games 150, x 116
#   296747c1-bd13-464e-94b6-c89ad797ce42  "Jordan Uppal"        gp 184, games 184, x 0
#
# All 116 of the first profile's x games are in the second profile's games, and
# the second credits every one of them. players/aliases/88.json maps the spectator
# id 88f43f9d-ddb4 to the FIRST profile; PlayHQ credits those games to the SECOND.
# The alias points at the wrong one of two profiles belonging to the same person,
# and build-player-games has been routing 116 appearances by that instruction.
#
# The 34 games PlayHQ does credit to the first profile are exactly the 34 that are
# NOT in the second. The split is clean.
#
# THIS IS NOT THE FOLD. Both records are real, separate PlayHQ profiles with their
# own credited stats. Nothing merged them. The fold's keeper rule decides which
# record's stats survive a merge and has no opinion on whether two records are the
# same person.
#
# CORRECTED 2026-09-05, BEFORE THE FIRST RUN'S NUMBERS COULD BE BELIEVED. The
# first version asked only "does another profile hold this game and get credited
# for it". That is true of EVERY TEAMMATE, so a ten-player roster produced nine
# claimants: 466 of 840 entries fell into `ambiguous` and the 40 reported as
# misrouted were only games with rosters small enough to leave one. Its synthetic
# test passed because it used two-player rosters - it confirmed the construction,
# not the logic.
#
# The claimant must now also be the SAME PERSON by name, using normName from
# scripts/lib/namespace-resolve.cjs. A duplicate profile shares a name ("Jordan
# singh Uppal" / "Jordan Uppal"); a teammate does not. The test is deliberately
# conservative - surnames must match exactly, first names must match or be a
# prefix of one another - because a false positive here names an innocent alias
# for repointing, which would move a real appearance off a real person's record.
#
# CORRECTED AGAIN 2026-09-05. The first apply run repointed EVERY foreign alias
# aimed at a player whose misrouted games all went to one claimant. That does not
# follow: one claimant holding all the misrouted games says nothing about WHICH
# alias carried WHICH game. William Warren (622098f3) had three foreign aliases -
# two carried the misrouted games, one carried 13 games PlayHQ credits to HIM.
# Repointing all three took 262 games down to 65 against a gp of 78.
#
# Games are now attributed to the alias that carried them: every game the player
# holds is walked, the roster id that resolves to them is found, and games are
# grouped by it. An alias is repointed ONLY when every game it carried is in the
# misrouted set. One credited game on it and it is HELD BACK, with the reason
# printed. Identity aliases remain excluded on top of that.
#
# NO RATIO FILTER. A player with 116 x entries and a player with 1 are the same
# bug at different scales, and no threshold separates a misroute from a genuine
# PlayHQ gap - only the per-game check does. The x-to-games ratio is reported as
# an observation and never used to decide anything.
#
# COST. It opens the player file of every candidate on every x game's team sheet.
# Cached by uuid, but this is the heaviest local scan in the repo. Entirely local:
# no API, no session, no rate limit.
#
# APPLY MODE WRITES players/aliases/*.json, which moves appearances between real
# people's records. It only touches an alias where ONE same-name claimant accounts
# for EVERY x entry on that player, and re-checks each entry against the file on
# disk before writing.
#
# IDENTITY ALIASES ARE NEVER TOUCHED. An alias whose key is a prefix of its target
# is the player's own id pointing at their own file. The first version listed those
# alongside foreign ones under a heading saying "to repoint" - for Jordan Uppal it
# printed "8a30488e-5554 -> 296747c1", his own id aimed at a stranger. Acting on
# that list unfiltered would have destroyed the record the repair was meant to fix.
# They are now listed separately, excluded, and the exclusion is re-checked at
# write time.
#
# VERIFIED END TO END 2026-09-05 on the case that prompted it. Repointing
# 88f43f9d-ddb4 from 8a30488e to 296747c1 and rebuilding took Jordan singh Uppal
# from 150 games to exactly 34 - matching the gp of 34 PlayHQ reports - with none
# of the 116 x games left and none of the 34 survivors on the other profile.
#
# Full checkout, never sparse.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report-only = scan and report, nothing written. apply = repoint the foreign aliases it names.'
        required: true
        default: report-only
        type: choice
        options:
          - report-only
          - apply
      players:
        description: 'How many players carrying x to examine. 0 = every one of them (required for a repair pass).'
        required: false
        default: '400'
        type: string
      seed:
        description: 'Sampling seed - the same seed draws the same players'
        required: false
        default: '20260905'
        type: string
      commit:
        description: 'Commit the report, or run and print only'
        required: false
        default: 'commit'
        type: choice
        options:
          - commit
          - print-only

# data-write, because apply mode writes players/aliases/*.json and must not race
# the nightly, the fold or the matrix.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (full, never sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Syntax check
        run: node --check scripts/find-misrouted-appearances.js

      # Inputs go through env, never straight into the command line. An input
      # interpolated into a run: block is substituted by GitHub BEFORE bash sees
      # it, so anything in it becomes shell source text.
      - name: Find
        env:
          IN_MODE:    ${{ inputs.mode }}
          IN_PLAYERS: ${{ inputs.players }}
          IN_SEED:    ${{ inputs.seed }}
          IN_COMMIT:  ${{ inputs.commit }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ "$IN_COMMIT" = "print-only" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$IN_MODE" = "apply" ]; then FLAGS="$FLAGS --apply"; fi
          node scripts/find-misrouted-appearances.js \
            "--players=$IN_PLAYERS" \
            "--seed=$IN_SEED" \
            $FLAGS

      - name: How to read it
        if: always()
        run: |
          echo "Report: reports/misrouted-appearances.json"
          echo ""
          echo "MISROUTED     another profile holds the game AND PlayHQ credits it to"
          echo "              them. The appearance is on the wrong player's record."
          echo "genuine gap   nobody is credited with the game. PlayHQ has the player"
          echo "              in its own box score and counts it for no one."
          echo "ambiguous     more than one same-name candidate is credited. Not acted on."
          echo ""
          echo "The genuine-gap line is split three ways by whether PlayHQ's OWN box"
          echo "score has the player: 'in box' is the Toby Jovic condition - PlayHQ"
          echo "records the appearance and does not count it. 'no row' means named on"
          echo "the team sheet but not on the court. 'no box' is undecidable from files"
          echo "and is never counted as either."
          echo ""
          echo "PARTIAL claimants are listed in full and never repaired: one alias cannot"
          echo "explain a claimant that takes some but not all of a player's x games."
          echo ""
          echo "The 'alias entries to repoint' block names the file, the spectator id,"
          echo "its current target and the profile PlayHQ actually credits. Nothing is"
          echo "changed by this run - that list is the input to a repair, and the"
          echo "repair needs deciding separately."
