# .github/workflows/build-leaderboards.yml
#
# Leaderboard rebuild. Default (no inputs): full — all players, all seasons;
# run manually after major crawls or schema changes. With active_only: active
# seasons only — dispatched weekly by Build Finals Stats' chain-leaderboards
# job (fixtures sweep → finals → leaderboards, Tuesdays early AM AEST).
# (A previous header here claimed the nightly crawl called --active-only as
# its final step — it never did; the script was dispatch-only until the
# weekly chain was wired 2026-07-21.)

name: Build Leaderboards

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full rebuild (ignore resume progress). Default: resume.'
        required: false
        # 2026-07-31: was "'false'" — a STRING default on a \`type: boolean\` input.
        # Harmless here (the only consumer is a bash \`=\` compare, where it renders as
        # a string either way), but it is the same type-mismatch family as the gate
        # bugs of 07-21 and 07-30, so it is corrected rather than left as a trap for
        # whoever next adds an expression-context gate. Same fix already applied to
        # build-records.yml.
        default: false
        type: boolean
      active_only:
        description: 'Only process active (unlocked) seasons'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run — scan, verify and report, no writes or commits. Run this first after any change to single-game record verification.'
        required: false
        default: false
        type: boolean
      keep_unverified_records:
        description: 'Publish single-game records whose game cannot be checked (no gameKey, game not held, or no scoreline). OFF by default since 2026-10-15 — leaving it off is what keeps unverifiable entries off the Best Game PTS board. The run prints the count either way.'
        required: false
        default: false
        type: boolean

# Serialize against nightly-crawl / weekly-indexes / the discover reduce (2026-08-06).
# This workflow writes to the repo but held NO lock, so when the matrix terminal fanned
# it out it rewrote main underneath the still-running nightly: nightly-crawl's
# venue-indexes job finished its own work in 20 SECONDS and then spent 40 MINUTES stuck
# in fetch/merge/push against a repo three lockless writers were rewriting, until the
# job timeout killed it. The paths never conflicted — push contention on a 6 GB repo is
# path-agnostic, every push must merge the others' commits. cancel-in-progress stays
# false: queued, never killed.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Inputs reach bash through env:, never interpolated into run: (directive 13 / T27).
      - name: Run build-leaderboards
        env:
          FORCE:            ${{ inputs.force }}
          ACTIVE_ONLY:      ${{ inputs.active_only }}
          DRY_RUN:          ${{ inputs.dry_run }}
          KEEP_UNVERIFIED:  ${{ inputs.keep_unverified_records }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${FORCE:-false}" = "true" ];           then ARGS="$ARGS --force"; fi
          if [ "${ACTIVE_ONLY:-false}" = "true" ];     then ARGS="$ARGS --active-only"; fi
          if [ "${DRY_RUN:-false}" = "true" ];         then ARGS="$ARGS --dry-run"; fi
          if [ "${KEEP_UNVERIFIED:-false}" = "true" ]; then ARGS="$ARGS --keep-unverified-records"; fi
          echo "running: node scripts/build-leaderboards.js $ARGS"
          node scripts/build-leaderboards.js $ARGS
