# .github/workflows/validate-uncredited-games.yml
name: Validate uncredited games (x)

# READ-ONLY. No PlayHQ calls, no session, no rate limit. Reads players/ and
# games/bv, writes one report.
#
# sports.Basketball.x lists games we hold that PlayHQ's publicProfileStatistics
# does not credit. It is on 9% of players, about 80,000 games repo-wide, and
# StatTrack now badges every one of them NOT CREDITED. Before that label is
# trusted, an entry has to be shown to MEAN something, and there are two very
# different possibilities:
#
#   Named but did not play. p[] is the team sheet, hp/ap are the box-score rows.
#   A player can be on the first and not the second, and PlayHQ would be correct
#   not to credit a game they took no part in. `x` would be accurate but badly
#   labelled.
#
#   Or a PlayHQ undercount. Verified on one case 2026-09-05: Toby Jovic
#   (0afc7690), game c7a6db82, 02 Aug 2025 v MLBC B32 - PlayHQ's own box score
#   gives him 2 points and 3 fouls, and PlayHQ's own profile page skips that round
#   and totals the season at 14 games. Real game, real numbers, not counted.
#
# One case is one case. This decides which shape dominates, entirely from files:
# games/bv already stores the box-score sides as hp/ap, so whether the player has
# a row is on disk.
#
# ID MATCHING USES scripts/lib/uuid-prefix.cjs. Roster and box-score ids appear as
# full uuids, 13-char truncations and legacy 10-char prefixes, and resolveToFullUuid
# is the one implementation that handles the trunc-13 cross-namespace collisions.
# Three separate findings in this campaign went wrong by reimplementing matching.
#
# Full checkout, never sparse - it walks every player shard.
#
# Its own concurrency group, NOT data-write: it writes a single report and would
# otherwise hold the lock against the nightly for no reason.

on:
  workflow_dispatch:
    inputs:
      players:
        description: 'How many players carrying x to sample (600 takes a few minutes)'
        required: false
        default: '600'
        type: string
      seed:
        description: 'Sampling seed - the same seed draws the same players'
        required: false
        default: '20260905'
        type: string
      commit:
        description: 'Commit the report, or run and print only'
        required: false
        default: 'commit'
        type: choice
        options:
          - commit
          - print-only

concurrency:
  group: validate-uncredited-games
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full, never sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Syntax check
        run: node --check scripts/validate-uncredited-games.js

      # Inputs go through env, never straight into the command line. An input
      # interpolated into a run: block is substituted by GitHub BEFORE bash sees
      # it, so anything in it becomes shell source text.
      - name: Validate
        env:
          IN_PLAYERS: ${{ inputs.players }}
          IN_SEED:    ${{ inputs.seed }}
          IN_COMMIT:  ${{ inputs.commit }}
        run: |
          set -euo pipefail
          DRY=""
          if [ "$IN_COMMIT" = "print-only" ]; then DRY="--dry-run"; fi
          node scripts/validate-uncredited-games.js \
            "--players=$IN_PLAYERS" \
            "--seed=$IN_SEED" \
            $DRY

      - name: How to read it
        if: always()
        run: |
          echo "Report: reports/uncredited-games-validation.json"
          echo ""
          echo "The share of PLAYHQ UNDERCOUNT among the decidable entries is the answer."
          echo "  Above 80%  - PlayHQ's own box score has the player and its own career"
          echo "               totals leave the game out. The NOT CREDITED badge is right"
          echo "               and this is a systematic undercount on their side."
          echo "  Below 20%  - the players were named and did not take the court. `x` is"
          echo "               accurate but the label should say so instead."
          echo "  In between - both are present and the examples need reading one by one."
          echo ""
          echo "no box score stored / game in no season / no id resolved are NOT counted"
          echo "as either answer. They are undecidable from files and are reported apart"
          echo "so they cannot quietly inflate whichever conclusion is being drawn."
