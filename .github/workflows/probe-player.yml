# .github/workflows/probe-player.yml
name: Probe Player

# READ-ONLY single-player deep reconciliation (built 2026-08-07 on Mark's ask):
# fetch one player's full profile from the mobile API — the endpoint the app
# renders from, which can serve profiles the website's statistics view errors
# on — and print the complete ours-vs-theirs picture: every API game credit
# classified, per-season rollup, and what a targeted repair could recover.
# No writes, no git, no lock.
#
# 2026-08-14 (OUTSTANDING §2.16) — the classification was corrected. "Present in
# the roster under their OWN id" used to be reported as an alias/fold case, so
# every game a repair had appended on an earlier pass came back counted as a fold
# problem on the next run. Six verdicts now, and only two of them are work:
#   ok / alias-ok — already correct, nothing to do
#   lag           — in the roster, not yet in games[]; the weekly rebuild fixes it
#   roster-gap    — a repair can append this
#   alias-gap     — present under an UNRESOLVED id: fold work, never an append
#   uncaptured    — EMPTY roster: needs a capture sweep, and a repair will skip it
# The recovery estimate counts roster-gaps only, so it now matches what
# repair-players-batch would actually do rather than overstating it.
#
# The uuid is in the profile page URL (playhq.com/.../profile/<uuid>) or in
# StatTrack's player link.
#
# NO setup-node (this job fetches api.playhq.com — absolute rule).

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: 'Player uuid (from the profile URL or StatTrack)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe
        run: node scripts/probe-player.js --uuid="${{ inputs.uuid }}"
