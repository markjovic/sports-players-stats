/* ── Opposition ── */
// Season head-to-head vs a team, from data already fetched when the view
// opens: both teams' fixtures live in team-stats/{sid} (each entry carries
// gameId + result FROM THAT TEAM'S PERSPECTIVE — the same fields that draw the
// team page's Fixtures tab), and the player's own games[] is in his cached
// file. Meetings = gameIds present in BOTH teams' fixture lists; the result is
// read off MY team's entry. played = meetings restricted to games[] (he was on
// court). Zero fetches; per-season tid, so no cross-season name-merging.
function seasonH2H(td,myTids,oppTid,myGameSet){
  const oppIds=new Set((td?.[oppTid]?.fixtures||[]).map(f=>f.gameId).filter(Boolean));
  if(!oppIds.size)return null;
  const team={w:0,l:0,d:0,n:0},played={w:0,l:0,d:0,n:0};
  for(const mt of myTids){
    if(mt===oppTid)continue;
    for(const f of(td?.[mt]?.fixtures||[])){
      if(!f.gameId||!oppIds.has(f.gameId))continue;
      const r=f.result;
      if(r!=='W'&&r!=='L'&&r!=='D')continue;   // upcoming/unscored meetings don't count
      team.n++;team[r.toLowerCase()]++;
      if(myGameSet.has(f.gameId)){played.n++;played[r.toLowerCase()]++;}
    }
  }
  return team.n?{team,played}:null;
}
function h2hLine(h){
  if(!h)return'';
  const f=(r)=>[r.w?`<span style="color:var(--win)">${r.w}W</span>`:'',r.l?`<span style="color:var(--loss)">${r.l}L</span>`:'',r.d?`<span style="color:var(--draw)">${r.d}D</span>`:''].filter(Boolean).join(' ');
  const p=h.played,tm=h.team;
  let inner;
  if(p.n){
    inner=`This season: ${f(p)} <span style="color:var(--text3)">(${p.n} meeting${p.n>1?'s':''} played`+(tm.n>p.n?`; team ${f(tm)} overall`:'')+`)</span>`;
  }else{
    inner=`This season: <span style="color:var(--text3)">didn't play in the ${tm.n} meeting${tm.n>1?'s':''} — team went</span> ${f(tm)}`;
  }
  return`<div class="oh2h" style="padding:8px 14px;font-size:0.78rem;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums">${inner}</div>`;
}
// gameId -> [tids] across every team's fixtures in the season. The fixtures
// tab needs the OPPONENT'S IDENTITY per row, and fixture entries carry only
// oppName — a display string two teams can share — so the join is by gameId
// (each game appears in exactly two teams' fixture lists), never by name.
function gameTidMap(td){
  const m=new Map();
  for(const[tid,team]of Object.entries(td||{})){
    for(const f of(team?.fixtures||[])){
      if(!f.gameId)continue;
      if(!m.has(f.gameId))m.set(f.gameId,[]);
      m.get(f.gameId).push(tid);
    }
  }
  return m;
}
// Per fixture row: this team's record in COMPLETED meetings against the same
// opponent STRICTLY BEFORE this fixture's date (falls back to excluding only
// the row itself when dates are absent). 'Prior' rather than season-to-date so
// a played row never counts itself in its own context line.
function fixturePriors(td,myTid){
  const gm=gameTidMap(td);
  const mine=(td?.[myTid]?.fixtures||[]).filter(f=>f.gameId);
  const oppOf=f=>(gm.get(f.gameId)||[]).find(x=>x!==myTid)||null;
  const out=new Map();
  for(const f of mine){
    const opp=oppOf(f);
    if(!opp)continue;
    const p={w:0,l:0,d:0,n:0};
    for(const g of mine){
      if(g.gameId===f.gameId||oppOf(g)!==opp)continue;
      const r=g.result;
      if(r!=='W'&&r!=='L'&&r!=='D')continue;
      if(f.date&&g.date&&!(g.date<f.date))continue;   // strictly earlier when dated
      p.n++;p[r.toLowerCase()]++;
    }
    out.set(f.gameId,p);
  }
  return out;
}
function wldChips(r){
  return[r.w?`<span style="color:var(--win)">${r.w}W</span>`:'',r.l?`<span style="color:var(--loss)">${r.l}L</span>`:'',r.d?`<span style="color:var(--draw)">${r.d}D</span>`:''].filter(Boolean).join(' ');
}

async function loadPlayerFile(uuid){

  if(d){ S.players[key]=d; if(key!==uuid) S.players[uuid]=d; }
  return d||null;
}
function getTidForSeason(player,sid){
  for(const sn of player?.seasons||[]){
    if(sn.sid===sid)return sn.regs?.[0]?.tid??null;

function getTidsForSeason(player,sid){
  for(const sn of player?.seasons||[]){
    if(sn.sid===sid)return new Set((sn.regs||[]).map(r=>r.tid).filter(Boolean));
  }
  return new Set();
}
function getTidForGame(player,sid,gameId){
  // Use gameTids map (written by fetch-profile-stats from API) when available.
  // Correctly resolves ambiguous players registered to multiple teams same season.
  if(player?.gameTids&&gameId&&player.gameTids[gameId])return player.gameTids[gameId];
  return getTidForSeason(player,sid);
}
async function resolveOppGames(r,myGameSet){
  const{opp,shared,fromUuid,oppTid,myPlayer}=r;
  if(!shared.length)return[];
  // Build gid→sid map from already-cached game files (.games subkey)
  const gidSid={};
  for(const[sid,gf]of Object.entries(S.games||{})){
    for(const gid of Object.keys(gf?.games||{}))gidSid[gid]=sid;
  }
  // For shared gids not yet mapped, load game files lazily
  const unmapped=shared.filter(gid=>!gidSid[gid]);
  if(unmapped.length){
    const sids=[...new Set((myPlayer?.seasons||[]).map(sn=>sn.sid).filter(Boolean))];
    for(const sid of sids){
      if(!unmapped.length)break;
      if(!S.games[sid])S.games[sid]=await sgj('games/bv',sid)||{games:{}};
      for(const gid of Object.keys(S.games[sid]?.games||{})){
        if(unmapped.includes(gid))gidSid[gid]=sid;
      }
      unmapped.splice(0,unmapped.length,...unmapped.filter(gid=>!gidSid[gid]));
    }
  }
  // Verify opposing sides and collect game details
  const verified=[];
  for(const gid of shared){
    const sid=gidSid[gid];
    if(!sid)continue;
    const g=S.games[sid]?.games?.[gid];
    if(!g)continue;
    const myTid=getTidForGame(myPlayer,sid,gid);
    const oppTidInGame=getTidForGame(opp,sid,gid);
    if(!myTid||!oppTidInGame)continue;
    // Also accept if teams are on correct sides (handles cases where gameTids not available)
    // Every one of these tests was false on a hidden game, so it was dropped from
    // the head-to-head record entirely.
    const _mh=hTid(g),_ma=aTid(g);
    const validExact=(_mh===myTid&&_ma===oppTidInGame)||(_ma===myTid&&_mh===oppTidInGame);
    // Fallback: accept if myTid and oppTidInGame are both in this game on opposite sides
    const myInGame=(_mh===myTid||_ma===myTid);
    const oppInGame=(_mh===oppTidInGame||_ma===oppTidInGame);
    const valid=validExact||(myInGame&&oppInGame&&myTid!==oppTidInGame);
    if(valid)verified.push({gid,sid,g});
  }
  verified.sort((a,b)=>(b.g.d||'').localeCompare(a.g.d||''));
  return verified;
}

       </tr></thead><tbody id="opp-squad-body">
       ${Object.entries(oppTeam.roster).sort(([,a],[,b])=>(b.pts||0)-(a.pts||0)).map(([u,pr])=>rosterRows(u,pr)).join('')}
       </tbody></table></div>`
    : `<div class="osec">${esc(oppName)} \u00b7 squad</div><div class="empty">No roster data</div>`;
  ve.innerHTML=`<div class="vhdr">${backBtn}<div><div class="vtitle">${esc(myName)} vs ${esc(oppName)}</div><div class="vsub">${esc(subtitle)}</div></div></div>${th2hH}<div id="opp-roster"></div>${oppTbl}`;
  hydrateCareers(oppRoster);
  // Load all player files for both rosters

  // Build opp game sets

  }
  // Render my roster with progressive encounter resolution
  const rosterEl=document.getElementById('opp-roster');
  if(!rosterEl)return;
  let rh='';
  const resolvers=[];
  for(let i=0;i<myRoster.length;i++){

      const row=document.getElementById(r.rowId);
      if(!row)return;
      // Per-opponent row count — used ONLY to decide whether anything was found.
      // The displayed total comes from the deduped list below: a game in which
      // three opposition players featured is ONE game, and summing the per-opponent

      const totalRaw=result.reduce((s,e)=>s+e.games.length,0);

        // Carry the opponent's uuid with each game. When our own player is not in

        // ⚠️ ONE GAME, COUNTED ONCE. This was flatMap over the per-opponent lists, so
        // a game in which THREE opposition players featured appeared THREE TIMES and

        // ⚠️ THE GAME ID IS ON THE ENTRY, NOT INSIDE g. resolveOppGames pushes
        // {gid, sid, g} — the gid is the key of the games map, never a field of the
        // game object. Deduping on x.g.id dropped EVERY row (undefined key) and the
        // W/L chips disappeared entirely at v1.09.
        const seenGid=new Set();
        const allGames=result.flatMap(e=>e.games.map(x=>({...x,oppUuid:e.oppUuid})))
          .filter(x=>{ const k=x.gid; if(!k||seenGid.has(k))return false; seenGid.add(k); return true; });
        const myTidFn=(sid,gid)=>getTidForGame(S.players[r.uuid],sid,gid);
        const wld=wldSummary(allGames,r.uuid,myTidFn);
        const total=allGames.length;
        if(enc)enc.outerHTML=`<span style="display:flex;align-items:center;flex-shrink:0"><span class="ocol-wld">${wld}</span><span class="oenc ocol-enc">${total}G vs ${nOpp}P</span></span>`;
        row.style.cursor='pointer';
        row.onclick=()=>toggleTeamOppDetail(row,result,r.uuid);
      }
    });
  }
}
async function resolveTeamOppGames(r){
  const{myP,encounters}=r;
  const results=[];
  for(const{oppUuid,shared}of encounters){
    const opp=S.players[oppUuid];
    const fakeR={opp,shared,fromUuid:r.uuid,myPlayer:myP};
    const games=await resolveOppGames(fakeR,new Set(myP?.games||[]));
    if(games.length)results.push({oppUuid,opp,games});
  }
  return results;
}
function getPlayerGameStats(g, uuid) {
  // Returns {pts, fg, ft, tp, fouls} for a player from box score data if available
  const sides = [g.hp||[], g.ap||[]];
  for (const side of sides) {
    const p = side.find(p => matchP(p.profileID, uuid));
    if (p) return { pts: p.pts??'', fouls: p.fouls??'' };
  }
  return null;
}

function wldSummary(games, myUuid, myTidFn) { // myTidFn(sid,gameId)
  let w = 0, l = 0, d = 0;
  for (const { g, sid, gid, oppUuid } of games) {
    // ⚠️ `gid`, NOT `g.id`. The game id lives on the entry; g has no id field. This
    // was passing undefined into getTidForGame, which therefore never matched a
    // gameTids entry and fell back to getTidForSeason — ONE team for the whole
    // season, frequently the wrong one for this game, and the result was read from
    // the wrong end. That is the inversion, and it had nothing to do with the
    // transport, the box score or the roster.
    let myTid = myTidFn ? myTidFn(sid, gid) : hTid(g);
    // ⚠️ 2026-10-01 — gameCtx FALLS THROUGH TO THE HOME SIDE when the tid matches
    // neither team (its last line returns myS:g.hs). So any game where the team
    // lookup failed was scored from the HOME end regardless of which side the
    // player was on, inverting every away result. Shaarav Gupta read 3W 8L where
    // the same eleven games give 8W 3L.
    // The box score knows the answer when the tid does not: find the player in
    // hp[]/ap[] and take the side he is actually listed on.
    // ⚠️ THE BOX SCORE WINS. getTidForGame falls back to getTidForSeason, which
    // returns ONE team for the season — so a player registered to more than one
    // team can be handed the tid of the team he was NOT playing for in this game,
    // including the opponent's. That passes the "is this a real tid" test and the
    // game is then scored from the wrong end. An earlier fix only consulted the
    // box score when the tid matched NEITHER side, which left that case inverted.
    // hp[]/ap[] is the record of who actually took the court, so it decides.
    // Our player, if the box score names him.
    if ((g.hp||[]).some(p=>matchP(p.profileID,myUuid)))      myTid = hTid(g);
    else if ((g.ap||[]).some(p=>matchP(p.profileID,myUuid))) myTid = aTid(g);
    // Otherwise the OPPONENT decides it: he is in this game by definition — that is
    // why it is in this list — so whichever side he is on, ours is the other. This
    // is the empirical answer and it needs no tid lookup, which is what kept getting
    // it wrong: getTidForGame falls back to one team for the whole season and can
    // hand back the other side's id entirely.
    else if (oppUuid) {
      if ((g.hp||[]).some(p=>matchP(p.profileID,oppUuid)))      myTid = aTid(g);
      else if ((g.ap||[]).some(p=>matchP(p.profileID,oppUuid))) myTid = hTid(g);
    }
    const ctx = gameCtx(g, myTid);
    // Skip unscored games (0-0 with no stats — typically unscored junior games)
    if (ctx.myS === 0 && ctx.oppS === 0 && !g.hp?.length && !g.ap?.length) continue;
    const r = resLetter(ctx.myS, ctx.oppS);
    if (r === 'W') w++;
    else if (r === 'L') l++;
    else if (ctx.myS != null) d++;
  }
  if (!w && !l && !d) return '';
  const parts = [];
  if (w) parts.push(`<span style="color:var(--win)">${w}W</span>`);
  if (l) parts.push(`<span style="color:var(--loss)">${l}L</span>`);
  if (d) parts.push(`<span style="color:var(--draw)">${d}D</span>`);
  return `<span style="font-size:0.7rem;display:flex;gap:4px;flex-shrink:0">${parts.join('')}</span>`;
}

function toggleTeamOppDetail(row, result, myUuid) {
  let detail = row.nextElementSibling;
  if (detail && detail.classList.contains('opp-detail')) {
    detail.classList.toggle('hidden');
    row.classList.toggle('expanded');
    return;
  }
  row.classList.add('expanded');
  const detailEl = document.createElement('div');
  detailEl.className = 'opp-detail';

  for (let ri = 0; ri < result.length; ri++) {
    const { opp, games, oppUuid } = result[ri];
    const oppRow = document.createElement('div');
    oppRow.className = 'opp-opp-row';
    const gameDetailId = `opp-games-${row.id}-${ri}`;
    const myTidFn = (sid,gid) => getTidForGame(S.players[myUuid],sid,gid);
    const wld = wldSummary(games, myUuid, myTidFn);
    oppRow.innerHTML = `<span class="opp-opp-name">${esc(opp?.name||'#'+oppUuid.slice(0,8))}</span><span class="ocol-wld">${wld}</span><span class="opp-opp-enc ocol-enc">${games.length}G</span>`;

    const gameDetail = document.createElement('div');
    gameDetail.className = 'opp-game-detail hidden';
    gameDetail.id = gameDetailId;

    for (const { gid, sid, g } of games) {
      // ⚠️ `gid`, NOT `g.id` — the id is on the entry, g has no id field. This passed
      // undefined, so getTidForGame never matched a gameTids entry, fell back to the
      // season's team, and `myTid || hTid(g)` then defaulted to the HOME side. Every
      // away game in this list was shown from the opponent's end. Same bug as
      // wldSummary; this site was missed when that one was fixed.
      let myTid = getTidForGame(S.players[myUuid],sid,gid);
      // The box score is the authority when it names either player.
      if ((g.hp||[]).some(p=>matchP(p.profileID,myUuid)))       myTid = hTid(g);
      else if ((g.ap||[]).some(p=>matchP(p.profileID,myUuid)))  myTid = aTid(g);
      else if ((g.hp||[]).some(p=>matchP(p.profileID,oppUuid))) myTid = aTid(g);
      else if ((g.ap||[]).some(p=>matchP(p.profileID,oppUuid))) myTid = hTid(g);
      const ctx = gameCtx(g, myTid || hTid(g));
      const score = ctx.myS != null ? `${ctx.myS}–${ctx.oppS}` : '—';
      const res = resLetter(ctx.myS, ctx.oppS);
      const resColor = res === 'W' ? 'var(--win)' : res === 'L' ? 'var(--loss)' : 'var(--text2)';
      const myStats = getPlayerGameStats(g, myUuid);
      const oppStats = getPlayerGameStats(g, oppUuid);
      const myStr = myStats ? `${myStats.pts}pts ${myStats.fouls}f` : '';
      const oppStr = oppStats ? `${oppStats.pts}pts ${oppStats.fouls}f` : '';
      const fc = finalClass(g.rn);
      // ⚠️ UNIQUE PER OPPONENT. This was `opp-gstats-${gid}` and the same game
      // appears under EVERY opponent who played in it, so the id existed two or
      // three times in the DOM. getElementById updates the first only — every other
      // copy sat on "Loading…" for ever.
      const statsSpanId = `opp-gstats-${gid}-${ri}`;
      const gameRow = document.createElement('div');
      gameRow.className = 'opp-game-row';
      // There was no way to reach the game from here, so nothing on this screen
      // could be checked against the box score.
      gameRow.style.cursor = 'pointer';
      gameRow.title = 'Open the box score';
      gameRow.addEventListener('click', (ev) => { ev.stopPropagation(); openSheet(gid, sid); });
      gameRow.innerHTML = `
        <span class="opp-game-date">${esc(g.d?.slice(0,10)||'')}</span>
        <span class="opp-game-grade">${esc(g.gn||'')}${fc?` <span style="color:gold;font-size:0.65rem">${esc(g.rn)}</span>`:''}</span>
        <span class="opp-game-score">${esc(score)}</span>
        <span class="opp-game-res" style="color:${resColor}">${res}</span>
        <span class="opp-game-stats" id="${statsSpanId}">${myStr?`Me: ${myStr}`:''}${myStr&&oppStr?' · ':''}${oppStr?`Them: ${oppStr}`:''}${!myStr&&!oppStr?'Loading…':''}</span>`;

      // Fetch box score and update stats span if not already in game file
      if (!myStr && !oppStr) {
        fetchBox(gid).then(bs => {
          if (!bs) {
            const sp = document.getElementById(statsSpanId);
            if (sp) sp.textContent = '';
            return;
          }
          const allP = [...(bs.h||[]), ...(bs.a||[])];
          const myBs  = allP.find(p => matchP(p.profileID, myUuid));
          const oppBs = allP.find(p => matchP(p.profileID, oppUuid));
          const myS2  = myBs  ? `${myBs.pts??''}pts ${myBs.fouls??''}f`  : '';
          const oppS2 = oppBs ? `${oppBs.pts??''}pts ${oppBs.fouls??''}f` : '';
          const sp = document.getElementById(statsSpanId);
          if (sp) sp.textContent = `${myS2?`Me: ${myS2}`:''}${myS2&&oppS2?' · ':''}${oppS2?`Them: ${oppS2}`:''}`;
        }).catch(() => {
          // A rejected fetch left the placeholder in place indefinitely.
          const sp = document.getElementById(statsSpanId);
          if (sp) sp.textContent = '';
        });
      }
      gameDetail.appendChild(gameRow);
    }

    oppRow.onclick = () => { gameDetail.classList.toggle('hidden'); oppRow.classList.toggle('expanded'); };
    detailEl.appendChild(oppRow);
    detailEl.appendChild(gameDetail);
  }

  row.after(detailEl);
}


async function buildLBSeasonPicker(){
  if(!S.idx)return;
  const nm=new Map(); // name → {name,active,sids:[]}
  S.lbSeasonMap={};  // name → [sid,...]
  for(const s of Object.values(S.idx.seasons)){

// Mirrors the exact per-category inclusion rule build-leaderboards.js used to
// apply server-side before season files carried pre-sorted arrays. Returns the
// stat value for this player, or null if this player shouldn't appear in this
// category at all (matches old server behaviour exactly: pts/gp/threePt/fouls/
// ppg require only the right type; the *PG and finals/gfApps/gfWins/wins/
// losses/draws categories require >0; winPct/lossPct require gp>=10 AND a
// non-zero wins+losses+draws total).
function statValueForPlayer(m,stat){
  const gp=m.gp||0;
  switch(stat){
    case 'pts':       return typeof m.pts==='number'?m.pts:null;
    case 'gp':        return typeof m.gp==='number'?m.gp:null;
    case 'threePt':   return typeof m.threePt==='number'?m.threePt:null;
    case 'fouls':     return typeof m.fouls==='number'?m.fouls:null;
    case 'ppg':       return typeof m.pts==='number'&&gp>0?Math.round((m.pts/gp)*10)/10:null;
    case 'threePtPG': return (m.threePtPG||0)>0?m.threePtPG:null;
    case 'foulsPG':   return (m.foulsPG||0)>0?m.foulsPG:null;
    case 'foulOuts':  return (m.foulOuts||0)>0?m.foulOuts:null;
    case 'foulOutsPG':return (m.foulOutsPG||0)>0?m.foulOutsPG:null;
    case 'finals':    return (m.finals||0)>0?m.finals:null;
    case 'gfApps':    return (m.gfApps||0)>0?m.gfApps:null;
    case 'gfWins':    return (m.gfWins||0)>0?m.gfWins:null;
    case 'wins':      return (m.wins||0)>0?m.wins:null;
    case 'losses':    return (m.losses||0)>0?m.losses:null;
    case 'draws':     return (m.draws||0)>0?m.draws:null;
    // winPct/lossPct gate on DECIDED games (w+l+d), not PlayHQ's gp. gp counts
    // appearances including games we hold no result for, so a 10-of-50 player
    // all-wins passed a gp>=10 gate on games that never entered the maths.
    case 'winPct': {
      const total=(m.wins||0)+(m.losses||0)+(m.draws||0);
      if(total<10)return null;
      return Math.round((m.wins||0)/total*100);
    }
    case 'lossPct': {
      const total=(m.wins||0)+(m.losses||0)+(m.draws||0);
      if(total<10)return null;
      return Math.round((m.losses||0)/total*100);
    }
    default: return null;
  }
}
// Replaces denormSeason(data) — season files now ship ONLY the raw players map
// (no pre-sorted per-category arrays). Computes the display-ready entry list
// for exactly ONE stat, on demand, from that raw map.
function seasonEntriesForStat(playersMap,stat){
  const out=[];
  for(const[id,m]of Object.entries(playersMap||{})){
    const uuid=id.split('|')[0];
    // Guard: must look like a uuid OR a uuid PREFIX. Corrected 2026-08-01 — this
    // required length>=32, but build-leaderboards.js writes the season key as
    // `${truncateUuid(uuid)}|${tid}` and TRUNC_LEN is 13 (10 before 2026-07-31).
    // Every entry therefore failed the guard and EVERY season leaderboard rendered
    // EMPTY — silently, because `data` still had one key so the 'no data' branch
    // never fired. all-time was unaffected: it does not pass through this function.
    if(!uuid||!/^[0-9a-f]{8}-[0-9a-f-]{0,27}$/i.test(uuid))continue;
    const v=statValueForPlayer(m,stat);
    if(v===null)continue;
    out.push({uuid,name:m.n||null,club:m.club||null,team:m.team||'',
           org:m.org||'',comp:m.comp||'',grade:m.grade||'',
           age:m.age||'',gender:m.gender||'',
           // For winPct/lossPct the minimum-games filter (and the displayed GP)
           // must be the DECIDED games the percentage was computed from, not
           // PlayHQ's appearance count. Every other stat keeps career gp.
           gp:(stat==='winPct'||stat==='lossPct')?((m.wins||0)+(m.losses||0)+(m.draws||0)):(m.gp||0),
           foulOuts:m.foulOuts||0,foulOutsPG:m.foulOutsPG||0,
           threePtPG:m.threePtPG||0,foulsPG:m.foulsPG||0,
           finals:m.finals||0,gfApps:m.gfApps||0,gfWins:m.gfWins||0,
           v});
  }
  return out;
}
async function loadLB(){
  const ve=el('view-leaders');
  if(el('lb-results'))el('lb-results').innerHTML='<div class="load-row">Loading…</div>';else ve.innerHTML='<div class="load-row">Loading…</div>';
  const scope=el('lb-season').value;
  S.lbScope=scope;
  let data;
  if(scope==='all'){
    if(!S.lbData['all'])S.lbData['all']=await gj(BASE+'/leaderboard/all-time.json');
    data=S.lbData['all'];
  }else{
    // scope is a season name — fetch ALL sids with that name and merge
    const sids=(S.lbSeasonMap||{})[scope]||[];
    if(!S.lbRaw)S.lbRaw={};
    const parts=await Promise.all(sids.map(async sid=>{
      if(!S.lbRaw[sid]){
        const raw=await sgj('leaderboard/season',sid);
        S.lbRaw[sid]=(raw&&raw.players)||{};
      }
      // Compute per-sid first, then concatenate below — NOT a merge-by-id
      // across sids. Object-merging raw maps here would silently drop an
      // entry on any uuid|tid collision between two same-named sids; per-sid
      // arrays concatenated afterward can never lose data that way (matches
      // the original array-concat behaviour exactly).
      return seasonEntriesForStat(S.lbRaw[sid],S.lbStat);
    }));
    data={[S.lbStat]:parts.flat()};
    S.lbData[scope]=data;
  }
  if(!data||!Object.keys(data).length){(el('lb-results')||ve).innerHTML='<div class="empty">No leaderboard data available.</div>';return;}
  // Show/hide season filters
  const isAll=scope==='all';
  document.querySelectorAll('.lb-per-season').forEach(e=>e.classList.toggle('hidden',isAll));
  el('view-leaders')?.querySelectorAll('.lb-alltime-only').forEach(b=>b.classList.toggle('hidden',!isAll));

  const entries=(data[S.lbStat]||[]).slice();
  // Populate filters
  {
    const allEntries4filter=entries;
    const orgs=[...new Set(allEntries4filter.map(e=>e.org).filter(Boolean))].sort();
    const comps=[...new Set(allEntries4filter.map(e=>e.comp).filter(Boolean))].sort();
    const grades=[...new Set(allEntries4filter.map(e=>e.grade).filter(Boolean))].sort();
    const ages=[...new Set(allEntries4filter.map(e=>e.age).filter(Boolean))].sort();
    const genders=[...new Set(allEntries4filter.map(e=>e.gender).filter(Boolean))].sort();
    const oSel=el('lb-org'),cSel=el('lb-comp'),gSel=el('lb-grade'),aSel=el('lb-age'),gnSel=el('lb-gender');
    const oVal=oSel.value,cVal=cSel.value,gVal=gSel.value,aVal=aSel.value,gnVal=gnSel.value;
    oSel.innerHTML='<option value="">All orgs</option>'+orgs.map(o=>`<option value="${esc(o)}"${o===oVal?' selected':''}>${esc(o)}</option>`).join('');
    cSel.innerHTML='<option value="">All comps</option>'+comps.map(c=>`<option value="${esc(c)}"${c===cVal?' selected':''}>${esc(c)}</option>`).join('');
    gSel.innerHTML='<option value="">All grades</option>'+grades.map(g=>`<option${g===gVal?' selected':''}>${esc(g)}</option>`).join('');
    aSel.innerHTML='<option value="">All ages</option>'+ages.map(a=>`<option${a===aVal?' selected':''}>${esc(a)}</option>`).join('');
    const genderLabel=g=>g==='Male'?'M':g==='Female'?'F':g==='Boys'?'Boys':g==='Girls'?'Girls':esc(g);
    gnSel.innerHTML='<option value="">All</option>'+genders.map(g=>`<option value="${esc(g)}"${g===gnVal?' selected':''}>${genderLabel(g)}</option>`).join('');
  }
  renderLB(entries,data);
}
function renderLB(allEntries,data){
  const scope=el('lb-season')?.value||'all';
  let entries=[...allEntries];

  if(org)entries=entries.filter(e=>e.org===org);
  if(gender)entries=entries.filter(e=>e.gender===gender);
  if(age)entries=entries.filter(e=>e.age===age);
  if(scope!=='all'){
    if(comp)entries=entries.filter(e=>e.comp===comp);
    // Cascade: rebuild grade options from age-filtered result
    const gradeSel=el('lb-grade');
    if(gradeSel){
      const availGrades=[...new Set(entries.map(e=>e.grade).filter(Boolean))].sort();

      if(curGrade&&!availGrades.includes(curGrade))gradeSel.value='';
    }

    if(grade)entries=entries.filter(e=>e.grade===grade);

  // Min GP filter — applies to all per-game rate stats
  if(['ppg','threePtPG','foulsPG','foulOutsPG','finalsPerSeason','winPct','lossPct'].includes(S.lbStat)){
    const minGP=parseInt(el('lb-mingp')?.value||'10');
    entries=entries.filter(e=>(e.gp||0)>=minGP);

  // Sort by v descending (data already sorted but re-sort after filter) (data already sorted but re-sort after filter)
  entries.sort((a,b)=>b.v-a.v);
  const ve=el('lb-results');
  const statLbl={'pts':'PTS','ppg':'PPG','gp':'GP','threePt':'3PT','threePtPG':'3PT/G','fouls':'F','foulsPG':'F/G','foulOuts':'Foul-outs','foulOutsPG':'FO/G','finals':'Finals','gfApps':'GF Apps','gfWins':'GF Wins','finalsPerSeason':'Finals/Ssn','maxGamePTS':'Best Game PTS','maxGameThreePt':'Best Game 3PT','wins':'Wins','losses':'Losses','draws':'Draws','winPct':'Win%'}[S.lbStat]||S.lbStat;
  const scopeName=scope==='all'?'All-time':el('lb-season')?.querySelector(`option[value="${scope}"]`)?.textContent||scope;
  if(!entries.length){(el('lb-results')||el('view-leaders')).innerHTML=`<div class="empty">No entries match the current filters.</div>`;return;}
  ve.innerHTML=`<div style="padding:8px 14px;font-size:0.75rem;color:var(--text2)">${esc(statLbl)} — ${entries.length} player${entries.length!==1?'s':''}</div>`+
    entries.slice(0,200).map((e,i)=>{
      const sub=[e.club,e.grade].filter(Boolean).join(' \u00b7 ');
      const gpInfo=e.gp?`<div class="lb-gp">${e.gp} GP</div>`:'';
      const dispVal=S.lbStat==='winPct'?e.v+'%':typeof e.v==='number'?e.v.toLocaleString('en-AU',{maximumFractionDigits:1}):e.v;
      return`<div class="lb-row" data-uuid="${esc(e.uuid)}">
        <div class="lb-rank">${i+1}</div>
        <div><div class="lb-name">${esc(displayName(e,e.uuid))}</div><div class="lb-club">${esc(sub)}</div></div>
        <div>${gpInfo}<div class="lb-val">${dispVal}</div></div>
      </div>`;
    }).join('');
  ve.querySelectorAll('.lb-row[data-uuid]').forEach(r=>r.addEventListener('click',()=>loadPlayer(r.dataset.uuid)));

// Shared game row builder used by both expanded rows and search detail
function buildGameRow(gid, sid, g, myUuid2, oppUuid2) {
  const myTid2 = getTidForGame(S.players[myUuid2],sid,g?.id);
  const ctx2 = gameCtx(g, myTid2 || hTid(g));
  const score2 = ctx2.myS != null ? `${ctx2.myS}\u2013${ctx2.oppS}` : '\u2014';
  const res2 = resLetter(ctx2.myS, ctx2.oppS);
  const resColor2 = res2 === 'W' ? 'var(--win)' : res2 === 'L' ? 'var(--loss)' : 'var(--text2)';
  const fc2 = finalClass(g.rn);
  const statsId2 = 'ogsr-' + gid + '-' + myUuid2.slice(0,4);
  const[_h2n,_a2n]=teamNames(g);
  const myTN = myTid2 === hTid(g) ? _h2n : _a2n;
  const oppTN = myTid2 === hTid(g) ? _a2n : _h2n;
  const row2 = document.createElement('div');
  row2.className = 'opp-game-row';
  row2.style.cssText = 'flex-wrap:nowrap;overflow:hidden;gap:8px';
  row2.innerHTML = `
    <span class="opp-game-date" style="flex-shrink:0">${esc(g.d?.slice(0,10)||'')}</span>
    <span style="flex-shrink:0;font-size:0.72rem;color:var(--text2)">${esc(g.rn||'')}</span>
    <span class="opp-game-grade" style="flex-shrink:0">${esc(g.gn||'')}${fc2?` <span style="color:gold;font-size:0.65rem">${esc(g.rn)}</span>`:''}</span>
    ${myTN||oppTN?`<span style="font-size:0.7rem;color:var(--text2);flex-shrink:0;white-space:nowrap">${esc(myTN)} <span style="color:var(--text3)">vs</span> ${esc(oppTN)}</span>`:''}
    ${g.vn?`<span style="color:var(--text3);font-size:0.68rem;flex-shrink:0;white-space:nowrap">${esc(g.vn)}</span>`:''}
    <span class="opp-game-score" style="flex-shrink:0">${esc(score2)}</span>
    <span class="opp-game-res" style="color:${resColor2};flex-shrink:0">${res2}</span>
    <span class="opp-game-stats" id="${statsId2}" style="flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Loading\u2026</span>`;
  row2.onclick = () => openSheet(gid, sid);
  fetchBox(gid).then(bs => {
    const sp = document.getElementById(statsId2);
    if (!sp) return;
    if (!bs) { sp.textContent = ''; return; }
    const allP2 = [...(bs.h||[]), ...(bs.a||[])];
    const myBs2  = allP2.find(p => matchP(p.profileID, myUuid2));
    const oppBs2 = allP2.find(p => matchP(p.profileID, oppUuid2));
    const myS3  = myBs2  ? `${myBs2.pts??''}pts ${myBs2.fouls??''}f` : '';
    const oppS3 = oppBs2 ? `${oppBs2.pts??''}pts ${oppBs2.fouls??''}f` : '';
    sp.textContent = `${myS3?`Me: ${myS3}`:''}${myS3&&oppS3?' \u00b7 ':''}${oppS3?`Them: ${oppS3}`:''}`;
  });
  return row2;
}
async function buildOppStats(uuid, btn) {
  const container = document.getElementById('opp-stats-' + uuid);
  if (!container) return;
  if(btn){btn.disabled = true; btn.textContent = 'Computing…';}
  container.innerHTML = '<div style="font-size:0.8rem;color:var(--text3);padding:8px 0">Loading game data…</div>';

  const player = S.players[uuid];
  if (!player) { container.innerHTML = '<div style="font-size:0.8rem;color:var(--text3);padding:8px 0">Player data not available.</div>'; if(btn)btn.disabled=false; return; }

  // Load all season game files and team-stats (needed to classify g.p[] players by side)
  //
  // ⚠️ 2026-11-20 — WAS a sequential `for (const sid of sids) { await …; await …; }`,
  // i.e. TWO round trips per season one after another. Eleven seasons is 22
  // serial fetches before the first opponent is counted, which is the twenty-odd
  // seconds of blank panel. Six at a time, both files together, same requests.
  const sids = [...new Set((player.seasons || []).map(s => s.sid).filter(Boolean))];
  await loadSeasonGames(sids,(d,t)=>{
    if(t&&container)container.innerHTML='<div style="font-size:0.8rem;color:var(--text3);padding:8px 0">Reading season game files\u2026 '+d+' of '+t+'</div>';
  });
  const needTs=sids.filter(sid=>!S.teamStats[sid]);
  for(let i=0;i<needTs.length;i+=6){
    await Promise.all(needTs.slice(i,i+6).map(async sid=>{
      S.teamStats[sid]=await sgj('team-stats/bv',sid)||{};
    }));
    if(container)container.innerHTML='<div style="font-size:0.8rem;color:var(--text3);padding:8px 0">Reading team sheets\u2026 '+Math.min(i+6,needTs.length)+' of '+needTs.length+'</div>';
  }
  if(container)container.innerHTML='<div style="font-size:0.8rem;color:var(--text3);padding:8px 0">Matching opponents\u2026</div>';

  // For each game the player was in, tally opponents and results
  // g.p[] entries have {id} (UUID string); hp/ap entries have {profileID}
  const oppRecord = {}; // oppUuid → {w, l, d}
  let skippedIds = 0;     // game-side ids no loaded index could place
  const oppNames = {};    // uuid -> name, straight off the opposing team sheet
  const playerGames = new Set(player.games || []);

  for (const sid of sids) {
    const gamesInSid = S.games[sid]?.games || {};

    for (const [gid, g] of Object.entries(gamesInSid)) {
      if (!playerGames.has(gid)) continue;
      const myTid = getTidForGame(player,sid,gid);
      if (!myTid) continue;

      const ctx = gameCtx(g, myTid);
      const res = resLetter(ctx.myS, ctx.oppS);
      if (ctx.myS == null) continue; // no score

      // Determine which side the player is on — skip game if we can't tell
      // `continue` drops the game from the tally. With g.h/g.a that happened for
      // EVERY hidden game, so the opponent record was built from the minority.
      const _h = hTid(g), _a = aTid(g);
      const isHome = _h === myTid;
      const isAway = _a === myTid;
      if (!isHome && !isAway) continue;
      const otherTid = isHome ? _a : _h;
      const td = S.teamStats[sid] || {};
      const oppRosterKeys = Object.keys(td[otherTid]?.roster || {});
      const myRosterKeys  = Object.keys(td[myTid]?.roster    || {});
      const oppRosterSet  = new Set(oppRosterKeys);
      const oppSide = isHome ? (g.ap || []) : (g.hp || []);

      // Collect opponents as CANONICAL full uuids. Game-side ids are mostly
      // trunc13 (of the player's own uuid) and won't equal the full-uuid roster
      // keys, so match on the 13-char prefix; fall back to the alias index for
      // diverged spectator ids not present in the roster.
      let oppUuids = [];
      if (oppSide.length) {
        for (const bp of oppSide) {
          const k2=t13(bp.profileID);
          const hit=oppRosterKeys.find(uu=>t13(uu)===k2) || resolveCachedUuid(bp.profileID);
          if (hit) oppUuids.push(hit); else skippedIds++;
        }
      } else if (g.p?.length) {
        for (const entry of g.p) {
          const pid = typeof entry === 'string' ? entry : entry.id;
          if (!pid || gameIdMatchesPlayer(pid, player)) continue; // skip self
          const k = t13(pid);
          if (myRosterKeys.some(uu => t13(uu) === k)) continue;   // teammate
          const oppKey = oppRosterKeys.find(uu => t13(uu) === k);
          if (oppKey) { oppUuids.push(oppKey); continue; }
          const r = resolveCachedUuid(pid);           // cached maps only; see resolveCachedUuid
          if (r && oppRosterSet.has(r)) oppUuids.push(r);
          else if (!r) skippedIds++;
        }
      } else {
        continue;
      }

      const oppRosterBlock = (S.teamStats[sid]||{})[otherTid]?.roster || {};
      for (const oppUuid of oppUuids) {
        if (!oppUuid || oppUuid === uuid) continue;
        // The name is in the roster block this loop already read. Fetching a
        // player file per opponent for it cost one request each, and every miss
        // then pulled that shard's whole index and alias file — a 220 kB pair
        // per shard. That is the 550 requests; none of them were needed.
        if (!(oppUuid in oppNames)) {
          const nm = oppRosterBlock[oppUuid]?.name;
          if (nm) oppNames[oppUuid] = nm;
        }
        if (!oppRecord[oppUuid]) oppRecord[oppUuid] = { w: 0, l: 0, d: 0, games: [] };
        if (res === 'W') oppRecord[oppUuid].w++;
        else if (res === 'L') oppRecord[oppUuid].l++;
        else oppRecord[oppUuid].d++;
        oppRecord[oppUuid].games.push({ gid, sid, g });
      }
    }
  }

  const entries = Object.entries(oppRecord)
    .map(([oppUuid, rec]) => {
      const total = rec.w + rec.l + rec.d;
      const winPct = total > 0 ? rec.w / total : 0;
      return { oppUuid, ...rec, total, winPct };
    })
    .filter(e => e.total >= 2);

  if (!entries.length) {
    container.innerHTML = '<div style="font-size:0.8rem;color:var(--text3);padding:8px 0">Not enough scored games vs same opponent (need ≥2).</div>';
    if(btn){btn.textContent = 'Compute ↗'; btn.disabled = false;}
    return;
  }

  // Store game data keyed by oppUuid for expandable rows
  const oppGames = {};
  for (const e of entries) oppGames[e.oppUuid] = e.games || [];
  S._oppStatGames = S._oppStatGames || {};
  S._oppStatGames[uuid] = oppGames;

  entries.sort((a, b) => b.winPct - a.winPct || b.total - a.total);
  const best  = entries.slice(0, 5);
  const worst = entries.slice(-5).reverse();

  function wldBadge(e) {
    return `<span style="font-size:0.7rem;display:flex;gap:4px;flex-shrink:0">` +
      (e.w ? `<span style="color:var(--win)">${e.w}W</span>` : '') +
      (e.l ? `<span style="color:var(--loss)">${e.l}L</span>` : '') +
      (e.d ? `<span style="color:var(--draw)">${e.d}D</span>` : '') +
      `</span>`;
  }

  function oppRow(e) {
    const pct = Math.round(e.winPct * 100) + '%';
    const rowId = 'osr-' + e.oppUuid;
    const detailId = 'osd-' + e.oppUuid;
    return `<div class="orow" style="cursor:pointer" id="${rowId}" onclick="toggleOppStatGames('${esc(e.oppUuid)}','${esc(uuid)}')">
      <span class="oname" id="oppn-${esc(e.oppUuid)}">#${esc(e.oppUuid.slice(0,8))}</span>
      ${wldBadge(e)}
      <span style="font-size:0.72rem;color:var(--text2);min-width:36px;text-align:right;flex-shrink:0">${pct}</span>
    </div><div id="${detailId}" class="opp-game-detail hidden"></div>`;
  }



  let h = '<div style="font-size:0.75rem;color:var(--text3);padding:6px 0 2px">Best win % (min 2 games)</div>';
  for (const e of best)  h += oppRow(e);
  h += '<div style="font-size:0.75rem;color:var(--text3);padding:10px 0 2px">Worst win % (min 2 games)</div>';
  for (const e of worst) h += oppRow(e);

  // Search dropdown — populated with all opponents once names load
  const searchId = 'opp-search-' + uuid;
  const searchDetailId = 'opp-search-detail-' + uuid;
  h += `<div style="margin-top:12px;border-top:0.5px solid var(--border);padding-top:10px">
    <div style="font-size:0.75rem;color:var(--text3);margin-bottom:6px">Look up any opponent</div>
    <select id="${searchId}" class="sselect">
      <option value="">Loading names\u2026</option>
    </select>
    <div id="${searchDetailId}" class="opp-game-detail hidden" style="margin-top:4px"></div>
  </div>`;

  container.innerHTML = h;
  if(btn){btn.textContent = 'Refresh \u2197'; btn.disabled = false;}

  // Wire search dropdown
  document.getElementById(searchId)?.addEventListener('change', function() {
    const oppUuid = this.value;
    const detail = document.getElementById(searchDetailId);
    if (!detail) return;
    detail.innerHTML = '';
    if (!oppUuid) { detail.classList.add('hidden'); return; }
    detail.classList.remove('hidden');
    const games = (S._oppStatGames?.[uuid]?.[oppUuid] || []).slice().sort((a,b)=>(b.g.d||'').localeCompare(a.g.d||''));
    for (const {gid,sid,g} of games) detail.appendChild(buildGameRow(gid, sid, g, uuid, oppUuid));
  });

  // Load all opponent names progressively then rebuild dropdown
  const nameMap = {};
  const allEntries = [...entries];
  let loaded = 0;

  // Only the ones the team sheets could not name are fetched. On a long career
  // that is a handful instead of every opponent.
  for (const e of allEntries) nameMap[e.oppUuid] = oppNames[e.oppUuid] || null;
  for (const [u2, nm] of Object.entries(oppNames)) {
    if (nm) document.querySelectorAll('#oppn-' + u2).forEach(el => { el.textContent = nm; });
  }
  const rebuildSelect = () => {
    const sel = document.getElementById(searchId);
    if (!sel) return;
    const sorted = allEntries
      .map(e => ({ ...e, name: nameMap[e.oppUuid] || ('#' + e.oppUuid.slice(0,8)) }))
      .sort((a,b) => a.name.localeCompare(b.name));
    sel.innerHTML = '<option value="">Select an opponent\u2026</option>' +
      sorted.map(e => {
        const pct = e.total > 0 ? Math.round(e.w/e.total*100)+'%' : '';
        return `<option value="${esc(e.oppUuid)}">${esc(e.name)} \u2014 ${e.w}W ${e.l}L${e.d?` ${e.d}D`:''} ${pct}</option>`;
      }).join('');
  };
  const needName = allEntries.filter(e => !nameMap[e.oppUuid]);
  rebuildSelect();                       // every name the team sheets gave, now
  for (const e of needName) {
    loadPlayerFile(e.oppUuid).then(opp => {
      const name = opp?.name || null;
      nameMap[e.oppUuid] = name;
      // Update inline spans in best/worst rows
      if (name) document.querySelectorAll('#oppn-' + e.oppUuid).forEach(el => { el.textContent = name; });
      loaded++;
      if (loaded === needName.length) rebuildSelect();
    });
  }
}

async function toggleOppStatGames(oppUuid, myUuid) {
  const row = document.getElementById('osr-' + oppUuid);
  const detail = document.getElementById('osd-' + oppUuid);
  if (!detail) return;
  if (detail.children.length) {
    detail.classList.toggle('hidden');
    row.classList.toggle('expanded');
    return;
  }
  const games = S._oppStatGames?.[myUuid]?.[oppUuid] || [];
  if (!games.length) { detail.innerHTML = '<div style="padding:4px 14px 4px 28px;font-size:0.75rem;color:var(--text3)">No game details available.</div>'; detail.classList.remove('hidden'); return; }
  games.sort((a, b) => (b.g.d || '').localeCompare(a.g.d || ''));
  for (const { gid, sid, g } of games) {
    const r = buildGameRow(gid, sid, g, myUuid, oppUuid);
    r.style.paddingLeft = '28px';
    detail.appendChild(r);
  }
  detail.classList.remove('hidden');
  row.classList.add('expanded');
}
