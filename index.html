<!-- stattrack.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatTrack">
<link rel="icon" type="image/webp" sizes="32x32" href="favicon.webp">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<title>StatTrack — Basketball Victoria</title>
<style>
:root {
  --bg: #121212; --surface: #1e1e1e; --elevated: #2a2a2a; --border: #2e2e2e;
  --accent: #00f5d4; --accent-dim: rgba(0,245,212,0.12);
  --text: #ffffff; --text2: #999999; --text3: #555555;
  --win: #4caf50; --loss: #f44336; --draw: #ff9800;
  --c-hidden: #7c4dff; --c-po: #ff6d00; --c-legacy: #555;
  --c-forfeit: #f44336; --c-cx: #795548;
  --rail: 320px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100dvh;overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
.hidden{display:none!important}

#app{display:flex;height:100dvh}
#rail{width:var(--rail);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;overflow-y:auto;min-width:0}

.rail-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.rail-logo{font-size:1.15rem;font-weight:800;letter-spacing:-0.03em;color:var(--accent)}
.rail-logo sup{font-size:0.55rem;font-weight:500;color:var(--text3);letter-spacing:0;margin-left:4px;vertical-align:top;margin-top:4px;display:inline-block}
.rail-ver{font-size:0.65rem;color:var(--text3)}

.stabs{display:flex;padding:6px;gap:3px;border-bottom:1px solid var(--border)}
.stab{flex:1;padding:6px 4px;border-radius:6px;font-size:0.78rem;font-weight:500;color:var(--text2);transition:background 0.12s,color 0.12s}
.stab.on{background:var(--accent-dim);color:var(--accent)}
.stab:hover:not(.on){background:var(--elevated);color:var(--text)}

.panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.swrap{padding:8px;border-bottom:1px solid var(--border)}
.swrap-hdr{display:flex;align-items:center;padding:5px 8px 0;gap:4px}
.swrap-hdr span{font-size:0.72rem;color:var(--text2)}
.rbtn{margin-left:auto;background:none;border:none;color:var(--text3);font-size:0.78rem;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1.2}
.rbtn:hover{background:var(--elevated);color:var(--text1)}
.sinput{width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:0.88rem;outline:none;transition:border-color 0.15s}
.sinput:focus{border-color:var(--accent)}
.sinput::placeholder{color:var(--text3)}
.sresults{flex:1;overflow-y:auto}
.sseason{padding:7px 8px;border-bottom:1px solid var(--border)}
.sfilters{display:flex;flex-direction:column;gap:6px}
.sselect:disabled{opacity:0.45;cursor:default}
.sselect{width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:0.83rem;outline:none;cursor:pointer;appearance:none}
.sselect:focus{border-color:var(--accent)}
.vfilters{padding:6px 8px;border-bottom:1px solid var(--border);display:flex;gap:6px}
.vfilters .sinput{font-size:0.78rem;padding:6px 10px}
.vfilter-date{width:130px;flex-shrink:0}

.ri{padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s}
.ri:hover{background:var(--elevated)}
.ri-name{font-size:0.88rem;font-weight:500}
.ri-sub{font-size:0.73rem;color:var(--text2);margin-top:1px}
.ri-empty{padding:16px 14px;color:var(--text3);font-size:0.83rem}

#view-home{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding:20px}
.home-mark{font-size:4rem;font-weight:900;letter-spacing:-0.05em;color:var(--accent);opacity:0.15;line-height:1}
.home-hint{font-size:0.83rem;color:var(--text3);text-align:center}

.vhdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;background:var(--bg);z-index:10}
.vback{color:var(--accent);font-size:0.83rem;padding:3px 0;white-space:nowrap;flex-shrink:0;margin-top:2px}
.vback:hover{opacity:0.75}
.vtitle{font-size:1.05rem;font-weight:600;line-height:1.3}
/* The player's uuid, on the page (2026-08-21). PlayHQ issues more than one profile
   for some people — Tahlia Parker has an api-id file carrying the credits with no
   season names, and a spectator-id file carrying the full names, holding 385 of the
   same games between them. Two pages titled identically, and no way to tell which
   is which without opening devtools. It is also the id the PlayHQ link uses, so it
   is exactly what you need when one of the two resolves and the other does not.
   Click to copy. */
.vuuid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.62rem;color:var(--text3);
  margin-top:3px;cursor:pointer;user-select:all;letter-spacing:-0.2px}
.vuuid:hover{color:var(--text2)}
.vsub{font-size:0.78rem;color:var(--text2);margin-top:2px}

.avi{width:44px;height:44px;border-radius:50%;background:var(--elevated);border:2px solid var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:0.95rem;font-weight:700;color:var(--accent);flex-shrink:0}

.cstats{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
/* Recorded-appearance bar (2026-08-21). Sits UNDER .cstats, separated by a dashed
   rule so it reads as a second source rather than another PlayHQ column. Accent
   colour marks it as ours; PlayHQ's row stays full-brightness above it. */
/* Unregistered appearances (2026-08-21). Its own section because these games have
   NO REGISTRATION and therefore no season card to sit inside. Orange rather than
   accent: this is information about provenance, not a statistic. */
.unreg-pill{background:var(--elevated);color:var(--text2);font-size:0.58rem;font-weight:700;padding:1px 6px;border-radius:6px}
.unreg-tog{margin-left:auto;font-size:0.64rem;color:var(--text2);font-weight:400;text-transform:none;letter-spacing:0;cursor:pointer;display:flex;align-items:center;gap:5px}
.unreg-tog input{accent-color:var(--accent);width:12px;height:12px;cursor:pointer}
.unreg-note{font-size:0.66rem;color:var(--text2);line-height:1.45;padding:0 0 8px}
.unreg-hdr{border-left:3px solid var(--c-po)}
.diff-hdr{border-left:3px solid var(--text3)}
.bdg.bNoCr{background:rgba(255,109,0,0.15);color:var(--c-po);font-size:0.55rem;font-weight:700;padding:0 5px;border-radius:4px;margin-left:6px;white-space:nowrap}
.bdg.bMiss{background:rgba(120,120,140,0.18);color:var(--text2);font-size:0.55rem;font-weight:700;padding:0 5px;border-radius:4px;margin-right:6px}
.diff-miss{font-size:0.7rem;color:var(--text2);padding:6px 12px}
.bdg.bFill{background:rgba(255,109,0,0.15);color:var(--c-po);font-size:0.55rem;font-weight:700;padding:0 5px;border-radius:4px;margin-right:6px}
.recbar{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
  padding:7px 12px 9px;background:var(--surface);border-top:1px dashed var(--border)}
.recbar-l{font-size:0.62rem;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.recbar-v{font-size:0.92rem;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.recbar-n{font-size:0.66rem;color:var(--text2)}
.cstat{flex:1;min-width:56px;padding:11px 6px;text-align:center;border-right:1px solid var(--border)}
.cstat:last-child{border-right:none}
.csv{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.csl{font-size:0.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-top:1px}

.upsec{padding:10px 16px;background:var(--accent-dim);border-bottom:1px solid var(--border)}
.uplbl{font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);margin-bottom:5px}
.upitem{font-size:0.83rem;padding:2px 0;cursor:pointer;color:var(--accent)}
.upitem:hover{opacity:0.8}

.slist{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.sec-lbl{font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:2px}
.sc{background:var(--elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden}
/* A season PERIOD that carries several registrations (a domestic comp, a rep
   comp, a tournament — each its own sid) gets one header with the period total,
   and its cards sit indented beneath it instead of reading as unrelated seasons. */
.sp-hdr{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:8px;margin:6px -8px 0;padding-left:0}
.sp-hdr .sp-info{flex:1;min-width:0;padding:7px 12px 6px}
.sp-hdr .sp-n{font-weight:700;font-size:0.84rem}
.sp-hdr .sp-s{color:var(--text3);font-size:0.66rem;margin-top:1px}
.sp-cells{flex:7;min-width:0;display:flex}
/* Member cards sit flush with every other season card, so every per-team stat
   column lines up down the whole list. Only the period header is offset — wider
   by 8px each side with an accent edge — so the combined line reads as the
   container rather than as another team. */
.sp-mem{margin-left:0}
.sp-mem+.sp-mem{margin-top:4px}
.sc-hdr{border-left:3px solid transparent;padding:0;cursor:pointer;display:flex;align-items:center;gap:0;transition:background 0.1s;user-select:none;background:var(--elevated)}
.sc-hdr:hover,.sc-hdr.open{background:#333}
.sc-info{flex:1;min-width:0;padding:7px 12px 6px}
.sc-name{font-size:0.83rem;font-weight:600}
.sc-name-locked{color:var(--text2)}
.sc-lock-pill{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;font-size:0.58rem;font-weight:700;letter-spacing:.04em;background:#333;color:#999;vertical-align:middle}
.sc-grade{font-size:0.73rem;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.sc-grade:hover{opacity:0.8}
.sc-regrade{font-size:0.68rem;color:var(--text3);margin-left:4px}
.gs-wrap{padding:6px 14px 2px}
.gs-org-block{margin-bottom:8px}
.gs-org-name{font-size:0.68rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px}
.gs-ages{display:flex;flex-wrap:wrap;gap:5px}
.gs-pill{display:inline-flex;align-items:center;gap:4px;background:var(--card-bg);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:0.71rem}
.gs-age{color:var(--text2)}
.gs-grd{color:var(--text1);font-weight:700}
/* Clubs played for (v1.23). One row per PlayHQ club organisation, resolved
   through club-map/bv/{sid}.json. On phone the name takes its own line rather
   than being truncated — a club is identified by its tail ("... Basketball
   Club") as often as its head. */
.pclub-wrap{padding:6px 14px 2px}
/* The finals strip starts shut. It is a second seven-column row directly under
   the career strip, and open by default it reads as part of it. */
.fin-lbl{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.fin-chev{display:inline-block;font-size:0.6rem;color:var(--text3);transition:transform .15s}
.fin-lbl.open .fin-chev{transform:rotate(90deg);color:var(--accent)}
.fin-strip,.fin-note{display:none}
.fin-strip.open{display:flex}
.fin-note.open{display:block}
.pclub-row{display:flex;align-items:stretch;gap:0;padding:0;margin-bottom:4px;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer}
.pclub-row.pclub-na{cursor:default;opacity:0.7}
.pclub-link{cursor:pointer}
.pclub-link:hover{color:var(--accent)}
.pclub-row.open{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.pclub-exp{display:none;border:1px solid var(--accent);border-top:0;border-radius:0 0 5px 5px;background:var(--surface);margin-bottom:4px}
.pclub-exp.open{display:block}
.pclub-tot,.pclub-treg{display:flex;align-items:stretch;border-top:1px solid var(--border)}
.pclub-tot{border-top:0;background:var(--accent-dim)}
.pclub-row>.pclub-tl{flex:1;min-width:0;padding:9px 12px}
.pclub-row .pclub-n{display:block;font-size:0.84rem}
.pclub-row .pclub-cells{flex:7;min-width:0;display:flex}
.pclub-exp{margin-top:-4px}
.pclub-tl{flex:1;min-width:0;padding:7px 12px;font-size:0.78rem}
.pclub-ts{color:var(--text3);font-size:0.65rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pclub-cells{flex:7;min-width:0;display:flex}
.pclub-fold{font-size:0.6rem;color:var(--draw);border:1px solid var(--border);border-radius:3px;padding:0 4px;white-space:nowrap}
.pclub-row:not(.pclub-na):hover{background:rgba(0,245,212,0.06)}
.pclub-n{min-width:0;font-size:0.82rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pclub-row.pclub-na .pclub-n{font-weight:500;color:var(--text2)}
.pclub-gp{font-size:0.88rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.pclub-row.pclub-na .pclub-gp{color:var(--text2)}
.pclub-x{font-size:0.62rem;color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums}
.pclub-ts .pclub-tag{margin:0}
.pclub-tag{margin-left:6px;padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-size:0.56rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--text3);vertical-align:middle}
.pclub-sub{margin:-2px 0 5px 10px;padding-left:8px;border-left:1px solid var(--border);font-size:0.64rem;color:var(--text2);line-height:1.5}
.pclub-sub-src{color:var(--text3)}
.pclub-s{font-size:0.66rem;color:var(--text2);white-space:nowrap}
.pclub-note{padding:2px 2px 6px;font-size:0.62rem;color:var(--text3);line-height:1.45}
.pclub-load{padding:4px 2px;font-size:0.76rem;color:var(--text3)}
@media(max-width:480px){.pclub-row{flex-wrap:wrap}.pclub-n{flex:1 1 100%;white-space:normal}}
.sc-stats{font-size:0.73rem;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sstat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border-left:1px solid var(--border);min-width:60px}
.ssv{font-size:0.68rem;display:flex;gap:2px;font-weight:700}
.ssl{font-size:0.58rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-top:1px}
.chev{color:var(--text3);font-size:0.65rem;transition:transform 0.2s;flex-shrink:0}
.sc-hdr.open .chev{transform:rotate(90deg)}
.sc-games{display:none;border-top:1px solid var(--border)}
.sc-games.open{display:block}

.grow{display:flex;flex-direction:column;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;border-left:3px solid transparent}
.grow:hover{background:var(--elevated)}
.grow:last-child{border-bottom:none}
.grow.gf{border-left-color:gold}
.grow.sf{border-left-color:silver}
.sc-games .grow{background:#111}
.sc-games .grow:hover{background:#1d1d1d}
.g-row{display:flex;align-items:center}
.g-info{flex:1;padding:7px 12px 6px;min-width:0}
.g-rn{font-size:0.67rem;color:var(--text3);margin-top:1px}
.g-opp{font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.sc-srow{display:flex;flex-direction:row;border-top:1px solid var(--border)}
.g-stats{display:flex;flex-direction:row;border-top:1px solid var(--border)}
.g-stats.empty{display:none}
.sc-sm,.g-sm{flex:1;text-align:center;padding:6px 4px;border-right:1px solid var(--border);min-width:0}
.sc-sm:last-child,.g-sm:last-child{border-right:none}
.sc-smv,.g-smv{font-size:0.82rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);display:block}
.sc-sml,.g-sml{font-size:0.58rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;display:block;margin-top:1px}
.rW{background:rgba(76,175,80,0.18);color:var(--win)}
.rL{background:rgba(244,67,54,0.18);color:var(--loss)}
.rD{background:rgba(255,152,0,0.18);color:var(--draw)}
.rU{background:var(--elevated);color:var(--text3)}
.load-row{padding:10px 12px;color:var(--text3);font-size:0.8rem;text-align:center}
.grade-divider{padding:4px 12px;font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);background:var(--elevated);border-bottom:1px solid var(--border)}

.bdg{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0}
.bH{background:rgba(124,77,255,0.2);color:var(--c-hidden)}
.bPO{background:rgba(255,109,0,0.2);color:var(--c-po)}
.bLG{background:rgba(85,85,85,0.3);color:#777}
.bFF{background:rgba(244,67,54,0.2);color:var(--c-forfeit)}
.bCX{background:rgba(121,85,72,0.3);color:#bcaaa4}
.bNV{background:rgba(85,85,85,0.2);color:var(--text3)}
/* A superseded fixture is SHOWN, greyed, never hidden. `sup` carries the id of the
   game that replaced it, and the row is the only place that id is any use to a
   person. Hiding it would also make a superseded fixture look identical to a
   DELETED one, and those are two different facts about PlayHQ. */
.bSUP{background:rgba(85,85,85,0.25);color:var(--text3);cursor:pointer}
.bSUP:hover{color:var(--text1)}
.sup-row{opacity:0.5}
.sup-row:hover{opacity:0.85}
/* A cancelled fixture is struck through. The chip is exempt — striking its own
   label through makes it unreadable at this opacity. */
.sup-row td:not(.gr-res){text-decoration:line-through}
.frow.sup-row,.crow.sup-row{text-decoration:line-through}
.frow.sup-row .bdg,.crow.sup-row .bdg{text-decoration:none}

.vtabs{display:flex;border-bottom:2px solid var(--border);padding:0 14px;gap:0}
.vtab{padding:9px 14px;font-size:0.83rem;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:color 0.12s,border-color 0.12s;cursor:pointer}
.vtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.vtab:hover:not(.on){color:var(--text)}
.tpane{display:none}
.tpane.on{display:block}

/* width:auto, not 100%: the table is as wide as its columns need and sits left,
   rather than stretching across a desktop viewport and dragging the numbers with it. */
.tc-tlbl{font-size:0.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:4px 14px 6px}
/* ── v1.68 panels: career highs, splits, team-mates, round chart, availability ── */
.hi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.hi-t{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px;cursor:pointer;transition:border-color .12s}
.hi-t:hover{border-color:var(--text3)}
.hi-q{cursor:default}
.hi-k{font-size:0.54rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.hi-v{font-size:1.35rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.hi-w{font-size:0.6rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-d{font-size:0.54rem;color:var(--text3)}
.hi-note{font-size:0.68rem;color:var(--text3);padding:6px 0 0}
.sp-hd{display:flex;align-items:baseline;justify-content:space-between;font-size:0.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:4px 0 2px}
.sp-hd span{text-transform:none;letter-spacing:0}
.sp-list{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.sp-r{display:flex;align-items:center;gap:8px;padding:4px 0}
.sp-r .n{width:200px;flex:0 0 200px;font-size:0.74rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rtbl{width:auto;max-width:100%;border-collapse:collapse;table-layout:fixed}
/* ⚠️ A NAME COLUMN IS A FIXED WIDTH, NOT A SHARE OF THE VIEWPORT. It was 34% and
   then 30%: on a 1600px screen that is ~480px of empty space between the name and
   GP. The 34% version also totalled 111% with seven numeric columns at 11%, so
   under table-layout:fixed the table was WIDER THAN ITS CONTAINER and the F column
   fell off the right edge — which a scroll wrapper then hid rather than fixed. */
.rtbl th:first-child,.rtbl td:first-child{width:230px}
/* Number-sized, not screen-sized. With width:auto the seven numeric columns split
   the whole viewport, so each figure sat at the right edge of a ~170px cell and the
   row read as scattered. Right alignment is correct — digits should line up — but
   only inside a cell the width of a number. */
.rtbl th:not(:first-child),.rtbl td:not(:first-child){width:92px}
.rtbl th,.rtbl td{padding-left:4px;padding-right:4px}
.rtbl th{padding:7px 10px;font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)}

@media(max-width:480px){
  /* Auto-placement would shove the score and badge onto a THIRD row once .cdets
     claims the full width, so every cell is placed by hand here. */
  .crow{grid-template-columns:minmax(0,1fr) auto auto;gap:1px 5px;padding:6px 10px 6px 14px}
  .crow > .cmain{grid-area:1/1/2/2}
  .crow > .cscore{grid-area:1/2/2/3}
  .crow > .g-res{grid-area:1/3/2/4}
  .crow > .cdets{grid-area:2/1/3/4;display:flex;flex-wrap:wrap;gap:2px 10px;padding-left:0}
  .cdet{font-size:0.66rem}
  .cscore{min-width:0}
  .ctime{font-size:0.7rem}.cteam{font-size:0.8rem}.copp{font-size:0.74rem}
  .cmeta{font-size:0.66rem}.cscore{font-size:0.8rem}
  .ccomp-hdr{font-size:0.68rem;padding-left:14px}
  .cage-hdr{padding-left:16px;font-size:0.7rem}
  .cgrade-hdr{padding-left:20px;font-size:0.65rem}
  .ccomp-hdr{padding-left:14px}
  .cchips{margin-left:0;width:100%}
  /* order puts the button on the NAME line and sends the chips below it.
     flex-basis 0 is what keeps it there: with `flex:0 1 auto` the long name
     demands its full content width, wraps as a WHOLE ITEM across two lines, and
     shoves the button onto a third line of its own. */
  .ccomp-hdr .ccomp-name{flex:1 1 0;white-space:normal}
  .ccomp-hdr .cxall{order:2;margin-left:auto}
  .ccomp-hdr .cchips{order:3}
  .cxall{width:24px;height:24px}
  .cchip{padding:3px 9px;font-size:0.7rem}
  /* Two buttons pushed the label onto a second line, which cost a whole row of
     height on the one screen where height is scarcest. The date field says what
     it is without being told. */
  .cweek-jump{padding:5px 10px;gap:6px}
  .cweek-jump label{display:none}
  .cweek-jump button{padding:3px 8px;font-size:0.72rem}
}

.hpcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:520px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.hphdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.hphdr b{font-size:0.95rem}
.hpbody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.hpsec{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);margin:16px 0 6px;font-weight:700}
.hpitem{padding:8px 10px;border-left:2px solid transparent;border-radius:0 8px 8px 0;margin-bottom:2px}
.hpitem.help-hit{border-left-color:var(--accent);background:rgba(0,245,212,.07)}
.hpterm{font-weight:700;font-size:0.82rem;margin-bottom:2px}
.hptext{font-size:0.75rem;color:var(--text2);line-height:1.5}
.rtbl tr.rsea td{border-bottom:none}
/* The career line was 0.68rem in --text3 (#555 on #121212 — roughly 2.5:1, below
   any readable threshold). It carries the only non-zero numbers on a pre-season
   roster, so it cannot be the hardest thing on the page to read. The accent teal at
   0.78rem reads clearly against #121212 and distinguishes the career line from the
   season row by HUE rather than by being dimmer, which is what made it unreadable. */
.rtbl tr.rcar td{padding-top:0;padding-bottom:7px;font-size:0.78rem;color:var(--accent)}
.rtbl tr.rcar td:first-child{text-transform:uppercase;letter-spacing:0.05em;font-size:0.62rem;color:var(--accent);opacity:0.75}
.osec{padding:12px 14px 6px;font-size:0.66rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);font-weight:700;border-top:1px solid var(--border);margin-top:8px}
.orow{justify-content:flex-start;gap:14px}
.orow .oname{flex:0 0 auto;min-width:190px}
.orow .oenc{min-width:72px;text-align:left}
.opp-opp-row{justify-content:flex-start;gap:14px}
.opp-opp-row .opp-opp-name{flex:0 0 auto;min-width:175px}
.opp-opp-row .opp-opp-enc{min-width:52px;text-align:left}
/* The record and the games/opponents figure are two different things — a result and
   a sample size — so they get their own columns instead of running together as one
   string. Same fixed widths at both levels, so a nested row lines up beneath the
   row it belongs to. */
.ocol-wld{flex:0 0 72px;display:flex;align-items:center;gap:4px}
.ocol-enc{flex:0 0 86px;text-align:left}
/* Nothing to split when there are no meetings: one cell across both columns, so the
   text reads as a sentence rather than being clipped into the first column's width. */
.ocol-span{flex:0 0 158px}
.rtbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
.rtbl{min-width:520px}

/* ── Head-to-head ─────────────────────────────────────────────────────────── */
.h2h-open{margin:6px 0 0;padding:3px 8px;font-size:0.72rem;border:1px solid var(--border);
  background:var(--surface2,transparent);color:var(--text1);border-radius:4px;cursor:pointer}
.h2h-open:hover{border-color:var(--accent);color:var(--accent)}
.h2h-pick{padding:10px 12px;border-bottom:1px solid var(--border)}
.h2h-pick input{width:100%;padding:8px 10px;font-size:0.9rem;border:1px solid var(--border);
  border-radius:6px;background:var(--surface);color:var(--text1)}
.h2h-res{margin-top:6px;max-height:260px;overflow:auto}
.h2h-sec{border-bottom:1px solid var(--border)}
.h2h-sec-h{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.h2h-sec-h:hover{background:var(--surface2,rgba(127,127,127,0.06))}
.h2h-n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text2)}
.h2h-sec-b{padding:0 12px 10px}
.h2h-row{padding:7px 0;border-top:1px solid var(--border);font-size:0.84rem}
.h2h-row .h2h-when{color:var(--text2);font-size:0.76rem}
.h2h-warn{padding:10px 12px;font-size:0.8rem;color:var(--warn,#c47f00);
  border-top:1px solid var(--border)}
.h2h-none{padding:10px 12px;color:var(--text2);font-size:0.85rem}

/* ── Movement map (v1.29) ───────────────────────────────────────────────── */
/* ── CAREER CARDS (v1.31) ──────────────────────────────────────────────────
   One card per period (season, calendar year, or a custom date window), hero
   number leading, the whole career drawn as bars behind it. Season totals come
   from the PlayHQ-credited registration stats; year and range totals are summed
   from the dated per-game lines in the season game files. */
.car-wrap{margin:10px 0 2px}
.car-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
.car-bar .lbl{color:var(--text3);font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;margin:0 2px 0 10px}
.car-bar .lbl:first-child{margin-left:0}
.car-bar button{border:1px solid var(--border);background:var(--elevated);color:var(--text2);border-radius:5px;cursor:pointer;font-size:0.74rem;padding:5px 9px;font-family:inherit}
.car-bar button:hover{color:var(--text);border-color:var(--text3)}
.car-bar button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.car-rgwrap{display:none}
.car-rgwrap.on{display:inline-flex;align-items:center}
.car-rg{display:none;align-items:center;gap:8px;margin-left:10px;padding-left:10px;border-left:1px solid var(--border)}
.car-rg.on{display:inline-flex}
.car-rg label{color:var(--text3);font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;display:inline-flex;align-items:center;gap:5px}
.car-rg input{background:var(--elevated);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font:inherit;font-size:0.74rem;color-scheme:dark}
.car-rg input:focus{outline:none;border-color:var(--accent)}
/* One row, scrolled sideways. Wrapping was tried and rejected: the row is the
   point — it is the career in order. What was wrong was the scrollbar, a 4px
   system hairline that could barely be seen let alone grabbed. So: a thick
   styled bar that is always visible, the wheel scrolls the row without holding
   anything down, and arrows at each end for a card-by-card nudge. */
.car-scroll{position:relative}
.car-strip{display:flex;align-items:stretch;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 4px;scroll-behavior:smooth;overscroll-behavior-x:contain}
.car-strip::-webkit-scrollbar{height:12px}
.car-strip::-webkit-scrollbar-track{background:var(--elevated);border-radius:6px}
.car-strip::-webkit-scrollbar-thumb{background:var(--text3);border-radius:6px;border:2px solid var(--elevated)}
.car-strip::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.car-strip{scrollbar-width:auto;scrollbar-color:var(--text3) var(--elevated)}
.car-card{flex:0 0 186px}
.car-nav{position:absolute;top:0;bottom:16px;width:30px;display:none;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:0.9rem;z-index:3;
  border-radius:6px;opacity:.92}
.car-nav:hover{color:var(--accent);border-color:var(--accent)}
.car-nav.show{display:flex}
.car-nav.l{left:-2px}.car-nav.r{right:-2px}
.car-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-self:stretch}
.car-card.open{border-color:var(--accent)}
.car-card.open .car-nm{color:var(--accent)}
.car-card.rng{border-color:var(--draw)}
.car-card.rng .car-nm{color:var(--draw)}
.car-ch{padding:8px 10px 0}
.car-nm{font-weight:600;font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-mt{color:var(--text3);font-size:0.67rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-hero{padding:6px 10px 2px;display:flex;align-items:baseline;gap:7px}
.car-big{font-size:2.3rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.car-unit{font-size:0.64rem;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.car-delta{margin-left:auto;font-size:0.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.car-up{color:var(--win)}.car-dn{color:var(--loss)}.car-flat{color:var(--text3)}
.car-spark{height:20px;margin:13px 10px 0;display:flex;align-items:flex-end;gap:3px;position:relative}
.car-spark i{flex:1;background:var(--text3);border-radius:1px;opacity:.5}
.car-spark i.me{background:var(--accent);opacity:1}
.car-avg{position:absolute;left:0;right:0;border-top:1px dashed var(--text2);opacity:.75;pointer-events:none}
.car-avgl{position:absolute;left:0;top:-13px;font-size:0.5rem;font-weight:600;color:var(--text2);letter-spacing:.03em;white-space:nowrap;pointer-events:none}
.car-mini{display:flex;flex-wrap:wrap;padding:7px 6px 7px;border-top:1px solid var(--border);margin-top:7px}
.car-mini .c{flex:1 0 33.33%;text-align:center;padding:3px 0}
.car-mini .v{font-size:0.8rem;font-variant-numeric:tabular-nums}
.car-mini .l{font-size:0.54rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.car-wl{padding:5px 10px;border-top:1px solid var(--border);font-size:0.68rem;font-variant-numeric:tabular-nums;color:var(--text3)}
.car-wl b{font-weight:600}
.car-teams{border-top:1px solid var(--border);padding:6px 10px 7px;margin-top:auto}
.car-teams.car-cut .car-tlist .car-t:nth-child(n+5){display:none}
.car-teams.car-cut.open .car-tlist .car-t{display:flex}
.car-more{display:block;width:100%;margin-top:4px;border:1px solid var(--border);background:transparent;color:var(--text3);
  border-radius:4px;cursor:pointer;font-size:0.64rem;padding:3px 0;font-family:inherit}
.car-more:hover{color:var(--accent);border-color:var(--accent)}
.car-t{font-size:0.7rem;color:var(--text2);display:flex;gap:6px;align-items:baseline;padding:1px 0;cursor:pointer}
.car-t:hover .car-tn em{color:var(--accent)}
.car-gp{flex:0 0 auto;min-width:17px;text-align:right;color:var(--text3);font-variant-numeric:tabular-nums;font-size:0.68rem}
.car-tn{flex:1;min-width:0;overflow:hidden}
.car-tn em{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The grade line was one nowrap line, so "Saturday U12 Boys B / Division 2" cut
   off at the card edge with empty card below it. It wraps to two lines now and
   only clips past that. */
.car-tn i{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-style:normal;
  color:var(--text3);font-size:0.62rem;line-height:1.2;white-space:normal;overflow:hidden;overflow-wrap:anywhere}
.car-gr{font-weight:600;color:var(--accent);font-size:0.62rem;opacity:.85}
.car-tn i.car-gb{color:var(--accent);opacity:.85;font-weight:600}
.car-tp{font-weight:600;color:var(--text3);font-variant-numeric:tabular-nums}
/* ── TEAM CARDS (v1.51) ────────────────────────────────────────────────────
   The roster as one chart plus a card per player, in the same language as the
   career cards on a player profile. Every figure comes from the team-stats file
   the view already loads; the career totals come from the player files
   hydrateCareers already fetches, so neither mode costs a request this view was
   not already making. */
.tc-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 14px 8px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
.tc-bar .lbl{color:var(--text3);font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;margin:0 2px 0 10px}
.tc-bar .lbl:first-child{margin-left:0}
.tc-bar button{border:1px solid var(--border);background:var(--elevated);color:var(--text2);border-radius:5px;cursor:pointer;font-size:0.74rem;padding:5px 9px;font-family:inherit}
.tc-bar button:hover{color:var(--text);border-color:var(--text3)}
.tc-bar button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.tc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px;align-items:stretch;padding:0 14px 12px}
.tc-chart{grid-column:span 2;grid-row:span 2;background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tc-chd{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:8px}
.tc-chd b{font-size:0.82rem}
.tc-chd span{color:var(--text3);font-size:0.67rem;margin-left:auto;font-variant-numeric:tabular-nums}
.tc-chb{padding:21px 10px 9px;position:relative;flex:1}
.tc-cr{display:flex;align-items:center;gap:7px;height:19px;cursor:pointer}
.tc-cr .n{width:88px;flex:0 0 88px;font-size:0.68rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-cr .t{flex:1;min-width:0;height:9px;background:var(--elevated);border-radius:2px;overflow:hidden}
.tc-cr .t i{display:block;height:100%;background:var(--text3);opacity:.6;border-radius:2px}
.tc-cr .v{width:40px;text-align:right;font-size:0.68rem;color:var(--text3);font-variant-numeric:tabular-nums}
.tc-cr:hover .n{color:var(--text)}
.tc-cr.on .n{color:var(--accent);font-weight:600}
.tc-cr.on .t i{background:var(--accent);opacity:1}
.tc-cr.on .v{color:var(--accent)}
.tc-avg{position:absolute;top:19px;bottom:9px;border-left:1px dashed var(--text2);opacity:.6;pointer-events:none}
.tc-avg b{position:absolute;top:-15px;left:3px;font-size:0.5rem;font-weight:600;color:var(--text2);background:var(--surface);padding:0 2px;letter-spacing:.03em;white-space:nowrap}
.tc-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.tc-card.on{border-color:var(--accent)}
.tc-card.sum{border-color:var(--text3);cursor:default}
.tc-card.sum .tc-big{color:var(--accent)}
.tc-h{padding:8px 10px 0;display:flex;align-items:baseline;gap:6px}
.tc-nm{font-weight:600;font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;cursor:pointer}
.tc-nm:hover{color:var(--accent)}
.tc-card.sum .tc-nm{cursor:default}
.tc-card.sum .tc-nm:hover{color:var(--text)}
.tc-rk{font-size:0.6rem;color:var(--text3);font-variant-numeric:tabular-nums}
.tc-mt{color:var(--text3);font-size:0.67rem;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-hero{padding:5px 10px 2px;display:flex;align-items:baseline;gap:7px}
.tc-big{font-size:2.1rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tc-unit{font-size:0.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.tc-shr{margin-left:auto;font-size:0.68rem;color:var(--text3);font-variant-numeric:tabular-nums}
.tc-mini{display:flex;flex-wrap:wrap;padding:7px 6px;border-top:1px solid var(--border);margin-top:auto}
.tc-mini .c{flex:1 0 33.33%;text-align:center;padding:3px 0}
.tc-mini .v{font-size:0.8rem;font-variant-numeric:tabular-nums}
.tc-mini .l{font-size:0.54rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
@media(max-width:560px){.tc-chart{grid-column:1/-1;grid-row:auto}}
.car-gwrap{border:1px solid var(--accent);border-radius:8px;background:var(--surface);margin:0 2px 10px}
.car-gh{display:flex;align-items:baseline;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border)}
.car-gh b{font-size:0.82rem}
.car-gh span{color:var(--text3);font-size:0.67rem;margin-left:auto}
.car-gx{border:1px solid var(--border);background:var(--elevated);color:var(--text2);border-radius:5px;cursor:pointer;font-size:0.7rem;padding:3px 9px;font-family:inherit}
.car-gx:hover{color:var(--text);border-color:var(--text3)}
.car-gb{padding:21px 10px 6px;position:relative}
.car-gr{display:flex;align-items:center;gap:7px;height:20px;cursor:pointer}
.car-gn{width:150px;flex:0 0 150px;min-width:0;overflow:hidden;line-height:1.05}
.car-gn em{display:block;font-style:normal;font-size:0.68rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-gn i{display:block;font-style:normal;font-size:0.56rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-gres{flex:0 0 13px;font-size:0.62rem;font-weight:700;text-align:center}
.car-gres.rW{color:var(--win)}.car-gres.rL{color:var(--loss)}.car-gres.rD{color:var(--draw)}.car-gres.rU{color:var(--text3)}
.car-gt{flex:1;min-width:0;height:9px;background:var(--elevated);border-radius:2px;overflow:hidden}
.car-gt i{display:block;height:100%;background:var(--text3);opacity:.6;border-radius:2px}
.car-gr:hover .car-gt i{background:var(--accent);opacity:1}
.car-gr:hover .car-gn em{color:var(--text)}
.car-gv{width:38px;text-align:right;font-size:0.68rem;color:var(--text3);font-variant-numeric:tabular-nums}
.car-gavg{position:absolute;top:19px;bottom:6px;border-left:1px dashed var(--text2);opacity:.6;pointer-events:none}
.car-gavg b{position:absolute;top:-15px;left:3px;font-size:0.5rem;font-weight:600;color:var(--text2);letter-spacing:.03em;white-space:nowrap}
.car-gspark{height:16px;margin:11px 0 3px;display:flex;align-items:flex-end;gap:3px;position:relative}
.car-gspark i{flex:1;background:var(--text3);border-radius:1px;opacity:.5}
.car-gspark i.me{background:var(--accent);opacity:1}
.car-gsavg{position:absolute;left:0;right:0;border-top:1px dashed var(--text2);opacity:.7;pointer-events:none}
.car-gsl{position:absolute;left:0;top:-12px;font-size:0.48rem;font-weight:600;color:var(--text2);letter-spacing:.03em;white-space:nowrap;pointer-events:none}
.car-gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:10px}
.car-gc{background:var(--elevated);border:1px solid var(--border);border-radius:6px;padding:6px 8px;cursor:pointer;min-width:0}
.car-gc:hover{border-color:var(--accent)}
.car-gch{display:flex;align-items:baseline;gap:6px}
.car-gch .nm{flex:1;min-width:0;font-size:0.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-gcm{color:var(--text3);font-size:0.58rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-gcv{display:flex;align-items:baseline;gap:5px;margin:3px 0 4px}
.car-gcv b{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.car-gcv span{font-size:0.56rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.car-gcv i{margin-left:auto;font-style:normal;font-size:0.6rem;font-weight:600;color:var(--text3);font-variant-numeric:tabular-nums}
.car-gcv i.up{color:var(--win)}.car-gcv i.dn{color:var(--loss)}
.car-gcg{display:flex;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:4px}
.car-gcg .c{flex:1 0 33.33%;text-align:center;padding:2px 0}
.car-gcg .v{font-size:0.72rem;font-variant-numeric:tabular-nums}
.car-gcg .l{font-size:0.5rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.car-card{cursor:pointer}
.car-card.open{border-color:var(--accent)}
.car-msg{grid-column:1/-1;padding:10px;color:var(--text2);font-size:0.78rem;line-height:1.5;max-width:70ch}
.car-build{display:none;margin:0 0 8px;padding:6px 10px;border:1px solid var(--border);border-left:3px solid var(--draw);
  border-radius:5px;background:var(--surface);color:var(--text2);font-size:0.74rem}
.car-build.on{display:block}
.car-build .r{display:flex;align-items:center;gap:10px;margin-top:7px}
.car-go{border:1px solid var(--border);background:var(--elevated);color:var(--text);border-radius:5px;cursor:pointer;font-size:0.74rem;padding:5px 10px;font-family:inherit}
.car-go:hover{border-color:var(--accent);color:var(--accent)}
.car-go[disabled]{opacity:.5;cursor:default}
</style>
</head>
<body>

<div id="app">
  <div id="rail">
    <div class="rail-hd">
      <div class="rail-logo">StatTrack<sup>BV</sup></div>
      <span class="help-dot" onclick="openHelp()" title="What the numbers mean">?</span>
      <span class="rail-ver">v2.03</span>
    </div>
    <div class="stabs">
      <button class="stab on" data-tab="players">Players</button>
      <button class="stab" data-tab="teams">Teams</button>
      <button class="stab" data-tab="venues">Venues</button>
      <button class="stab" data-tab="clubs">Clubs</button>
      <button class="stab" data-tab="leaders">Top</button>
      <button class="stab" data-tab="grading">Grading</button>
    </div>

<script>

'use strict';
const BASE = 'https://markjovic.github.io/sports-players-stats';
const WRKR = 'https://solitary-snowflake-cb3e.insanoflash.workers.dev';

const S = {
  idx:null, venues:null, teamIdx:null,
  shards:{}, games:{}, players:{}, teamStats:{}, boxes:{}, venueDay:{}, venueDates:{}, dateVenues:{},
  tmRun:0,   // team-search generation counter — the grade filter awaits a fetch

  seasonVenueIdx:null, venueSeasonFilter:null, lbData:{}, lbScope:'all', lbStat:'pts', lbMinGP:10,
  playerUuid:null, teamId:null, teamSid:null, venueId:null,
  calOffset:0, // weeks offset from today for venue calendar

  /* Clubs (v1.22). clubIdx is data/club-index.json — 866 rows, fetched once.
     clubs[cid] is clubs/{cid}.json. clubWeek is the Monday of the week on show. */
  clubIdx:null, clubs:{}, clubId:null, clubName:'', clubWeek:null, clubRun:0,
  /* Collapsed day/competition sections, by key. Kept on S rather than rebuilt per
     render so a competition you have closed STAYS closed as you page through
     weeks — otherwise it reopens every time and the click is pointless. */
  clubClosed:new Set(),
  /* club-map/bv/{sid}.json, one entry per season ASKED FOR — null when the fetch
     failed, which is NOT the same as {} (a season with no clubs). clubNames is
     id -> name, derived from clubIdx once; null until the index has loaded. */
  clubMap:{}, clubNames:null,
  /* id -> PlayHQ organisation type (CLUB / ASSOCIATION), and the CLUB-only
     candidate list name inference matches against. Both null until
     data/club-index.json has loaded AND carries `ty`. */
  clubTypes:null, clubKeys:null,
};

/* ── Helpers ── */
async function gj(url){
  try{ const r=await fetch(url); return r.ok?await r.json():null; }catch{return null;}
}
/* Active/locked split (v0.74): per-season files (games/bv, team-stats/bv,
   leaderboard/season) live on TWO Pages origins. archivedAt in sports-index is
   set by graduate-seasons.yml only AFTER the season was probed LIVE on the
   archive, so routing by it is safe. seasonBase is the single choke point for
   any future origin sharding. sgj retries a miss ONCE on the other origin
   (covers a stale index in a long-lived tab, in both directions). */
const ARCH = 'https://markjovic.github.io/sports-players-stats-archive';
function seasonBase(sid){
  return (S.idx?.seasons?.[sid]?.archivedAt) ? ARCH : BASE;
}
async function sgj(dir,sid){
  const primary=seasonBase(sid);
  const d=await gj(primary+'/'+dir+'/'+sid+'.json');
  if(d!==null)return d;
  return gj((primary===ARCH?BASE:ARCH)+'/'+dir+'/'+sid+'.json');
}
const el = id => document.getElementById(id);
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* ⚠️ CLEAR MUST LEAVE THE BOX AS A FRESH PAGE LOAD LEAVES IT — empty, with the
   recent searches showing. `showRecent` is wired ONLY to the input's `focus`
   event, and clearing does not blur an already-focused input, so the recents
   stayed gone until the page was reloaded (Mark, 2026-10-13).
   resetPlayer had a second fault on top: it set the results panel to
   display:none, and ONLY searchPlayers ever set it back, so even a genuine
   re-focus would have painted the recents into a hidden element.
   resetClub never had either fault because it re-renders its own list; this is
   that same idea for the three boxes whose list is the recents. */
function resetSearch(inputId, resultsId, key, onSelect){
  const q=el(inputId); if(q) q.value='';
  const r=el(resultsId); if(!r) return;
  r.style.display='';
  r.innerHTML='';
  showRecent(key, r, onSelect);   // no-op when there are none, leaving it empty
}
function resetPlayer(){resetSearch('q-pl','res-pl','players',v=>{el('q-pl').value=v;searchPlayers(v);});}
function resetTeam(){
  const sn=el('q-sn'); if(sn)sn.selectedIndex=0;
  buildCompPicker();
  // Team recents mirror the focus handler's own condition: they are only useful
  // once a season is chosen, and Clear has just unset it.
  if(el('q-sn')&&el('q-sn').value) resetSearch('q-tm','res-tm','teams',v=>{el('q-tm').value=v;searchTeams(v);});
  else { const q=el('q-tm'); if(q)q.value=''; const r=el('res-tm'); if(r){r.style.display='';r.innerHTML='';} }
}
function resetVenue(){
  const vd=el('q-vdate'); if(vd)vd.value='';
  const vs=el('q-vsn');   if(vs)vs.selectedIndex=0;
  const ga=el('vgrid-area'); if(ga)ga.innerHTML='';
  const cs=el('cal-section'); if(cs)cs.innerHTML='';
  resetSearch('q-vn','res-vn','venues',v=>{el('q-vn').value=v;searchVenues();});
}
function resetClub(){const q=el('q-cl');if(q)q.value='';const r=el('res-cl');if(r)r.innerHTML='';renderClubs(S.clubIdx||[],'');}
function resetLB(){const o=document.getElementById('lb-org');if(o)o.value='';const c=document.getElementById('lb-comp');if(c)c.value='';const g=document.getElementById('lb-grade');if(g)g.value='';const a=document.getElementById('lb-age');if(a)a.value='';const gn=document.getElementById('lb-gender');if(gn)gn.value='';const mg=document.getElementById('lb-mingp');if(mg)mg.value='10';renderLB(S.lbData[S.lbScope]?.[S.lbStat]||[],S.lbData[S.lbScope]||{});}
// Recent searches (localStorage)
function getRecent(k){try{return JSON.parse(localStorage.getItem('st_'+k)||'[]');}catch{return[];}}
function addRecent(k,v){if(!v||v.length<2)return;let r=getRecent(k).filter(x=>x!==v);r.unshift(v);localStorage.setItem('st_'+k,JSON.stringify(r.slice(0,8)));}
function showRecent(k,re,onSelect){
  const r=getRecent(k);if(!r.length)return;
  re.innerHTML=`<div class="ri-empty" style="font-size:0.7rem;color:var(--text3);padding:8px 14px 4px">Recent</div>`+
    r.map(v=>`<div class="ri recent-item" data-v="${esc(v)}"><div class="ri-name" style="display:flex;align-items:center;gap:6px"><span style="color:var(--text3)">↩</span>${esc(v)}</div></div>`).join('');
  re.querySelectorAll('.recent-item').forEach(item=>item.addEventListener('click',()=>onSelect(item.dataset.v)));
}

function dayOfWeek(y,m,d){
  // 0=Sun,1=Mon,...,6=Sat
  const t=[0,3,2,5,0,3,5,1,4,6,2,4];
  const yr=m<3?y-1:y;
  return(yr+Math.floor(yr/4)-Math.floor(yr/100)+Math.floor(yr/400)+t[m-1]+d)%7;
}
function fmtDow(d){
  if(!d)return'';
  const[ys,ms,dys]=d.split('-');
  const y=parseInt(ys),m=parseInt(ms),dy=parseInt(dys);
  const dow=dayOfWeek(y,m,dy);
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return`${days[dow]} ${dy} ${months[m-1]}`;
}
function fmtD(d){
  if(!d)return'';
  const[,m,dy]=d.split('-');
  return`${parseInt(dy)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)-1]}`;
}
function avg(p,g){return g?(p/g).toFixed(1):'—';}
function inits(n){if(!n)return'?';const p=n.split(' ').filter(Boolean);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n.slice(0,2).toUpperCase();}
function mkDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dy}`;}
function tokenMatch(str,query){
  // normName v2 fold (2026-08-02), applied to BOTH operands at compare time —
  // curly/straight quotes, dash family, accents. Self-contained: keys and query
  // are folded here together, so no index rebuild is required. Deliberately NOT
  // applied to search-shard SELECTION (the q.slice(0,2) site) — shard placement
  // is decided by build-search-index.js at build time, and folding only the
  // query side would break lookups for accented first letters.
  const fold=x=>x.normalize('NFKC').replace(/[\u2018\u2019\u201A\u201B\u2032\u02BC]/g,"'").replace(/[\u201C\u201D\u201E\u201F\u2033]/g,'"').replace(/[\u2010-\u2015\u2212]/g,'-').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const sl=fold(str);
  return fold(query).split(/\s+/).filter(Boolean).every(t=>sl.includes(t));
}

/* ── api-canonical id resolution + privacy (StatTrack #5) ── */
const TRUNC_LEN = 13;
function t13(id){ return String(id==null?'':id).slice(0, TRUNC_LEN); }
function isPlaceholderName(name){ return !name || /^player\s*#/i.test(String(name).trim()); }
function displayName(rec, id){
  const nm = (rec && typeof rec==='object') ? rec.name : rec;
  return isPlaceholderName(nm) ? ('Player #'+t13(id||(rec&&rec.uuid)||'')) : nm;
}
function isPrivate(rec){ return !!(rec && rec.private===true); }
function privBadge(rec){ return isPrivate(rec) ? ' <span style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;font-size:0.6rem;font-weight:700;letter-spacing:.04em;background:#333;color:#bbb;vertical-align:middle">PRIVATE</span>' : ''; }
// Match a game-side id (trunc13 or full/diverged) to a LOADED player — no fetch.
const _idsetCache = new WeakMap();
function playerIdSet(player){
  if(!player) return new Set();
  let s=_idsetCache.get(player); if(s) return s;
  s=new Set(); const add=v=>{ if(v){ s.add(String(v)); s.add(t13(v)); } };
  add(player.uuid); (player.spectatorIds||[]).forEach(add);
  _idsetCache.set(player,s); return s;
}
function gameIdMatchesPlayer(gameId, player){
  if(gameId==null||!player) return false;
  const ks=playerIdSet(player), s=String(gameId);
  return ks.has(s)||ks.has(t13(s));
}
function matchP(gameId, uuid){ return gameIdMatchesPlayer(gameId, S.players[uuid]||{uuid:uuid}); }
// Faithful browser port of scripts/lib/uuid-prefix.cjs resolveToFullUuid:
// resolve any stored id (trunc13 / legacy10 / full) from search / leaderboard /
// team-stats / games back to the full canonical player uuid.
//   truncated id : players/indexes match first (keys ARE api ids, so this hits
//                  for everyone incl. diverged-and-folded) -> alias fallback for
//                  a spectator trunc that redirects to an api id -> else null.
//   full id      : index self-check (self wins) -> alias redirect -> else passthrough.
// Two intentional browser deviations from the CJS source: fetch (gj) replaces
// readFileSync (gj returns null on a missing/failed shard = the source's ENOENT
// tolerance), and an unexpected length returns null instead of throwing so the UI
// degrades to the placeholder rather than crashing.
const LEGACY_TRUNC_LEN = 10, FULL_LEN = 36;
const COLLISION = Symbol('uuid-prefix-collision');
const _idxMaps = {}, _aliasMaps = {};
function isFullUuid(id){ return typeof id==='string' && id.length===FULL_LEN; }
function isTruncatedPrefix(id){ return typeof id==='string' && (id.length===TRUNC_LEN || id.length===LEGACY_TRUNC_LEN); }
async function loadShardPrefixMap(shard, len){
  const k=shard+':'+len; if(k in _idxMaps) return _idxMaps[k];
  const map=new Map(); const index=await gj(BASE+'/players/indexes/'+shard+'.json');
  if(index) for(const full of Object.keys(index)){
    if(full.length!==FULL_LEN) continue;
    const p=full.slice(0,len); const ex=map.get(p);
    if(ex===COLLISION) continue;
    if(ex!==undefined && ex!==full){ map.set(p,COLLISION); continue; }
    map.set(p,full);
  }
  _idxMaps[k]=map; return map;
}
async function loadAliasPrefixMap(shard, len){
  const k=shard+':'+len; if(k in _aliasMaps) return _aliasMaps[k];
  const map=new Map(); const aliases=await gj(BASE+'/players/aliases/'+shard+'.json');
  if(aliases) for(const spec in aliases){
    const apiId=aliases[spec]; if(!isFullUuid(apiId)) continue;
    const p = len>=spec.length ? spec : spec.slice(0,len); const ex=map.get(p);
    if(ex===COLLISION) continue;
    if(ex!==undefined && ex!==apiId){ map.set(p,COLLISION); continue; }
    map.set(p,apiId);
  }
  _aliasMaps[k]=map; return map;
}
/* Resolve ONLY from shard maps already in memory. Every miss in resolveToFullUuid
   fetches that shard's whole player index and its alias file — two files per
   shard, up to 256 shards. The opponent walk calls it once per unresolved
   opposing player across a whole career, so a long career quietly pulled
   hundreds of index files and took over a minute. The fallback it provides only
   matters when a game-side id's 13-prefix differs from the roster key's, which
   the prefix match a line earlier already covers for everyone else — so where
   the map is not already loaded, this returns null and the id is skipped rather
   than paying a file for it. */
function resolveCachedUuid(id){
  if(!id)return null;
  const shard=String(id).slice(0,2).toLowerCase();
  const len=isFullUuid(id)?TRUNC_LEN:String(id).length;
  const k=shard+':'+len;
  const idx=_idxMaps[k];
  if(idx){const r=idx.get(isFullUuid(id)?String(id).slice(0,TRUNC_LEN):id);if(typeof r==='string')return r;}
  const am=_aliasMaps[k];
  if(am){const a=am.get(isFullUuid(id)?String(id).slice(0,TRUNC_LEN):id);if(typeof a==='string')return a;}
  return null;
}
/* Memoised. The opponent walk calls this once per opposing player per game —
   for a long career that is thousands of calls, each one an await that yields
   even when every shard map is already cached. Same answer, one lookup. */
const UUID_MEMO=new Map();
async function resolveToFullUuid(id){
  if(id!=null&&UUID_MEMO.has(id))return UUID_MEMO.get(id);
  const _r=await resolveToFullUuidRaw(id);
  if(id!=null)UUID_MEMO.set(id,_r);
  return _r;
}
async function resolveToFullUuidRaw(id){
  if(isFullUuid(id)){
    const shard=id.slice(0,2).toLowerCase();
    const idx=await loadShardPrefixMap(shard,TRUNC_LEN);
    if(idx.get(id.slice(0,TRUNC_LEN))===id) return id;            // self wins
    const am=await loadAliasPrefixMap(shard,TRUNC_LEN);
    const red=am.get(id.slice(0,TRUNC_LEN));
    if(typeof red==='string' && red!==id) return red;
    return id;
  }
  if(!isTruncatedPrefix(id)) return null;
  const shard=id.slice(0,2).toLowerCase();
  const idx=await loadShardPrefixMap(shard,id.length);
  const r=idx.get(id);
  if(typeof r==='string') return r;
  const am=await loadAliasPrefixMap(shard,id.length);
  const a=am.get(id);
  if(typeof a==='string') return a;
  return null;
}
// Canonicalise a game-side id to a full uuid: opposing-team roster first (no
// fetch, since the player is in that roster under their full uuid), then alias.
async function canonGameId(pid, rosterKeys){
  if(!pid) return null;
  const k=t13(pid);
  for(const uu of rosterKeys){ if(t13(uu)===k) return uu; }
  return await resolveToFullUuid(pid);
}
async function openGameId(gameId){
  const uuid = await resolveToFullUuid(gameId);
  loadPlayer(uuid||gameId); // loadPlayer shows a graceful placeholder if the file 404s
}

function renderMode(g){
  if(g.bye)return'bye';if(g.forfeit)return'forfeit';if(g.cancelled)return'cancelled';if(g.abandoned)return'abandoned';
  if(g.hidden){return g.hp?.length?'hidden-full':'hidden-partial';}
  if(g.profileOnly)return'profileOnly';
  // legacy only wins when there is genuinely NO score. Corrected 2026-07-31:
  // this used to be an unguarded `if(g.legacy)return'legacy'` ABOVE the score
  // test, so a legacy game holding a real scoreline rendered as
  // 'HISTORICAL RECORD - Data unavailable'. That was not an edge case: 3,120 of
  // the 3,262 games carrying the flag hold a score, because the flag is stale
  // (its classifier was removed in the 2026-07-16 cleanup, and every fixture
  // write since has merged over the entry without clearing it). The data-side
  // repair is scripts/repair-legacy-flags.js; this guard is the client-side
  // complement and stays correct whichever runs first. The ~142 genuinely
  // scoreless ones still render 'legacy', which is the honest answer for them.
  if(g.legacy && typeof g.hs!=='number')return'legacy';
  if(typeof g.hs==='number')return'normal';
  // ⚠️ A FIXTURE THAT HAS NOT BEEN PLAYED YET IS NOT 'unknown'. Every test above
  // is a flag or a score, and an upcoming game carries neither — so it fell to
  // 'unknown', whose only rendering is "No data available." That is what the
  // venue grid showed for every current and future game: the cell knows both
  // teams, the time and the court, and clicking it produced an empty sheet.
  // Placed AFTER the legacy test deliberately, so nothing that renders today
  // changes — this only catches what was already falling through.
  // ⚠️ A SUPERSEDED FIXTURE IS NOT UPCOMING. `sup` holds the id of the game that
  // replaced it after a regrade (written nightly; see TOOLING.md §6). Tested AFTER
  // the score tests deliberately: if a game ever carries both a score and a stale
  // flag, the score is the honest answer and the flag is the thing that is wrong.
  if(typeof g.sup==='string'&&g.sup)return'superseded';
  if(g.st==='UPCOMING'||g.st==='PRE_GAME')return'upcoming';
  return'unknown';
}
function gameCtx(g,tid){
  if(g.h){
    if(g.h===tid)return{myS:g.hs,oppS:g.as,oppN:g.an,oppId:g.a};
    if(g.a===tid)return{myS:g.as,oppS:g.hs,oppN:g.hn,oppId:g.h};
  }
  if(g.t1===tid)return{myS:null,oppS:null,oppN:g.t2n,oppId:g.t2};
  if(g.t2===tid)return{myS:null,oppS:null,oppN:g.t1n,oppId:g.t1};
  return{myS:g.hs,oppS:g.as,oppN:(g.hn||g.t1n||'?'),oppId:null};
}
function resLetter(a,b){
  if(a==null||b==null)return null;

// pad=true appends an empty trailing column so game rows align under a season
// header that carries the W/L cell (8 columns); without it 7 cells stretch
// under 8 and every column drifts. Border-left matches .sstat so the grid
// line runs continuously down the card.
function buildGameStatRow(g,ctx,ps,pad){
  const sc=(ctx.myS!=null&&ctx.oppS!=null)?`${ctx.myS}\u2013${ctx.oppS}`:'\u2014';
  const res=resLetter(ctx.myS,ctx.oppS);
  const rc=res==='W'?'#4caf50':res==='L'?'#f44336':res==='D'?'#ff9800':'#555';
  const dot='\u00b7';
  const fg=ps?((ps.pt2??0)+(ps.pt3??0)):dot;
  const cells=[
    [sc,'',null],[res||'?','',rc],
    [ps!=null?(ps.pts??0):dot,'PTS',null],[fg,'FG',null],
    [ps!=null?(ps.pt1??0):dot,'FT',null],[ps!=null?(ps.pt3??0):dot,'3PT',null],
    [ps!=null?(ps.fouls??0):dot,'F',null]];
  return cells.map(([v,l,c],i)=>statCell(v,l,i===cells.length-1,c)).join('')+(pad?'<div style="flex:1;min-width:0;border-left:1px solid #2e2e2e"></div>':'');
}
function renderMiniStats(p){
  if(!p)return'';
  const fg=(p.pt2??0)+(p.pt3??0);
  return statRow([[1,'GP'],[p.pts??0,'PTS'],[p.pts??0,'PPG'],[fg,'FG'],[p.pt1??0,'FT'],[p.pt3??0,'3PT'],[p.fouls??0,'FL']]);
}
function finalClass(rn){
  if(!rn)return'';
  const r=rn.toLowerCase();
  if(r.includes('grand final')||r==='gf')return'gf';
  if(r.includes('final')||r.includes('semi')||r.includes('quarter')||r.includes('elimination')||r.includes('preliminary')||r.includes('playoff'))return'sf';
  return'';
}
function sortSeasonsDesc(arr){
  function snYear(sn){
    const sl=sn.match(/(\d{4})\/(\d{2})/);
    if(sl)return parseInt(sl[1].slice(0,2)+sl[2]);
    return parseInt(sn.match(/\d{4}/)?.[0]||'0');
  }
  return[...arr].sort((a,b)=>{
    const ya=snYear(a.sn||''),yb=snYear(b.sn||'');
    if(yb!==ya)return yb-ya;
    // 2026-08-02: rank by COMP START DATE within the shared end-year, i.e. the
    // date of the comp's first round, approximated from the season name (the
    // only start signal available client-side — no per-season date index exists).
    // AEST chronology: Summer 2025/26 tips off ~Oct 2025 (earliest — note snYear
    // files it under its END year), Autumn ~Feb, Winter ~Apr, Spring ~Sep. The
    // old map {Autumn:3,Winter:2,Summer:1,Spring:1} ranked completed Autumn
    // above a running Winter and pinned brand-new Spring to the bottom.
    const ord={Spring:4,Winter:3,Autumn:2,Summer:1};
    const ka=Object.keys(ord).find(k=>a.sn?.startsWith(k))||'';
    const kb=Object.keys(ord).find(k=>b.sn?.startsWith(k))||'';
    return(ord[kb]||0)-(ord[ka]||0);
  });
}

// Merge regs with same (sid, tid) within a player's season list
function abbreviateGrades(grades){
  if(grades.length<=1)return grades[0]||'';
  const sp=grades.map(g=>g.split(' '));
  let pLen=0;
  outer:for(let i=0;i<sp[0].length;i++){
    for(let j=1;j<sp.length;j++){if(sp[j][i]!==sp[0][i])break outer;}
    pLen=i+1;
  }
  const pre=sp[0].slice(0,pLen).join(' ');
  const suf=sp.map(s=>s.slice(pLen).join(' ')).filter(Boolean);
  if(!pre)return grades.join(' / ');
  return(pre+(suf.length?' '+suf.join(' / '):'')).trim();
}
function gradeAbbrev(gn, allRegGrades){
  // Show only the suffix of gn after stripping common prefix of all reg grades
  if(!gn||allRegGrades.length<=1)return gn||'';
  const sp=allRegGrades.map(g=>g.split(' '));
  let pLen=0;
  outer:for(let i=0;i<sp[0].length;i++){
    for(let j=1;j<sp.length;j++){if(!sp[j][i]||sp[j][i]!==sp[0][i])break outer;}
    pLen=i+1;
  }
  const prefix=sp[0].slice(0,pLen).join(' ');
  const suffix=gn.startsWith(prefix)?gn.slice(prefix.length).trim():gn;
  return suffix||gn;
}
function groupRegs(seasons){
  const result=[];
  for(const sn of sortSeasonsDesc(seasons)){
    const byTid=new Map();
    for(const reg of(sn.regs||[])){
      const tid=reg.tid||'_unknown';
      if(!byTid.has(tid))byTid.set(tid,[]);
      byTid.get(tid).push(reg);
    }
    for(const[tid,regs]of byTid){
      result.push({sn,tid,regs});
    }
  }
  return result;
}

/* ── Deep links ───────────────────────────────────────────────────────────────
   navigate() used to call history.pushState(state,'') with NO url, so the address
   bar never changed: every view shared the app's root link and a refresh dumped
   you back to home. The hash is now written too, in the same key=value form the
   footy dashboard uses (parseHash below is that shape), so a link opens the exact
   view it was copied from.
   Keys: p=player uuid · t=team tid with s=sid · v=venue vid with vn=name ·
         o=opponent tid with s=sid and f=from-player · mo=my tid for a team-vs-team
   Anything unrecognised falls back to home rather than erroring. */
function parseHash(h){
  const out={};
  String(h||'').replace(/^#/,'').split('&').filter(Boolean).forEach(kv=>{
    const i=kv.indexOf('='); if(i<1)return;
    out[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));
  });
  return out;
}
function hashFor(type,d){
  const e=encodeURIComponent;
  if(type==='player') return `p=${e(d.uuid)}`;
  if(type==='team')   return `t=${e(d.tid)}&s=${e(d.sid)}`;
  if(type==='venue')  return `v=${e(d.vid)}` + (d.vname?`&vn=${e(d.vname)}`:'');
  if(type==='opp')    return `o=${e(d.oppTid)}&s=${e(d.sid)}` + (d.fromUuid?`&f=${e(d.fromUuid)}`:'');
  if(type==='teamopp')return `mo=${e(d.myTid)}&o=${e(d.oppTid)}&s=${e(d.sid)}`;
  if(type==='h2h')    return `h=${e(d.a)}` + (d.b?`&h2=${e(d.b)}`:'');
  if(type==='grading')return `gs=${e(d.sid)}&gk=${e(d.key)}`;
  if(type==='club')   return `c=${e(d.cid)}` + (d.cname?`&cn=${e(d.cname)}`:'') + (d.week?`&w=${e(d.week)}`:'');
  return '';
}
/* The share link is always absolute and always names index.html — GitHub Pages
   serves the directory form too, but a bare directory link is the one that breaks
   when pasted into apps that append to the path. */
function shareBase(){
  let path=location.pathname;
  if(path.endsWith('/')) path+='index.html';
  return location.origin+path;
}
function shareURL(){
  const h=(location.hash||'').replace(/^#/,'');
  return shareBase()+(h?'#'+h:'');
}
/* Restore a view from the hash on load. Called once, after the indexes are in. */
function applyHash(){
  const q=parseHash(location.hash);
  if(q.p)       { loadPlayer(q.p,false); return true; }
  if(q.t&&q.s)  { loadTeam(q.t,q.s,false); return true; }
  if(q.v)       { loadVenue(q.v,q.vn||'',undefined,false); return true; }
  if(q.h)       { openH2H(q.h,q.h2||null,false); return true; }
  if(q.c)       { loadClub(q.c,q.cn||'',q.w||null,false); return true; }
  if(q.gs&&q.gk){ grBuild(q.gs).then(()=>grOpen(q.gs,q.gk,false)); return true; }
  if(q.mo&&q.o&&q.s){ openTeamOpp(q.mo,q.o,q.s,false,false); return true; }
  if(q.o&&q.s)  { openOpp(q.o,q.s,q.f,false); return true; }
  return false;
}

/* The QR is a STATIC image of the app's home URL, not a generated code for the
   current view. An encoder was written and embedded on 2026-09-13 and REMOVED the
   same day: it passed every structural check available offline — finder, timing and
   alignment placement, format bits decoding back to ECC M, Reed-Solomon syndromes
   zero against independently built GF(256) tables, payload round-tripping out of
   the de-interleaved data — and still would not scan on a phone. None of those
   checks can catch what a real decoder rejects, so it went out untested in the only
   way that matters. Do not re-add a generated QR without a scan test.
   Consequence, stated in the sheet itself: the SCAN opens StatTrack, the COPIED
   LINK opens this exact view. They are deliberately not the same thing. */

/* ── Share sheet ─────────────────────────────────────────────────────────────*/
function openShare(){
  const url=shareURL();
  el('shurl').textContent=url;
  el('shqr').innerHTML=`<img src="assets/qr-code.png" alt="QR code to open StatTrack" width="200" height="200" style="display:block;width:200px;height:200px">`;
  el('shwrap').classList.add('on');
  // Copy straight away — opening the sheet IS the share action, and the button
  // below is a retry rather than the first step. This runs inside the click
  // handler, which is what keeps the clipboard write inside a user gesture; moving
  // it behind an await or a timeout would make the browser refuse it.
  copyShare();
}
function closeShare(){ el('shwrap').classList.remove('on'); }
function copyShare(){
  const url=shareURL(), btn=el('shcopy');
  const ok=()=>{ btn.textContent='\u2713 Link copied'; setTimeout(()=>{btn.textContent='Copy link again';},2200); };
  // No clipboard API on http:// or an older browser — select the text instead so
  // there is still something to do, rather than a dead button.
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok).catch(selectShare);
  else selectShare();
}
function selectShare(){
  const n=el('shurl'), r=document.createRange(); r.selectNodeContents(n);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

function showV(id){

  // Scroll main to top on every view change
  const m=el('main');if(m)m.scrollTop=0;
  // Shown on every view INCLUDING home — home is a link worth sharing, it is just
  // the app itself rather than one player.
  const sb=el('shbtn'); if(sb)sb.classList.add('on');
  // leaders always fullscreen regardless of device; mobile also fullscreen for non-home
  const fullscreen=id==='view-leaders'||window.innerWidth<=768;
