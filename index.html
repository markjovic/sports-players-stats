      // Both rows, and re-hydrate: every file is cached by now, so this repaints
      // the career lines without a single request.

      hydrateCareers(sorted2.map(([u])=>u));
      ve2.querySelectorAll('.rtbl th[data-col]').forEach(th=>{
        th.style.color=th.dataset.col===col?'var(--accent)':'';
        th.textContent=th.dataset.col===col?(newDir===-1?th.dataset.label+' ↓':th.dataset.label+' ↑'):th.dataset.label;
      });
    };
    const thStyle='cursor:pointer;user-select:none';
    h+=`<table class="rtbl"><thead><tr>
      <th>Player</th>
      <th data-col="gp" data-label="GP" style="${thStyle}" onclick="el('view-team')._sort('gp')">GP</th>
      <th data-col="pts" data-label="PTS" style="${thStyle};color:var(--accent)" onclick="el('view-team')._sort('pts')">PTS ↓</th>
      <th data-col="ppg" data-label="PPG" style="${thStyle}" onclick="el('view-team')._sort('ppg')">PPG</th>
      <th data-col="fg" data-label="FG" style="${thStyle}" onclick="el('view-team')._sort('fg')">FG</th>
      <th data-col="ft" data-label="FT" style="${thStyle}" onclick="el('view-team')._sort('ft')">FT</th>
      <th data-col="3pt" data-label="3PT" style="${thStyle}" onclick="el('view-team')._sort('threePt')">3PT</th>

    el('view-team')._sort=sortBy;

  }
  h+=`<div class="slist" id="tc-avail-${tesc}"><div class="sec-lbl">Who played which round</div>
    <div class="av-body"><div class="av-msg">Reading the season game file…</div></div></div>`;
  h+=`</div></div><div id="f${tesc}" class="tpane">`;
  h+=`<div id="tc-rounds-${tesc}"></div>`;
  if(!fixtures.length){h+='<div class="empty">No fixture data</div>';}
  else{
    const priors=fixturePriors(td,tid);
    const ford=supOrder(fixtures, f=>f.gameId, f=>(typeof f.sup==='string'&&f.sup)?f.sup:null);
    h+=ford.rows.map(f=>{

      // team-stats carries `sup` on the fixture entry (build-team-stats.js). The
      // team card renders team-stats, not games/bv, which is why the flag had to
      // be propagated into the build rather than skipped in the UI.
      const sup=(typeof f.sup==='string'&&f.sup)?f.sup:null;
      const resH=res?`<div class="g-res r${res}">${res}</div>`
                :sup?`<div class="g-res rU"><span class="bdg bSUP" title="${ford.orphans.has(f)?'Cancelled by a regrade \u2014 opens the game played instead':'Cancelled by a regrade \u2014 the game played instead is the next row'}">${ford.orphans.has(f)?'RGRD':'\u2193 RGRD'}</span></div>`

      return`<div class="frow${fc?' '+fc:''}${sup?' sup-row':''}" data-gid="${esc(f.gameId)}" data-sid="${esc(sid)}"${f.result?' data-result="'+esc(f.result)+'"':''}${sup?' data-sup="'+esc(sup)+'"':''} >

        <div><div class="fopp">${esc(f.oppName||'\u2014')}</div><div class="fdt">${esc(fmtD(f.date||''))}</div>${prH}</div>
        <div class="fsc">${esc(f.score||'')}</div>${resH}</div>`;
    }).join('');

  h+='</div>';

  // Career lines fill in after paint — the season rows are already on screen.
  hydrateCareers(Object.keys(td.roster||{}));
  // The cards read the same roster and the same career blocks, so they add no
  // request of their own: tcHydrate waits on playerFile's cache, which
  // hydrateCareers has already warmed.
  {

      car:careerOf(S.players[uuid])||null}));
    tcDraw(key);
    tcHydrate(key,stc.roster.map(r=>r.uuid));

  ve.querySelectorAll('.frow').forEach(r=>r.addEventListener('click',()=>{

    (async()=>{
      if(!S.games[sid2]){const d=await sgj('games/bv',sid2);S.games[sid2]=d||{games:{}};}
      const g2=S.games[sid2]?.games?.[gid2];
      // ⚠️ 2026-10-01 — WAS openTeamOpp(hTid(g2), aTid(g2), …), i.e. the HOME team
      // as "my" team. Whenever the team being viewed was the AWAY side the whole
      // view inverted: the opposition's players were listed at the top with the
      // focus team's players nested beneath them. `tid` is the team whose page this
      // fixture row belongs to, so it is the focus team by definition.
      if(g2&&hTid(g2)&&aTid(g2)){
        const home=hTid(g2), away=aTid(g2);
        const mine=(away===tid)?away:home, theirs=(mine===home)?away:home;
        openTeamOpp(mine,theirs,sid2,true);

}
/* ── ROUND BY ROUND (v1.68) ────────────────────────────────────────────────
   The fixtures are already on the page with their scores and results, and
   nothing drew the team's own season. Height is the team's score; the lane
   underneath is the margin, which is what separates a 70-20 from a 50-45 —
   both of which the score bars alone draw as wins. */
function tcScores(f){
  const m=String(f.score||'').match(/(\d+)\D+(\d+)/);
  if(!m)return null;
  let us=+m[1],them=+m[2];
  // The score string's order is not guaranteed to be ours-first, but the result
  // letter is authoritative: trust it over the string rather than silently
  // drawing a win as a loss.
  if(f.result==='W'&&us<them||f.result==='L'&&us>them){const t=us;us=them;them=t;}
  return{us,them};
}
function tcRounds(key,fixtures){
  const host=el('tc-rounds-'+key); if(!host)return;
  const played=fixtures.map(f=>({f,s:tcScores(f)})).filter(x=>x.s);
  if(played.length<2){host.innerHTML='';return;}
  const vals=played.map(x=>x.s.us);
  const mx=Math.max(...vals,1), av=vals.reduce((a,b)=>a+b,0)/vals.length;
  const mmx=Math.max(...played.map(x=>Math.abs(x.s.us-x.s.them)),1);
  const bars=played.map(({f,s})=>{
    const cl=s.us>s.them?'W':s.us<s.them?'L':'D';
    return `<div class="rb ${cl}" title="${esc([f.rn,f.oppName].filter(Boolean).join(' \u00b7 '))} \u00b7 ${s.us}\u2013${s.them}"
       onclick="openSheet('${esc(f.gameId)}','${esc(f.sid||'')}')">
      <div class="sc"><span>${s.us}</span></div>
      <div class="barw" style="height:${Math.max(4,Math.round(s.us/mx*100))}%"></div>
      <div class="lb">${esc(String(f.rn||'').replace(/^Round\s*/i,''))}</div></div>`;}).join('');
  const lane=played.map(({f,s})=>{
    const m=s.us-s.them, hp=Math.round(Math.abs(m)/mmx*34);
    return `<div class="mc" title="${esc(f.oppName||'')} \u00b7 ${m>0?'+':''}${m}">
      <div class="mb ${m>=0?'p':'n'}" style="height:${hp}%"></div>
      <div class="mv" style="${m>=0?'bottom':'top'}:calc(50% + ${hp}%);${m>=0?'padding-bottom':'padding-top'}:2px">${m>0?'+':''}${m}</div></div>`;}).join('');
  host.innerHTML=`<div class="tr-wrap">
    <div class="tr-rounds"><span class="tr-avgl">avg ${av.toFixed(1)}</span>
      <div class="tr-avg" style="bottom:${26+Math.round(av/mx*(160-26-18))}px"></div>${bars}</div>
    <div class="tr-mgn"><div class="tr-ml"></div><span class="tr-mttl">margin</span>${lane}</div></div>`;
}

/* ── WHO PLAYED WHICH ROUND ────────────────────────────────────────────────
   One season game file, then g.p[] against the roster. A filled cell is a name
   on that game's sheet; an outlined one is a game the squad played without
   them. Rows a player could not have been part of are not distinguished from
   ones they missed, because the data does not say which. */
async function tcAvail(key,tid,sid,btn){
  const host=el('tc-avail-'+key); if(!host)return;
  const box=host.querySelector('.av-body')||host;
  if(btn)btn.disabled=true;
  box.innerHTML='<div class="av-msg">Reading the season game file\u2026</div>';
  if(!S.games[sid])S.games[sid]=await sgj('games/bv',sid)||{games:{}};
  const gf=(S.games[sid]&&S.games[sid].games)||{};
  const st=tcSt(key);
  const fx=(st.fixtures||[]).filter(f=>f.result&&f.gameId&&gf[f.gameId]);
  if(btn)btn.disabled=false;
  if(!fx.length){box.innerHTML='<div class="av-msg">The season game file holds none of this team\u2019s played fixtures.</div>';return;}
  const roster=st.roster||[];
  const present=fx.map(f=>{
    const g=gf[f.gameId];
    const ids=new Set((Array.isArray(g.p)?g.p:[]).map(e=>t13(typeof e==='string'?e:(e&&e.id))).filter(Boolean));
    return ids;
  });
  const any=present.some(s=>s.size);
  if(!any){box.innerHTML='<div class="av-msg">These game records carry no team sheet, so who played cannot be read from them.</div>';return;}
  const rows=roster.map(r=>{
    const k=t13(r.uuid);
    const cells=present.map(s=>s.has(k));
    return{name:r.name,uuid:r.uuid,cells,n:cells.filter(Boolean).length};
  }).sort((a,b)=>b.n-a.n);
  box.innerHTML=`<div class="av-hd">${rows.length} player${rows.length===1?'':'s'} \u00b7 ${fx.length} game${fx.length===1?'':'s'}</div>
    <div class="av-grid">
      <div class="av-rhd">${fx.map(f=>`<span title="${esc(f.oppName||'')}">${esc(String(f.rn||'').replace(/^Round\s*/i,''))}</span>`).join('')}</div>
      ${rows.map(r=>`<div class="av-r"><span class="n" onclick="loadPlayer('${esc(r.uuid)}')" title="Open ${esc(r.name)}">${esc(r.name)}</span>${
        r.cells.map((c,i)=>`<span class="c ${c?'on':'out'}" title="${esc(fx[i].oppName||'')} \u00b7 ${c?'played':'did not play'}"></span>`).join('')}
        <span class="tot">${r.n}/${fx.length}</span></div>`).join('')}
    </div>`;
}

/* ── SEASON FOUL-OUTS (v1.71) ──────────────────────────────────────────────
   The Top tab's season leaderboard, leaderboard/season/{sid}.json, is keyed
   `trunc13(uuid)|tid` and carries a PLAIN NUMBER foulOuts per player — the same
   figure the FO leaderboard ranks on. One file for the whole team, cached in
   S.lbRaw where the Top tab also looks, so opening both costs one fetch between
   them. This is why the season FO column exists at all: the team roster block
   does not carry the field. */
async function tcFoulOuts(key,tid,sid){
  const st=TC[key]; if(!st||st.foDone)return;
  st.foDone=1;
  if(!S.lbRaw)S.lbRaw={};
  if(!S.lbRaw[sid]){
    const raw=await sgj('leaderboard/season',sid);
    S.lbRaw[sid]=(raw&&raw.players)||{};
  }
  const pm=S.lbRaw[sid]||{};
  const want=new Map((st.roster||[]).map(r=>[t13(r.uuid),r]));
  let any=false;
  for(const[k,m]of Object.entries(pm)){
    const r=want.get(t13(k.split('|')[0]));
    if(!r)continue;
    const v=m&&m.foulOuts;
    if(typeof v!=='number'||!isFinite(v))continue;
    any=true;
    r.sea.foulOuts=Math.max(r.sea.foulOuts||0,v);
  }
  if(any&&el('tc-'+key))tcDraw(key);
}

/* ── SCORELESS GAMES (v1.70) ───────────────────────────────────────────────
   PlayHQ publishes no scoreless count, so it is derived: a box-score line with
   zero points, for a player named on that game's sheet. One request per PLAYED
   GAME — not per player — because one box score carries both full teams. A
   season is 14-20 games against a career's 100+, which is why this runs on
   opening a team where the player view makes the equivalent wait for a tab.

   A player's zero is only counted for games they were actually in: a name
   missing from the sheet is an absence, and counting it as a scoreless game
   would punish the injured.

   Foul-outs are NOT derived here. A box line carries number, name, PTS, 2PT,
   3PT, FT and fouls — nothing saying the player fouled out of that game. The FO
   figures in this view come from PlayHQ's own season and career totals. */
async function tcGameLines(key,tid,sid){
  const st=TC[key]; if(!st||st.zeroDone)return;
  st.zeroDone=1;
  const fx=(st.fixtures||[]).filter(f=>f.result&&f.gameId);
  if(!fx.length)return;
  const byKey=new Map((st.roster||[]).map(r=>[t13(r.uuid),r]));
  const zero=new Map(), seen=new Map();
  const queue=fx.slice();
  let read=0;
  await Promise.all(Array.from({length:Math.min(6,queue.length)},async()=>{
    while(queue.length){
      const f=queue.shift();
      const bs=await fetchBox(f.gameId);
      if(!bs)continue;
      read++;
      for(const line of [...(bs.h||[]),...(bs.a||[])]){
        const k=t13(line&&line.profileID);
        if(!k||!byKey.has(k))continue;                 // other team, or not on this roster
        seen.set(k,(seen.get(k)||0)+1);
        if(!(line.pts||0))zero.set(k,(zero.get(k)||0)+1);
      }
    }
  }));
  if(!read||!seen.size)return;                          // nothing read: offer nothing
  for(const[k,r]of byKey){
    if(!seen.has(k))continue;                           // never appeared in a box score
    r.sea.zero=zero.get(k)||0;
  }
  if(el('tc-'+key))tcDraw(key);
}

/* The player view's panes, unlike the team view's two, are addressed by id and
   the bar is built from one list, so one handler turns the others off rather
   than naming the pane to hide. */
function switchPTab(btn,showId,uuid,which){
  const bar=btn.parentElement;
  bar.querySelectorAll('.vtab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const host=bar.parentElement;
  host.querySelectorAll(':scope > .tpane').forEach(p=>p.classList.toggle('on',p.id===showId));
  pTabLoad(uuid,which);
}
/* A pane fills itself the first time it is opened. Nothing here runs when the
   profile loads: these panels read one file per season, and the highs and the
   splits read one BOX SCORE PER GAME, which is not a cost to pay for a player
   somebody only wanted the season cards of. Opening the tab is the consent.
   Once loaded it stays loaded, so coming back is instant. */
const PTAB_DONE={};
function pTabLoad(uuid,which){
  if(!uuid||!which)return;
  const k=uuid+'|'+which;
  if(PTAB_DONE[k])return;
  PTAB_DONE[k]=1;
  if(which==='L'){
    (async()=>{ hydrateHighs(uuid); await buildSplits(uuid,null); hydrateHighs(uuid); })();
  } else if(which==='O'){
    // Sequential, not parallel: the team sheets the mates panel loads are the
    // same files buildOppStats then walks, so running them in order costs
    // nothing extra and puts something on screen while the slow one works.
    (async()=>{ await buildMates(uuid,null); await buildOppStats(uuid,null); })();
  }
}
function switchTTab(btn,showId,hideId){
  btn.closest('.vtabs').querySelectorAll('.vtab').forEach(b=>b.classList.toggle('on',b===btn));
  const sp=el(showId),hp=el(hideId);
  if(sp)sp.classList.add('on');if(hp)hp.classList.remove('on');
}


/* ── Venue season filter ── */
async function buildVenueSeasonPicker(){
  if(!S.idx)return;
  // Populate season picker for venues (all season names, newest first)
  const nm=new Map();
  for(const s of Object.values(S.idx.seasons)){
    if(!nm.has(s.name))nm.set(s.name,{name:s.name,active:false,sids:[]});
    nm.get(s.name).sids.push(s.id);
    if(!s.locked)nm.get(s.name).active=true;
  }
  const sorted=[...nm.values()].sort((a,b)=>{
    if(a.active!==b.active)return a.active?-1:1;
    const ya=a.name.match(/\d{4}/)?.[0]||'0',yb=b.name.match(/\d{4}/)?.[0]||'0';
    return parseInt(yb)-parseInt(ya);
  });
  const sel=el('q-vsn');
  sel.innerHTML='<option value="">All seasons</option>'+sorted.map(s=>`<option value="${esc(JSON.stringify(s.sids))}">${esc(s.name)}${s.active?' \u25cf':' \ud83d\udd12'}</option>`).join('');
}

function dayOfWeekN(y,m,d){const t=[0,3,2,5,0,3,5,1,4,6,2,4];const yr=m<3?y-1:y;return(yr+Math.floor(yr/4)-Math.floor(yr/100)+Math.floor(yr/400)+t[m-1]+d)%7;}
function groupByMonth(dates){const m=new Map();for(const d of dates){const ym=d.slice(0,7);if(!m.has(ym))m.set(ym,[]);m.get(ym).push(d);}return m;}
function calGrid(byMonth,vid,todayStr){
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW='<div class="vcd">M</div><div class="vcd">T</div><div class="vcd">W</div><div class="vcd">T</div><div class="vcd">F</div><div class="vcd">S</div><div class="vcd">S</div>';
  let h='<div class="vcal-wrap">';
  for(const[ym,ds]of byMonth){
    const[y,m]=ym.split('-').map(Number);
    h+=`<div class="vcal-col" id="vcal-m-${y}-${String(m).padStart(2,'0')}"><div class="vcm">${MN[m-1]} ${y}</div><div class="vcg">${DOW}`;
    let prevDay=null;
    for(const d of ds){
      const[,,dyStr]=d.split('-');
      const dy=parseInt(dyStr);
      if(prevDay===null){
        const dow=(dayOfWeekN(y,m,dy)+6)%7;
        for(let i=0;i<dow;i++)h+='<div></div>';
      } else {
        for(let i=0;i<dy-prevDay-1;i++)h+='<div></div>';
      }
      const isSel=d===S.venueSelDate,isToday=d===todayStr;
      h+=`<button class="vday${isToday?' vtoday':''}${isSel?' vsel':''}" data-date="${d}" onclick="selectVenueDate('${esc(vid)}','${d}',this)">${dy}</button>`;
      prevDay=dy;
    }
    h+='</div></div>';
  }
  return h+'</div>';
}
function renderKnownDates(dates,vid,todayStr,pageIdx){
  const byMonth=groupByMonth(dates);
  const months=[...byMonth.keys()];
  if(!months.length)return'<div class="empty">No dates on record.</div>';
  const total=months.length;
  if(pageIdx==null){
    // Find month nearest to today, put it in the middle of the 3-month window
    const todayYM=todayStr?todayStr.slice(0,7):'';
    let nearest=total-1;
    for(let i=0;i<months.length;i++){if(months[i]>=todayYM){nearest=i;break;}}
    pageIdx=Math.max(0,Math.min(nearest-1,total-3)); // nearest as middle
  }
  pageIdx=Math.max(0,Math.min(pageIdx,total-1));
  const visible=months.slice(pageIdx,pageIdx+3);
  const pageMap=new Map(visible.map(m=>[m,byMonth.get(m)]));
  const hasPrev=pageIdx>0;
  const hasNext=pageIdx+3<total;
  // Jump input: find page containing selected month
  const jumpHtml=`<div class="vcal-jump"><label>Jump to:</label><input type="month" class="sinput" oninput="vCalJump('${esc(vid)}','${esc(todayStr||'')}',this.value)"></div>`;
  const nav=`<div class="vcal-nav"><button ${hasPrev?'':'disabled'} onclick="vCalPage('${esc(vid)}','${esc(todayStr||'')}',${Math.max(0,pageIdx-3)})">← Earlier</button><span style="font-size:0.78rem;color:var(--text2)">${visible[0].replace('-',' / ')} – ${visible[visible.length-1].replace('-',' / ')}</span><button ${hasNext?'':'disabled'} onclick="vCalPage('${esc(vid)}','${esc(todayStr||'')}',${Math.min(total-3,pageIdx+3)})">Later →</button></div>`;
  return jumpHtml+nav+calGrid(pageMap,vid,todayStr);
}
function vCalPage(vid,todayStr,pageIdx){
  const dates=S.venueDates[vid]||[];
  const cs=document.getElementById('cal-section');
  if(cs)cs.innerHTML=renderKnownDates(dates,vid,todayStr,pageIdx);
  const ga=document.getElementById('vgrid-area');if(ga)ga.innerHTML='';
}
function vCalJump(vid,todayStr,monthVal){
  if(!monthVal)return;
  const byMonth=groupByMonth(S.venueDates[vid]||[]);
  const months=[...byMonth.keys()];
  // Find the first page that includes this month (or nearest)
  const target=monthVal.slice(0,7);
  let best=Math.max(0,months.length-3);
  for(let i=0;i<months.length;i++){if(months[i]>=target){best=Math.max(0,i-1);break;}}
  vCalPage(vid,todayStr,best);
}
function jumpToMonth(vid,todayStr,monthVal,isKnown){
  if(!monthVal)return;
  if(isKnown){vCalJump(vid,todayStr,monthVal);return;}
  // Range calendar
  const today=mkDate(new Date());
  const[y,m]=monthVal.split('-');
  const target=new Date(parseInt(y),parseInt(m)-1,1);
  const now=new Date();
  const weeksOff=Math.round((target-now)/(7*24*3600*1000));
  S.calOffset=weeksOff;
  const cs=el('cal-section');
  if(cs)cs.innerHTML=renderCalRange(vid,todayStr||today,S.calOffset);
  const ga=el('vgrid-area');if(ga)ga.innerHTML='';
}
function renderCalRange(vid,todayStr,offsetWeeks){
  S.calOffset=offsetWeeks;
  const base=new Date();base.setDate(base.getDate()+offsetWeeks*7-14);
  const dates=[];for(let i=0;i<30;i++){const d=new Date(base);d.setDate(d.getDate()+i);dates.push(mkDate(d));}
  const from=fmtDow(dates[0]),to=fmtDow(dates[dates.length-1]);
  return`<div class="vcal-nav"><button onclick="shiftCal('${esc(vid)}','${esc(todayStr)}',-1)">\u2190 Earlier</button><span>${esc(from)} \u2013 ${esc(to)}</span><button onclick="shiftCal('${esc(vid)}','${esc(todayStr)}',1)">Later \u2192</button></div>
<div class="vcal-jump"><label>Jump to:</label><input type="month" class="sinput" oninput="jumpToMonth('${esc(vid)}','${esc(todayStr)}',this.value)"></div>
${calGrid(groupByMonth(dates),vid,todayStr)}`;
}
function selectVenueDate(vid,date,btn){
  S.venueSelDate=date;
  document.querySelectorAll('.vday').forEach(b=>b.classList.remove('vsel'));
  if(btn)btn.classList.add('vsel');
  else{const b=document.querySelector(`.vday[data-date="${date}"]`);if(b)b.classList.add('vsel');}
  loadVenueDay(vid,date);
}
function shiftCal(vid,todayStr,dir){
  S.calOffset+=dir;
  const cs=el('cal-section');
  if(cs)cs.innerHTML=renderCalRange(vid,todayStr,S.calOffset);
  const ga=el('vgrid-area');if(ga)ga.innerHTML='';
}
async function loadVenueDay(vid,date){
  const ga=el('vgrid-area');
  ga.innerHTML='<div class="load-row">Loading schedule\u2026</div>';
  const key=vid+'/'+date;
  if(!S.venueDay[key]){const d=await gj(BASE+'/venue-lookup/'+vid+'/'+date+'.json');S.venueDay[key]=d||null;}

}

function renderVGrid(day,container){
  const courts=Object.keys(day).sort();
  const tset=new Set();
  for(const c of courts)for(const g of day[c])if(g.t)tset.add(g.t);
  const times=[...tset].sort();
  if(!times.length){container.innerHTML+='<div class="empty">No scheduled games found.</div>';return;}
  let h='<div class="vgwrap"><table class="vgtbl"><thead><tr><th>Court</th>';
  for(const t of times)h+=`<th>${esc(t)}</th>`;
  h+='</tr></thead><tbody>';
  for(const c of courts){
    h+=`<tr><td>${esc(c)}</td>`;
    const byT=new Map(day[c].map(g=>[g.t,g]));
    for(const t of times){
      const g=byT.get(t);
      if(g){
        const fin=g.st==='FINAL',up=(g.st==='UPCOMING'||g.st==='PRE_GAME');
        // comp/grade if available in data (future data enhancement)
        const compLine=g.comp||g.grade?`<div class="gc">${esc([g.comp,g.grade].filter(Boolean).join(' \u00b7 '))}</div>`:'';
        h+=`<td><div class="ggame${fin?' fin':up?' up':''}" data-gid="${esc(g.id)}" data-sid="${esc(g.sid||'')}">
          <div class="gt">${(([hN,aN])=>`${esc((hN||'?').slice(0,14))} vs ${esc((aN||'?').slice(0,14))}`)(teamNames(g))}</div>
          ${compLine}<div class="gs">${esc(g.st||'')}</div></div></td>`;
      }else h+='<td></td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  container.innerHTML+=h;
  container.querySelectorAll('.ggame').forEach(g=>{
    g.addEventListener('click',()=>{
      if(g.dataset.sid)openSheet(g.dataset.gid,g.dataset.sid);
      else{
        el('sh-title').textContent='Game';
        el('sh-body').innerHTML=`<div class="gmode-blk"><div class="gmode-msg">Game ID: ${esc(g.dataset.gid)}<br><span style="color:var(--text3);font-size:0.8rem">Full detail requires season context \u2014 data update pending.</span></div></div>`;
        el('sov').classList.add('open');
      }
    });
  });
}

/* ── CLUBS (v1.22) ───────────────────────────────────────────────────────────
   Pick a club, see every team it runs in one Mon–Sun week: results and upcoming
   games, grouped BY DAY and then BY COMPETITION inside the day.

   WHERE THE CLUB COMES FROM. Nowhere in this repo before 2026-10-11. `club`
   everywhere else here is `season.club`, which nightly-crawl.js writes as the
   sports-index `orgName` — the ASSOCIATION, not the club — and team-stats
   `meta.club` is only ever populated for teams that have played no games. The
   real club is PlayHQ's team `organisation`, captured by build-club-index.js
   into clubs/{clubId}.json. Measured over the whole database: 408,784 teams,
   100.0% of them carrying a club, 866 clubs.

   ⚠️ ASSOCIATIONS APPEAR IN THE CLUB LIST AND ARE NOT FILTERED (Mark, 2026-10-11).
   The five largest are leagues and associations, not clubs — VJBL alone owns
   10,371 teams — because PlayHQ genuinely records a rep team as belonging to
   VJBL. Hiding them would make 10,371 teams unreachable. Do not "tidy" this.

   ⚠️ READ THE GAME FILE, NOT team-stats. A team-stats fixture carries only
   {gameId,date,rn,oppId,oppName,result,score,st} — no time, no venue, no court
   and no per-game grade. games/bv/{sid}.json carries all of them, and it is the
   cache the game sheet and the team view already use, so a click through to a
   box score afterwards costs nothing.

   ⚠️ g.h/g.a is NEVER sufficient — a game carries h/a OR t1/t2, never both
   (T44). Every id here goes through hTid()/aTid() and every name through
   teamNames(), exactly as the other nineteen sites do. */

const CLUB_SEASON_CAP     = 12;  // games files fetched for one week, at most
const CLUB_DERIVED_MONTHS = 15;  // implied season length when endDate is absent

function dAdd(ds, n){ const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return mkDate(d); }
function addMonths(ds, n){ const d = new Date(ds + 'T00:00:00'); d.setMonth(d.getMonth() + n); return mkDate(d); }
/* Monday of the week containing ds. dayOfWeek is 0=Sun..6=Sat, so Monday is 0
   back and Sunday is 6 back — NOT dow-1, which sends Sunday forward six days
   into the following week. */
function mondayOf(ds){
  const [y, m, dy] = ds.split('-').map(Number);
  return dAdd(ds, -(((dayOfWeek(y, m, dy)) + 6) % 7));
}
function clubWeekLabel(mon){ return fmtDow(mon) + ' – ' + fmtDow(dAdd(mon, 6)); }

/* ── Club leaders ──────────────────────────────────────────────────────────
   NO BUILD STEP AND NO NEW DATA. Both artifacts are already published and
   already fetched elsewhere in this page:
     clubs/{cid}.json          seasons → [tid]   (loadClub already has it)
     team-stats/bv/{sid}.json  teams[tid].roster[truncUuid] =
                               { name, gp, pts, fg, ft, threePt, fouls }
   — the same file and the same roster the team card renders.

   ⚠ IMMUNE TO T20 BY CONSTRUCTION. build-team-stats.js resolves ONE
   registration per (sid, tid) through extractRegStats and never sums siblings,
   so a roster entry cannot carry the regrade double-count that a naive sum over
   players/ registrations produces. Summing roster entries across teams and
   seasons is therefore correct.

   ⚠ LOADED NEWEST FIRST, RENDERED AS IT ARRIVES. A club can span twenty-odd
   seasons and team-stats files are the largest artifacts in the repo, so the
   table paints after each season rather than after all of them, and says how
   far through it is. A season that fails to load is COUNTED and named in the
   footer — a short table and a complete one must not look alike. */
/* ⚠ THE ROW COUNT IS BOUNDED ON PURPOSE AND "SHOW ALL" DOES NOT EXIST.
   A club is not necessarily small: PlayHQ records a rep team as belonging to its
   league, so VJBL alone owns 10,371 teams and a club like that has players in
   the tens of thousands. Rendering every ranked row in one go would build a DOM
   that size from a single click. The table opens at CLUB_TOP and grows by
   CLUB_STEP per click, so no one render is ever larger than CLUB_STEP rows and
   the cost is always something the person asked for. Neither number is a
   measurement — do not treat them as one. */
const CLUB_TOP   = 100;  // rows on first paint
const CLUB_STEP  = 100;  // rows added per click, and the block the search jumps to
const CLUB_STICK = 10;   // leading rows pinned above the scrolling remainder
const CLUB_CATS = [['gp','Games'],['pts','Points'],['threePt','3-pointers'],['fouls','Fouls'],['fg','Field goals'],['ft','Free throws']];

function clubSeasonStart(sid){
  const se = S.idx?.seasons?.[sid];
  return (se && (se.startDate || se.endDate)) ? String(se.startDate || se.endDate).slice(0,10) : '';
}

async function clubLeadersLoad(){
  const cid = S.clubId, club = S.clubs[cid] || {};
  if(S.clubLead && S.clubLead.cid === cid){ clubLeadersRender(); return; }
  const sids = Object.keys(club.seasons || {})
    .sort((a,b)=>String(clubSeasonStart(b)).localeCompare(String(clubSeasonStart(a))) || String(b).localeCompare(String(a)));
  // sid:'' is ALL SEASONS and is the default — the all-time table is the point,
  // the filter is a narrowing of it. `order` keeps the newest-first season list
  // for the dropdown so it does not have to be re-derived on every render.
  S.clubLead = { cid, rows:new Map(), done:0, total:sids.length, cat:'gp', per:false, failed:[], sid:'', order:sids, loaded:new Set(), show:CLUB_TOP, find:'', hit:null, findMsg:'',
                 pick:null, pickName:'', sug:[], sugIdx:0, sugMore:0, sugOpen:false, cache:null };
  clubLeadersRender();
  for(const sid of sids){
    // A club viewed, left and reopened must not restart a half-finished load.
    if(!S.clubLead || S.clubLead.cid !== cid) return;
    // ⚠ 'team-stats/bv', not 'team-stats'. sgj() takes the whole directory and
    // every other caller in this file passes the /bv. Without it each fetch 404s
    // on both origins and every season reports as failed.
    const ts = await sgj('team-stats/bv', sid);
    if(!ts){ S.clubLead.failed.push(sid); }
    else {
      for(const tid of (club.seasons[sid] || [])){
        const t = ts[tid]; if(!t || !t.roster) continue;
        for(const [key, r] of Object.entries(t.roster)){
          let a = S.clubLead.rows.get(key);
          if(!a) S.clubLead.rows.set(key, a = { uuid:key, name:r.name || key, bySid:new Map() });
          // Kept per season so the filter is a slice of the same numbers the
          // all-time table shows, never a second aggregation that could drift.
          let b = a.bySid.get(sid);
          if(!b) a.bySid.set(sid, b = { gp:0, pts:0, threePt:0, fouls:0, fg:0, ft:0, teams:0 });
          b.gp += r.gp || 0; b.pts += r.pts || 0; b.threePt += r.threePt || 0;
          b.fouls += r.fouls || 0; b.fg += r.fg || 0; b.ft += r.ft || 0; b.teams++;
          if(r.name && a.name === key) a.name = r.name;
        }
      }
    }
    S.clubLead.loaded.add(sid);
    S.clubLead.done++;
    clubLeadersRender();
  }
}

/* The search is a STANDING query, not a one-off. Changing the category or the
   per-game toggle re-sorts the whole ranking, so a player at #109 by games can
   be #3,200 by points: keeping the highlight without re-running the search
   would leave a marked row outside the rendered block and a message quoting a
   rank that no longer exists. Every control that changes the ordering re-runs
   it instead of merely re-rendering. */
function clubLeadersRefind(){
  const L = S.clubLead; if(!L) return;
  /* ⚠ RE-LOCATE THE PERSON, NOT THE TEXT. Changing category or season used to
     re-run the text search, which silently re-answers the question: "Smith"
     resolved to whichever Smith happened to rank highest under the NEW ordering,
     so the highlight could hop between two different people while the box still
     said Smith. A chosen player is an id, and it stays that id. */
  if(L.pick) clubLeadersLocate();
  else if(L.find) clubLeadersFind(L.find);
  else clubLeadersRender();
}
function clubLeadersPick(cat){ if(S.clubLead){ S.clubLead.cat = cat; clubLeadersRefind(); } }
function clubLeadersSeason(sid){
  if(!S.clubLead) return;
  S.clubLead.sid = sid || '';
  S.clubLead.show = CLUB_TOP;          // a different population starts at the default
  S.clubLead.hit = null; S.clubLead.findMsg = '';
  clubLeadersRefind();                  // and the standing search is re-answered against it
}
function clubLeadersMore(){ if(S.clubLead){ S.clubLead.show += CLUB_STEP; clubLeadersRender(); } }
function clubLeadersLess(){ if(S.clubLead){ S.clubLead.show = CLUB_TOP; S.clubLead.hit = null; clubLeadersRender(); } }

/* ── Find a player in the ranking ───────────────────────────────────────
   Searching a ranked list is not filtering it: the point is WHERE someone sits,
   so the table is left whole and the row is scrolled to and marked. The rows
   between here and them are rendered too — jumping to row 3,400 without the
   3,399 above it would show a rank with nothing to read it against — so the
   search expands to the CLUB_STEP block that contains them and no further.
   ⚠ It searches the WHOLE ranking, not the rendered rows. Searching only what
   is on screen would answer "not found" for anyone past the first block, which
   is the opposite of what this is for. */
const CLUB_SUG = 12;        // suggestion rows offered at once

/* ── WHY A LIST AND NOT A JUMP ─────────────────────────────────────────
   The previous version took the typed text and jumped to the FIRST player it
   matched, which is only ever right by luck. A club has several Smiths, two
   players really can share a name, and a short query matches dozens — the
   person typing is the only one who knows which one they meant, and the old
   box never asked. Typing now narrows a list and nothing is selected until a
   row is chosen, by click or by Enter on the highlighted row.
   The expensive half (ranking, re-rendering the panel, scrolling the table)
   happens ONCE, on selection. Typing only filters names against the memoised
   ranking, so the box no longer fights the typist. */

function missMsg(L){
  /* ⚠ A MISS IS NOT NECESSARILY AN ABSENCE. Three different facts read the
     same otherwise: not in this club at all; in the club but not in the season
     being filtered to; or in a season whose file has not arrived yet. */
  const bits = [];
  if(L.sid){
    const nm = (S.idx?.seasons?.[L.sid] && (S.idx.seasons[L.sid].name || S.idx.seasons[L.sid].fullName)) || L.sid;
    bits.push(`in ${esc(nm)}`);
  }
  if(L.done < L.total) bits.push(`and only ${L.done} of ${L.total} season(s) have loaded \u2014 try again when it finishes`);
  else if(!L.sid) bits.push('across all seasons');
  return `no one matching \u201c${esc(L.find)}\u201d ${bits.join(' ')}`;
}

function clubLeadersSugHtml(L){
  if(!L.sugOpen || !L.find) return '';
  if(!L.sug.length) return `<div class="clb-sug"><div class="clb-sug-none">${missMsg(L)}</div></div>`;
  return `<div class="clb-sug" role="listbox">`
    + L.sug.map((x,i)=>
        `<div class="clb-sug-row${i===L.sugIdx?' on':''}" role="option" aria-selected="${i===L.sugIdx}"
              data-uuid="${esc(x.uuid)}"
              onmousedown="event.preventDefault(); clubLeadersChoose('${esc(x.uuid)}')">
           <span class="clb-sug-nm">${esc(x.name)}</span>
           <span class="clb-sug-meta">#${x.rank.toLocaleString()} \u00b7 ${x.gp.toLocaleString()} game${x.gp===1?'':'s'}</span>
         </div>`).join('')
    + (L.sugMore ? `<div class="clb-sug-more">+${L.sugMore.toLocaleString()} more match \u2014 keep typing to narrow</div>` : '')
    + `</div>`;
}

/* Paints ONLY the suggestion box. It must never call clubLeadersRender():
   that would rebuild the input being typed into, which is the bug this whole
   redesign exists to remove. */
function clubLeadersSugPaint(){
  const L = S.clubLead, box = el('clb-sug');
  if(!L || !box) return;
  box.innerHTML = clubLeadersSugHtml(L);
}

function clubLeadersSuggest(q){
  const L = S.clubLead; if(!L) return;
  const t = String(q || '').trim();
  // Emptying the box clears the selection outright — a cleared box still
  // showing a highlighted row reads as a stuck result.
  if(!t){ clubLeadersFind(''); return; }
  L.find = t; L.sug = []; L.sugIdx = 0; L.sugMore = 0; L.sugOpen = true;
  const { ranked } = clubLeadersRanked(L);
  let n = 0;
  for(let i = 0; i < ranked.length; i++){
    if(!tokenMatch(String(ranked[i].name), t)) continue;
    n++;
    if(L.sug.length < CLUB_SUG) L.sug.push({ uuid:ranked[i].uuid, name:ranked[i].name, gp:ranked[i].gp, rank:i+1 });
  }
  L.sugMore = Math.max(0, n - L.sug.length);
  clubLeadersSugPaint();
}

function clubLeadersKey(ev, inp){
  const L = S.clubLead; if(!L) return;
  const k = ev.key;
  if(k === 'ArrowDown' || k === 'ArrowUp'){
    if(!L.sugOpen || !L.sug.length) return;
    ev.preventDefault();
    L.sugIdx = (L.sugIdx + (k === 'ArrowDown' ? 1 : L.sug.length - 1)) % L.sug.length;
    clubLeadersSugPaint(); return;
  }
  if(k === 'Escape'){ L.sugOpen = false; clubLeadersSugPaint(); return; }
  if(k === 'Enter'){
    ev.preventDefault();
    // Enter takes the highlighted row, which starts as the first one.
    if(L.sugOpen && L.sug.length) clubLeadersChoose(L.sug[L.sugIdx].uuid);
    else clubLeadersFind(inp ? inp.value : L.find);   // nothing offered: say so
  }
}

function clubLeadersBlur(){
  const L = S.clubLead; if(!L || !L.sugOpen) return;
  // After the mousedown on a row has had its turn. The row uses mousedown with
  // preventDefault precisely so the click is not lost to this.
  setTimeout(() => { const M = S.clubLead; if(M){ M.sugOpen = false; clubLeadersSugPaint(); } }, 120);
}

function clubLeadersChoose(uuid){
  const L = S.clubLead; if(!L) return;
  const row = L.sug.find(x => x.uuid === String(uuid));
  L.pick = String(uuid || '') || null;
  if(row) L.pickName = row.name;
  L.sugOpen = false; L.sug = []; L.sugIdx = 0; L.sugMore = 0;
  clubLeadersLocate();
}

/* The one place that ranks, renders and scrolls. Everything that selects a
   player ends here, so there is a single definition of what "found" means. */
function clubLeadersLocate(extra){
  const L = S.clubLead; if(!L) return;
  L.hit = null; L.findMsg = '';
  if(!L.pick){ clubLeadersRender(); return; }
  const { ranked } = clubLeadersRanked(L);
  const i = ranked.findIndex(r => r.uuid === L.pick);
  if(i < 0){
    // The player is real — they were chosen from this very list — but they are
    // not in the ranking as it now stands. Say which scope dropped them.
    L.findMsg = L.pickName
      ? `${esc(L.pickName)} is not in this ranking ${L.sid ? '\u2014 no games in the season selected' : '\u2014 no games credited'}`
      : missMsg(L);
    clubLeadersRender(); return;
  }
  const rank = i + 1;
  L.show = Math.max(L.show, Math.max(CLUB_TOP, Math.ceil(rank / CLUB_STEP) * CLUB_STEP));
  L.hit = ranked[i].uuid;
  L.findMsg = `${esc(ranked[i].name)} \u2014 #${rank.toLocaleString()} of ${ranked.length.toLocaleString()}`
            + (extra ? ` \u00b7 ${extra}` : '');
  clubLeadersRender();
  // After paint, not before: the row does not exist until the render that the
  // expansion above triggered has run.
  //
  // ⚠ SCROLL THE LIST, NOT THE PAGE. scrollIntoView() moves every scrollable
  // ancestor, so it dragged the whole club view up and took the heading, the
  // category buttons and the search box off the top of the screen — searching
  // from a box you can no longer see. Only the list container is moved, by the
  // difference between the row and the container, so everything else stays put.
  requestAnimationFrame(() => {
    const wrap = document.querySelector('#club-lead .clb-scroll');
    const row  = document.querySelector('#club-lead .clb-hit');
    if(!wrap || !row || !wrap.contains(row)) return;   // a hit inside the pinned block needs no scroll
    const r = row.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    wrap.scrollTop += (r.top - w.top) - (w.height / 2 - r.height / 2);
  });
}

/* Kept as the text entry point: it resolves text to a player and then goes
   through the same selection path. Used when Enter is pressed with nothing
   offered, and by anything that searches by name rather than by choice. */
function clubLeadersFind(q){
  const L = S.clubLead; if(!L) return;
  L.find = String(q || '').trim();
  L.sug = []; L.sugIdx = 0; L.sugMore = 0; L.sugOpen = false;
  if(!L.find){ L.pick = null; L.pickName = ''; L.hit = null; L.findMsg = ''; clubLeadersRender(); return; }
  /* \u26a0 tokenMatch, not a substring. It is the page's own name matcher (L1257):
     the normName v2 fold on BOTH operands \u2014 curly and straight apostrophes, the
     dash family, accents \u2014 and then every whitespace-separated token must
     appear. A raw toLowerCase().includes() missed "squire louis" for Louis
     SQUIRE because the order differs, and missed O\u2019Brien typed with a straight
     apostrophe. The repo solved this at seven comparison sites in August; this
     is the eighth and it uses the same function rather than a ninth copy. */
  const { ranked } = clubLeadersRanked(L);
  let first = -1, n = 0;
  for(let j = 0; j < ranked.length; j++){
    if(!tokenMatch(String(ranked[j].name), L.find)) continue;
    if(first < 0) first = j;
    n++;
  }
  if(first < 0){ L.pick = null; L.pickName = ''; L.hit = null; L.findMsg = missMsg(L); clubLeadersRender(); return; }
  L.pick = ranked[first].uuid; L.pickName = ranked[first].name;
  clubLeadersLocate(n > 1 ? `${n} names match, this is the highest` : '');
}

/* ONE ranking, used by the render and by the search. Two copies would be two
   answers to "who is #347". */
function clubLeadersRanked(L){
  /* ⚠ MEMOISED, and it has to be. The suggestion list asks for this on every
     keystroke, and ranking every player in the club per character is the exact
     cost that made the old search unusable. The key holds everything that
     changes the RESULT; `show`, `find`, `pick` and the suggestion state are
     excluded because they only change what is drawn from it. Anything added to
     this function that varies on something not in the key will return stale
     rows — put it in the key. */
  const ckey = `${L.cat}|${L.per?1:0}|${L.sid}|${L.done}|${L.rows.size}`;
  if(L.cache && L.cache.key === ckey) return L.cache.out;
  const cat = L.cat, per = L.per && cat !== 'gp', only = L.sid;
  const all = [...L.rows.values()].map(r => {
    const t = { uuid:r.uuid, name:r.name, gp:0, pts:0, threePt:0, fouls:0, fg:0, ft:0, seasons:0, teams:0 };
    for(const [sid, b] of r.bySid){
      if(only && sid !== only) continue;
      t.gp += b.gp; t.pts += b.pts; t.threePt += b.threePt;
      t.fouls += b.fouls; t.fg += b.fg; t.ft += b.ft;
      t.teams += b.teams; t.seasons++;
    }
    return t;
  }).filter(r => r.seasons > 0);
  const ranked = all.filter(r => r.gp > 0);
  const val = r => per ? (r.gp ? r[cat] / r.gp : 0) : r[cat];
  ranked.sort((a,b)=> val(b)-val(a) || b.gp-a.gp || a.name.localeCompare(b.name) || a.uuid.localeCompare(b.uuid));
  const out = { ranked, unranked: all.length - ranked.length, val, per, only, cat };
  L.cache = { key: ckey, out };
  return out;
}
function clubLeadersPer(){ if(S.clubLead){ S.clubLead.per = !S.clubLead.per; clubLeadersRefind(); } }

function clubLeadersRender(){
  const host = el('club-lead'); if(!host) return;
  const L = S.clubLead; if(!L){ host.innerHTML = ''; return; }
  /* ⚠⚠ THIS FUNCTION REBUILDS THE SEARCH BOX, so it must put the person back
     where they were. Replacing host.innerHTML destroys the input they are
     typing into: focus went to the body and the field reset, so typing
     "Lovelace" left "L" and the box went dead after one character. The search
     now runs on Enter rather than per keystroke, which removes most of those
     renders — but not all of them: Enter itself renders, clearing the box
     renders, and changing category or season re-answers the standing search.
     Focus and caret are carried across so none of those lose the cursor.
     The feature was untestable by its own unit tests, which called
     clubLeadersFind() directly and never typed a key. */
  const q0 = host.querySelector('.clb-q');
  const refocus = !!(q0 && document.activeElement === q0);
  const caret = refocus ? q0.selectionStart : null;
  const restore = () => {
    if(!refocus) return;
    const q1 = host.querySelector('.clb-q');
    if(!q1) return;
    q1.focus();
    try { q1.setSelectionRange(caret, caret); } catch(_) {}
  };
  // ONE ranking, shared with the search — see clubLeadersRanked.
  const { ranked, unranked, val, per, only, cat } = clubLeadersRanked(L);
  const fmt = v => per ? (Math.round(v*10)/10).toFixed(1) : v.toLocaleString();
  const catLabel = (CLUB_CATS.find(c=>c[0]===cat)||['','?'])[1];

  const tabs = CLUB_CATS.map(([k,lbl])=>
    `<button class="clb-cat${k===cat?' on':''}" onclick="clubLeadersPick('${k}')">${esc(lbl)}</button>`).join('');
  const perBtn = cat === 'gp' ? '' :
    `<button class="clb-cat${per?' on':''}" onclick="clubLeadersPer()" title="Per game instead of totals">per game</button>`;

  /* Every season the club has is listed, not just the loaded ones — a season
     missing from the list because it has not arrived yet would read as a season
     the club never had. One still loading says so in its own label. */
  const seasonOpts = ['<option value="">All seasons — all time</option>'].concat(
    L.order.map(sid => {
      const nm = (S.idx?.seasons?.[sid] && (S.idx.seasons[sid].name || S.idx.seasons[sid].fullName)) || sid;
      const state = L.failed.includes(sid) ? ' \u2014 could not load' : (L.loaded.has(sid) ? '' : ' \u2014 loading\u2026');
      return `<option value="${esc(sid)}"${L.sid === sid ? ' selected' : ''}>${esc(nm)}${state}</option>`;
    })).join('');
  const seasonSel = `<select class="sselect clb-sea" onchange="clubLeadersSeason(this.value)">${seasonOpts}</select>`;

  /* ⚠ THE BAR STAYS AT 100% WHEN IT FINISHES, IT DOES NOT VANISH. While it is
     filling, every figure on screen is provisional — the ranking covers only the
     seasons that have arrived, and a long career in older seasons climbs as it
     completes. "All N seasons loaded" is therefore not decoration: it is the
     difference between a provisional table and a final one, and removing the
     bar on completion would delete the only thing that says which you are
     looking at. */
  const pct = L.total ? Math.round((L.done / L.total) * 100) : 100;
  const doneAll = L.done >= L.total;
  /* ⚠ done counts ATTEMPTS, not successes — clubLeadersLoad increments it on a
     failed season too, which is right, because otherwise one dead file leaves
     the bar stuck short forever. So the finished state must not say "complete"
     when something failed: it reaches 100%, turns red and says INCOMPLETE, and
     the warn line underneath names the files. */
  const bad = L.failed.length;
  const prog = `<div class="clb-load${doneAll ? ' done' : ''}${doneAll && bad ? ' bad' : ''}">
      <div class="clb-load-hd">
        <span>${doneAll
          ? (bad
              ? `All ${L.total.toLocaleString()} season${L.total === 1 ? '' : 's'} attempted — ${bad} could not be loaded, so these totals are INCOMPLETE`
              : `All ${L.total.toLocaleString()} season${L.total === 1 ? '' : 's'} loaded — these totals are complete`)
          : `Loading seasons — <b>${L.done.toLocaleString()} of ${L.total.toLocaleString()}</b>, newest first`}</span>
        <span class="clb-load-pct">${pct}%</span>
      </div>
      <div class="clb-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
        <div class="clb-fill" style="width:${pct}%"></div>
      </div>
      ${doneAll ? '' : '<div class="clb-load-sub">The ranking covers the seasons loaded so far, so positions can still change.</div>'}
    </div>`;
  const fail = L.failed.length
    ? `<div class="clb-prog warn">⚠ ${L.failed.length} season file(s) could not be loaded, so these totals are INCOMPLETE: ${L.failed.map(esc).join(', ')}</div>`
    : '';

  const scope = only
    ? ((S.idx?.seasons?.[only] && (S.idx.seasons[only].name || S.idx.seasons[only].fullName)) || only)
    : `all time, ${L.done} of ${L.total} season(s)`;
  const shown = ranked.slice(0, Math.max(CLUB_TOP, L.show));
  /* ⚠ Games is BOTH a category and the context column. Ranking by Games showed
     the same number twice under two headings both reading GAMES. The context
     column is dropped when it would repeat the value. */
  const showGP = !(cat === 'gp' && !per);
  const row = (r,i) =>
    `<tr class="${L.hit === r.uuid ? 'clb-hit' : ''}"><td class="clb-rk">${i+1}</td>
      <td class="clb-nm" onclick="loadPlayer('${esc(r.uuid)}')" title="Open ${esc(r.name)}">${esc(r.name)}</td>
      <td class="clb-v">${fmt(val(r))}</td>
      ${showGP ? `<td class="clb-s">${r.gp.toLocaleString()}</td>` : ''}
      <td class="clb-s">${only ? r.teams : r.seasons}</td></tr>`;
  /* ⚠ TWO TABLES, NOT ONE WITH STICKY ROWS. The leading block stays put while
     the rest scrolls, and position:sticky on ten separate <tr> elements needs a
     per-row offset that breaks the moment a name wraps to two lines. Two tables
     sharing an identical <colgroup> under table-layout:fixed stay aligned by
     construction, whatever the content does. */
  const COLS = `<colgroup><col style="width:3.2em"><col><col style="width:7em">`
             + (showGP ? `<col style="width:5em">` : '') + `<col style="width:5em"></colgroup>`;
  const head = shown.slice(0, CLUB_STICK).map(row).join('');
  const rest = shown.slice(CLUB_STICK).map((r,i)=>row(r, i + CLUB_STICK)).join('');

  host.innerHTML = `<div class="clb-bar">${tabs}${perBtn}</div>
    <div class="clb-bar clb-seabar">${seasonSel}</div>${prog}${fail}
    <div class="clb-find">
      <!-- ⚠ TYPING NARROWS A LIST; IT DOES NOT SELECT. clubLeadersSuggest paints
           the dropdown ONLY — it never calls clubLeadersRender, so the field being
           typed into is not rebuilt mid-word. Selection (click, or Enter on the
           highlighted row) is the one action that ranks, renders and scrolls. -->
      <div class="clb-qwrap">
        <input class="sinput clb-q" type="search" autocomplete="off" role="combobox"
               aria-autocomplete="list" aria-controls="clb-sug"
               placeholder="Find a player…" value="${esc(L.find || '')}"
               oninput="clubLeadersSuggest(this.value)"
               onkeydown="clubLeadersKey(event, this)"
               onblur="clubLeadersBlur()">
        <div id="clb-sug"></div>
      </div>
      ${L.findMsg ? `<span class="clb-fmsg">${L.findMsg}</span>` : ''}
    </div>
    <div class="clb-pin"><table class="clb-tbl">${COLS}
      <thead><tr><th></th><th>Player</th><th>${esc(catLabel)}${per?' /g':''}</th>${showGP?'<th>Games</th>':''}<th>${only?'Teams':'Seasons'}</th></tr></thead>
      <tbody>${head || `<tr><td colspan="${showGP?5:4}" class="clb-prog">No ranked players yet.</td></tr>`}</tbody>
    </table></div>
    <div class="clb-scroll"><table class="clb-tbl">${COLS}<tbody>${rest}</tbody></table></div>
    <div class="clb-foot">${ranked.length.toLocaleString()} ranked player(s) \u00b7 ${esc(scope)}`
    + (ranked.length > shown.length || shown.length > CLUB_TOP
        ? ` · showing ${shown.length.toLocaleString()} of ${ranked.length.toLocaleString()}`
          + (ranked.length > shown.length
              ? ` <button class="clb-more" onclick="clubLeadersMore()">Show ${Math.min(CLUB_STEP, ranked.length - shown.length).toLocaleString()} more</button>`
              : '')
          + (shown.length > CLUB_TOP
              ? ` <button class="clb-more" onclick="clubLeadersLess()">Back to top ${CLUB_TOP}</button>`
              : '')
        : '')
    + (unranked ? ` · ${unranked.toLocaleString()} held out with no games credited — a registration with no stats reads as 0 here and is NOT treated as a real nought` : '')
    + `</div>`;
  restore();
  if(L.sugOpen) clubLeadersSugPaint();
}

/* Stepping through weeks REPLACES the history entry rather than pushing one.
   Twenty clicks forward must not become twenty presses of Back to leave. */
function setClubWeek(mon){
  S.clubWeek = mon;
  history.replaceState({ type: 'club', cid: S.clubId, cname: S.clubName, week: mon }, '',
                       '#' + hashFor('club', { cid: S.clubId, cname: S.clubName, week: mon }));
  const l = el('cwk-lbl'); if(l) l.textContent = clubWeekLabel(mon);
  const d = el('cwk-date'); if(d) d.value = mon;
  renderClubWeek();
}
function shiftClubWeek(dir){ setClubWeek(dAdd(S.clubWeek, dir * 7)); }
function jumpClubWeek(ds){
  if(!ds || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
  setClubWeek(mondayOf(ds));
}

/* Which of the club's seasons could hold a game this week?
   startDate/endDate come from data/sports-index.json. 808 seasons carry NO
   endDate — they are returned by no organisation and it will not improve by
   re-asking — so an absent end is handled explicitly instead of being read as
   "ended": an UNLOCKED season is still running and always qualifies, and a
   LOCKED one with no end is capped at CLUB_DERIVED_MONTHS after its start.
   That cap is a display heuristic, never stored, and the number of seasons
   admitted without a real end date is reported in the UI — so an empty week can
   never be mistaken for a complete answer. */
function clubSeasonCandidates(mon, sun){
  const club = S.clubs[S.clubId] || {}, out = [];
  for(const sid of Object.keys(club.seasons || {})){
    const se = S.idx?.seasons?.[sid] || null;
    const st = se && se.startDate ? String(se.startDate).slice(0, 10) : null;
    const en = se && se.endDate   ? String(se.endDate).slice(0, 10)   : null;
    if(st && st > sun) continue;                                   // starts after this week
    if(en){ if(en < mon) continue; }                               // ended before it
    else if(se && se.locked === true && st && addMonths(st, CLUB_DERIVED_MONTHS) < mon) continue;
    out.push({ sid, se, st, noEnd: !en });
  }
  /* Seasons with a REAL end date first, then most recent first. When the cap
     bites it must drop the seasons admitted on a 15-month ASSUMPTION before it
     drops one PlayHQ actually dated — otherwise a guess can push out a fact. */
  out.sort((a, b) => (a.noEnd === b.noEnd ? 0 : a.noEnd ? 1 : -1)
                  || String(b.st || '').localeCompare(String(a.st || '')));
  return out;
}

async function renderClubWeek(){
  const run = ++S.clubRun;
  const body = el('cweek-body'); if(!body) return;
  const mon = S.clubWeek, sun = dAdd(mon, 6);
  const club = S.clubs[S.clubId] || {};
  body.innerHTML = '<div class="load-row">Loading week…</div>';

  const all = clubSeasonCandidates(mon, sun);
  if(!all.length){
    body.innerHTML = `<div class="empty">None of this club's ${Object.keys(club.seasons || {}).length} seasons covers ${esc(clubWeekLabel(mon))}.</div>`;
    return;
  }
  const picked = all.slice(0, CLUB_SEASON_CAP), skipped = all.length - picked.length;
  const noEnd  = picked.filter(c => c.noEnd).length;

  await Promise.all(picked.map(async c => {
    if(!S.games[c.sid]){ const d = await sgj('games/bv', c.sid); S.games[c.sid] = d || { games: {} }; }
  }));
  // A later week may have been asked for while these were in flight. Without
  // this the slower fetch repaints over the newer one and the view silently
  // shows a week the user is no longer on.
  if(run !== S.clubRun) return;

  const rows = [];
  for(const c of picked){
    const gf   = S.games[c.sid] || { games: {} };
    const mine = new Set((club.seasons[c.sid] || []).map(x => String(x).slice(0, 8)));
    const comp = c.se ? compLabelOf(c.se) : c.sid;
    for(const [gid, g] of Object.entries(gf.games || {})){
      if(!g || g.cancelled || g.bye) continue;
      const d = g.d ? String(g.d).slice(0, 10) : '';
      if(!d || d < mon || d > sun) continue;
      const h = String(hTid(g) || '').slice(0, 8), a = String(aTid(g) || '').slice(0, 8);
      const hMine = !!(h && mine.has(h)), aMine = !!(a && mine.has(a));
      if(!hMine && !aMine) continue;
      const [hn, an] = teamNames(g);
      rows.push({ gid, sid: c.sid, d, g, comp, age: gameAge(g, c.se),
                  grade: g.gn || '(no grade recorded)', hMine, aMine, hn: hn || '', an: an || '' });
    }
  }

  const noGrade = rows.filter(r => r.age.n === 1000).length;
  let note = `<div class="cnote">Checked <b>${picked.length}</b> season${picked.length === 1 ? '' : 's'} for this week`;
  if(noGrade) note += ` \u00b7 \u26a0 <b>${noGrade}</b> game${noGrade === 1 ? '' : 's'} carr${noGrade === 1 ? 'ies' : 'y'} no grade, so ${noGrade === 1 ? 'it is' : 'they are'} grouped under "${NO_GRADE_LABEL}"`;
  if(noEnd)   note += ` · <b>${noEnd}</b> of them ${noEnd === 1 ? 'has' : 'have'} no recorded end date, so ${noEnd === 1 ? 'it is' : 'they are'} included on an assumed ${CLUB_DERIVED_MONTHS}-month season`;
  if(skipped) note += ` · ⚠ <b>${skipped}</b> further season${skipped === 1 ? '' : 's'} also overlapped this week and ${skipped === 1 ? 'was' : 'were'} NOT checked (cap ${CLUB_SEASON_CAP})`;
  note += '.</div>';

  if(!rows.length){
    body.innerHTML = note + `<div class="empty">No games for ${esc(S.clubName)} in ${esc(clubWeekLabel(mon))}.</div>`;
    return;
  }

  /* DAY -> COMPETITION -> AGE -> GRADE -> TIME (Mark, 2026-10-11).
     Age sorts NUMERICALLY (U8 before U10 — as strings "U10" < "U8"), and the
     no-age bucket carries n=999 so it lands last without being renamed. Grades
     and competitions sort naturally, so "Sec 10" follows "Sec 2". An untimed
     game sorts to the end of its grade on '~', not to the front on ''. */
  let h = note, ageSeq = 0;
  for(const [day, dayRows] of [...groupBy(rows, r => r.d)].sort((a, b) => natCmp(a[0], b[0]))){
    const dayKey = 'day:' + day;
    h += `<div class="cgrp${S.clubClosed.has(dayKey) ? ' collapsed' : ''}">`
       + `<div class="cday-hdr" data-k="${esc(dayKey)}" onclick="toggleSec(this)"><span class="ctw">\u25b8</span>${esc(fmtDow(day))}`
       + `<span class="cday-n">${dayRows.length} game${dayRows.length === 1 ? '' : 's'}</span>${CXALL}</div><div class="cbody">`;
    for(const [comp, compRows] of [...groupBy(dayRows, r => r.comp)].sort((a, b) => natCmp(a[0], b[0]))){
      const byAge = [...groupBy(compRows, r => r.age.label)]
        .sort((a, b) => (a[1][0].age.n - b[1][0].age.n) || natCmp(a[0], b[0]));
      /* The chips are jump links, so the age sections need their ids BEFORE the
         competition heading is written. The same age recurs under other days and
         other competitions, so the id is a running sequence, never the label. */
      const ageIds = byAge.map(() => 'cage-' + (++ageSeq));
      const chips = byAge.map(([lbl, rws], i) =>
        `<button type="button" class="cchip" onclick="event.stopPropagation();scrollToAge('${ageIds[i]}')" title="Jump to ${esc(lbl)}">${esc(ageChipLabel(lbl))}<span class="cchip-n">${rws.length}</span></button>`).join('');
      const compKey = 'comp:' + comp;
      h += `<div class="cgrp${S.clubClosed.has(compKey) ? ' collapsed' : ''}">`
         + `<div class="ccomp-hdr" data-k="${esc(compKey)}" onclick="toggleSec(this)">`
         + `<span class="ccomp-name"><span class="ctw">\u25b8</span>${esc(comp)}</span>`
         + CXALL + `<span class="cchips">${chips}</span></div><div class="cbody">`;
      byAge.forEach(([ageLabel, ageRows], ai) => {
        /* Keyed on the LABEL, not on day+competition, so closing U13 closes it
           everywhere — which is the point when you follow one child. */
        const ageKey = 'age:' + ageLabel;
        h += `<div class="cgrp${S.clubClosed.has(ageKey) ? ' collapsed' : ''}">`
           + `<div class="cage-hdr" id="${ageIds[ai]}" data-k="${esc(ageKey)}" onclick="toggleSec(this)">`
           + `<span class="ctw">\u25b8</span>${esc(ageLabel)}`
           + `<span class="cage-n">${ageRows.length} game${ageRows.length === 1 ? '' : 's'}</span>${CXALL}`
           + `</div><div class="cbody">`;
        for(const [grade, gradeRows] of [...groupBy(ageRows, r => r.grade)].sort((a, b) => natCmp(a[0], b[0]))){
          const gradeKey = 'grade:' + grade;
          h += `<div class="cgrp${S.clubClosed.has(gradeKey) ? ' collapsed' : ''}">`
             + `<div class="cgrade-hdr" data-k="${esc(gradeKey)}" onclick="toggleSec(this)">`
             + `<span class="ctw">\u25b8</span>${esc(grade)}`
             + `<span class="cgrade-n">${gradeRows.length} game${gradeRows.length === 1 ? '' : 's'}</span>`
             + `</div><div class="cbody">`;
          const list = gradeRows.sort((x, y) =>
            timeCmp(x.g.t, y.g.t) || natCmp(clubMyName(x), clubMyName(y)));
          for(const r of list) h += clubRowHTML(r);
          h += `</div></div>`;   // close the grade's cbody + cgrp
        }
        h += `</div></div>`;     // close the age's cbody + cgrp
      });
      h += `</div></div>`;   // close the competition's cbody + cgrp
    }
    h += `</div></div>`;     // close the day's cbody + cgrp
  }
  body.innerHTML = h;
  syncAllBtn();

  body.querySelectorAll('.crow').forEach(row => row.addEventListener('click', () => {
    const gid = row.dataset.gid, sid = row.dataset.sid;
    // Same behaviour as the team Fixtures tab: a played game opens the box
    // score, an unplayed one opens the team-vs-team view.
    if(row.dataset.played === '1'){ openSheet(gid, sid); return; }
    // A superseded fixture opens the game that REPLACED it, not a team-vs-team
    // view flagged "upcoming" for a date in the past.
    if(row.dataset.sup){ openSheet(row.dataset.sup, sid); return; }
    const g = S.games[sid]?.games?.[gid];
    const hh = hTid(g), aa = aTid(g);
    if(g && hh && aa){
      const mineTid = row.dataset.mytid || hh;
      openTeamOpp(mineTid, mineTid === hh ? aa : hh, sid, true);
    } else openSheet(gid, sid);
  }));
}

function clubMyName(r){ return r.aMine && !r.hMine ? r.an : r.hn; }

/* AGE IS NOT A FIELD ON A GAME. The record carries `gid` and `gn`
   ("Saturday U19 Boys Sec 3"); the age lives in data/sports-index.json under
   that season's grades[] as `age` ("Under 15"), written by discover-org-seasons.
   So: the index first, the grade NAME second, and an explicit bucket third.

   ⚠️ DO NOT USE ageNum() HERE. It strips every non-digit, so
   "Saturday U19 Boys Sec 3" becomes 193 and sorts after every real age group.
   It is correct for the `age` FIELD ("Under 15" -> 15) and wrong for a grade
   name, which is what this has to cope with.

   A grade with no age is its OWN named bucket, sorted last on purpose — never
   folded into U0 and never silently dropped. OUTSTANDING records ~31% of
   grade_age as blank, so this is the common case, not the edge case. */
const NO_AGE_LABEL = 'Senior / no age group';
/* A game with NO GRADE AT ALL is a different fact from a senior competition, and
   folding the two together hid a real data gap: discover-fixtures.js wrote future
   fixtures with no `gid`/`gn` until 2026-10-12, so an entire Saturday of junior
   games read as "Senior / no age group". Its own bucket, sorted last. */
const NO_GRADE_LABEL = 'Grade not recorded';
function gameAge(g, se){
  const gid8 = String(g && g.gid || '').slice(0, 8);
  if(gid8 && se && Array.isArray(se.grades)){
    const gr = se.grades.find(x => x && String(x.id || '').slice(0, 8) === gid8);
    const m = gr && gr.age ? String(gr.age).match(/(\d{1,2})/) : null;
    if(m) return { n: parseInt(m[1], 10), label: 'U' + m[1] };
  }
  const gnStr = String(g && g.gn || '').trim();
  const m2 = gnStr.match(/\bU(?:nder)?\s*(\d{1,2})\b/i);
  if(m2) return { n: parseInt(m2[1], 10), label: 'U' + m2[1] };
  if(!gnStr && !gid8) return { n: 1000, label: NO_GRADE_LABEL };
  return { n: 999, label: NO_AGE_LABEL };
}
/* The full label is right as a heading and far too long as a chip. */
function ageChipLabel(label){
  if(label === NO_AGE_LABEL)   return 'Senior';
  if(label === NO_GRADE_LABEL) return 'No grade';
  return label;
}
/* The key lives in a data attribute, NOT interpolated into the onclick. A
   competition name carrying an apostrophe would otherwise break the handler. */
function toggleSec(hdr){
  const grp = hdr.parentElement;
  if(!grp) return;
  const k = hdr.dataset ? hdr.dataset.k : '';
  const nowClosed = grp.classList.toggle('collapsed');
  if(k){ if(nowClosed) S.clubClosed.add(k); else S.clubClosed.delete(k); }
  syncAllBtn();
}
/* One button, two jobs. Anything still open means the action is COLLAPSE;
   everything already shut means it is EXPAND. The label is derived from the DOM
   rather than from a flag, so it cannot drift out of step with a section the
   user toggled by hand. */
function allSecOpen(){
  const body = el('cweek-body');
  if(!body) return false;
  const g = body.querySelectorAll('.cgrp');
  return g.length > 0 && [...g].some(x => !x.classList.contains('collapsed'));
}
function syncAllBtn(){
  const btn = el('cwk-all');
  if(btn) btn.textContent = allSecOpen() ? 'Collapse all' : 'Expand all';
  const body = el('cweek-body');
  if(!body) return;
  // Every per-section button reads its own branch, for the same reason the
  // global one reads the whole body: a flag would drift the moment a single
  // heading is toggled by hand.
  for(const b of body.querySelectorAll('.cxall')){
    const grp = b.closest('.cgrp');
    const anyOpen = grp && [...grp.querySelectorAll('.cgrp')].some(g => !g.classList.contains('collapsed'));
    b.textContent = anyOpen ? '\u229f' : '\u229e';
    b.title = anyOpen ? 'Collapse everything below this' : 'Expand everything below this';
  }
}
const CXALL = '<button type="button" class="cxall" onclick="event.stopPropagation();toggleSubSec(this)">\u229f</button>';
/* The same two-jobs button, scoped to ONE branch: it touches every .cgrp inside
   this section and nothing outside it. It lives inside a heading that is itself a
   toggle, so the click must not bubble. */
function toggleSubSec(btn){
  const grp = btn.closest('.cgrp');
  if(!grp) return;
  const subs = [...grp.querySelectorAll('.cgrp')];
  if(!subs.length) return;
  const close = subs.some(g => !g.classList.contains('collapsed'));
  for(const g of subs){
    g.classList.toggle('collapsed', close);
    const hdr = g.firstElementChild;
    const k = hdr && hdr.dataset ? hdr.dataset.k : '';
    if(k){ if(close) S.clubClosed.add(k); else S.clubClosed.delete(k); }
  }
  // Expanding the inside of a CLOSED section would show nothing, so open it.
  if(!close && grp.classList.contains('collapsed')){
    grp.classList.remove('collapsed');
    const hk = grp.firstElementChild && grp.firstElementChild.dataset ? grp.firstElementChild.dataset.k : '';
    if(hk) S.clubClosed.delete(hk);
  }
  syncAllBtn();
}
function toggleAllSec(){
  const body = el('cweek-body');
  if(!body) return;
  const close = allSecOpen();
  for(const g of body.querySelectorAll('.cgrp')){
    g.classList.toggle('collapsed', close);
    const hdr = g.firstElementChild;
    const k = hdr && hdr.dataset ? hdr.dataset.k : '';
    if(!k) continue;
    if(close) S.clubClosed.add(k); else S.clubClosed.delete(k);
  }
  syncAllBtn();
}
function scrollToAge(id){
  const t = document.getElementById(id);
  if(!t) return;
  // A chip can point into a section that is collapsed — its own competition, or
  // the day above it. Open every collapsed ancestor first, or the jump lands on
  // something with display:none and silently does nothing.
  for(let p = t.parentElement; p; p = p.parentElement){
    if(p.classList && p.classList.contains('cgrp') && p.classList.contains('collapsed')){
      p.classList.remove('collapsed');
      const hk = p.firstElementChild && p.firstElementChild.dataset ? p.firstElementChild.dataset.k : '';
      if(hk) S.clubClosed.delete(hk);
    }
    if(p.id === 'cweek-body') break;
  }
  // scroll-margin-top on .cage-hdr clears the two sticky bars, so this needs no
  // offset arithmetic and does not care which ancestor is the scroller.
  try { t.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  catch(_) { t.scrollIntoView(); }
  t.classList.add('cage-flash');
  setTimeout(() => { t.classList.remove('cage-flash'); }, 1000);
}
/* Natural order, so "Sec 10" comes after "Sec 2" rather than before it. */
function natCmp(a, b){ return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }
/* ⚠️ A MISSING TIME IS RANKED EXPLICITLY, NOT WITH A SENTINEL CHARACTER.
   The first version sorted on `t || '~'` assuming '~' lands after digits. Under
   locale collation it lands BEFORE them, so an untimed game went to the TOP of
   its grade instead of the bottom. It was never caught because every test
   fixture had a time on it. */
function timeCmp(a, b){
  const ta = a || '', tb = b || '';
  if(!ta && !tb) return 0;
  if(!ta) return 1;
  if(!tb) return -1;
  return natCmp(ta, tb);
}
function groupBy(list, keyOf){
  const m = new Map();
  for(const x of list){ const k = keyOf(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}

function clubRowHTML(r){
  const g = r.g;
  const both = r.hMine && r.aMine;                       // an intra-club game
  const myIsHome = both ? true : r.hMine;
  const myName  = myIsHome ? r.hn : r.an;
  const oppName = myIsHome ? r.an : r.hn;
  const myTid   = String((myIsHome ? hTid(g) : aTid(g)) || '');
  const hs = (g.hs === undefined || g.hs === null) ? null : g.hs;
  const as = (g.as === undefined || g.as === null) ? null : g.as;
  const mine = myIsHome ? hs : as, theirs = myIsHome ? as : hs;

  let res = null, played = false;
  if(mine !== null && theirs !== null){ played = true; res = mine > theirs ? 'W' : mine < theirs ? 'L' : 'D'; }
  else if(g.forfeit){ played = true; res = (g.fo && String(g.fo).slice(0, 8) === myTid.slice(0, 8)) ? 'W' : 'L'; }

  const score = played && mine !== null && theirs !== null ? `${mine}-${theirs}` : '';
  // An intra-club game has no "us" and "them", so a W/L badge would be a lie.
  // A superseded fixture is not a pending game. Rendering it as one is what made a
  // week months gone still look like it had games to come.
  const sup   = (typeof g.sup === 'string' && g.sup) ? g.sup : null;
  // No arrow here on purpose: the club week view is one week across clubs, not a
  // single team's fixture list, so the replacing game is NOT reliably the next row.
  const resH  = sup  ? '<div class="g-res rU"><span class="bdg bSUP" title="Cancelled by a regrade — opens the game played instead">RGRD</span></div>'
              : both ? '<div class="g-res rU">—</div>'
              : res  ? `<div class="g-res r${res}">${res}</div>`
                     : `<div class="g-res rU">${esc(g.st === 'UPCOMING' || g.st === 'PRE_GAME' ? '—' : (g.st || '—'))}</div>`;

  /* The GRADE is gone from the row: it is the heading immediately above it, and
     repeating it ate the width that round, venue and court now have. Each is its
     own column on a wide screen and they wrap to a second line on a phone, rather
     than one run-on string ellipsised into uselessness. */
  const det = [g.rn || '', g.vn || '', g.ct || ''];
  const cls  = [finalClass(g.rn), both ? 'cmine2' : '', sup ? 'sup-row' : ''].filter(Boolean).join(' ');

  return `<div class="crow${cls ? ' ' + cls : ''}" data-gid="${esc(r.gid)}" data-sid="${esc(r.sid)}" data-played="${played ? 1 : 0}"${sup ? ` data-sup="${esc(sup)}"` : ''} data-mytid="${esc(myTid)}">
    <div class="cmain">
      <span class="cteam">${esc(myName || '—')}</span><span class="copp">${both ? 'v ' : (myIsHome ? 'v ' : '@ ')}${esc(oppName || '—')}</span>${both ? '<span class="cboth">(club v club)</span>' : ''}
    </div>
    <div class="cdets"><div class="cdet cdet-rn">${esc(det[0])}</div><div class="ctime">${esc(g.t || '—')}</div><div class="cdet cdet-vn">${esc(det[1])}</div><div class="cdet cdet-ct">${esc(det[2])}</div></div>
    <div class="cscore">${esc(score)}</div>
    ${resH}
  </div>`;
}

/* ── Game sheet ── */
async function openSheet(gid,sid){
  const ov=el('sov'),sb=el('sh-body'),tt=el('sh-title');
  sb.innerHTML='<div class="load-row">Loading\u2026</div>';
  ov.classList.add('open');
  if(!S.games[sid]){const d=await sgj('games/bv',sid);S.games[sid]=d||{games:{}};}
  const g=S.games[sid]?.games?.[gid];
  if(!g){sb.innerHTML='<div class="load-row">Game not found.</div>';return;}
  tt.textContent=g.rn||'Game';
  renderSheet(g,gid,sid,sb);
  if(renderMode(g)==='normal'){
    fetchBox(gid).then(bs=>{if(bs)applyBox(bs,g,gid,sb);});
  }
  // Add opposition history button if both team IDs are known
  // CORRECTED: was `[,,,ht,at]` - FIVE slots from a return of FOUR. Index 3 is
  // the AWAY tid and index 4 does not exist, so on a hidden game htid took the
  // away team and atid took undefined.
  const[,,ht,at]=teamNames?teamNames(g):['','','',''];
  const htid=g.h||ht,atid=g.a||at;
  if(htid&&atid){
    const histBtn=document.createElement('button');
    histBtn.className='lb-stat';histBtn.style.cssText='margin:8px 14px;font-size:0.72rem';
    histBtn.textContent='⇔ Opposition history';
    histBtn.onclick=()=>{
      closeSheet();
      // Determine which side the current player is on so their team is always "my team"
      const uuid=S.playerUuid;
      const player=uuid?S.players[uuid]:null;
      const playerTid=player?getTidForSeason(player,sid):null;
      const myTid=playerTid===(atid)?atid:htid;
      const oppTid=myTid===htid?atid:htid;
      openTeamOpp(myTid,oppTid,sid,false);
    };
    sb.insertBefore(histBtn,sb.firstChild);
  }
}
function closeSheet(){el('sov').classList.remove('open');}

// A game carries h/a OR t1/t2, never both: README.md L266 - hidden games use
// t1/t2. teamNames() below has always handled that, but most of this file reads
// g.h/g.a directly, so on a hidden game those are undefined and the read fails
// silently. Same defect fixed in build-player-games.js and build-win-loss.js on
// 2026-09-01; in the one season file measured, 2,684 of 2,758 games were hidden.
//
// t1 is home and t2 away - build-finals-stats.js L248/L254 has resolved them that
// way against hs/as in production since before this.
function hTid(g){return g?.h ?? g?.t1 ?? null;}
function aTid(g){return g?.a ?? g?.t2 ?? null;}

function teamNames(g){
  if(g.h)return[g.hn||'',g.an||'',g.h,g.a];
  if(g.t1)return[g.t1n||'',g.t2n||'',g.t1,g.t2];
  // ⚠️ 2026-09-17 — venue-lookup day entries are a THIRD shape and this returned
  // nothing for all of them, so every venue on every date rendered "? vs ?".
  // update-venue-lookup.js writes {id,t,hn,an,hid,aid,sid,comp,grade,st}: the names
  // are present as hn/an, but the team ids are hid/aid, so both gates above miss and
  // it fell through to the empty case. The grade line rendered because it is read
  // directly rather than through here — which is why the rows looked half-populated
  // rather than empty.
  if(g.hn||g.an||g.hid||g.aid)return[g.hn||'',g.an||'',g.hid||'',g.aid||''];
  return['','','',''];
}

function renderSheet(g,gid,sid,con){
  const mode=renderMode(g);
  const[t1n,t2n,t1id,t2id]=teamNames(g);
  const uuid=S.playerUuid;
  // Determine which side the player is on
  let mine=null;
  // The `g.h` guard skipped this entirely on hidden games, so the player's own
  // side was never highlighted in the box score.
  if(uuid&&hTid(g)){if((g.hp||[]).some(p=>matchP(p.profileID,uuid))||(hTid(S.games[sid]?.games?.[gid])===S.teamId))mine='h';}
  // Simple side detection: check if player's teamId matches
  const myTeamId=S.playerUuid?getPlayerTeamForGame(g,uuid,S.players[uuid]):null;
  const t1mine=myTeamId&&(myTeamId===t1id||mine==='h');
  const t2mine=myTeamId&&(myTeamId===t2id||mine==='a');
  let h='';
  const mp=[];
  if(g.rn)mp.push(esc(g.rn));if(g.d)mp.push(esc(fmtD(g.d)));if(g.t)mp.push(esc(g.t));
  if(g.vn)mp.push(esc(g.vn+(g.ct?' \u00b7 '+g.ct:'')));
  if(mp.length)h+=`<div class="gmeta">${mp.join('<span class="dot"> \u00b7 </span>')}</div>`;

  const t1win=typeof g.hs==='number'&&typeof g.as==='number'&&g.hs>g.as;
  const t2win=typeof g.hs==='number'&&typeof g.as==='number'&&g.as>g.hs;
  const sb=(hs,as,t1,t2,t1m,t2m,div='&ndash;')=>`<div class="sblock">
    <div class="tsc${t1m?' mine':''}${t1win?' win':''}" ${t1id?`style="cursor:pointer" onclick="loadTeam('${esc(t1id)}','${esc(sid)}');closeSheet()"`:''}>
      <div class="tsc-n">${esc(t1)}</div><div class="tsc-p">${hs??'&mdash;'}</div></div>
    <div class="sdiv">${div}</div>
    <div class="tsc${t2m?' mine':''}${t2win?' win':''}" ${t2id?`style="cursor:pointer" onclick="loadTeam('${esc(t2id)}','${esc(sid)}');closeSheet()"`:''}>
      <div class="tsc-n">${esc(t2)}</div><div class="tsc-p">${as??'&mdash;'}</div></div>
  </div>`;

  switch(mode){
    case'normal':
      h+=sb(g.hs,g.as,t1n,t2n,t1mine,t2mine);
      h+=`<div id="qslot"></div>`;
      h+=`<div id="box-slot" class="bload">Loading box score\u2026</div>`;
      break;
    case'hidden-full':
      h+=`<div style="padding:7px 14px"><span class="bdg bH">\ud83d\udfe3 Hidden grade</span></div>`;
      h+=sb(g.hs,g.as,t1n||'Team 1',t2n||'Team 2',t1mine,t2mine);
      if(g.hq?.length)h+=renderQtrs(g.hq,g.aq);
      h+=renderBoxHtml(g.hp||[],g.ap||[],t1n,t2n,t1id,t2id,sid,uuid);
      break;
    case'hidden-partial':
      h+=`<div style="padding:7px 14px"><span class="bdg bH">\ud83d\udfe3 Hidden grade \u2014 limited data</span></div>`;
      h+=sb(g.hs,g.as,t1n||'Team 1',t2n||'Team 2',t1mine,t2mine);
      h+=`<div class="gmode-blk"><div class="gmode-msg">No venue data for hidden grades.</div></div>`;
      break;
    case'profileOnly':
      h+=`<div style="padding:7px 14px"><span class="bdg bPO">\ud83d\udfe0 Historical record</span></div>`;
      h+=sb('&mdash;','&mdash;',t1n,t2n,t1mine,t2mine,'vs');
      break;
    case'forfeit':{
      const w=g.fo==='HOME'?t1n:g.fo==='AWAY'?t2n:'';
      h+=`<div style="padding:7px 14px"><span class="bdg bFF">\ud83d\udd34 Forfeit</span></div>`;
      h+=sb(null,null,t1n,t2n,false,false,'vs');
      h+=`<div class="gmode-blk"><div class="gmode-msg">${esc(w?w+' won by forfeit.':'Forfeit.')}</div></div>`;break;}
    case'cancelled':
      h+=`<div style="padding:7px 14px"><span class="bdg bCX">\u2715 Cancelled</span></div>`;
      h+=sb(null,null,t1n,t2n,false,false,'vs');break;
    case'abandoned':
      h+=`<div style="padding:7px 14px"><span class="bdg bCX">\u26a1 Abandoned</span></div>`;
      h+=sb(g.hs,g.as,t1n,t2n,false,false);break;
    case'bye':
      h+=`<div class="gmode-blk"><span class="bdg" style="background:var(--elevated);color:var(--text2)">Bye</span></div>`;break;
    case'legacy':
      h+=`<div style="padding:7px 14px"><span class="bdg bLG">\u2b1c Historical</span></div>`;
      h+=`<div class="gmode-blk"><div class="gmode-msg">${t1n?esc(t1n)+' vs '+esc(t2n||'?'):'Teams unknown'}${g.d?`<br><span style="color:var(--text3)">${esc(fmtD(g.d))}</span>`:''}</div></div>`;break;
    case'superseded':{
      h+=`<div style="padding:7px 14px"><span class="bdg bSUP" onclick="openSheet('${esc(g.sup)}','${esc(sid)}')" title="Open the game that replaced this fixture">\u21bb Regraded</span></div>`;
      h+=sb(null,null,t1n||'Team 1',t2n||'Team 2',t1mine,t2mine,'vs');
      h+=`<div class="gmode-blk"><div class="gmode-msg">Replaced after a regrade and never played. PlayHQ still lists it.</div></div>`;
      break;}
    case'upcoming':{
      // Surrogate pair, not \u1f5d3 — \uXXXX takes exactly four hex digits, so the
      // five-digit form parses as \u1f5d followed by a literal '3' and renders a
      // CJK glyph. Every other badge in this file uses the pair form.
      const lbl=g.st==='PRE_GAME'?'\u23f1 About to start':'\ud83d\uddd3 Upcoming';
      h+=`<div style="padding:7px 14px"><span class="bdg bPO">${esc(lbl)}</span></div>`;

      h+=sb(null,null,t1n||'Team 1',t2n||'Team 2',t1mine,t2mine,'vs');

    default:
      // Only a genuine dead end when we do not even know who is playing. When the
      // names are there, show the matchup — a sheet that names both teams and
      // links to them beats "No data available." on identical information.
      if(t1n||t2n){

      }
  }
  if(g.noVenue&&!g.vn)h+=`<div style="padding:3px 14px 6px"><span class="bdg bNV">No venue</span></div>`;
