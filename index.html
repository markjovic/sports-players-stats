/* ── DRAG TO PAN (v1.78) ──────────────────────────────────────────────────
   The career strip, the game cards and the availability grid all scroll
   sideways inside a page that scrolls down, which on a trackpad means fighting
   the page to move them. One delegated handler gives every one of them a hand
   grab; nothing has to be re-bound when a panel is redrawn, which happens on
   every settings click.

   A drag must not also count as a click — these panels are made of clickable
   cards — so once the pointer has actually moved, the next click is swallowed
   in the capture phase. */
const PAN_SEL='.car-strip,.car-gcards,.av-grid,.ptwrap,.tc-grid,.hi-grid,.mt-grid';
function panScrollable(el){
  for(let n=el;n&&n!==document.body;n=n.parentElement){
    if(n.matches&&n.matches(PAN_SEL)&&
       (n.scrollWidth-n.clientWidth>4||n.scrollHeight-n.clientHeight>4))return n;
  }
  return null;
}
(function initDragPan(){
  let el=null,sx=0,sy=0,l0=0,t0=0,moved=false;
  document.addEventListener('pointerover',e=>{
    const t=panScrollable(e.target);
    if(t&&!t.style.cursor)t.style.cursor='grab';
  });
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    if(/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test((e.target||{}).tagName||''))return;
    el=panScrollable(e.target);
    if(!el)return;
    moved=false;sx=e.clientX;sy=e.clientY;l0=el.scrollLeft;t0=el.scrollTop;
  });
  document.addEventListener('pointermove',e=>{
    if(!el)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<5)return;
    if(!moved){
      moved=true;el.style.cursor='grabbing';
      // scroll-behavior:smooth on the career strip fights a drag
      el.dataset.panSb=el.style.scrollBehavior||'';el.style.scrollBehavior='auto';
      el.setPointerCapture&&el.setPointerCapture(e.pointerId);
    }
    el.scrollLeft=l0-dx;el.scrollTop=t0-dy;
    e.preventDefault();
  },{passive:false});
  const end=()=>{
    if(!el)return;
    const e2=el;el=null;
    e2.style.cursor='grab';e2.style.scrollBehavior=e2.dataset.panSb||'';
    if(moved){
      const stop=ev=>{ev.stopPropagation();ev.preventDefault();};
      document.addEventListener('click',stop,{capture:true,once:true});
      setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),0);
    }
  };
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
})();

/* ── GAME-LINE PANELS (v1.68) ─────────────────────────────────────────────────
   Career highs, venue/day splits and team-mate continuity all read the SAME
   game lines the career cards build (carLoadRows + carBuild), so the first of
   them to be opened pays for the fetch and the rest are free. None of them
   stores anything new: the lines live in CAR[uuid].rows and S.boxes exactly as
   the Calendar-year mode and the drill-down left them. */
async function carRowsReady(uuid,onProg){
  const st=carSt(uuid),p=st.p;
  if(!p)return null;
  if(!st.rows&&!st.loading)await carLoadRows(p);
  else while(st.loading)await new Promise(r=>setTimeout(r,120));
  if((st.pend||[]).length){
    if(onProg)onProg(st.pend.length);
    await carBuild(uuid);
  }
  return st.rows||[];
}
function panelBusy(host,msg){
  if(host)host.innerHTML=`<div style="font-size:0.8rem;color:var(--text3);padding:8px 0">${esc(msg)}</div>`;
}

/* ── CAREER HIGHS ──────────────────────────────────────────────────────────
   The best single game for each stat. A sum over lines that are already held,
   so this never fetches on its own: it fills in the moment the lines exist for
   any other reason, and offers the fetch when they do not. */
const HIGH_K=[['pts','Points'],['fg','Field goals'],['ft','Free throws'],['tp','Three-pointers'],['f','Fouls']];
/* PlayHQ publishes foul-outs as a SEASON AND CAREER total only: a box-score line
   carries number, name, PTS, 2PT, 3PT, FT and fouls, and nothing that says the
   player fouled out of THAT game. So this tile is the career figure, marked as
   such, and sits apart from the single-game highs beside it. Deriving it from
   "fouls >= 5" would be this app inventing a rule PlayHQ did not apply. */
function careerFouledOut(p){
  // ⚠️ NOT sports.Basketball.foulOuts. On these files that career field is not a
  // number — rendering it gave "[object Object]" — which is also why the header
  // row's FO cell, gated on `> 0`, never appeared for anyone. The registration
  // stats DO carry a plain number, so the career figure is summed from them with
  // the same rule as everything else here: MAX across sibling registrations of
  // one team (a regrade repeats the season block, T20), summed across teams.
  const byTid=new Map();
  let any=false;
  for(const s of (p&&p.seasons)||[]){
    for(const r of (s.regs||[])){
      const v=r&&r.stats&&r.stats.foulOuts;
      if(typeof v!=='number'||!isFinite(v))continue;
      any=true;
      const k=(s.sid||'')+'|'+(r.tid||'');
      byTid.set(k,Math.max(byTid.get(k)||0,v));
    }
  }
  if(!any)return null;
  let t=0; for(const v of byTid.values())t+=v;
  return t;
}
function foTile(p){
  const fo=careerFouledOut(p);
  if(fo===null)return '';          // the competition does not record them at all
  const gp=(p&&p.games&&p.games.length)||0;
  // Every other tile is one game, so this one has to say it is not. "career"
  // alone does that; the source was noise nothing else carries.
  return `<div class="hi-t hi-q"><div class="hi-k">Foul-outs</div><div class="hi-v">${fo}</div>
    <div class="hi-w">career total</div><div class="hi-d">${
      fo&&gp?('one every '+Math.round(gp/fo)+' games'):'\u2014'}</div></div>`;
}
function highsHtml(rows){
  const tiles=HIGH_K.map(([k,label])=>{
    let best=null;
    for(const r of rows){const v=r[k]||0;if(!best||v>best[k])best=r;}
    if(!best||!(best[k]||0))return '';
    return `<div class="hi-t" onclick="openSheet('${esc(best.gid)}','${esc(best.sid)}')" title="Open this game">
      <div class="hi-k">${esc(label)}</div>
      <div class="hi-v">${best[k]}</div>
      <div class="hi-w">${esc(best.opp||best.tn||'')}</div>
      <div class="hi-d">${esc([best.rn,carFmtD(best.date)].filter(Boolean).join(' · '))}</div></div>`;
  }).filter(Boolean).join('');
  const zero=rows.filter(r=>!(r.pts||0)).length;
  return tiles+(zero?`<div class="hi-t hi-q"><div class="hi-k">${labelHTML('0PT games')}</div>
    <div class="hi-v">${zero}</div><div class="hi-w">of ${rows.length}</div><div class="hi-d">—</div></div>`:'');
}
/* A high is only ever the best of the lines actually READ, and that is fewer
   than the games PlayHQ credits. Leaving the two numbers to differ silently is
   the failure this app exists to avoid, so the shortfall is named and broken
   down rather than left for someone to notice in a screenshot. */
function highsGap(st,rows){
  const n=st.scan||{};
  const credited=n.credited||0;
  if(!credited||rows.length>=credited)return '';
  const missing=credited-rows.length;
  const bits=[];
  if(n.notInAnyFile)bits.push(n.notInAnyFile+' in no season file held');
  if(n.noDate)bits.push(n.noDate+' with no date');
  const rest=missing-(n.notInAnyFile||0)-(n.noDate||0);
  if(rest>0)bits.push(rest+' whose box score names no line for this player');
  if((st.missing||[]).length)bits.push((st.missing||[]).length+' season file(s) that would not load');
  return `<div class="hi-note" title="${esc(bits.join(' · '))}">${rows.length} of ${credited} game lines</div>`;
}
function hydrateHighs(uuid){
  const host=el('phigh-'+uuid); if(!host)return;
  const st=carSt(uuid), rows=st.rows||[], pend=(st.pend||[]).length;
  if(!rows.length&&!pend){
    host.innerHTML=`<div class="slist"><div class="sec-lbl">Career highs</div>
      <div class="sp-wait">Reading game lines…</div></div>`;
    return;
  }
  const body=rows.length?`<div class="hi-grid">${highsHtml(rows)+foTile(st.p)}</div>`
    :`<div class="sp-wait">Reading game lines…</div>`;
  const part=pend?`<div class="hi-note">${rows.length} of ${rows.length+pend} game lines read…</div>`
             :highsGap(st,rows);
  host.innerHTML=`<div class="slist"><div class="sec-lbl">Career highs</div>${body}${part}</div>`;
}
async function buildHighs(uuid,btn){
  if(btn)btn.disabled=true;
  const host=el('phigh-'+uuid);
  panelBusy(host&&host.querySelector('.slist'),'Reading game lines…');
  await carRowsReady(uuid);
  hydrateHighs(uuid);
}

/* ── VENUE AND DAY SPLITS ──────────────────────────────────────────────────
   Every game carries vn (venue), ct (court) and t (time); nothing in the app
   used them for a player. Rows with no venue are counted separately rather than
   bundled into an "Unknown" bar, because an unnamed venue is a gap in the data,
   not a place someone played. */
function splitBand(t){
  const h=parseInt(String(t||'').slice(0,2));
  if(isNaN(h))return['',''];
  if(h<12)return['morning',h];
  if(h<16)return['midday',h];
  return['evening',h];
}
const SPLIT_HEAD=`<div class="sp-r sp-h"><span class="n"></span><span class="t"></span><span class="g">GP</span><span class="v">PPG</span></div>`;
function splitRows(groups,unit){
  const list=[...groups.values()].filter(g=>g.gp).sort((a,b)=>(b.pts/b.gp)-(a.pts/a.gp));
  if(!list.length)return '<div class="sp-none">No lines carry this field.</div>';
  const mx=Math.max(...list.map(g=>g.pts/g.gp),0.1);
  const tot=list.reduce((a,g)=>({gp:a.gp+g.gp,pts:a.pts+g.pts}),{gp:0,pts:0});
  return SPLIT_HEAD+list.map(g=>{const v=g.pts/g.gp;
    return `<div class="sp-r${v===mx?' b':''}"><span class="n">${esc(g.label)} <i>${esc(g.sub)}</i></span>
      <span class="t"><i style="width:${Math.max(2,Math.round(v/mx*100))}%"></i></span>
      <span class="g">${g.gp}</span><span class="v">${v.toFixed(1)}</span></div>`;}).join('')
    +`<div class="sp-r sp-t"><span class="n">${list.length} ${list.length===1?'entry':'entries'}</span><span class="t"></span>
      <span class="g">${tot.gp}</span><span class="v">${tot.gp?(tot.pts/tot.gp).toFixed(1):'\u2014'}</span></div>`;
}
async function buildSplits(uuid,btn){
  const host=el('splits-'+uuid); if(!host)return;
  if(btn)btn.disabled=true;
  panelBusy(host,'Reading game lines…');
  const rows=await carRowsReady(uuid)||[];
  if(btn)btn.disabled=false;
  if(!rows.length){panelBusy(host,'No game lines could be read for this player.');return;}
  const ven=new Map(), day=new Map();
  let noVen=0,noTime=0;
  const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  for(const r of rows){
    if(r.vn){
      if(!ven.has(r.vn))ven.set(r.vn,{label:r.vn,sub:'',gp:0,pts:0,ct:new Map()});
      const o=ven.get(r.vn);o.gp++;o.pts+=r.pts||0;
      if(r.ct)o.ct.set(r.ct,(o.ct.get(r.ct)||0)+1);
    } else noVen++;
    const p=String(r.date).split('-');
    const dow=p.length===3?DAYS[dayOfWeek(+p[0],+p[1],+p[2])]:'';
    const[band]=splitBand(r.t);
    if(dow&&band){
      const k=dow+' '+band;
      if(!day.has(k))day.set(k,{label:dow+' '+band,sub:'',gp:0,pts:0,ts:new Map()});
      const o=day.get(k);o.gp++;o.pts+=r.pts||0;
      if(r.t)o.ts.set(r.t,(o.ts.get(r.t)||0)+1);
    } else noTime++;
  }
  const modal=m=>{let b='',n=0;for(const[k,v]of m)if(v>n){n=v;b=k;}return b;};
  for(const o of ven.values())o.sub=o.ct.size?('usually '+modal(o.ct)):'';
  for(const o of day.values())o.sub=o.ts.size?modal(o.ts):'';
  const foot=[];
  if(noVen)foot.push(noVen+' game'+(noVen===1?'':'s')+' name no venue');
  if(noTime)foot.push(noTime+' carry no time');
  host.innerHTML=`<div class="sp-hd">By venue <span>PPG · ${rows.length} games read</span></div>
    <div class="sp-list">${splitRows(ven)}</div>
    <div class="sp-hd" style="margin-top:10px">By day and time <span>PPG</span></div>
    <div class="sp-list">${splitRows(day)}</div>
    ${foot.length?`<div class="sp-foot">${esc(foot.join(' · '))}.</div>`:''}`;
}

/* ── TEAM-MATE CONTINUITY ──────────────────────────────────────────────────
   The team sheet is the roster block in team-stats/bv/{sid}.json, one file per
   season played — the same files buildOppStats already loads, so a player whose
   opponents have been computed pays nothing here.

   g.p[] names every player in a GAME, both sides, with no marker saying which.
   So the roster decides who is a team-mate and g.p decides which games they were
   actually there for: a season spent in the same squad is not continuity if one
   of them missed half of it. hp/ap are not used — this dataset does not carry
   them, which is why the career cards fetch box scores one game at a time. */
async function buildMates(uuid,btn){
  const host=el('mates-'+uuid); if(!host)return;
  const p=carSt(uuid).p||S.players[uuid];
  if(!p){panelBusy(host,'This profile is not loaded.');return;}
  if(btn)btn.disabled=true;
  const sids=[...new Set((p.seasons||[]).map(s=>s.sid).filter(Boolean))];
  panelBusy(host,'Reading team sheets\u2026');
  await loadSeasonGames(sids,(d,t)=>{if(t)panelBusy(host,`Reading season game files\u2026 ${d} of ${t}`);});
  let done=0;
  for(let i=0;i<sids.length;i+=6){
    await Promise.all(sids.slice(i,i+6).map(async sid=>{
      if(!S.teamStats[sid])S.teamStats[sid]=await sgj('team-stats/bv',sid)||{};
      done++;
    }));
    panelBusy(host,`Reading team sheets\u2026 ${done} of ${sids.length}`);
  }
  // Periods, not seasons: two registrations inside one season period are one
  // column on the strip, exactly as the career cards group them. Ordered oldest
  // to newest — p.seasons is in no order at all, which drew the strip as a
  // shuffled row of cells with no reading direction.
  const periods=[], pOf={};
  for(const s of sortSeasonsDesc(p.seasons||[]).slice().reverse()){
    const k=s.sn||s.sid;
    if(periods.indexOf(k)<0)periods.push(k);
    if(s.sid)pOf[s.sid]=periods.indexOf(k);
  }
  const tnOf={};
  for(const s of (p.seasons||[]))for(const r of (s.regs||[]))if(r.tid&&r.tn)tnOf[r.tid]=r.tn;
  const mineGames=new Set(Array.isArray(p.games)?p.games:[]);
  const tally=new Map();
  let rosters=0;
  for(const sid of sids){
    const ts=S.teamStats[sid]||{};
    const myTids=getTidsForSeason(p,sid)||[];
    const mates=new Map();                       // t13 -> name, for THIS season
    for(const tid of myTids){
      const r=ts[tid]&&ts[tid].roster; if(!r)continue;
      rosters++;
      // The team name as THIS player's own registration spells it, falling back
      // to the team-stats meta. "3 seasons together" says nothing about which
      // side of which club, which is the first thing anyone asks of it.
      const tn=(tnOf[tid]||((ts[tid]&&ts[tid].meta&&ts[tid].meta.name)||''));
      for(const[k,v]of Object.entries(r)){
        if(gameIdMatchesPlayer(k,p))continue;
        mates.set(t13(k),{id:k,name:(v&&v.name)||'',tn});
      }
    }
    if(!mates.size)continue;
    const per=pOf[sid];
    for(const[k,m]of mates){
      if(!tally.has(k))tally.set(k,{id:m.id,name:m.name,g:0,per:new Set(),tn:{}});
      const o=tally.get(k);
      if(!o.name&&m.name)o.name=m.name;
      if(per!=null){o.per.add(per); if(m.tn)o.tn[per]=m.tn;}
    }
    const gf=(S.games[sid]&&S.games[sid].games)||{};
    for(const gid of mineGames){
      const g=gf[gid]; if(!g||!Array.isArray(g.p))continue;
      for(const e of g.p){
        const pid=typeof e==='string'?e:(e&&e.id);
        if(!pid)continue;
        const k=t13(pid);
        const o=tally.get(k);
        if(o&&mates.has(k))o.g++;
      }
    }
  }
  if(btn)btn.disabled=false;
  if(!rosters){
    panelBusy(host,'No team sheets could be read for this player\u2019s seasons.');
    return;
  }
  // No top-N. The first cut kept 24, which on a 400-game career silently threw
  // away most of the answer — and a list that stops at an arbitrary number is
  // worse than a long one, because nothing on screen says it stopped.
  const all=[...tally.values()].sort((a,b)=>b.g-a.g||b.per.size-a.per.size);
  const list=all.filter(o=>o.g>0);
  const noShared=all.length-list.length;
  if(!list.length){
    panelBusy(host,`Read ${rosters} team sheet${rosters===1?'':'s'}, but none of their players appear in this player\u2019s games.`);
    return;
  }
  const span=o=>{const k=[...o.per].sort((a,b)=>a-b);
    if(!k.length)return '';
    return k.length===1?periods[k[0]]:periods[k[0]]+' \u2013 '+periods[k[k.length-1]];};
  // Cards are for the people this player actually keeps playing with — more
  // than one season. One season together is a squad-mate, not a nucleus, and a
  // hundred of those as cards buries the handful that matter; they go in a list
  // underneath. The rank is on the card because the order is games alongside
  // and nothing else on the card says so.
  const core=list.filter(o=>o.per.size>1);
  const rest=list.filter(o=>o.per.size<=1);
  const card=(o,i)=>`<div class="mt-c" onclick="loadPlayer('${esc(o.id)}')" title="Open this player">
      <div class="mt-rk">#${i+1}</div>
      <div class="mt-n">${esc(displayName({name:o.name},o.id))}</div>
      <div class="mt-s">${o.g} game${o.g===1?'':'s'} alongside</div>
      <div class="mt-tl">${periods.map((nm,j)=>`<i class="${o.per.has(j)?'on':''}" title="${
        esc(o.per.has(j)?(nm+(o.tn[j]?' \u00b7 '+o.tn[j]:'')):(nm+' \u00b7 not together'))}"></i>`).join('')}</div>
      <div class="mt-g">${esc(span(o))}</div></div>`;
  const PER_ROW=5, ROWS=3, SHOWN=PER_ROW*ROWS;
  const first=core.slice(0,SHOWN), more=core.slice(SHOWN);
  host.innerHTML=`<div class="mt-hd">${list.length} team-mate${list.length===1?'':'s'} \u00b7 ${rosters} team sheet${rosters===1?'':'s'} \u00b7 ${periods.length} season${periods.length===1?'':'s'}${
    noShared?` \u00b7 ${noShared} more on a squad list with no game recorded alongside`:''}</div>
    ${core.length?`<div class="mt-key"><span class="mt-ke">${esc(periods[0]||'')}</span>
      <span class="mt-kt">${core.length} played more than one season with this player \u00b7 one cell per season, oldest to newest, filled where they shared a team</span>
      <span class="mt-ke">${esc(periods[periods.length-1]||'')}</span></div>
    <div class="mt-grid">${first.map((o,i)=>card(o,list.indexOf(o))).join('')}</div>
    ${more.length?`<div class="mt-grid mt-hide" id="mtmore-${esc(uuid)}">${more.map(o=>card(o,list.indexOf(o))).join('')}</div>
      <button class="mt-btn" data-n="${more.length}" onclick="matesMore(this,'mtmore-${esc(uuid)}')">Show ${more.length} more</button>`:''}`:''}
    ${rest.length?(()=>{
      const li=o=>`<div class="mt-li" onclick="loadPlayer('${esc(o.id)}')" title="Open this player">
        <span class="r">#${list.indexOf(o)+1}</span><span class="n">${esc(displayName({name:o.name},o.id))}</span>
        <span class="s">${esc(span(o))}</span><span class="g">${o.g}</span></div>`;
      const LIST_SHOWN=12;
      const a=rest.slice(0,LIST_SHOWN), z=rest.slice(LIST_SHOWN);
      return `<div class="mt-lhd">One season together \u00b7 ${rest.length}</div>
        <div class="mt-list">${a.map(li).join('')}</div>
        ${z.length?`<div class="mt-list mt-hide" id="mtrest-${esc(uuid)}">${z.map(li).join('')}</div>
          <button class="mt-btn" data-n="${z.length}" onclick="matesMore(this,'mtrest-${esc(uuid)}')">Show ${z.length} more</button>`:''}`;})():''}`;
}

function renderPlayer(p){
  const ve=el('view-player');
  const uuid=p.uuid;
  S.playerUuid=uuid;
  const sport=Object.keys(p.sports||{})[0]||'Basketball';
  const cs=p.sports?.[sport]||{};
  const gp=cs.gp||0,pts=cs.pts||0,fg=cs.fg||0,ft=cs.ft||0,tp=cs.threePt||0,fouls=cs.fouls||0;
  const foulOuts=cs.foulOuts||0,finals=cs.finals||0,gfApps=cs.gfApps||0,gfWins=cs.gfWins||0;
  const finalsPS=cs.finalsPerSeason??null;
  const careerW=cs.wins||0,careerL=cs.losses||0,careerD=cs.draws||0;
  const winPct=cs.winPct!=null?Math.round(cs.winPct*100)+'%':null;
  const upcoming=(p.teams||[]).filter(t=>t.status==='UPCOMING');
  const club=(p.seasons||[])[0]?.club||'';
  const groups=groupRegs(p.seasons||[]);
  let h='';
  h+=`<div class="vhdr"><button class="vback" onclick="history.back()">\u2190</button>
    <div class="avi">${esc(inits(p.name))}</div>
    <div style="flex:1;min-width:0"><div class="vtitle">${esc(displayName(p,uuid))}${privBadge(p)}</div>
    <div class="vsub">${esc([p.gender,club].filter(Boolean).join(' \u00b7 '))}</div>
    <div class="vuuid" title="Click to copy" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(uuid)}')">${esc(uuid)}</div>
    ${isPrivate(p)?'':`<a class="phq-lnk" href="https://www.playhq.com/public/profile/${esc(uuid)}/statistics" target="_blank" rel="noopener" style="display:inline-flex;margin:4px 0 0;padding:3px 8px;font-size:0.72rem">View on PlayHQ \u2197</a>`}
    <button class="h2h-open" onclick="openH2H('${esc(uuid)}',null)">\u2194 Compare with\u2026</button>
    </div></div>`;
  // A PRIVATE profile publishes no statistics, so every OFFICIAL cell shows an em
  // dash rather than 0 (decision 2026-08-21). A zero is a claim that they played
  // none and scored none; a dash says PlayHQ publishes nothing. 3,140 players
  // currently read as though they never played. The recorded-appearance line below
  // is then the only figure they carry, which is the point of showing it.
  const OFF=v=>isPrivate(p)?'\u2014':v;
  h+=`<div class="cstats">
    <div class="cstat"><div class="csv">${OFF(gp)}</div><div class="csl">GP</div></div>
    <div class="cstat"><div class="csv">${OFF(pts)}</div><div class="csl">PTS</div></div>
    <div class="cstat"><div class="csv">${OFF(avg(pts,gp))}</div><div class="csl">PPG</div></div>
    <div class="cstat"><div class="csv">${OFF(tp)}</div><div class="csl">3PT</div></div>
    <div class="cstat"><div class="csv">${OFF(fouls)}</div><div class="csl">F</div></div>${foulOuts>0?`
    <div class="cstat"><div class="csv">${foulOuts}</div><div class="csl">FO</div></div>`:''}${careerW||careerL?`
    <div class="cstat"><div class="csv" style="font-size:0.75rem;display:flex;gap:4px;justify-content:center;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums">${careerW?`<span style="color:var(--win)">${careerW}W</span>`:''}${careerL?`<span style="color:var(--loss)">${careerL}L</span>`:''}${careerD?`<span style="color:var(--draw)">${careerD}D</span>`:''}</div><div class="csl">${winPct??''}</div></div>`:''}${finals>0?`
    <div class="cstat"><div class="csv">${finals}</div><div class="csl">Finals</div></div>`:''}${gfApps>0?`
    <div class="cstat"><div class="csv">${gfApps}</div><div class="csl">GF</div></div>`:''}${gfWins>0?`
    <div class="cstat"><div class="csv">${gfWins}</div><div class="csl">GFW</div></div>`:''}${finalsPS!==null?`
    <div class="cstat"><div class="csv">${finalsPS.toFixed(2)}</div><div class="csl">F/Ssn</div></div>`:''}
  </div>`;
  // ── OFFICIAL vs RECORDED (design decision 2026-08-21) ──────────────────────
  // Two independent numbers live on every player and nothing reconciled them:
  //   cs.gp      PlayHQ's credited career total (summed from reg.stats.gp)
  //   p.games[]  appearances built from p[] team sheets
  // For 39,834 non-private players games[] is LARGER, by 82,424 appearances. The
  // rosters were verified against PlayHQ's own API on 2026-08-18 and
  // publicProfileTeams confirms no registration exists for those teams, so both
  // numbers are right — a fill-in plays a real game for a team they never joined.
  //
  // PlayHQ stays canonical: its row above is unmodified and no leaderboard changes
  // source. This line sits BESIDE it. It is free — games[].length is already loaded
  // — and exact, which is why only APPEARANCES appear here. Recorded SCORING needs
  // every box score fetched through the Worker, so it belongs on the season card
  // where a fetch already happens.
  //
  // Private profiles: cstats renders \u2014 for every official stat rather than 0,
  // because a zero claims they played none while a dash says PlayHQ publishes
  // nothing. This line is then the only figure they have.
  const recApps=Array.isArray(p.games)?p.games.length:0;
  if(recApps||isPrivate(p)){
    // CORRECTED 2026-09-04. Was `recApps - gp`: a difference of two TOTALS shown
    // as a count of games PlayHQ does not credit. Not the same thing - the two
    // lists disagree in BOTH directions and a subtraction cancels them. Shard 00,
    // 1,591 players in scope: 288 carry `c` (credited, we lack it), 144 carry `x`
    // (we hold it, not credited), 66 carry BOTH. For those 66 the old figure was
    // short by exactly c.length; wherever c exceeded x it went negative and the
    // line vanished. For a private player with no gp it read the whole games count
    // as "not credited", which is nonsense - PlayHQ published nothing at all.
    //
    // `x` IS the count, from PlayHQ's own credited list at fetch time, forfeits
    // excluded on both sides. Absent means zero; the field is deleted, not empty.
    // The old arithmetic survives only for files written before the diff existed.
    const uncredited = Array.isArray(cs.x) ? cs.x.length
                     : (cs.statsChecked ? 0 : Math.max(0, recApps - gp));
    h+=`<div class="recbar">
      <span class="recbar-l">Recorded appearances</span>
      <span class="recbar-v">${recApps}</span>${(!isPrivate(p)&&uncredited>0)?`
      <span class="recbar-n">\u00b7 ${uncredited} not credited by PlayHQ</span>`:''}${isPrivate(p)?`
      <span class="recbar-n">\u00b7 from published team sheets</span>`:''}
    </div>`;
  }
  h+=renderFinalsPanel(cs,{fo:foulOuts>0,rec:!!(careerW||careerL),fin:finals>0,gf:gfApps>0,gfw:gfWins>0,fssn:finalsPS!==null});
  if(upcoming.length){
    h+=`<div class="upsec"><div class="uplbl">\u26a1 Upcoming</div>`;
    for(const t of upcoming){
      const si=S.idx?.seasons?.[t.sid];
      h+=`<div class="upitem" onclick="loadTeam('${esc(t.tid)}','${esc(t.sid)}')">${esc(si?.name||t.sid)} \u2192</div>`;
    }
    h+='</div>';
  }
  /* ── TABS (v1.68) ─────────────────────────────────────────────────────────
     Four panes, using the same vtabs/vtab/tpane classes the team view has had
     since v1.0, so the two views read as one app. The header, the career stat
     row and the recorded-appearances line stay ABOVE the bar: they identify the
     player, and a tab that could hide who you are looking at is not a tab. */
  const pt=(id,label,on)=>`<button class="vtab${on?' on':''}" onclick="switchPTab(this,'pp${id}-${esc(uuid)}','${esc(uuid)}','${id}')">${label}</button>`;
  h+=`<div class="vtabs">${pt('S','Season',1)}${pt('L','Games')}${pt('O','Opponents')}${pt('R','Clubs')}</div>`;
  h+=`<div class="tpane on" id="ppS-${esc(uuid)}">`;
  h+=`<div class="pmove-wrap" id="pmove-${esc(uuid)}"></div>`;
  h+='<div class="slist"><div class="sec-lbl">Season history</div>';
  // ── PERIOD TOTALS (v1.31) ────────────────────────────────────────────────
  // groups is one entry per (sid,tid). One season period often holds several
  // sids, so three cards all headed "Summer 2026/27" is three answers to one
  // question. Total them under one header; single-registration periods are
  // untouched. Per-group stats use the same MAX-across-siblings rule as the
  // card below (T20) and are then SUMMED across different tids.
  const periodOf=g=>g.sn.sn||g.sn.sid;
  const gst=groups.map(({regs})=>{
    const st=regs.reduce((a,r)=>{const q=r.stats||{};return{
      gp:Math.max(a.gp||0,q.gp||0),pts:Math.max(a.pts||0,q.pts||0),fg:Math.max(a.fg||0,q.fg||0),
      ft:Math.max(a.ft||0,q.ft||0),threePt:Math.max(a.threePt||0,q.threePt||0),
      fouls:Math.max(a.fouls||0,q.fouls||0)};},{});
    const w=regs[0]&&regs[0].stats||{};
    return{st,w:w.wins||0,l:w.losses||0,d:w.draws||0};
  });
  const periods=new Map();
  groups.forEach((g,i)=>{
    const k=periodOf(g);
    if(!periods.has(k))periods.set(k,{n:0,first:i,gp:0,pts:0,fg:0,ft:0,tp:0,f:0,w:0,l:0,d:0});
    const t=periods.get(k),x=gst[i];
    t.n++;t.gp+=x.st.gp||gamesForGroup(p,g.regs);t.pts+=x.st.pts||0;t.fg+=x.st.fg||0;
    t.ft+=x.st.ft||0;t.tp+=x.st.threePt||0;t.f+=x.st.fouls||0;t.w+=x.w;t.l+=x.l;t.d+=x.d;
  });
  groups.forEach(({sn,tid,regs},gi)=>{
    const pk=periodOf({sn}),pt=periods.get(pk);
    if(pt&&pt.n>1&&pt.first===gi){
      const pppg=pt.gp?(pt.pts/pt.gp).toFixed(1):'\u2014';
      const ppc=(pt.w+pt.l+pt.d)>0?Math.round(pt.w/(pt.w+pt.l+pt.d)*100)+'%':'';
      // EIGHT cells, because the season rows beneath render eight. `.cstat` is
      // flex:1, so alignment IS cell-count parity (same rule as the finals row
      // against the career strip) \u2014 a seven-cell header drifts further out of
      // line with every column.
      const pwld=(pt.w||pt.l||pt.d)
        ? `${pt.w?`<span style="color:var(--win)">${pt.w}W</span>`:''}${pt.l?`<span style="color:var(--loss)">${pt.l}L</span>`:''}${pt.d?`<span style="color:var(--draw)">${pt.d}D</span>`:''}`
        : '<span style="color:var(--text3)">\u2014</span>';
      h+=`<div class="sp-hdr"><div class="sp-info"><div class="sp-n">${esc(pk)}</div>
        <div class="sp-s">${pt.n} teams</div></div>
        <div class="sp-cells">${[[pt.gp,'GP'],[pppg,'PPG'],[pt.pts,'PTS'],[pt.fg,'FG'],[pt.ft,'FT'],[pt.tp,'3PT'],[pt.f,'F']]
          .map(([v,l])=>statCell(v,l,false,null)).join('')}
          <div style="flex:1;text-align:center;padding:6px 4px;min-width:0;overflow:hidden">
            <div style="font-size:0.75rem;font-weight:700;display:flex;gap:3px;justify-content:center;white-space:nowrap;font-variant-numeric:tabular-nums">${pwld}</div>
            <div style="font-size:0.58rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-top:1px">${ppc}</div>
          </div></div></div>`;
    }
    const inPeriod=pt&&pt.n>1;
    // Use last reg as team link target (most stable).
    const primary=regs[regs.length-1];
    // Sibling regs sharing a tid carry IDENTICAL season-cumulative stat blocks (the
    // pipeline's sibling sync keeps them in step), so SUMMING them doubles every stat
    // for regraded players (B→BRES etc: gp 13 rendered as 26). Take the per-stat MAX
    // across the group — identity for single regs and for synced siblings, and the
    // documented correct resolution for any sibling the sync hasn't reached (same rule
    // the W/L/D block below has always applied via regs[0]). Do NOT change back to a sum.
    const st=regs.reduce((a,r)=>{const s=r.stats||{};return{
      gp:Math.max(a.gp||0,s.gp||0),pts:Math.max(a.pts||0,s.pts||0),
      fg:Math.max(a.fg||0,s.fg||0),ft:Math.max(a.ft||0,s.ft||0),
      threePt:Math.max(a.threePt||0,s.threePt||0),fouls:Math.max(a.fouls||0,s.fouls||0),
      foulOuts:Math.max(a.foulOuts||0,s.foulOuts??0),
      finals:Math.max(a.finals||0,s.finals??0),
      gfApps:Math.max(a.gfApps||0,s.gfApps??0),
      gfWins:Math.max(a.gfWins||0,s.gfWins??0)
    };},{});
    // ── GP FROM games[] WHEN THE REG HAS NO STATS ────────────────────────────
    // reg.stats is written by fetch-profile-stats from PlayHQ's per-season figures.
    // A season back-filled from the API's stats response carries a tid and often
    // {wins,losses} but NO gp — so the card rendered "0 GP" for a player who had
    // played 27 games. Tahlia Parker showed 1 populated season out of 30 against a
    // career of 389.
    //
    // The file already holds the answer: gameTids maps every gid in games[] to the
    // team it was played for. Counting the player's own games against this card's
    // tid is EXACT, costs nothing, and needs no fetch.
    //
    // PlayHQ's figure still wins where it exists — it is canonical, and a game we
    // hold that PlayHQ does not credit must not silently inflate a season total.
    // This fills a HOLE; it never overwrites.
    const gpFromGames=gamesForGroup(p,regs);
    const stGp=st.gp||gpFromGames;
    const gpIsOurs=!st.gp&&gpFromGames>0;

    // All grade names joined — no assumption about order
    const allGrades=abbreviateGrades([...new Set(regs.map(r=>r.gn||r.tn||'?'))]);
    const cid=`sc-${gi}`;
    const teamLink=`<span class="sc-grade" onclick="event.stopPropagation();loadTeam('${esc(tid)}','${esc(sn.sid)}')">${esc(allGrades)} \u2192</span>`;
    const ppg=st.gp?(st.pts/st.gp).toFixed(1):'\u2014';   // PPG only where PlayHQ gave both
    // W/L/D is per sid:tid — all regs with same tid have the same value.
    // Take from first reg only to avoid multiplication when regraded (multiple regs, same tid).
    const _wldReg=regs[0]?.stats;
    const regW=_wldReg?.wins||0;
    const regL=_wldReg?.losses||0;
    const regD=_wldReg?.draws||0;
    const regWinPct=(regW+regL+regD)>0?Math.round(regW/(regW+regL+regD)*100)+'%':null;
    // Medal keys off this season's reg stats ONLY. A career fallback here painted the
    // GF-winner medal on every season a winner ever played. Per-reg data is authoritative.
    const medal=st.gfWins>0?' \ud83e\udd47':st.gfApps>0?' \ud83e\udd48':st.finals>0?' \ud83e\udd49':'';
    // Locked marker keys on locked ONLY — never archivedAt: where a season is
    // SERVED from must stay invisible in the interface.
    const sLocked=S.idx?.seasons?.[sn.sid]?.locked===true;
    h+=`<div class="sc${inPeriod?' sp-mem':''}">
      <div class="sc-hdr" data-cid="${esc(cid)}" data-si="${gi}" onclick="toggleGames(this)">
        <div class="sc-info" class="sc-info">
          <div style="display:flex;align-items:flex-start;gap:5px">
            <span class="chev" style="flex-shrink:0;margin-top:3px">\u25b6</span>
            <div style="min-width:0">
              <div class="sc-name${sLocked?' sc-name-locked':''}">${inPeriod?'':esc(sn.sn)+' \u00b7 '}${esc(primary.tn||sn.club)}${medal}${sLocked?' <span class="sc-lock-pill">LOCKED</span>':''}</div>
              <div>${teamLink}</div>
            </div>
          </div>
        </div>
        <div style="flex:7;min-width:0;display:flex;flex-direction:row">${[[stGp||0,'GP',gpIsOurs?'var(--accent)':null],[ppg,'PPG',null],[st.pts||0,'PTS',null],[st.fg||0,'FG',null],[st.ft||0,'FT',null],[st.threePt||0,'3PT',null],[st.fouls||0,'F',null]].map(([v,l,c],i)=>statCell(v,l,i===6,c)).join('')}${`<div class="sstat"><div class="ssv" style="font-size:0.68rem;display:flex;gap:3px;justify-content:center;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums">${(regW||regL||regD)?`${regW?`<span style="color:var(--win)">${regW}W</span>`:''}${regL?`<span style="color:var(--loss)">${regL}L</span>`:''}${regD?`<span style="color:var(--draw)">${regD}D</span>`:''}`:'<span style="color:var(--text3)">\u2014</span>'}</div><div class="ssl">${regWinPct??''}</div></div>`}</div>
      </div>
      <div class="sc-games" id="${esc(cid)}-g"></div>
    </div>`;
  });
  h+='</div>';
  h+='</div>';                                   // ── end Season pane

  // ── Splits ───────────────────────────────────────────────────────────────
  h+=`<div class="tpane" id="ppL-${esc(uuid)}">
    <div class="phigh-wrap" id="phigh-${esc(uuid)}"></div>
    <div class="slist"><div class="sec-lbl">Venue and day</div>
      <div id="splits-${esc(uuid)}"><div class="sp-wait">Reading game lines…</div></div>
    </div></div>`;

  // ── Opponents ────────────────────────────────────────────────────────────
  // Team-mates first: it reads one file per season and is on screen in a second,
  // where the head-to-head walk takes twenty or more. The fast panel leading means
  // the tab is never blank while the slow one works.
  h+=`<div class="tpane" id="ppO-${esc(uuid)}">
    <div class="slist"><div class="sec-lbl">Team-mates</div>
      <div id="mates-${esc(uuid)}"><div class="sp-wait">Reading team sheets…</div></div></div>
    <div class="slist"><div class="sec-lbl">Opponent stats</div>
      <div id="opp-stats-${esc(uuid)}"><div class="sp-wait">Waiting for the team sheets…</div></div></div>
    </div>`;

  // ── Registrations ────────────────────────────────────────────────────────
  h+=`<div class="tpane" id="ppR-${esc(uuid)}">`;
  h+=`<div class="pclub-wrap" id="pclub-${esc(uuid)}"></div>`;
  h+=renderUnreg(p);
  h+=renderDiff(p);
  h+=renderGradeSnapshot(p.seasons||[]);
  h+='</div>';
  ve.innerHTML=h;
  // Store groups on element for toggleGames
  ve._groups=groups;
  if(cs.finalsStats)hydrateFinals(uuid,cs.finalsStats);
  hydrateClubs(p,groups);
  hydrateDiff(p);
  hydrateCareer(p);
  hydrateHighs(uuid);
}

/* ── UNREGISTERED APPEARANCES ─────────────────────────────────────────────────
   Games where the player is named in the team sheet but holds NO REGISTRATION with
   either team — PlayHQ's own "Fill-in" case, plus one-off appearances. Real games;
   PlayHQ credits them to no career total, which is why they are separated from the
   season list rather than folded into it.

   WHY THIS NEEDS THE `u` FIELD AND CANNOT BE DERIVED HERE. games[] is a flat list
   of game ids with NO SEASON, and this app only ever reaches a game season-first:
   S.games[sid] is fetched when a season card expands, and season cards are built
   from seasons[].regs[]. An unregistered appearance has no registration, therefore
   no card, therefore nothing tells the app which season file to load. 1,115,257 of
   them were simply invisible until build-player-games began emitting
   `u: ["gid|sid|tid", ...]` on 2026-08-21.

   `u` carries ONLY the measurable kind. An appearance in a season we hold no
   registration for at all is NOT emitted — absence of evidence is not evidence of
   absence, and labelling it a fill-in would be a false accusation about a real
   season. 137,384 are withheld on that basis. */
/* ── CREDIT DIFFERENCES (c / x) ───────────────────────────────────────────────
   Written by fetch-profile-stats.js from PlayHQ's own credited game list at the
   moment of the fetch, forfeits excluded on BOTH sides:

     c  PlayHQ credits it, games[] does not hold it. We are missing the game.
     x  games[] holds it, PlayHQ does not credit it.

   Both are DELETED rather than written empty, so absent means zero. Measured on
   shard 00 (1,591 players, all freshly fetched): 288 carry c, 144 carry x, 66
   carry both.

   WHY THIS NEEDS TO RESOLVE THE SEASON ITSELF. `u` entries carry theirs
   ("gid|sid|tid"), but c and x are BARE GAME IDS - the same problem the note above
   renderUnreg describes for games[]. This app only ever reaches a game
   season-first, so nothing here says which games/bv file to open. So on expand it
   walks the player's own seasons[] and finds which one holds each id, the same
   approach resolveOppGames already uses. Bounded by the player's season count,
   fetched only when the card is opened, and cached in S.games afterwards.

   An id that resolves to none of them is listed plainly rather than dropped. For
   `c` that is expected and is the interesting case: a game we hold no record of at
   all, in a season we may never have crawled. */
function renderDiff(p){
  // `sport` is a LOCAL const in the card renderer, not a global. Derived here the
  // same way (first key of p.sports) so this function does not depend on the
  // caller's scope - referencing it directly threw a ReferenceError that
  // `node --check` cannot see.
  const sport=Object.keys(p.sports||{})[0]||'Basketball';
  const cs=p.sports?.[sport]||{};
  const c=Array.isArray(cs.c)?cs.c:[];
  // `x` is deliberately NOT listed here. Every x game is one we hold, so it is
  // already a row in its season card, badged NOT CREDITED in place - which reads
  // better than the same game appearing twice on one page with nothing linking
  // them. The only x games without a season card are ones where the player is not
  // registered to either side, and those are already in the unregistered section.
  // `c` has no such home: we hold no record of those games at all, so this is the
  // only place they can appear.
  if(!c.length)return '';
  const blk=(kind,ids,title,note)=>{
    if(!ids.length)return '';
    const cid=`df-${kind}`;
    return `<div class="sc">
      <div class="sc-hdr diff-hdr" data-cid="${esc(cid)}" data-kind="${esc(kind)}" onclick="toggleDiff(this)">
        <div class="sc-info">
          <div style="display:flex;align-items:flex-start;gap:5px">
            <span class="chev" style="flex-shrink:0;margin-top:3px">\u25b6</span>
            <div style="min-width:0">
              <div class="sc-name">${esc(title)}</div>
              <div style="font-size:0.72rem;color:var(--text3)">${esc(note)}</div>
            </div>
          </div>
        </div>
        <div style="flex:0 0 auto;padding-right:12px;font-size:0.74rem;color:var(--text2);font-variant-numeric:tabular-nums">${ids.length} game${ids.length===1?'':'s'}</div>
      </div>
      <div class="sc-games" id="${esc(cid)}-g"></div>
    </div>`;
  };
  return `<div class="slist" id="diff-sec">
    <div class="sec-lbl" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>Games we are missing</span>
      <span class="unreg-pill">${c.length}</span>
      <label class="unreg-tog"><input type="checkbox" checked onchange="el('diff-body').classList.toggle('hidden',!this.checked)"> Show</label>
    </div>
    <div class="unreg-note">PlayHQ credits these games to this player and we hold no record of them. Compared game by game at the last stats fetch, forfeits excluded from both sides. Games we hold that PlayHQ does not credit are marked NOT CREDITED in the season card instead.</div>
    <div id="diff-body">
      ${blk('c',c,'Credited by PlayHQ, not in our record',"PlayHQ counts these toward the career totals above. We hold no appearance for them, so they are in no season card.")}
    </div>
  </div>`;
}

/* `cs.c` is a snapshot: the games PlayHQ credited that we held no record of AT
   THE LAST STATS FETCH. The crawler keeps running after that, so a game listed
   here is routinely captured days later and now sits in its season card as an
   ordinary row — while this panel still announces that we have no record of it.
   Every player showing exactly one is that: the most recent round, credited
   before the crawl caught up.

   So re-check the list against what we actually hold now. The season files are
   already in S.games for any profile that has opened, so this usually costs
   nothing. A gid we now hold is dropped; if every one resolves, the panel goes
   entirely rather than standing there contradicting the card below it. */
async function hydrateDiff(p){
  const sec=el('diff-sec'); if(!sec||!p)return;
  const sport=Object.keys(p.sports||{})[0]||'Basketball';
  const c=((p.sports||{})[sport]||{}).c;
  if(!Array.isArray(c)||!c.length)return;
  const uuid=p.uuid, want=new Set(c), held=new Set();
  await loadSeasonGames((p.seasons||[]).map(sn=>sn.sid));
  for(const sn of p.seasons||[]){
    if(!want.size)break;
    const sid=sn.sid; if(!sid)continue;
    const gf=(S.games[sid]||{}).games||{};
    for(const gid of [...want]){
      const g=gf[gid]; if(!g)continue;
      const inIt=(g.p||[]).some(x=>matchP(x.id,uuid))||!!storedStats(g,uuid);
      if(inIt){held.add(gid);want.delete(gid);}
    }
  }
  if(!held.size)return;
  if(S.playerUuid!==uuid)return;
  const left=c.filter(g=>!held.has(g));
  if(!left.length){sec.remove();return;}
  const pill=sec.querySelector('.unreg-pill'); if(pill)pill.textContent=left.length;
  const hdr=sec.querySelector('.diff-hdr');
  if(hdr){
    const cnt=hdr.lastElementChild;
    if(cnt)cnt.textContent=`${left.length} game${left.length===1?'':'s'}`;
  }
  sec._cLeft=left;
  const body=el('df-c-g'); if(body){body.innerHTML='';delete body.dataset.loaded;}
}

async function toggleDiff(hdr){
  const open=hdr.classList.toggle('open');
  const cid=hdr.dataset.cid, kind=hdr.dataset.kind;
  const ge=el(cid+'-g');
  ge.classList.toggle('open',open);
  if(!open||ge.dataset.loaded)return;
  const uuid=S.playerUuid;
  const p=S.players[uuid]||{};
  const sport=Object.keys(p.sports||{})[0]||'Basketball';
  const cs=p.sports?.[sport]||{};
  const sec=el('diff-sec');
  const ids=(kind==='c'&&sec&&Array.isArray(sec._cLeft))?sec._cLeft
           :(Array.isArray(cs[kind])?cs[kind]:[]);
  if(!ids.length){ge.innerHTML='<div class="load-row">Nothing to show.</div>';ge.dataset.loaded='1';return;}
  ge.innerHTML='<div class="load-row">Loading games\u2026</div>';
  // Resolve gid -> sid across the player's own seasons. Stops early once every id
  // is placed, so a player with one stray difference does not fetch every season.
  const sids=[...new Set((p.seasons||[]).map(s=>s.sid).filter(Boolean))];
  const found=new Map();
  for(const sid of sids){
    if(found.size>=ids.length)break;
    if(!S.games[sid]){const dd=await sgj('games/bv',sid);S.games[sid]=dd||{games:{}};}
    const all=S.games[sid]?.games||{};
    for(const gid of ids){ if(!found.has(gid)&&all[gid]) found.set(gid,{sid,g:all[gid]}); }
  }
  const rows=[...found.entries()].sort((a,b)=>(b[1].g.d||'').localeCompare(a[1].g.d||''));
  const unresolved=ids.filter(g=>!found.has(g));
  const badge=kind==='c'?'<span class="bdg bMiss">NOT HELD</span>':'<span class="bdg bNoCr">NOT CREDITED</span>';
  // Side resolution, most reliable first. getPlayerTeamForGame reads the stored
  // box-score sides, which is the ONLY thing that works for a `c` game: PlayHQ
  // credits it but our roster does not have the player on it, so the season
  // registration is not necessarily the team they turned out for. Falls back to
  // the registration, then to the home side.
  const tidFor=(g,sid)=>getPlayerTeamForGame(g,uuid,p)||getTidForSeason(p,sid)||hTid(g);
  let html=rows.map(([gid,{sid,g}])=>{
    const tid=tidFor(g,sid);
    const ctx=gameCtx(g,tid);
    const stored=storedStats(g,uuid);
    const mode=renderMode(g);
    const oppN=(ctx.oppN||'\u2014').slice(0,30);
    const fc=finalClass(g.rn);
    const badgeH=(mode==='hidden-full'||mode==='hidden-partial')?'<span class="bdg bH" style="font-size:0.58rem;padding:0 4px">H</span>':'';
    // The team they turned out for. Omitted in the first version, which left the
    // row showing an opponent with no indication of which side the player was on.
    const[_hN,_aN]=teamNames(g);
    const forN=(tid===hTid(g)?_hN:tid===aTid(g)?_aN:'')||'';
    return`<div class="grow${fc?' '+fc:''}" data-gid="${esc(gid)}" data-sid="${esc(sid)}">
      <div class="g-row">
        <div class="g-info">
          <div class="g-opp">${badge}${badgeH}${ctx.oppId?`<span style="cursor:pointer;text-decoration:underline;text-decoration-color:var(--border)" onclick="event.stopPropagation();openOpp('${esc(ctx.oppId)}','${esc(sid)}','${esc(uuid)}')">${esc(oppN)}</span>`:esc(oppN)}</div>
          <div class="g-rn">${esc(g.rn||'')}${g.d?' \u00b7 '+esc(fmtD(g.d)):''}${forN?' \u00b7 for '+esc(forN):''} \u00b7 ${esc(S.idx?.seasons?.[sid]?.name||sid)}</div>
        </div>
        <div id="gstats-${esc(gid)}" style="flex:7;min-width:0;display:flex;flex-direction:row">${buildGameStatRow(g,ctx,stored,false)}</div>
      </div>
    </div>`;
  }).join('');
  // Listed, never dropped. For `c` this is the interesting case: a game PlayHQ
  // credits that we hold no record of in any season we know about.
  if(unresolved.length){
    html+=`<div class="diff-miss">${unresolved.length} game${unresolved.length===1?'':'s'} not found in any season on this profile: ${unresolved.map(g=>esc(g)).join(', ')}</div>`;
  }
  ge.innerHTML=html||'<div class="load-row">No game records found.</div>';
  // Opens the box score. Copied from toggleGames L1544 - without it these rows
  // were the only game rows in the app that did nothing when clicked.
  ge.addEventListener('click',e=>{const r=e.target.closest('.grow');if(r)openSheet(r.dataset.gid,r.dataset.sid);});
  ge.dataset.loaded='1';
  // Fills the stat cells from the box score, exactly as toggleGames L1547 does.
  // This is why the first version showed nothing: storedStats only has a line if
  // the player is already in the game's hp/ap, and for a `c` game they are not -
  // that is what makes it a `c` game. The box score is the only place the numbers
  // exist, and nothing was fetching it.
  rows.filter(([,{g}])=>typeof g.hs==='number'&&!storedStats(g,uuid)).forEach(([gid,{sid,g}])=>{
    fetchBox(gid).then(bs=>{
      const el2=document.getElementById('gstats-'+gid);
      if(!el2||!bs)return;
      const allP=[...(bs.h||[]),...(bs.a||[])];
      const mine=allP.find(pp=>matchP(pp.profileID,uuid));
      if(mine)el2.innerHTML=buildGameStatRow(g,gameCtx(g,tidFor(g,sid)),mine,false);
    });
  });
}

function renderUnreg(p){
  const raw=Array.isArray(p.u)?p.u:[];
  if(!raw.length)return '';
  // Group by season. Team names are NOT in the player file for a team the player
  // never registered with, so they are resolved from the game records on expand.
  const bySid=new Map();
  for(const e of raw){
    const [gid,sid,tid]=String(e).split('|');
    if(!gid||!sid)continue;
    if(!bySid.has(sid))bySid.set(sid,[]);
    bySid.get(sid).push({gid,tid:tid||null});
  }
  if(!bySid.size)return '';
  const order=[...bySid.keys()].sort((a,b)=>{
    const an=S.idx?.seasons?.[a]?.name||'',bn=S.idx?.seasons?.[b]?.name||'';
    return bn.localeCompare(an);
  });
  // Count what is actually RENDERED, not raw.length — a malformed entry that gets
  // filtered above would otherwise make the pill disagree with the cards below it.
  let shown=0; for(const v of bySid.values()) shown+=v.length;
  let h=`<div class="slist" id="unreg-sec">
    <div class="sec-lbl" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>Unregistered appearances</span>
      <span class="unreg-pill">${shown}</span>
      <label class="unreg-tog"><input type="checkbox" checked onchange="el('unreg-body').classList.toggle('hidden',!this.checked)"> Show</label>
    </div>
    <div class="unreg-note">Named in the team sheet but holding no registration with either team \u2014 fill-ins and one-off games. Real appearances, and PlayHQ does count them: it credits each one against this player's registration with a different team, which is why they sit here rather than under a season card.</div>
    <div id="unreg-body">`;
  order.forEach((sid,ui)=>{
    const list=bySid.get(sid);
    const meta=S.idx?.seasons?.[sid];
    const nm=meta?.name||sid;
    const org=meta?.orgName||'';
    const cid=`ur-${ui}`;
    h+=`<div class="sc">
      <div class="sc-hdr unreg-hdr" data-cid="${esc(cid)}" data-sid="${esc(sid)}" data-pairs="${esc(list.map(x=>x.gid+':'+(x.tid||'')).join(','))}" onclick="toggleUnreg(this)">
        <div class="sc-info">
          <div style="display:flex;align-items:flex-start;gap:5px">
            <span class="chev" style="flex-shrink:0;margin-top:3px">\u25b6</span>
            <div style="min-width:0">
              <div class="sc-name">${esc(nm)}</div>
              <div style="font-size:0.72rem;color:var(--text3)">${esc(org)}</div>
            </div>
          </div>
        </div>
        <div style="flex:0 0 auto;padding-right:12px;font-size:0.74rem;color:var(--text2);font-variant-numeric:tabular-nums">${list.length} game${list.length===1?'':'s'}</div>
      </div>
      <div class="sc-games" id="${esc(cid)}-g"></div>
    </div>`;
  });
  h+='</div></div>';
  return h;
}

async function toggleGames(hdr){
  const open=hdr.classList.toggle('open');
  const cid=hdr.dataset.cid;
  const ge=el(cid+'-g');
  ge.classList.toggle('open',open);
  if(!open||ge.dataset.loaded)return;

  if(!group){ge.innerHTML='<div class="load-row">Error loading group.</div>';return;}
  const{sn,tid,regs}=group;
  const sid=sn.sid;
  const uuid=S.playerUuid;
  ge.innerHTML='<div class="load-row">Loading games\u2026</div>';
  if(!S.games[sid]){const d=await sgj('games/bv',sid);S.games[sid]=d||{games:{}};}
  const all=S.games[sid]?.games||{};
  const pg=Object.entries(all)
    // hTid/aTid, not g.h/g.a: a hidden game matched NEITHER side, so a season of
    // hidden games rendered "No game records found." for a player who played all
    // of them.
    .filter(([,g])=>(hTid(g)===tid||aTid(g)===tid)&&(g.p||[]).some(p=>matchP(p.id,uuid)))
    .sort(([,a],[,b])=>(b.d||'').localeCompare(a.d||''));
  if(!pg.length){ge.innerHTML='<div class="load-row">No game records found.</div>';ge.dataset.loaded='1';return;}
  const allRegGradeNames=regs.map(r=>r.gn||r.tn||'').filter(Boolean);
  // Mirror of the header's W/L cell. ⚠️ 2026-09-13: the header's cell is now
  // UNCONDITIONAL — it used to be `${regW||regL?…:''}` and emitted NOTHING when a
  // team had played no games, leaving the flex row with seven children instead of
  // eight so every other column stretched and fell out of line with the rows above
  // and below it. A pre-season team has no wins and no losses by definition, so the
  // whole season card misaligned. The header now always renders the cell, showing an
  // em dash when there is nothing in it. This pad MUST match it or the game rows
  // underneath sit one column short of their own header.
  // when the header renders 8 columns, every game row pads to 8.
  const padWld=true;
  // Games PlayHQ does NOT credit, marked in place. Without this the same game
  // appears twice on one card with no connection between them: as an ordinary row
  // here, and again under "Credit differences" as not credited. The season
  // header's totals come from the PlayHQ registration and exclude it, so the rows
  // below already sum to more than the figure above them - the badge is what says
  // why. Set is built once per expand rather than per row.
  const _pX=S.players[uuid]?.sports?.[Object.keys(S.players[uuid]?.sports||{})[0]||'Basketball']?.x;
  const xSet=new Set(Array.isArray(_pX)?_pX:[]);
  // Stamped on the container because applyBox ALSO rewrites #gstats-{gid} rows
  // (box-score refresh) from outside this scope — it reads the stamp back.
  if(padWld)ge.dataset.pad='1';
  const rows=pg.map(([gid,g])=>{
    const ctx=gameCtx(g,tid);
    const res=resLetter(ctx.myS,ctx.oppS);
    const sc=(ctx.myS!=null&&ctx.oppS!=null)?`${ctx.myS}\u2013${ctx.oppS}`:'';
    const stored=storedStats(g,uuid);
    const mode=renderMode(g);
    const oppN=(ctx.oppN||'\u2014').slice(0,30);
    const fc=finalClass(g.rn);
    const badgeH=(mode==='hidden-full'||mode==='hidden-partial')?'<span class="bdg bH" style="font-size:0.58rem;padding:0 4px">H</span>':'';
    // VERIFIED 2026-09-05 against a real case rather than reasoned about. Toby
    // Jovic (0afc7690), game c7a6db82, 02 Aug 2025 v MLBC B32: PlayHQ's OWN box
    // score lists him with 2 points and 3 fouls, and PlayHQ's OWN profile page
    // omits that round and puts the season at 14 games. So the game is real, he
    // played it, and PlayHQ does not count it - the inconsistency is theirs.
    //
    // Two earlier explanations were wrong and are recorded so they are not tried
    // again: that he was named but did not play (the box score has him), and that
    // gameStatistics truncates at 50 per grade the way gradePlayerStatistics does
    // (this season has 14 games, nowhere near a cap).
    //
    // The badge therefore states the fact and no cause.
    const badgeX=xSet.has(gid)?'<span class="bdg bNoCr" title="PlayHQ does not count this game toward the season totals above, even where its own box score shows the player in it">NOT CREDITED</span>':'';
    const gradeTag=regs.length>1&&g.gn?`<span style="font-size:0.62rem;color:var(--accent);font-weight:600;margin-right:6px;flex-shrink:0;white-space:nowrap">${esc(gradeAbbrev(g.gn,allRegGradeNames))}</span>`:'';    
    return`<div class="grow${fc?' '+fc:''}" data-gid="${esc(gid)}" data-sid="${esc(sid)}">
      <div class="g-row">
        <div class="g-info">
          <div class="g-opp">${gradeTag}${badgeH}${ctx.oppId?`<span style="cursor:pointer;text-decoration:underline;text-decoration-color:var(--border)" onclick="openOpp('${esc(ctx.oppId)}','${esc(sid)}','${esc(uuid)}')">${esc(oppN)}</span>`:esc(oppN)}${badgeX}</div>
          <div class="g-rn">${esc(g.rn||'')}${g.d?' \u00b7 '+esc(fmtD(g.d)):''}</div>
        </div>
        <div id="gstats-${esc(gid)}" style="flex:7;min-width:0;display:flex;flex-direction:row">${buildGameStatRow(g,ctx,stored,padWld)}</div>
      </div>
    </div>`;
  }).join('');
  ge.innerHTML=rows;
  ge.addEventListener('click',e=>{const r=e.target.closest('.grow');if(r)openSheet(r.dataset.gid,r.dataset.sid);});
  ge.dataset.loaded='1';
  // Fetch box scores in parallel and update player stat cells
  pg.filter(([,g])=>typeof g.hs==='number'&&!storedStats(g,uuid)).forEach(([gid,g])=>{
    fetchBox(gid).then(bs=>{
      const el2=document.getElementById('gstats-'+gid);
      if(!el2||!bs)return;
      const allP=[...(bs.h||[]),...(bs.a||[])];
      const mine=allP.find(p=>matchP(p.profileID,uuid));
      if(mine)el2.innerHTML=buildGameStatRow(g,gameCtx(g,tid),mine,padWld);
    });
  });
}

function buildSeasonPicker(){
  if(!S.idx)return;
  const nm=new Map();
  for(const s of Object.values(S.idx.seasons)){
    if(!nm.has(s.name))nm.set(s.name,{name:s.name,active:false});
    if(!s.locked)nm.get(s.name).active=true;
  }
  const sorted=[...nm.values()].sort((a,b)=>{
    if(a.active!==b.active)return a.active?-1:1;
    const ya=a.name.match(/\d{4}/)?.[0]||'0',yb=b.name.match(/\d{4}/)?.[0]||'0';
    return parseInt(yb)-parseInt(ya);
  });
  const sel=el('q-sn');
  sel.innerHTML='<option value="">Select season\u2026</option>'+sorted.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}${s.active?' \u25cf':' \ud83d\udd12'}</option>`).join('');
  buildCompPicker();
}
async function loadTeamIdx(){if(!S.teamIdx){S.teamIdx=await gj(BASE+'/data/team-index.json')||{};}}

/* ── Season -> competition -> grade (2026-10-05) ──────────────────────────────
   A season NAME is not a season. "Summer 2026/27" is run by dozens of
   associations, and data/team-index.json is keyed by that name, so picking a
   season has always dumped every association's teams into one list. The two
   selects below narrow it the way the data is actually shaped:

     season name  ->  the sids carrying that name
     competition  ->  one sid (usually), via sports-index's compName
     grade        ->  that season's own grades[], from sports-index

   THE GRADE FILTER READS team-stats, NOT team-index. team-index's `grade` is
   whichever grade the team was seen in FIRST and is never corrected —
   update-team-index.js refuses to touch it on purpose, because a registration
   carries no chronology. build-team-stats.js now writes meta.grade from the
   team's most recent GAME, which is the only thing that can answer "currently".
   That file is fetched per sid and cached in S.teamStats, where loadTeam() was
   going to fetch it anyway the moment a result is clicked. */
/* — A COMPETITION IS NOT ITS NAME — ------------------------------------------
   Associations reuse competition names freely: "Junior Domestic" is run by dozens
   of them. Keying this dropdown on compName (the first version, 2026-10-05)
   collapsed every one of them into a SINGLE option, so choosing it merged several
   associations' teams into one list AND unioned their grades, with nothing on
   screen to say so. That is exactly the silent merge this filter exists to remove,
   reintroduced one level up.
   sports-index carries compId, orgId and orgName per season, so the KEY is the
   competition id and the LABEL names the association. compId is PlayHQ's own and
   unique across organisations; the fallback key still separates by org, so an
   entry missing compId cannot merge with another association's. */
function compKeyOf(se){
  return se.compId || ('n:'+(se.compName||'')+'|o:'+(se.orgId||se.orgName||''));
}
function compLabelOf(se){
  const c=se.compName||'(unnamed competition)',o=se.orgName||'';
  /* Several compNames already carry the association, usually bracketed on the end.
     Appending it again reads as a bug, so only add what is missing. */
  if(!o||c.toLowerCase().includes(o.toLowerCase()))return c;
  return c+' \u2014 '+o;
}
function seasonSidsFor(sn,compKey){
  return Object.entries(S.idx?.seasons||{})
    .filter(([,se])=>se.name===sn&&(!compKey||compKeyOf(se)===compKey))
    .map(([sid])=>sid);
}
function buildCompPicker(){
  const sn=el('q-sn').value,cp=el('q-cp'),gr=el('q-gr');
  if(!sn){
    cp.innerHTML='<option value="">Competition \u2014 select a season</option>';cp.disabled=true;
    gr.innerHTML='<option value="">Grade \u2014 select a competition</option>';gr.disabled=true;
    return;
  }
  const seen=new Map();
  for(const sid of seasonSidsFor(sn)){
    const se=S.idx.seasons[sid],k=compKeyOf(se);
    if(!seen.has(k))seen.set(k,compLabelOf(se));
  }
  /* Two DIFFERENT competitions can still produce the same label — same name, same
     association. Disambiguate by id rather than let them look like one entry. */
  const counts={};for(const l of seen.values())counts[l]=(counts[l]||0)+1;
  const comps=[...seen.entries()]
    .map(([k,l])=>({k,l:counts[l]>1?`${l} (${k.slice(0,6)})`:l}))
    .sort((a,b)=>a.l.localeCompare(b.l));
  cp.disabled=false;
  cp.innerHTML='<option value="">All competitions</option>'+comps.map(c=>`<option value="${esc(c.k)}">${esc(c.l)}</option>`).join('');
  /* One competition is not a choice — select it so the grade list opens straight
     away rather than making the user pick the only option there is. */
  if(comps.length===1)cp.value=comps[0].k;
  buildGradePicker();
}
function buildGradePicker(){
  const sn=el('q-sn').value,cp=el('q-cp').value,gr=el('q-gr');
  if(!sn||!cp){
    gr.innerHTML='<option value="">Grade \u2014 select a competition</option>';gr.disabled=true;return;
  }
  const names=new Set();
  for(const sid of seasonSidsFor(sn,cp))for(const g of (S.idx.seasons[sid].grades||[]))if(g.name)names.add(g.name);
  const list=[...names].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  gr.disabled=!list.length;
  gr.innerHTML=list.length
    ?'<option value="">All grades</option>'+list.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')
    :'<option value="">No grades published yet</option>';
}
async function searchTeams(q){
  const sn=el('q-sn').value,re=el('res-tm');
  if(!sn){re.innerHTML='<div class="ri-empty">Select a season first</div>';return;}
  const run=++S.tmRun;
  await loadTeamIdx();
  const cp=el('q-cp').value,grade=el('q-gr').value;
  const sids=new Set(seasonSidsFor(sn,cp));
  /* With no competition chosen this is the unfiltered list, byte for byte what
     it was before — a team-index entry whose sid is absent from sports-index
     must not silently vanish. */
  let teams=(S.teamIdx[sn]||[]).filter(t=>!cp||sids.has(t.sid));
  if(q)teams=teams.filter(t=>tokenMatch(t.n,q));
  let noGradeData=false;
  if(grade){
    re.innerHTML='<div class="ri-empty">Loading grades\u2026</div>';
    const need=[...new Set(teams.map(t=>t.sid))].filter(sid=>!S.teamStats[sid]);
    await Promise.all(need.map(async sid=>{S.teamStats[sid]=await sgj('team-stats/bv',sid)||{};}));
    if(run!==S.tmRun)return;   /* a later keystroke already owns the panel */
    /* If NOTHING in scope carries a grade, say so. A season whose team pages
       predate meta.grade would otherwise filter to zero and read as "no such
       grade", which is a lie about the data rather than about the filter. */
    noGradeData=teams.length>0&&!teams.some(t=>S.teamStats[t.sid]?.[t.id]?.meta?.grade);
    teams=teams.filter(t=>(S.teamStats[t.sid]?.[t.id]?.meta?.grade||'')===grade);
  }
  if(run!==S.tmRun)return;
  const sorted=[...teams].sort((a,b)=>a.n.localeCompare(b.n));
  if(noGradeData){
    re.innerHTML='<div class="ri-empty">No grades recorded for these teams yet \u2014 their team pages have not been rebuilt since grading. Clear the grade filter to see them.</div>';
    return;
  }
  if(!sorted.length){re.innerHTML='<div class="ri-empty">No teams found</div>';return;}
  re.innerHTML=sorted.slice(0,50).map(t=>{
    const si=S.idx?.seasons?.[t.sid];
    /* Prefer the CURRENT grade when the season's team-stats are already loaded;
       t.grade is the first-seen one and can be a grading-round grade months old. */
    const live=S.teamStats[t.sid]?.[t.id]?.meta?.grade;
    /* si carries compName AND the association; t.comp is the bare name. With no
       competition chosen this list spans associations, so the bare name would make
       two different competitions look like one. */
    const compTxt=si?compLabelOf(si):(t.comp||'');
    const sub=[compTxt,live||t.grade].filter(Boolean).join(' \u00b7 ')||si?.name||sn;
    return`<div class="ri" data-tid="${esc(t.id)}" data-sid="${esc(t.sid)}"><div class="ri-name">${esc(t.n)}</div><div class="ri-sub">${esc(sub)}</div></div>`;
  }).join('');
  re.querySelectorAll('.ri').forEach(r=>r.addEventListener('click',()=>{addRecent('teams',q||sn);loadTeam(r.dataset.tid,r.dataset.sid);if(window.innerWidth<=768)el('rail').classList.add('mob-hide');}));
}

/* ── Team focus ── */
async function loadTeam(tid,sid,push=true){
  if(push)navigate('team',{tid,sid});
  showV('view-team');
  const ve=el('view-team');ve.innerHTML='<div class="load-row">Loading\u2026</div>';
  S.teamId=tid;S.teamSid=sid;
  if(!S.teamStats[sid]){const d=await sgj('team-stats/bv',sid);S.teamStats[sid]=d||{};}
  const td=S.teamStats[sid]?.[tid];
  if(!td){ve.innerHTML=`<div class="vhdr"><button class="vback" onclick="history.back()">\u2190</button><div><div class="vtitle">Team not found</div></div></div>`;return;}

}
/* ── Two-row roster: season on top, career below (2026-10-01) ────────────────
   The roster in team-stats/bv/{sid} carries THAT SEASON with THAT TEAM only, so a
   roster row could never answer "how good is this player" — only "how are they going
   this season". The career line comes from the player's own file, one fetch each,
   cached in S.players and shared with the player view, so opening a player
   afterwards is instant and a second visit to the team costs nothing.
   Rendered PROGRESSIVELY: the season rows appear immediately and each career row
   fills in as its file lands. A roster is eight to twelve players, most of them
   already cached from browsing, so in practice this is a handful of requests. */
const CAREER_PENDING = '<span style="color:var(--text3)">…</span>';

function careerOf(pf){
  const bk = pf && pf.sports && pf.sports.Basketball;
  if(!bk) return null;
  // foulOuts rides along: the team view already holds this file for the career
  // rows, so the figure costs nothing. It is summed from the REGISTRATION stats,
  // not read from bk.foulOuts — that career field is not a number on these files.
  // Absent is not zero: a competition that does not record foul-outs must not
  // read as nobody ever fouling out, so the key is omitted and no column shows.
  const o={ gp:bk.gp||0, pts:bk.pts||0, fg:bk.fg||0, ft:bk.ft||0, threePt:bk.threePt||0, fouls:bk.fouls||0 };
  const fo=careerFouledOut(pf);
  if(fo!==null)o.foulOuts=fo;
  return o;
}
async function playerFile(key){
  if(S.players[key]) return S.players[key];
  let k=key, d=await gj(BASE+'/players/'+k.slice(0,2)+'/'+k+'.json');
  if(!d){ const r=await resolveToFullUuid(key); if(r&&r!==k){ k=r; d=S.players[k]||await gj(BASE+'/players/'+k.slice(0,2)+'/'+k+'.json'); } }
  if(d){ S.players[k]=d; if(k!==key) S.players[key]=d; }
  return d;
}
/* Both rows for one player. The career row is a sibling <tr> rather than a second
   line inside one cell so the columns stay aligned with the header above. */
function rosterRows(uuid,pr){
  const id=('c'+uuid).replace(/[^a-zA-Z0-9]/g,'');
  const c=careerOf(S.players[uuid]);
  return `<tr class="rsea" onclick="loadPlayer('${esc(uuid)}')">`
    +`<td>${esc(pr.name||'#'+uuid.slice(0,8))}</td>`
    +`<td>${pr.gp||0}</td><td>${pr.pts||0}</td><td>${avg(pr.pts||0,pr.gp||0)}</td>`
    +`<td>${pr.fg||0}</td><td>${pr.ft||0}</td><td>${pr.threePt||0}</td><td>${pr.fouls||0}</td></tr>`
    +`<tr class="rcar" id="${id}" onclick="loadPlayer('${esc(uuid)}')">`
    +`<td>career</td>`
    +(c?`<td>${c.gp}</td><td>${c.pts}</td><td>${avg(c.pts,c.gp)}</td><td>${c.fg}</td><td>${c.ft}</td><td>${c.threePt}</td><td>${c.fouls}</td>`
       :`<td colspan="7">${CAREER_PENDING}</td>`)
    +`</tr>`;
}
/* Fill the career rows in place once each file lands. Called after a render and
   after a re-sort; cached players resolve on the first tick, so a re-sort does not
   re-fetch anything. */
function hydrateCareers(keys){
  for(const uuid of keys){
    playerFile(uuid).then(()=>{
      const id=('c'+uuid).replace(/[^a-zA-Z0-9]/g,'');
      const tr=document.getElementById(id);
      const c=careerOf(S.players[uuid]);
      if(!tr) return;
      tr.innerHTML = c
        ? `<td>career</td><td>${c.gp}</td><td>${c.pts}</td><td>${avg(c.pts,c.gp)}</td><td>${c.fg}</td><td>${c.ft}</td><td>${c.threePt}</td><td>${c.fouls}</td>`
        : `<td>career</td><td colspan="7" style="color:var(--text3)">not available</td>`;
    }).catch(()=>{});
  }
}

/* ── TEAM CARDS (v1.51) ───────────────────────────────────────────────────── */
const TC={};
function tcSt(key){
  if(!TC[key])TC[key]={hero:'pts',per:'S',meas:'T',order:'H',chart:true,sel:null,roster:[],fixtures:[],zeroDone:0,foDone:0};
  return TC[key];
}
const TC_STATS=[['gp','GP','games'],['pts','PTS','points'],['fg','FG','field goals'],
                ['ft','FT','free throws'],['threePt','3PT','three-pointers'],['fouls','F','fouls']];
/* Per game is a measure over whatever the hero is, so PPG left the hero list:
   it is PTS with the measure on. GP has no per-game form and ignores it. */
/* 0PT, not SCORELESS. Basketball has no stat-sheet term for a scoreless game —
   "goose egg" is commentary, not a label — and 0PT reads the same way as the
   3PT and FT already in the grid. The count is of GAMES, so the per-game form
   stays a count-over-games rate and keeps the same name. */
const TC_PG={pts:'PPG',fg:'FG/PG',ft:'FT/PG',threePt:'3PT/PG',fouls:'F/PG',gp:'GP',foulOuts:'FO/PG',zero:'0PT/PG'};
const TC_EXTRA={foulOuts:['foulOuts','FO','foul-outs'],zero:['zero','0PT','scoreless games']};
/* A stat is offered only where the rows in the CURRENT scope actually carry it:
   PlayHQ does not publish foul-outs for every competition, and a column of
   zeros is a claim that nobody ever fouled out. */
function tcHas(rows,per,k){
  return rows.some(r=>{const q=per==='C'?r.car:r.sea;return q&&(k in q);});
}
function tcStats(rows,per){
  const out=TC_STATS.slice();
  for(const k of tcExtras(rows,per))out.push(TC_EXTRA[k]);
  return out;
}
/* The keys at least one row in this scope carries. One list for the hero bar,
   the cards and the squad total, so all three agree. */
function tcExtras(rows,per){
  return Object.keys(TC_EXTRA).filter(k=>tcHas(rows,per,k));
}
/* GP ignores the measure — games per game is not a thing — so it must not pick
   up the decimal the measure gives everything else. */
function tcFmt(v,meas,k){return (meas==='G'&&k!=='gp')?(+v).toFixed(1):v;}
function tcLbl(k,meas){
  if(meas==='G')return TC_PG[k]||String(k).toUpperCase();
  return (TC_STATS.concat(Object.values(TC_EXTRA)).find(s=>s[0]===k)||[])[1]||String(k).toUpperCase();
}
/* A roster line and a career block carry the same stat names, so one accessor
   serves both modes. The per-game value is derived, never stored. */
function tcVal(r,k,per,meas){
  const q=per==='C'?r.car:r.sea;
  if(!q)return 0;
  const v=q[k]||0;
  if(meas!=='G'||k==='gp')return v;
  return q.gp?+(v/q.gp).toFixed(1):0;
}
function tcSet(key,k,v){const s=tcSt(key);s[k]=v;tcDraw(key);}
function tcFlag(key,k){const s=tcSt(key);s[k]=!s[k];tcDraw(key);}
function tcPick(key,uuid){const s=tcSt(key);s.sel=(s.sel===uuid?null:uuid);tcDraw(key);}

/* ⚠️ `extras` is decided ONCE for the whole squad and passed in — it must never
   be derived from the card's own q. Doing that gave one player an FO cell and
   the next none, because the season leaderboard carries the field for some
   entries and not others, and a card with seven cells does not line up with the
   six beside it. Every card now shows the same cells; a player the data has no
   figure for shows an em dash, which is the honest answer and also the one that
   keeps the grid straight. */
function tcCells(q,meas,extras){
  const dash='\u2014';
  const v=k=>{
    if(!(k in q))return dash;
    return meas==='G'?(q.gp?((q[k]||0)/q.gp).toFixed(1):dash):(q[k]||0);
  };
  const cells=meas==='G'
    ? ['pts','fouls','ft','fg','threePt'].map(k=>[v(k),tcLbl(k,'G')])
    : [[q.pts||0,'PTS'],[q.gp?((q.pts||0)/q.gp).toFixed(1):dash,'PPG'],[q.fouls||0,'F'],[q.ft||0,'FT'],[q.fg||0,'FG'],[q.threePt||0,'3PT']];
  for(const k of (extras||[]))cells.push([v(k),tcLbl(k,meas)]);
  return cells.map(([x,l])=>`<div class="c"><div class="v">${x}</div><div class="l">${labelHTML(l)}</div></div>`).join('');
}
/* A slashed zero for 0PT only. The app's own face has no `zero` OpenType
   feature to switch on, and changing the interface font to get one is a large
   change for one glyph — so just that character borrows a mono face that slashes
   it by default. Everything else keeps the font it had. */
function labelHTML(l){
  return String(l).replace(/^0/,'<span class="z0">0</span>');
}

function tcDraw(key){
  const host=el('tc-'+key); if(!host)return;
  const st=tcSt(key), hero=st.hero, per=st.per, meas=st.meas||'T';
  const lbl=tcLbl(hero,meas);
  const word=(TC_STATS.find(s=>s[0]===hero)||[])[2]||'';
  const on=c=>c?' on':'';
  const b=(k,v,t)=>`<button class="${(v===undefined?st[k]:st[k]===v)?'on':''}" onclick="${v===undefined?`tcFlag('${key}','${k}')`:`tcSet('${key}','${k}','${v}')`}">${t}</button>`;
  const bar=`<div class="tc-bar">
    <span class="lbl">Hero stat</span>${tcStats(st.roster||[],per).map(([k])=>b('hero',k,tcLbl(k,meas))).join('')}
    <span class="lbl">Scope</span>${b('per','S','This season')}${b('per','C','Career')}
    <span class="lbl">Measure</span>${b('meas','T','Totals')}${b('meas','G','Per game')}
    <span class="lbl">Order</span>${b('order','H','By '+lbl)}${b('order','N','By name')}
    <span class="lbl">Show</span>${b('chart',undefined,'Squad chart')}</div>`;

  const tbl=el('tc-table-'+key);
  if(tbl)tbl.classList.remove('hidden');

  // Career mode needs the player files; they are already being fetched for the
  // table's career rows, so this only waits, it never adds a request.
  const rows=st.roster.filter(r=>per!=='C'||r.car);
  if(!rows.length){
    host.innerHTML=bar+`<div class="tc-bar" style="background:none;border:0;color:var(--text2);font-size:0.78rem">${
      per==='C'?'Reading career totals…':'No roster data.'}</div>`;
    return;
  }
  const extras=tcExtras(rows,per);
  const ranked=rows.slice().sort((a,c)=>tcVal(c,hero,per,meas)-tcVal(a,hero,per,meas));
  const vals=ranked.map(r=>tcVal(r,hero,per,meas));
  const mx=Math.max(...vals,1);
  const avgv=vals.reduce((a,c)=>a+c,0)/Math.max(1,vals.length);
  const list=st.order==='H'?ranked:rows.slice().sort((a,c)=>String(a.name).localeCompare(String(c.name)));
  // A share is of a total, so PPG gets none: averages do not sum.
  // GP's denominator is the team's games, and that exists only for a season.
  // Careers span different teams and seasons, so there is nothing to be a share
  // OF: "218 of 218 team games, 100%" was the longest career on the roster
  // being compared against itself.
  const teamGames=per==='S'?rows.reduce((a,r)=>Math.max(a,tcVal(r,'gp','S','T')),0):0;
  const teamHero=meas==='G'?0:(hero==='gp'?teamGames:rows.reduce((a,r)=>a+tcVal(r,hero,per,'T'),0));

  const chart=st.chart?`<div class="tc-chart">
    <div class="tc-chd"><b>Squad · ${esc(lbl)}</b><span>${rows.length} player${rows.length===1?'':'s'}</span></div>
    <div class="tc-chb"><div class="tc-avg" style="left:calc(105px + (100% - 162px)*${(avgv/mx).toFixed(4)})"><b>avg ${(meas==='G'&&hero!=='gp')?avgv.toFixed(1):Math.round(avgv)}</b></div>
      ${list.map(r=>{const v=tcVal(r,hero,per,meas);return `<div class="tc-cr${st.sel===r.uuid?' on':''}" onclick="tcPick('${esc(key)}','${esc(r.uuid)}')">
        <span class="n">${esc(r.name)}</span><span class="t"><i style="width:${Math.max(2,Math.round(v/mx*100))}%"></i></span>
        <span class="v">${tcFmt(v,meas,hero)}</span></div>`;}).join('')}
    </div></div>`:'';

  const tot=rows.map(r=>per==='C'?r.car:r.sea).reduce((a,q)=>{
    const o={gp:per==='S'?Math.max(a.gp,q.gp||0):a.gp+(q.gp||0),pts:a.pts+(q.pts||0),
      fg:a.fg+(q.fg||0),ft:a.ft+(q.ft||0),threePt:a.threePt+(q.threePt||0),fouls:a.fouls+(q.fouls||0)};
    for(const k of extras)if(k in q)o[k]=(a[k]||0)+(q[k]||0);else if(k in a)o[k]=a[k];
    return o;},
    {gp:0,pts:0,fg:0,ft:0,threePt:0,fouls:0});
  const totHero=(meas==='G'&&hero!=='gp')?(tot.gp?((tot[hero]||0)/tot.gp).toFixed(1):'\u2014'):(tot[hero]||0);
  const summary=`<div class="tc-card sum">
    <div class="tc-h"><div class="tc-nm">Squad total</div></div>
    <div class="tc-mt">${rows.length} players · ${tot.gp} ${per==='S'?'games':'appearances'}${per==='C'?' · career':''}</div>
    <div class="tc-hero"><div class="tc-big">${totHero}</div><div class="tc-unit">${esc(meas==='G'?('team '+lbl.toLowerCase()):lbl)}</div></div>
    <div class="tc-mini">${tcCells(tot,meas,extras).replace('>PPG<','>TEAM PPG<')}</div></div>`;

  host.innerHTML=bar+`<div class="tc-grid">${chart}${summary}${list.map(r=>{
    const i=ranked.indexOf(r), v=tcVal(r,hero,per,meas), q=per==='C'?r.car:r.sea;
    const share=teamHero?Math.round(tcVal(r,hero,per,'T')/teamHero*100):0;
    return `<div class="tc-card${st.sel===r.uuid?' on':''}" onclick="tcPick('${esc(key)}','${esc(r.uuid)}')">
      <div class="tc-h"><div class="tc-nm" title="Open ${esc(r.name)}" onclick="event.stopPropagation();loadPlayer('${esc(r.uuid)}')">${esc(r.name)}</div>
        <div class="tc-rk">#${i+1}/${ranked.length}</div></div>
      <div class="tc-mt">${(hero==='gp'&&teamGames)?`of ${teamGames} team game${teamGames===1?'':'s'}`:`${q.gp||0} game${(q.gp||0)===1?'':'s'}`}${per==='C'?' · career':''}</div>
      <div class="tc-hero"><div class="tc-big">${tcFmt(v,meas,hero)}</div><div class="tc-unit">${labelHTML(esc(lbl))}</div>
        ${share?`<div class="tc-shr" title="${share}% of the squad's ${esc(word)}">${share}%</div>`:''}</div>
      <div class="tc-mini">${tcCells(q,meas,extras)}</div></div>`;}).join('')}</div>`;
}

/* Career blocks land asynchronously; repaint when they do, but only while this
   team is still on screen. */
function tcHydrate(key,uuids){
  for(const uuid of uuids){
    playerFile(uuid).then(()=>{
      const st=TC[key]; if(!st)return;
      const row=st.roster.find(r=>r.uuid===uuid); if(!row)return;
      row.car=careerOf(S.players[uuid])||null;
      if(el('tc-'+key))tcDraw(key);
    }).catch(()=>{});
  }
}

function renderTeam(td,tid,sid){
  const ve=el('view-team');
  const meta=td.meta||{};
  const roster=Object.entries(td.roster||{}).sort(([,a],[,b])=>(b.pts||0)-(a.pts||0));
  const fixtures=td.fixtures||[];
  const si=Object.values(S.idx?.seasons||{}).find(s=>s.id===sid);
  const tesc=('t'+tid).replace(/[^a-zA-Z0-9]/g,'');
  let h=`<div class="vhdr"><button class="vback" onclick="history.back()">\u2190</button>
    <div><div class="vtitle">${esc(meta.name||'Team')}</div>
    <div class="vsub">${esc([meta.club,si?.name].filter(Boolean).join(' \u00b7 '))}</div></div></div>
  <div class="vtabs">
    <button class="vtab on" onclick="switchTTab(this,'r${tesc}','f${tesc}')">Roster</button>
    <button class="vtab" onclick="switchTTab(this,'f${tesc}','r${tesc}')">Fixtures</button>
  </div>
  <div id="r${tesc}" class="tpane on">
    <div id="tc-${tesc}"></div>
    <div id="tc-table-${tesc}"><div class="tc-tlbl">Full table · season and career</div>`;
  if(!roster.length){h+='<div class="empty">No roster data</div>';}
  else{
    const sortBy=(col)=>{
      const ve2=el('view-team');
      const cur=ve2.dataset.sortCol||'pts'; const dir=parseInt(ve2.dataset.sortDir||'-1');
      const newDir=(col===cur)?-dir:-1;
      ve2.dataset.sortCol=col; ve2.dataset.sortDir=newDir;
      const sorted2=Object.entries(td.roster||{}).sort(([,a],[,b])=>{
        const av=col==='ppg'?((a.pts||0)/(a.gp||1)):(a[col]||0);
        const bv=col==='ppg'?((b.pts||0)/(b.gp||1)):(b[col]||0);

      });
      const tbody=ve2.querySelector('#rtbl-body');
