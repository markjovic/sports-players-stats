    el('main').classList.toggle('mob-show',!home);
  }else{
    el('rail').classList.remove('mob-hide');
    el('main').classList.remove('mob-show');
  }
}
function goHome(){
  history.pushState({type:'home'},'',shareBase().replace(/index\.html$/,'')||location.pathname);
  showV('view-home');
}
function navigate(type,data){
  const h=hashFor(type,data);
  history.pushState({type,...data},'',h?'#'+h:location.pathname);
}
/* ⚠️ 2026-09-13 — BACK USED TO PUSH FORWARD, AND ON MOBILE THAT WAS A DEAD END.
   Every branch below calls a loader, and every loader began with navigate(), i.e.
   history.pushState. So a popstate ADDED an entry instead of consuming one: Back
   could never reach home, showV never ran with 'view-home', the rail kept its
   mob-hide class, and a full page refresh was the only way out. For venue and opp
   it happened on every press; for player and team only when the item was not
   already cached, which is why it looked intermittent.
   Loaders now take push=false from here — they render without touching history.

   AND THE 'opp' STATE WAS UNREADABLE. openOpp pushed {oppTid,sid,fromUuid} and
   openTeamOpp pushed {myTid,oppTid,sid} under the SAME type, while this handler
   read e.state.tid — a key NEITHER writes. Back into an opposition view called
   openOpp(undefined, sid, undefined), which pushed another broken entry and
   rendered nothing. They are now separate types, each read with its own keys. */
window.addEventListener('popstate',e=>{
  if(!e.state||e.state.type==='home'){showV('view-home');return;}
  const{type}=e.state;
  if(type==='player'){
    S.playerUuid=e.state.uuid;
    showV('view-player');
    const p=S.players[e.state.uuid];
    if(p)renderPlayer(p);else loadPlayer(e.state.uuid,false);
  }else if(type==='team'){
    const td=S.teamStats[e.state.sid]?.[e.state.tid];
    if(td){showV('view-team');renderTeam(td,e.state.tid,e.state.sid);}
    else loadTeam(e.state.tid,e.state.sid,false);
  }else if(type==='venue'){
    loadVenue(e.state.vid,e.state.vname,undefined,false);
  }else if(type==='opp'){
    openOpp(e.state.oppTid,e.state.sid,e.state.fromUuid,false);
  }else if(type==='h2h'){
    openH2H(e.state.a,e.state.b||null,false);
  }else if(type==='grading'){
    if(GR[e.state.sid])grOpen(e.state.sid,e.state.key,false);
    else grBuild(e.state.sid).then(()=>grOpen(e.state.sid,e.state.key,false));
  }else if(type==='club'){
    loadClub(e.state.cid,e.state.cname,e.state.week,false);
  }else if(type==='teamopp'){
    openTeamOpp(e.state.myTid,e.state.oppTid,e.state.sid,e.state.isUpcoming,false);
  }else{showV('view-home');}
});

/* ── Boot ── */

/* ── HEAD-TO-HEAD: two players, every time their paths crossed ───────────────
   Answers "have these two ever played together or against each other" without a
   new index, a build step or an API call. Everything it needs is already on the
   two player files:
     p.games[]    every gid the player appears in, written by build-player-games
                  from the game-sheet p[] arrays
     p.gameTids   gid -> the tid they played FOR in that game
     p.seasons[]  regs carrying tid / gid(grade) / tn / gn
   So the whole question is an intersection of two games[] arrays plus a tid
   comparison, and the only fetches are the season game files needed to name and
   date the shared fixtures — which S.games already caches.

   ⚠️ WHY NOT resolveOppGames. That function answers a different question and
   answers it by FILTERING: it keeps a game only when the two tids differ AND
   both sit on opposite sides of the fixture, and it `continue`s past every other
   case — no season file, game missing, no tid recorded, tids that do not match
   the fixture. For "which opponents has this player met" a silent drop is
   tolerable. For "have these two ever met" it is not: a dropped game is a
   WRONG ANSWER to the question actually asked. Everything here is classified
   into one of four buckets or reported as UNRESOLVED with its reason, and the
   unresolved count is rendered where it cannot be missed.

   The four tiers, narrowest first:
     1 OPPOSITION  shared gid, tids differ, both on the fixture's two sides
     2 TOGETHER    shared gid, same tid
     3 SQUAD       registered to the same (sid,tid) but never on a sheet together
     4 GRADE       same (sid,grade), different teams, no shared fixture
   3 and 4 are weaker claims than 1 and 2 and are labelled as such: "same squad"
   is not "played together", and the UI must not let them read as the same thing. */

function h2hSeasonMap(p){
  // sid -> { sn, tids:Map(tid->tn), grades:Map(gradeId->{gn,tn,tid}) }
  const m=new Map();
  for(const sn of (p&&p.seasons)||[]){
    if(!sn.sid)continue;
    let e=m.get(sn.sid);
    if(!e){e={sn:sn.sn||sn.sid,tids:new Map(),grades:new Map()};m.set(sn.sid,e);}
    for(const r of (sn.regs||[])){
      if(r.tid&&!e.tids.has(r.tid))e.tids.set(r.tid,r.tn||'');
      if(r.gid&&!e.grades.has(r.gid))e.grades.set(r.gid,{gn:r.gn||'',tn:r.tn||'',tid:r.tid||null});
    }
  }
  return m;
}

/* gid -> sid for a set of gids. Checks what S.games already holds, then loads
   only the season files the two players actually played in. Seasons from BOTH
   players are searched: resolveOppGames searches only the viewing player's, which
   cannot place a game held under a season the other player alone registered for. */
async function h2hMapGids(gidSet,players){
  const gidSid={};
  for(const[sid,gf]of Object.entries(S.games||{})){
    for(const gid of Object.keys((gf&&gf.games)||{}))if(gidSet.has(gid))gidSid[gid]=sid;
  }
  let missing=[...gidSet].filter(g=>!gidSid[g]);
  if(!missing.length)return gidSid;
  const sids=[...new Set(players.flatMap(p=>((p&&p.seasons)||[]).map(sn=>sn.sid)).filter(Boolean))];
  for(const sid of sids){
    if(!missing.length)break;
    if(!S.games[sid])S.games[sid]=await sgj('games/bv',sid)||{games:{}};
    const all=(S.games[sid]&&S.games[sid].games)||{};
    for(const gid of missing)if(all[gid])gidSid[gid]=sid;
    missing=missing.filter(g=>!gidSid[g]);
  }
  return gidSid;
}

async function computeH2H(A,B){
  const ga=new Set((A&&A.games)||[]), gb=new Set((B&&B.games)||[]);
  const shared=[...ga].filter(g=>gb.has(g));
  const gidSid=await h2hMapGids(new Set(shared),[A,B]);

  const against=[],together=[],unresolved=[];
  for(const gid of shared){
    const sid=gidSid[gid];
    if(!sid){unresolved.push({gid,why:'no season file held for this game'});continue;}
    const g=S.games[sid]&&S.games[sid].games&&S.games[sid].games[gid];
    if(!g){unresolved.push({gid,sid,why:'game id not present in its season file'});continue;}
    const tA=getTidForGame(A,sid,gid), tB=getTidForGame(B,sid,gid);
    if(!tA||!tB){
      unresolved.push({gid,sid,g,why:'no team recorded for '+((!tA?A:B).name||'one of them')+' in this game'});
      continue;
    }
    if(tA===tB){together.push({gid,sid,g,tA,tB});continue;}
    const H=hTid(g),Aw=aTid(g);
    if((H===tA&&Aw===tB)||(Aw===tA&&H===tB)){against.push({gid,sid,g,tA,tB});continue;}
    // Both hold a tid for this game and the tids differ, but they are not the
    // fixture's two sides. getTidForGame falls back to the season's first tid
    // when gameTids is absent, so this is most often that fallback being wrong
    // rather than a data fault — either way it is NOT evidence they met.
    unresolved.push({gid,sid,g,why:'their recorded teams are not the two sides of this fixture'});
  }
  const byDate=(x,y)=>String((y.g&&y.g.d)||'').localeCompare(String((x.g&&x.g.d)||''));
  against.sort(byDate); together.sort(byDate);

  // Tiers 3 and 4, from registrations rather than game sheets.
  const ma=h2hSeasonMap(A), mb=h2hSeasonMap(B);
  const togetherKeys=new Set(together.map(x=>x.sid+':'+x.tA));
  const againstSids=new Set(against.map(x=>x.sid));
  const squad=[],grade=[];
  for(const[sid,ea]of ma){
    const eb=mb.get(sid); if(!eb)continue;
    // Same team, but no fixture where they were BOTH on that team's sheet.
    const sameTids=[...ea.tids.keys()].filter(t=>eb.tids.has(t)&&!togetherKeys.has(sid+':'+t));
    if(sameTids.length){
      squad.push({sid,sn:ea.sn,teams:sameTids.map(t=>ea.tids.get(t)||eb.tids.get(t)||('#'+String(t).slice(0,8)))});
    }
    // Same grade, different teams, and no fixture against each other that season.
    if(!againstSids.has(sid)){
      const g2=[...ea.grades.keys()].filter(gid=>eb.grades.has(gid)
        && ea.grades.get(gid).tid && eb.grades.get(gid).tid
        && ea.grades.get(gid).tid!==eb.grades.get(gid).tid);
      if(g2.length){
        grade.push({sid,sn:ea.sn,grades:g2.map(gid=>({
          gn:ea.grades.get(gid).gn||'',aTn:ea.grades.get(gid).tn||'',bTn:eb.grades.get(gid).tn||''}))});
      }
    }
  }
  return {against,together,squad,grade,unresolved,sharedCount:shared.length};
}

/* ── Rendering ───────────────────────────────────────────────────────────── */

/* Fields come from gameCtx/resLetter/storedPts, the helpers the season and
   opposition views already render from — NOT from hand-picked g.* keys. A game
   object uses g.h/g.a (+hs/as/hn/an) once played and g.t1/g.t2 (+t1n/t2n) while
   it is only a fixture, and gameCtx is what knows the difference.

   Rows are deliberately NOT clickable, for now. They could call openSheet(gid,sid)
   — the real box-score opener, nine call sites — and that is the obvious follow-up;
   they are left inert until someone decides a head-to-head row SHOULD open the box
   score, rather than that being assumed here.
   (openGameId, despite the name, resolves a PLAYER uuid and loads a player.) */
function h2hGameRow(x,A,B){
  const g=x.g||{};
  const ctx=gameCtx(g,x.tA);                 // always A's perspective
  const score=(ctx.myS!=null&&ctx.oppS!=null)?(ctx.myS+'–'+ctx.oppS):'';
  const res=resLetter(ctx.myS,ctx.oppS);
  const resCol=res==='W'?'var(--win)':res==='L'?'var(--loss)':'var(--text2)';
  const pa=storedPts(g,A.uuid), pb=storedPts(g,B.uuid);
  const lines=[];
  if(pa!=null)lines.push(esc(firstName(A))+' '+pa);
  if(pb!=null)lines.push(esc(firstName(B))+' '+pb);
  const fc=finalClass(g.rn);
  const sub=[ctx.oppN?('v '+ctx.oppN):'',lines.join(' · ')].filter(Boolean).join(' · ');
  return `<div class="h2h-row">
    <div>${esc(String(g.d||'').slice(0,10))}${g.gn?' · '+esc(g.gn):''}${score?' · <strong>'+esc(score)+'</strong>':''}`
    + (res?` <span style="color:${resCol}">${res}</span>`:'')
    + (fc?` · <span style="color:gold;font-size:0.7rem">${esc(g.rn)}</span>`:'')
    + `</div><div class="h2h-when">${sub}</div></div>`;
}
function firstName(p){
  const n=(p&&p.name)||'';
  return n.split(' ').filter(Boolean)[0]||n||'?';
}

function h2hSection(id,title,n,bodyHtml,note){
  if(!n)return `<div class="h2h-sec"><div class="h2h-sec-h" style="cursor:default;opacity:0.65">${esc(title)}<span class="h2h-n">0</span></div></div>`;
  return `<div class="h2h-sec">
    <div class="h2h-sec-h" onclick="var b=document.getElementById('${id}');if(b)b.classList.toggle('hidden')">${esc(title)}<span class="h2h-n">${n}</span></div>
    <div class="h2h-sec-b" id="${id}">${note?'<div class="h2h-when" style="padding:6px 0">'+esc(note)+'</div>':''}${bodyHtml}</div>
  </div>`;
}

function renderH2H(A,B,r){
  const ve=el('view-h2h'); if(!ve)return;
  const nameA=displayName(A,A.uuid), nameB=displayName(B,B.uuid);
  let h=`<div class="vhdr"><button class="vback" onclick="history.back()">←</button>
    <div style="flex:1;min-width:0"><div class="vtitle">${esc(nameA)} ↔ ${esc(nameB)}</div>
    <div class="vsub">${r.sharedCount} shared game${r.sharedCount===1?'':'s'} on file</div></div></div>`;

  const met=r.against.length+r.together.length;
  if(!met&&!r.squad.length&&!r.grade.length){
    h+=`<div class="h2h-none">No recorded connection between these two — no shared fixture, no shared team, no shared grade.</div>`;
  }

  h+=h2hSection('h2h-a','Played against each other',r.against.length,
      r.against.map(x=>h2hGameRow(x,A,B)).join(''));
  h+=h2hSection('h2h-t','Played on the same team',r.together.length,
      r.together.map(x=>h2hGameRow(x,A,B)).join(''));
  h+=h2hSection('h2h-s','Same squad, never on a sheet together',r.squad.length,
      r.squad.map(x=>`<div class="h2h-row"><div>${esc(x.teams.join(', '))}</div><div class="h2h-when">${esc(x.sn)}</div></div>`).join(''),
      'Registered to the same team that season but never named in the same fixture — not the same thing as playing together.');
  h+=h2hSection('h2h-g','Same grade, never met',r.grade.length,
      r.grade.map(x=>x.grades.map(gg=>`<div class="h2h-row"><div>${esc(gg.gn||'—')}</div><div class="h2h-when">${esc(x.sn)} · ${esc(gg.aTn||'?')} v ${esc(gg.bTn||'?')}</div></div>`).join('')).join(''),
      'Same grade and season, different teams, and no fixture between them on file.');

  // ⚠️ NEVER SILENT. A shared game we could not classify is not an absence of a
  // meeting, and the count must be visible next to the answer it qualifies.
  if(r.unresolved.length){
    const by={};
    for(const u of r.unresolved)by[u.why]=(by[u.why]||0)+1;
    h+=`<div class="h2h-warn">⚠ ${r.unresolved.length} shared game${r.unresolved.length===1?'':'s'} could not be classified and ${r.unresolved.length===1?'is':'are'} NOT counted above:<br>`
      + Object.entries(by).map(([w,n])=>`&nbsp;&nbsp;${n} × ${esc(w)}`).join('<br>')+`</div>`;
  }
  ve.innerHTML=h;
}

/* Shard selection is the SAME fold as the main player search (and as
   build-search-index.js). Kept identical deliberately: a second, drifting copy of
   the shard rule is how accented and apostrophe names stopped being findable the
   first time. */
async function h2hSearch(fromUuid,q){
  const re=document.getElementById('h2h-res'); if(!re)return;
  if(q.length<2){re.innerHTML='';return;}
  const _fold=q.normalize('NFKC').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
  const sh=_fold.length>=2?_fold.slice(0,2):(_fold+'_').slice(0,2);
  if(!S.shards[sh]){const d=await gj(BASE+'/search/players/'+sh+'.json');S.shards[sh]=d||{};}
  const hits=[];const seen=new Set();
  for(const[k,arr]of Object.entries(S.shards[sh])){
    if(!tokenMatch(k,q))continue;
    for(const e of arr){if(e.id!==fromUuid&&!seen.has(e.id)){seen.add(e.id);hits.push({k,...e});}}
  }
  if(!hits.length){re.innerHTML='<div class="ri-empty">No players found</div>';return;}
  re.innerHTML=hits.slice(0,40).map(h=>`<div class="ri" data-u="${esc(h.id)}"><div class="ri-name">${esc(h.k)}</div><div class="ri-sub">${esc(h.c||'—')} · ${esc(h.t||'')}</div></div>`).join('');
  re.querySelectorAll('.ri').forEach(rw=>rw.addEventListener('click',()=>openH2H(fromUuid,rw.dataset.u)));
}

/* ══ GRADING / REGRADE FLOW ══════════════════════════════════════════════════
   Where teams moved between grades during a season. Grades are ROWS with a
   sticky name gutter; each column is a week in which something changed, and a
   box is a plain block whose HEIGHT is how many teams were in that grade then.

   THE CHRONOLOGY COMES FROM GAMES AND NOTHING ELSE. A registration carries no
   date and reg array order says nothing (T57), so the only record of "which
   grade was this team in, when" is each game's own gid plus its date. A move is
   where two consecutive GAMES differ in grade, dated at the later one.
   ⚠️ A team that played two grades in one week really did play two grades that
   week. That is data, not an anomaly to collapse (Mark, 2026-11-23).

   UNPLAYED FIXTURES COUNT. A team whose next scheduled game is in a new grade
   has been regraded, and that shows before the game is played. Those boxes and
   ribbons are drawn dashed, and an unplayed game never enters a W/L tally.

   ⚠️ NO STRENGTH ORDER, ANYWHERE. Rows are sorted by grade NAME for stable
   layout only. Nothing says one grade is above another, nothing is labelled
   "up" or "down", no quality-weighted record is computed. Which wins were
   better is the viewer's judgement. Do not add a rank or a weighted record.

   Measured on Kilsyth Junior Domestic Winter 2026 (8ff9f39e), 2026-11-23:
   6,790 games, 96.1% carrying a gid, zero grading grades, 792 teams of which
   385 (48.6%) change grade across 13 change-weeks — 2 to 7 per age group.
   EDJBA and CBL carry a gid on grading and finals ONLY, so a move inside their
   regular season cannot be seen; the panel says so rather than drawing it.
*/

const GR = {};            // sid -> computed model
let GRSEL  = null;        // selected GRADE (gid) — filters to teams ever in it
let GRTEAM = null;        // highlighted team (tid) — highlights, never filters
let GRCUR  = null;        // {sid, key}

function grNorm(s){ return String(s??'').replace(/\s+/g,' ').trim(); }

/* Monday of the week containing a YYYY-MM-DD, built from parts — never
   new Date(string), per the house rule. */
function grWeek(ymd){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd||''));
  if(!m)return '';
  const t=Date.UTC(+m[1],+m[2]-1,+m[3]);
  return new Date(t-((new Date(t).getUTCDay()+6)%7)*86400000).toISOString().slice(0,10);
}
function grShift(ymd,days){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd||''));
  if(!m)return ymd;
  return new Date(Date.UTC(+m[1],+m[2]-1,+m[3])+days*86400000).toISOString().slice(0,10);
}
function grDayLabel(ymd){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd||''));
  if(!m)return ymd||'';
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${+m[3]} ${M[+m[2]-1]}`;
}

/* Grade names read "Saturday U15 Boys C", "Wednesday U12 Girls BRES". The DAY
   is part of the grade's identity — a panel keyed on age alone would merge
   Saturday U9 Boys with Tuesday U9 Girls. */
const GR_DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function grParse(name){
  const s=grNorm(name);
  let day=null;
  for(const d of GR_DAYS){ if(new RegExp('\\b'+d+'\\b','i').test(s)){ day=d; break; } }
  let age=null, m=/\b(?:u|under\s*)(\d{1,2})\b/i.exec(s);
  if(m) age='U'+Number(m[1]);                  // U09 and U9 are ONE age group
  else { m=/\b(\d{1,2})u\b/i.exec(s); if(m) age='U'+Number(m[1]); }
  let gender=null;
  if(/\bgirls?\b|\bwomen'?s?\b/i.test(s)) gender='Girls';
  else if(/\bboys?\b|\bmen'?s?\b/i.test(s)) gender='Boys';
  else if(/\bmixed\b/i.test(s)) gender='Mixed';
  return {day,age,gender,name:s};
}
const grKey   = p => [p.day||'~',p.age||'~',p.gender||'~'].join('|');
const grLabel = p => [p.day,p.age,p.gender].filter(Boolean).join(' ') || 'Ungrouped';

/* The grade name minus its day/age/gender prefix — that prefix is the panel
   heading, so repeating it in every row label wastes the gutter. The full name
   is still the row's tooltip. */
function grShort(name){
  let s=grNorm(name);
  for(const d of GR_DAYS) s=s.replace(new RegExp('\\b'+d+'\\b','ig'),'');
  s=s.replace(/\b(?:u|under\s*)\d{1,2}\b/ig,'').replace(/\b\d{1,2}u\b/ig,'');
  s=s.replace(/\b(boys?|girls?|mens?|womens?|mixed|open)\b/ig,'');
  s=grNorm(s);
  return s||grNorm(name);
}

/* ── Model ─────────────────────────────────────────────────────────────────*/
const grPlayed = a => a.st==='FINAL' && Number.isFinite(Number(a.my)) && Number.isFinite(Number(a.their));

async function grBuild(sid){
  if(GR[sid]) return GR[sid];
  // team-index is AWAITED, not fired off: the model is cached after this, so a
  // name resolved before the index arrives would be wrong for the whole session.
  const [gf,ts]=await Promise.all([sgj('games/bv',sid),sgj('team-stats/bv',sid),loadTeamIdx()]);
  const games=(gf&&gf.games)||{};

  // The game carries `gn` right beside `gid`, so that is the first source.
  // sports-index grades[] goes stale; team-stats meta.grade is a third.
  const idxGrades=new Map();
  for(const gr of (S.idx?.seasons?.[sid]?.grades||[])) if(gr&&gr.id) idxGrades.set(gr.id,gr.name);
  const tsGrade=new Map(), tName=new Map(), tAlt=new Map();
  const noteName=(tid,nm,src)=>{
    if(!tid||!nm) return;
    if(!tAlt.has(tid)) tAlt.set(tid,new Map());
    if(!tAlt.get(tid).has(nm)) tAlt.get(tid).set(nm,src);
  };
  for(const [tid,rec] of Object.entries(ts||{})){
    const meta=rec&&rec.meta; if(!meta)continue;
    if(meta.name){ tName.set(tid,meta.name); noteName(tid,meta.name,'team-stats'); }
    if(meta.gid&&meta.grade&&!tsGrade.has(meta.gid)) tsGrade.set(meta.gid,meta.grade);
  }
  // data/team-index.json is the MAINTAINED team name — update-team-index.js
  // corrects it, and a game record can carry a grade-prefixed PlayHQ form
  // instead ("U13 Boys MRM1" for Maroondah Magic 1). Only used if the index is
  // already loaded; this never forces a fetch of a 368k-team file.
  const seasonName=S.idx?.seasons?.[sid]?.name;
  for(const t of ((S.teamIdx||{})[seasonName]||[])){
    if(!t||!t.id||!t.n||t.sid!==sid) continue;
    noteName(t.id,t.n,'team-index');
    tName.set(t.id,t.n);
  }
  const gradeOf=(gid,gn)=> grNorm(gn) || idxGrades.get(gid) || tsGrade.get(gid) || null;

  const byTeam=new Map();
  let total=0, noGid=0; const unnamed=new Set();
  for(const [gkey,g] of Object.entries(games)){
    total++;
    if(!g||!g.gid){ noGid++; continue; }
    const nm=gradeOf(g.gid,g.gn);
    if(!nm) unnamed.add(g.gid);
    const h=hTid(g), a=aTid(g);           // T44: h/a OR t1/t2, never both
    const [hn,an]=teamNames(g);
    noteName(h,hn,'game'); noteName(a,an,'game');
    if(h&&hn&&!tName.has(h)) tName.set(h,hn);
    if(a&&an&&!tName.has(a)) tName.set(a,an);
    for(const side of [0,1]){
      const tid=side?a:h, opp=side?h:a;
      if(!tid) continue;
      if(!byTeam.has(tid)) byTeam.set(tid,[]);
      byTeam.get(tid).push({
        gid:g.gid, grade:nm||('grade '+String(g.gid).slice(0,8)),
        d:g.d||'', t:g.t||'', key:gkey, rn:g.rn||'', st:g.st||'',
        opp, oppName:(side?hn:an)||'',
        my:side?g.as:g.hs, their:side?g.hs:g.as, home:!side,
        sup:(typeof g.sup==='string'&&g.sup)?g.sup:''
      });
    }
  }

  const teams=new Map();
  for(const [tid,apps0] of byTeam.entries()){
    let apps=apps0;
    apps.sort((x,y)=>{ const A=x.d+' '+x.t, B=y.d+' '+y.t; return A<B?-1:A>B?1:0; });

    /* ⚠️ SUPERSEDED FIXTURES ARE RECORDED IN THE DATA NOW, NOT INFERRED HERE.
       `sup` on the game entry in games/bv holds the GAME ID of the fixture that
       replaced this one: past-dated, never played, still served by PlayHQ, and one
       of its teams has a PLAYED game in a DIFFERENT grade that day. Written and
       cleared every run by nightly-crawl.js.
       The two inference passes that used to stand here - keep the played game per
       round, then drop old-grade residue when the remaining fixtures name both the
       current grade and one the team has left - are RETIRED, not kept alongside it.
       Leaving inference beside a recorded field is how a regression hides: the two
       agree today, and the day they diverge nobody finds out.
       Superseded fixtures are excluded from segments, bands, counts and "still to
       play", and kept in `sups` so the team card can show them greyed with the id
       of the game that replaced them. */
    const sups=apps.filter(a=>a.sup);
    apps=apps.filter(a=>!a.sup);
    const superseded=sups.length;

    /* ⚠️ A PLAYED GAME IS A FACT; AN UNPLAYED FIXTURE IS A PLAN, AND PLANS
       CONTRADICT EACH OTHER. PlayHQ carries future fixtures for a regraded
       team in BOTH its old and new grade — Maroondah Magic 1 (43878738) holds
       two fixtures on 4 Dec, one in A and one in AR. Segmenting over every
       fixture made the team flip grade week by week, and a stale AR fixture on
       20 Nov dragged them out of A for the week of 16 Nov, where they had in
       fact played in A (Mark, 2026-11-23).
       So: segments come from PLAYED games. Unplayed fixtures add a scheduled
       move only when they agree on one grade; when they disagree the grade is
       unsettled, the last played grade carries forward, and the team card says
       so rather than inventing a move. */
    const playedApps=apps.filter(grPlayed), futureApps=apps.filter(a=>!grPlayed(a));
    const runs=list=>{
      const out=[];
      for(const a of list){
        const last=out[out.length-1];
        if(last&&last.gid===a.gid){ last.apps.push(a); last.to=a.d; }
        else out.push({gid:a.gid,grade:a.grade,from:a.d,fromWeek:grWeek(a.d),to:a.d,apps:[a],future:false});
      }
      return out;
    };
    let segs, conflict=null;
    if(playedApps.length){
      segs=runs(playedApps);
      const lastGid=segs[segs.length-1].gid;
      const futGids=[...new Set(futureApps.map(a=>a.gid))];
      const other=futGids.filter(g=>g!==lastGid);
      if(futGids.length===1&&other.length===1){
        // every remaining fixture is in one NEW grade: an unambiguous plan
        const first=futureApps.find(a=>a.gid===other[0]);
        segs.push({gid:first.gid,grade:first.grade,from:first.d,fromWeek:grWeek(first.d),
                   to:futureApps[futureApps.length-1].d,
                   apps:futureApps.filter(a=>a.gid===first.gid),future:true});
      }else if(other.length){
        conflict=futGids.map(g=>(futureApps.find(a=>a.gid===g)||{}).grade).filter(Boolean);
      }
    }else{
      // season not started for this team — every fixture is a plan
      segs=runs(apps); for(const sg of segs) sg.future=true;
    }
    const hops=[];
    for(let i=1;i<segs.length;i++)
      hops.push({week:segs[i].fromWeek,date:segs[i].from,from:segs[i-1].gid,to:segs[i].gid,future:segs[i].future});
    teams.set(tid,{tid,name:tName.get(tid)||tid,apps,sups,segs,hops,conflict,superseded,
                   alt:[...(tAlt.get(tid)||new Map()).entries()],
                   gids:new Set(segs.map(s=>s.gid))});
  }

  const groups=new Map();
  for(const t of teams.values()){
    if(!t.segs.length) continue;
    // ⚠️ Group on the day/age/gender the team plays MOST, weighted by games —
    // not on its first game. One make-up fixture in another grade's slot would
    // otherwise file the whole team under a different panel, where it reads as
    // a team missing from the grade it actually plays in.
    const tally=new Map();
    for(const sg of t.segs){
      const kk=grKey(grParse(sg.grade));
      tally.set(kk,(tally.get(kk)||0)+sg.apps.length);
    }
    const k=[...tally.entries()].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0])))[0][0];
    const p=grParse(t.segs.find(sg=>grKey(grParse(sg.grade))===k).grade);
    if(!groups.has(k)) groups.set(k,{key:k,label:grLabel(p),teams:[],weeks:new Set(),movers:0});
    const G=groups.get(k);
    G.teams.push(t);
    if(t.hops.length) G.movers++;
    for(const h of t.hops) G.weeks.add(h.week);
  }
  for(const G of groups.values()) G.weekList=[...G.weeks].sort();

  GR[sid]={sid,total,noGid,gidCoverage:total?(total-noGid)/total:0,unnamed:[...unnamed],teams,
           groups:[...groups.values()].sort((a,b)=>b.movers-a.movers||a.label.localeCompare(b.label))};
  return GR[sid];
}

/* Compared on WEEK, not date: a hop dated Sat 16 May sits in week Mon 11 May,
   so a date comparison would report the old grade in the hop's own column. */
function grGradeAtWeek(t,week){
  let cur=t.segs[0]||null;
  for(const s of t.segs){ if(s.fromWeek<=week) cur=s; else break; }
  return cur;
}

/* The record a team has built up IN THAT GRADE, to the end of a column. Only
   played games count — a scheduled fixture is not a result. */
function grCum(t,gid,upto){
  let p=0,w=0,l=0,d=0;
  for(const a of t.apps){
    if(a.gid!==gid || a.d>upto || !grPlayed(a)) continue;
    const my=Number(a.my), th=Number(a.their);
    p++; if(my>th)w++; else if(my<th)l++; else d++;
  }
  return {p,w,l,d,pct:p?Math.round(((w+d/2)/p)*100):null};
}

/* ── Rail: search first, pickers as the fallback ───────────────────────────*/
function buildGradingPicker(){
  if(!S.idx) return;
  const sel=el('q-gsn'); if(!sel||sel.dataset.built) return;
  const nm=new Map();
  for(const s of Object.values(S.idx.seasons)){
    if(!nm.has(s.name)) nm.set(s.name,{name:s.name,active:false});
    if(!s.locked) nm.get(s.name).active=true;
  }
  const sorted=[...nm.values()].sort((a,b)=>{
    if(a.active!==b.active) return a.active?-1:1;
    const ya=a.name.match(/\d{4}/)?.[0]||'0', yb=b.name.match(/\d{4}/)?.[0]||'0';
    return parseInt(yb)-parseInt(ya);
  });
  sel.innerHTML='<option value="">Select season…</option>'+
    sorted.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}${s.active?' ●':' 🔒'}</option>`).join('');
  sel.dataset.built='1';
}

/* Season names are not memorable, so the way in is a TEAM name. team-index
   carries {id,n,sid,comp} per season, which gives season AND competition in one
   hit — no guessing which "Winter 2026" is the right one. */
async function grSearchTeams(){
  const q=(el('q-gtm').value||'').trim(), box=el('res-gr');
  if(q.length<3){ box.innerHTML=q.length?'<div class="ri-empty">Keep typing…</div>':''; return; }
  // ⚠️ The season/competition selects FILTER this search. They used to be
  // ignored entirely, so picking "Summer 2026/27" and then typing returned
  // Winter 2026 teams — two controls writing to one panel, neither aware of
  // the other (Mark, 2026-11-23).
  const fSeason=el('q-gsn').value||null, fSid=el('q-gcp').value||null;
  box.innerHTML='<div class="load-row">Searching teams…</div>';
  await loadTeamIdx();
  const hits=[];
  outer:
  for(const [season,list] of Object.entries(S.teamIdx||{})){
    if(fSeason && season!==fSeason) continue;
    for(const t of list){
      if(!t||!t.n) continue;
      if(fSid && t.sid!==fSid) continue;
      if(!tokenMatch(t.n,q)) continue;
      const sn=S.idx?.seasons?.[t.sid];
      hits.push({tid:t.id,name:t.n,sid:t.sid,season,
                 comp:(sn&&(sn.compName||sn.fullName))||t.comp||season,
                 org:(sn&&sn.orgName)||'', active:sn?!sn.locked:false});
      if(hits.length>400) break outer;
    }
  }
  const scope=fSid?`in ${esc(el('q-gcp').selectedOptions[0]?.textContent||'this competition')}`
            :fSeason?`in ${esc(fSeason)}`:'across all seasons';
  const hdr=`<div class="gr-scope">Searching ${scope}${fSeason?' — <a onclick="grClearScope()">search everything</a>':''}</div>`;
  if(!hits.length){ box.innerHTML=hdr+'<div class="ri-empty">No team matches that.</div>'; return; }
  hits.sort((a,b)=> a.active!==b.active ? (a.active?-1:1) : String(b.season).localeCompare(String(a.season)));
  box.innerHTML=hdr+hits.slice(0,40).map(h=>{
    const comp=h.org&&!String(h.comp).toLowerCase().includes(String(h.org).toLowerCase())?`${h.comp} — ${h.org}`:h.comp;
    return `<div class="ri" onclick="grFromTeam('${esc(h.sid)}','${esc(h.tid)}')">
      <div class="ri-name">${esc(h.name)}</div>
      <div class="ri-sub">${esc(h.season)} · ${esc(comp)}</div></div>`;
  }).join('')+(hits.length>40?`<div class="ri-empty">${hits.length-40} more — keep typing to narrow</div>`:'');
}

/* One panel, one owner. Typing searches; an empty box falls back to the
   competition's age-group list. Every control routes through here so the two
   can never disagree about what the panel is showing. */
function grRefreshPanel(){
  const q=(el('q-gtm').value||'').trim();
  if(q.length>=3) return grSearchTeams();
  const sid=el('q-gcp').value;
  if(sid) return grPickComp();
  el('res-gr').innerHTML='';
}
function grClearScope(){ el('q-gsn').value=''; grBuildComps(); }

/* Straight from a searched team to its own age group, with it highlighted. */
async function grFromTeam(sid,tid){
  el('res-gr').innerHTML='<div class="load-row">Reading the season…</div>';
  const M=await grBuild(sid);
  if(!M.teams.get(tid)){ el('res-gr').innerHTML='<div class="ri-empty">That team has no games in this season’s data.</div>'; return; }
  const G=M.groups.find(g=>g.teams.some(x=>x.tid===tid));
  if(!G){ el('res-gr').innerHTML='<div class="ri-empty">That team could not be placed in an age group.</div>'; return; }
  grListGroups(sid,M);
  grOpen(sid,G.key);
  GRTEAM=tid; grRender(); grTeamCard(tid);
}

function grBuildComps(){
  const name=el('q-gsn').value, cp=el('q-gcp');
  if(!name){
    cp.innerHTML='<option value="">Competition — select a season</option>'; cp.disabled=true;
    grRefreshPanel(); return;
  }
  const rows=[];
  for(const s of Object.values(S.idx.seasons)){
    if(s.name!==name||s.removed) continue;
    const comp=s.compName||s.fullName||s.name, org=s.orgName||'';
    rows.push({sid:s.id,label:(org&&!comp.toLowerCase().includes(org.toLowerCase()))?`${comp} — ${org}`:comp});
  }
  rows.sort((a,b)=>a.label.localeCompare(b.label));
  cp.innerHTML='<option value="">Competition…</option>'+rows.map(r=>`<option value="${esc(r.sid)}">${esc(r.label)}</option>`).join('');
  cp.disabled=!rows.length;
  grRefreshPanel();
}

async function grPickComp(){
  const sid=el('q-gcp').value, box=el('res-gr');
  if((el('q-gtm').value||'').trim().length>=3) return grSearchTeams();
  if(!sid){ box.innerHTML=''; return; }
  box.innerHTML='<div class="load-row">Reading the season…</div>';
  grListGroups(sid,await grBuild(sid));
}

function grListGroups(sid,M){
  const box=el('res-gr');
  if(!M.teams.size){ box.innerHTML='<div class="ri-empty">No games held for this competition.</div>'; return; }
  let h='';
  if(M.gidCoverage<0.9){
    h+=`<div class="gr-warn">Grade recorded on ${(M.gidCoverage*100).toFixed(0)}% of games</div>`;
  }
  h+=M.groups.map(G=>`<div class="ri" onclick="grOpen('${esc(sid)}','${esc(G.key)}')">
      <div class="ri-name">${esc(G.label)}</div>
      <div class="ri-sub">${G.teams.length} teams · ${G.movers} changed grade · ${G.weekList.length} change week${G.weekList.length===1?'':'s'}</div>
    </div>`).join('');
  box.innerHTML=h;
}

function grReset(){
  el('q-gtm').value=''; el('q-gsn').value='';
  el('q-gcp').innerHTML='<option value="">Competition — select a season</option>'; el('q-gcp').disabled=true;
  el('res-gr').innerHTML=''; GRSEL=null; GRTEAM=null;
}

/* ── View ──────────────────────────────────────────────────────────────────*/
function grOpen(sid,key,push=true){
  GRCUR={sid,key}; GRSEL=null; GRTEAM=null;
  if(push) navigate('grading',{sid,key});
  showV('view-grading');
  if(window.innerWidth<=768) el('rail').classList.add('mob-hide');
  grRender();
}

function grModel(){
  if(!GRCUR) return null;
  const M=GR[GRCUR.sid]; if(!M) return null;
  const G=M.groups.find(g=>g.key===GRCUR.key); if(!G) return null;
  // ⚠️ SELECTING A GRADE HIGHLIGHTS, IT DOES NOT FILTER. It used to drop every
  // team not in the chosen grade and then count the survivors, so each box
  // reported its selected cohort rather than the grade's real membership —
  // "3 teams" where fourteen were playing (Mark, 2026-11-23). Every box, every
  // ribbon and every tooltip is built from the FULL group; the selection is a
  // marked subset drawn inside them.
  const teams=G.teams;
  const selSet=GRSEL?new Set(G.teams.filter(t=>t.gids.has(GRSEL)).map(t=>t.tid)):null;
  const cols=['start',...G.weekList];
  const colEnd=cols.map((c,i)=> i+1<cols.length?grShift(cols[i+1],-1):'9999-12-31');
  const at=new Map();
  for(const t of teams) at.set(t.tid,cols.map((c,i)=> i===0?t.segs[0]:grGradeAtWeek(t,c)));
  return {M,G,teams,selSet,cols,colEnd,at};
}

function grRender(){
  const v=el('view-grading'); if(!v||!GRCUR) return;
  const D=grModel();
  if(!D){ v.innerHTML='<div class="ri-empty">That age group is no longer in the data.</div>'; return; }
  const {M,G,teams,selSet,cols,colEnd,at}=D;
  const season=S.idx?.seasons?.[GRCUR.sid];

  const cell=new Map(), flows=new Map();
  for(const t of teams){
    cols.forEach((c,i)=>{ const s=at.get(t.tid)[i]; if(!s)return;
      const k=i+'|'+s.gid; if(!cell.has(k))cell.set(k,[]); cell.get(k).push(t); });
    for(let i=1;i<cols.length;i++){
      const a=at.get(t.tid)[i-1], b=at.get(t.tid)[i];
      if(!a||!b) continue;
      // Teams that STAY get a band too — without one the picture does not
      // account for everyone between two columns (Mark, 2026-11-23).
      const k=i+'|'+a.gid+'|'+b.gid; if(!flows.has(k))flows.set(k,[]); flows.get(k).push(t);
    }
  }

  // A column is in the future when not one game in that week has been played.
  // This is a property of the COLUMN, not of a team's segment.
  const colFuture=cols.map((c,i)=>{
    if(i===0) return false;
    return !teams.some(t=>t.apps.some(a=>grWeek(a.d)===c && grPlayed(a)));
  });

  const gradeNames=new Map();
  for(const t of teams) for(const s of t.segs) gradeNames.set(s.gid,s.grade);
  /* ⚠️ ROWS SORT BY AGE FIRST, HIGHEST AT THE TOP.
     The old sort was alphabetical on the FULL grade name, so "Saturday U14 Boys
     ARes" landed BELOW "Saturday U13 Boys D" purely because "U14" > "U13" as
     text — a team promoted an entire age bracket appeared at the bottom of the
     diagram, labelled "ARES", indistinguishable from a U13 A Reserve. The row
     label comes from grShort(), which strips the age by design (it is normally
     the panel heading), so nothing on screen said which age it was.
     Rows are keyed on gid, so the two grades were never merged in the data —
     this was a reading problem, not a counting one.
     Within an age, gradeRank() gives the real order (A, ARES, B, BRES, C …)
     rather than the alphabetical one, which put ARES after A1 and C before
     BRES. An unknown level ranks 999 and falls to the foot of its own band. */
  const homeAge=ageNum(String(G.key||'').split('|')[1]);
  const ageNumOf=name=>{ const n=ageNum(grParse(name).age); return (n&&n!==999)?n:homeAge; };
  const ageTxtOf=name=>grParse(name).age||String(G.key||'').split('|')[1]||'';
  const rows=[...gradeNames.entries()].sort((a,b)=>
    ageNumOf(b[1])-ageNumOf(a[1]) ||
    gradeRank(grShort(a[1]))-gradeRank(grShort(b[1])) ||
    String(a[1]).localeCompare(String(b[1]),undefined,{numeric:true}));
  const rowIdx=new Map(rows.map(([gid],i)=>[gid,i]));
  const rowAge=rows.map(([,name])=>ageTxtOf(name));
  const multiAge=new Set(rowAge).size>1;
  const AGEH=multiAge?20:0;
  const newBand=rows.map((r,i)=>multiAge&&(i===0||rowAge[i]!==rowAge[i-1]));

  // Narrow columns; a box's HEIGHT is how many teams are in it.
  // PADT holds the column heading: date, the span it covers, and what is in it.
  // The gutter's top spacer reads the same constant, so the two stay aligned.
  const COLW=46, GAP=96, PADL=10, PADT=62, UNIT=9, ROWPAD=14;
  const rowH=rows.map(([gid])=>{
    let max=0; for(let i=0;i<cols.length;i++) max=Math.max(max,(cell.get(i+'|'+gid)||[]).length);
    return Math.max(24,max*UNIT+ROWPAD);
  });
  // The band header occupies real height, counted here so the gutter's divs and
  // the SVG's rows stay on the same y — they are two renderings of one layout.
  const rowY=[]; let y=PADT;
  for(let i=0;i<rows.length;i++){ if(newBand[i]) y+=AGEH; rowY.push(y); y+=rowH[i]+10; }
  /* ⚠️ The headings are wider than COLW and are centred, so the last column's
     text overhangs the right edge. With PADL on both sides it was CLIPPED —
     "scheduled" rendered as "schedule". PADR is the overhang allowance. */
  const PADR=78;
  const W=PADL+cols.length*COLW+(cols.length-1)*GAP+PADR, H=y+14;
  const colX=i=>PADL+i*(COLW+GAP);
  const nAt=(i,gid)=>(cell.get(i+'|'+gid)||[]).length;
  const boxH=n=>n*UNIT;        // exactly one UNIT per team — bands stack to fill
  const boxY=(r,n)=>rowY[r]+(rowH[r]-boxH(n))/2;

  // Links are STACKED inside their source and target boxes, in row order, so
  // the bands leaving a box add up to exactly its height. Centre-to-centre
  // ribbons overlapped as soon as a box had more than one destination.
  const links=[...flows.entries()].map(([k,list])=>{const[i,from,to]=k.split('|');return{k,i:+i,from,to,list};})
    .filter(L=>rowIdx.has(L.from)&&rowIdx.has(L.to))
    .sort((a,b)=> a.i-b.i || rowIdx.get(a.from)-rowIdx.get(b.from) || rowIdx.get(a.to)-rowIdx.get(b.to));
  const srcUsed=new Map(), tgtUsed=new Map();
  for(const L of links){
    const sk=(L.i-1)+'|'+L.from, tk=L.i+'|'+L.to, w=L.list.length*UNIT;
    const so=srcUsed.get(sk)||0, to=tgtUsed.get(tk)||0;
    L.w=w;
    L.y1=boxY(rowIdx.get(L.from),nAt(L.i-1,L.from))+so+w/2;
    L.y2=boxY(rowIdx.get(L.to),  nAt(L.i,L.to))    +to+w/2;
    srcUsed.set(sk,so+w); tgtUsed.set(tk,to+w);
  }

  let svg=`<svg class="gr-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  // Filled ribbons, not thick strokes. A 70px stroke with round caps reads as
  // clipart at an angle; a sankey band is the AREA between two curves.
  for(const L of links.slice().sort((a,b)=>(a.from===a.to?0:1)-(b.from===b.to?0:1))){
    const stay=L.from===L.to;
    const fut=colFuture[L.i];
    const hot=GRTEAM&&L.list.some(t=>t.tid===GRTEAM);
    const insel=selSet&&L.list.some(t=>selSet.has(t.tid));
    const x1=colX(L.i-1)+COLW, x2=colX(L.i), mid=(x1+x2)/2;
    const a1=L.y1-L.w/2, b1=L.y1+L.w/2, a2=L.y2-L.w/2, b2=L.y2+L.w/2;
    const d=`M${x1},${a1} C${mid},${a1} ${mid},${a2} ${x2},${a2}`+
            ` L${x2},${b2} C${mid},${b2} ${mid},${b1} ${x1},${b1} Z`;
    svg+=`<path class="gr-rib${stay?' stay':''}${fut?' fut':''}${insel?' insel':''}${hot?' hot':''}" d="${d}"
          onmouseenter="grTip(event,'flow','${esc(L.k)}')" onmouseleave="grTipHide()"
          onclick="grPickGrade('${esc(L.to)}')"></path>`;
  }
  /* ⚠️ A COLUMN IS A SPAN, NOT A DATE. The heading read "9 Nov · week of", which
     says when the column STARTS and nothing about what it covers — and the last
     column covers everything from its week to the end of the season, which may
     be months. Each heading now carries the date range it actually spans and how
     much is inside it, so a wide column cannot read as a single week.
     Games are counted by DISTINCT game id: both sides of a fixture are teams in
     this panel, so counting appearances would double every number. */
  const ymdUTC=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||''));return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null;};
  let firstD='', lastD='';
  for(const t of teams) for(const a of t.apps.concat(t.sups||[])){
    if(!a.d) continue;
    if(!firstD||a.d<firstD) firstD=a.d;
    if(a.d>lastD) lastD=a.d;
  }
  /* ⚠️ cols[0] IS THE STRING 'start', NOT A DATE. It is a sentinel meaning "where
     each team began", so it cannot be compared against a game date and cannot be
     measured from: `a.d >= 'start'` is false for every real date, which reported
     the Start column as holding 0 games. Its span begins at the FIRST GAME. */
  const colFrom=cols.map((c,i)=> i===0?(firstD||c):c);
  const colTo  =cols.map((c,i)=> i+1<cols.length?grShift(cols[i+1],-1):(lastD>colFrom[i]?lastD:colFrom[i]));
  /* ⚠️ FLOOR, NOT ROUND. colTo is the INCLUSIVE LAST DAY of the span, not the
     start of its final week. 26 Oct–1 Nov is six days and one week; rounding
     6/7 to 1 and adding 1 called it two. */
  const colWeeks=cols.map((c,i)=>{
    const A=ymdUTC(colFrom[i]),B=ymdUTC(colTo[i]);
    if(A===null||B===null||B<A) return 1;
    return Math.max(1,Math.floor((B-A)/604800000)+1);
  });
  const colGames=cols.map((c,i)=>{
    const seen=new Set();
    for(const t of teams) for(const a of t.apps.concat(t.sups||[]))
      if(a.d&&a.d>=colFrom[i]&&a.d<=colTo[i]) seen.add(a.key);
    return seen.size;
  });
  cols.forEach((c,i)=>{
    const x=colX(i)+COLW/2;
    const span=colTo[i]&&colTo[i]!==colFrom[i]?`${esc(grDayLabel(colFrom[i]))} \u2013 ${esc(grDayLabel(colTo[i]))}`:esc(grDayLabel(colFrom[i]));
    const wk=`${colWeeks[i]} week${colWeeks[i]===1?'':'s'}`;
    const gm=colFuture[i]?'scheduled':`${colGames[i]} game${colGames[i]===1?'':'s'}`;
    svg+=`<text class="gr-colh${colFuture[i]?' fut':''}" x="${x}" y="20" text-anchor="middle">${i===0?'Start':esc(grDayLabel(c))}</text>`+
         `<text class="gr-cols" x="${x}" y="33" text-anchor="middle">${span}</text>`+
         `<text class="gr-colm" x="${x}" y="45" text-anchor="middle">${wk} \u00b7 ${gm}</text>`;
  });
  rows.forEach(([gid,name],r)=>{
    for(let i=0;i<cols.length;i++){
      const list=cell.get(i+'|'+gid)||[]; if(!list.length) continue;
      const future=colFuture[i];
      const hot=GRTEAM&&list.some(t=>t.tid===GRTEAM);
      const nSel=selSet?list.filter(t=>selSet.has(t.tid)).length:0;
      const h=boxH(list.length), yy=boxY(r,list.length);
      // The number is ALWAYS drawn. It used to be suppressed under 15px, so a
      // one- or two-team box rendered as a blank bar with no label at all.
      const label=selSet?`${nSel}/${list.length}`:String(list.length);
      const inside=h>=13&&label.length<=4;
      svg+=`<g class="gr-box${GRSEL===gid?' sel':''}${future?' fut':''}${hot?' hot':''}"
             onmouseenter="grTip(event,'cell','${i}|${esc(gid)}')" onmouseleave="grTipHide()"
             onclick="grPickGrade('${esc(gid)}')"><title>${esc(name)}</title>`+
           `<rect x="${colX(i)}" y="${yy}" width="${COLW}" height="${h}" rx="3"></rect>`+
           (nSel?`<rect class="gr-selin" x="${colX(i)}" y="${yy+h-boxH(nSel)}" width="${COLW}" height="${boxH(nSel)}" rx="3"></rect>`:'')+
           (inside?`<text class="gr-boxn" x="${colX(i)+COLW/2}" y="${yy+h/2+4}" text-anchor="middle">${label}</text>`
                  :`<text class="gr-boxn out" x="${colX(i)+COLW+5}" y="${yy+h/2+4}">${label}</text>`)+
           `</g>`;
    }
  });
  // The boundary between two age brackets, carried across the whole diagram so
  // the eye does not have to return to the gutter to find it. Not drawn above
  // the first band — there is nothing above it to separate.
  if(multiAge){
    rows.forEach((_,i)=>{
      if(!newBand[i]||i===0) return;
      const yy=rowY[i]-AGEH/2-5;
      svg+=`<line class="gr-agerule" x1="0" y1="${yy}" x2="${W}" y2="${yy}"></line>`;
    });
  }
  svg+='</svg>';

  const gutter=`<div class="gr-gutter"><div style="height:${PADT}px"></div>`+
    rows.map(([gid,name],r)=>
      (newBand[r]?`<div class="gr-age" style="height:${AGEH}px">${esc(rowAge[r])}</div>`:'')+
      `<div class="gr-grow${GRSEL===gid?' sel':''}" style="height:${rowH[r]}px;margin-bottom:10px"
        title="${esc(name)}" onclick="grPickGrade('${esc(gid)}')"><span>${esc(grShort(name))}</span></div>`).join('')+`</div>`;

  const movers=G.teams.filter(t=>t.hops.length).length;
  const selName=GRSEL?gradeNames.get(GRSEL):null;
  const teamOpts=G.teams.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(t=>`<option value="${esc(t.tid)}"${GRTEAM===t.tid?' selected':''}>${esc(t.name)}${t.hops.length?` (${t.hops.length} move${t.hops.length===1?'':'s'})`:''}</option>`).join('');

  v.innerHTML=`<div class="gr-head">
      <button class="rbtn" onclick="goHome()">‹ Home</button>
      <div class="gr-title">${esc(G.label)}</div>
      <div class="gr-sub">${esc(season?(season.fullName||season.name):'')} · ${G.teams.length} teams · ${movers} changed grade · ${G.weekList.length} change week${G.weekList.length===1?'':'s'}</div>
      <div class="gr-ctl">
        <select class="sselect gr-tsel" onchange="grSelectTeam(this.value)">
          <option value="">Highlight a team…</option>${teamOpts}
        </select>
        ${GRSEL?`<button class="rbtn gr-selbtn" onclick="grPickGrade('${esc(GRSEL)}')">✕ ${esc(selName||'grade')} · ${selSet?selSet.size:0} team${(selSet?selSet.size:0)===1?'':'s'} marked</button>`:''}
      </div>
      <div class="gr-note">Dashed = not yet played. Click a grade to mark its teams.</div>
    </div>
    <div class="gr-wrap">${gutter}<div class="gr-scroll">${svg}</div></div>
    <div id="gr-team"></div>`;
}

/* ── Tooltip: who is here, and what they have done IN THIS GRADE so far ────*/
function grTipList(kind,k){
  const D=grModel(); if(!D) return {list:[],gid:null,upto:'9999-12-31'};
  if(kind==='cell'){
    const [i,gid]=k.split('|');
    return {list:D.teams.filter(t=>{const s=D.at.get(t.tid)[+i];return s&&s.gid===gid;}),gid,upto:D.colEnd[+i],sel:D.selSet};
  }
  const [iS,from,to]=k.split('|'); const i=+iS;
  /* ⚠️ A MOVE SHOWS THE RECORD IN THE GRADE BEING LEFT, NOT THE ONE BEING ENTERED.
     This read `gid:to, upto:colEnd[i]` — the destination grade, cut off at the end
     of the destination column. That column is frequently in the FUTURE, so
     hovering a move into A showed "1 · 0-1 · 0%" built from a game that has not
     been played, and for a wholly unplayed week it showed a record for a grade
     the team has not yet played a minute in.
     What makes a move legible is how the team FINISHED the grade it is leaving —
     that is the result the move was made on. So a move reads `from`, up to the
     end of the PREVIOUS column. A stay is not leaving anything, so it keeps the
     later cutoff and shows more games rather than fewer. */
  const moved=from!==to;
  return {list:D.teams.filter(t=>{const a=D.at.get(t.tid)[i-1],b=D.at.get(t.tid)[i];return a&&b&&a.gid===from&&b.gid===to;}),
          gid:moved?from:to, upto:moved?D.colEnd[i-1]:D.colEnd[i], sel:D.selSet, moved};
}
function grTip(ev,kind,k){
  const {list,gid,upto,sel,moved}=grTipList(kind,k);
  if(!list.length) return;
  // Selected teams sort to the top, but nobody is left out — the tooltip is
  // the grade's real membership at that point.
  const ordered=sel?[...list].sort((a,b)=>(sel.has(b.tid)?1:0)-(sel.has(a.tid)?1:0)):list;
  const rows=ordered.slice(0,26).map(t=>{
    const c=grCum(t,gid,upto);
    const rec=c.p?`${c.p} · ${c.w}-${c.l}${c.d?'-'+c.d:''} · ${c.pct}%`:'<span class="gr-tipm">no games yet</span>';
    return `<div class="gr-tr${GRTEAM===t.tid?' hot':''}${sel&&sel.has(t.tid)?' insel':''}"><span class="gr-tn">${esc(t.name)}</span><span class="gr-tv">${rec}</span></div>`;
  }).join('');
  const tip=el('gr-tip');
  const nSel=sel?list.filter(t=>sel.has(t.tid)).length:0;
  const verb=kind==='flow'?(k.split('|')[1]===k.split('|')[2]?'stayed':'moved here'):'';
  // Say WHICH grade the record is in. "record in this grade" beside a move was
  // ambiguous even when it was the destination, and is wrong now it is not.
  tip.innerHTML=`<div class="gr-tiph">${list.length} team${list.length===1?'':'s'}${verb?' '+verb:''} · record in ${moved?'the grade they left':'this grade'}${sel?` · ${nSel} marked`:''}</div>`+rows+
    (ordered.length>26?`<div class="gr-tipm">… and ${ordered.length-26} more</div>`:'');
  tip.classList.add('on');
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(ev.clientX+14,window.innerWidth-r.width-10)+'px';
  tip.style.top=Math.min(ev.clientY+14,window.innerHeight-r.height-10)+'px';
}
function grTipHide(){ el('gr-tip').classList.remove('on'); }

/* ── One team: results, and where each opponent sat then and now ───────────*/
/* ⚠️ A CANCELLED FIXTURE IS LISTED DIRECTLY ABOVE THE GAME THAT REPLACED IT.
   Both carry the same DATE, so sorting by date alone puts them either way round,
   and the ↓ on the chip becomes a lie the moment the replacement sorts first.
   The replacing game always has this team as a side — that is how `sup` was
   derived — so it is always somewhere in the same list, just not always next.
   A row whose replacement is NOT in the list is returned in `orphans` and keeps
   its date position, so it can be drawn WITHOUT the arrow rather than pointing
   at whatever happens to follow it. ONE implementation, two callers. */
function supOrder(list, idOf, supOf){
  const keep=list.filter(x=>!supOf(x)), sups=list.filter(x=>supOf(x));
  const at=new Map(); keep.forEach((x,i)=>at.set(String(idOf(x)),i));
  const before=new Map(), orphans=new Set();
  for(const sp of sups){
    const i=at.get(String(supOf(sp)));
    if(i===undefined){ orphans.add(sp); continue; }
    if(!before.has(i)) before.set(i,[]);
    before.get(i).push(sp);
  }
  const out=[];
  for(let i=0;i<keep.length;i++){ for(const sp of (before.get(i)||[])) out.push(sp); out.push(keep[i]); }
  const stamp=r=>String((r.d||r.date||'')+' '+(r.t||''));
  for(const sp of orphans){
    const k=out.findIndex(r=>stamp(r)>stamp(sp));
    out.splice(k<0?out.length:k,0,sp);
  }
  return { rows: out, orphans };
}

function grTeamCard(tid){
  const M=GR[GRCUR.sid], t=M.teams.get(tid), box=el('gr-team');
  if(!t){ box.innerHTML=''; return; }
  const finalOf=o=>{ const x=M.teams.get(o); return x&&x.segs.length?x.segs[x.segs.length-1].grade:null; };
  const atOf=(o,week)=>{ const x=M.teams.get(o); if(!x)return null; const s=grGradeAtWeek(x,week); return s?s.grade:null; };
  let w=0,l=0,d=0;
  // Superseded fixtures are OUT of t.apps, so every count above and every band is
  // clean by construction. They are shown here, greyed, because the flag carries
  // the id of the game that replaced it and this row is where that is useful.
  const ord=supOrder(t.apps.concat(t.sups||[]).sort((x,y)=>{const A=x.d+' '+x.t,B=y.d+' '+y.t;return A<B?-1:A>B?1:0;}),
                     a=>a.key, a=>a.sup);
  const shown=ord.rows;
  const rows=shown.map(a=>{
    const my=Number(a.my), th=Number(a.their);
    const isSup=!!a.sup;
    let res='',cls='';
    if(grPlayed(a)){ if(my>th){res='W';cls='w';w++;} else if(my<th){res='L';cls='l';l++;} else {res='D';cls='d';d++;} }
    // ↓ means "the game that replaced this one is the next row". With no
    // replacement in this list there is nothing to point at, so no arrow.
    else if(isSup){ res=ord.orphans.has(a)?'RGRD':'\u2193 RGRD'; cls='p'; }
    else { res=esc(a.st||'TBP'); cls='p'; }
    const wk=grWeek(a.d), oppThen=atOf(a.opp,wk), oppNow=finalOf(a.opp);
    const moved=oppThen&&oppNow&&oppThen!==oppNow;
    const open=grPlayed(a)?` class="gr-trow" onclick="openSheet('${esc(a.key)}','${esc(GRCUR.sid)}')"`
             :isSup?` class="gr-trow sup-row" onclick="openSheet('${esc(a.sup)}','${esc(GRCUR.sid)}')" title="${ord.orphans.has(a)?'Cancelled by a regrade \u2014 click to open the game played instead':'Cancelled by a regrade \u2014 the game played instead is the next row; click to open it'}"`
             :'';
    return `<tr${open}><td class="gr-d">${esc(grDayLabel(a.d))}</td><td class="gr-r">${esc(a.rn)}</td>
      <td>${esc(a.oppName||a.opp||'')}</td>
      <td class="gr-sc">${grPlayed(a)?`${my}–${th}`:'–'}</td>
      <td class="gr-res ${cls}">${res}</td><td class="gr-g">${esc(a.grade||'')}</td>
      <td class="gr-g">${esc(oppThen||'–')}</td>
      <td class="gr-g${moved?' gr-gmv':''}"${moved?` title="Was ${esc(oppThen)} when you played them"`:''}>${esc(oppNow||'–')}</td></tr>`;
  }).join('');
  const path=t.segs.map(s=>`<span class="${s.future?'gr-pf':''}">${esc(s.grade)}</span> <span class="gr-pd">(${esc(grDayLabel(s.from))}${s.future?', scheduled':''})</span>`).join(' → ');
  const played=w+l+d;
  box.innerHTML=`<div class="gr-tcard">
    <div class="rec-title gr-tlink" onclick="loadTeam('${esc(t.tid)}','${esc(GRCUR.sid)}')" title="Open this team">${esc(t.name)} ›</div>
    <div class="gr-path">${path}</div>
    <div class="gr-rec">${w}W ${l}L${d?` ${d}D`:''} over ${played} played${t.apps.length>played?` · ${t.apps.length-played} still to play`:''}${t.superseded?` · ${t.superseded} regraded, struck through above their replacements and not counted`:''}</div>
    <div class="gr-tablewrap"><table class="gr-table">
      <thead><tr><th>Date</th><th>Round</th><th>Opponent</th><th>Score</th><th></th><th>Our grade</th><th>Their grade then</th><th>Their grade now</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="gr-note">Underlined = that opponent moved grade afterwards.</div>
  </div>`;
}

function renderRecords(){
  const rv=document.getElementById('lb-records-view');
  if(!rv||!S.records)return;
  const cats=[
    {key:'playerPTS',   title:'Single-game scoring record',   vLabel:'PTS', type:'player'},
    {key:'playerThreePt',title:'Single-game 3PT record',      vLabel:'3PT', type:'player'},
    {key:'teamPTS',     title:'Team single-game record',       vLabel:'PTS', type:'team'},
    {key:'teamThreePt', title:'Team 3PT record',               vLabel:'3PT', type:'team', note:'Box scores only'},
    {key:'highestCombined',title:'Highest combined score',     vLabel:'PTS', type:'game'},
    {key:'largestMargin',  title:'Largest winning margin',     vLabel:'Pts', type:'game'},
    {key:'closestGame',    title:'Closest game',               vLabel:'%',   type:'closest'},
  ];
  let h='<div style="padding:12px 16px;font-size:0.72rem;color:var(--text2);border-bottom:1px solid var(--border)">All-time records across 2,245,987 recorded games</div>';
  for(const cat of cats){
    const entries=S.records[cat.key]||[];
    if(!entries.length)continue;
    const note=S.records._notes?.[cat.key]?`<span style="font-size:0.65rem;color:var(--text3);margin-left:6px">${esc(S.records._notes[cat.key])}</span>`:'';
    h+=`<div class="rec-card"><div class="rec-title">${esc(cat.title)}${note}</div>`;
    const shown=entries.slice(0,5);
    const rest=entries.slice(5,50);
    h+=shown.map((e,i)=>recEntry(e,i+1,cat)).join('');
    if(rest.length){
      h+=`<div id="rec-more-${esc(cat.key)}" class="hidden">${rest.map((e,i)=>recEntry(e,i+6,cat)).join('')}</div>`;
      h+=`<button class="lb-stat" style="margin-top:6px;width:100%" onclick="el('rec-more-${esc(cat.key)}').classList.toggle('hidden');this.textContent=this.textContent.includes('Show')?'Hide':'Show all 50'">Show all 50 ↓</button>`;
    }
    h+='</div>';
  }
  rv.innerHTML=h;
}
function recEntry(e,rank,cat){
  const isClosest=cat.type==='closest';
  const val=isClosest?((e.ratio??0)*100).toFixed(1)+'%':(e.v??0).toLocaleString('en-AU');
  let detail='',sub='';
  if(cat.type==='player'){detail=esc(e.name||'');sub=`${esc(e.date||'')} · vs ${esc(e.vs||'')} · ${esc(e.score||'')}`;
  }else if(cat.type==='team'){detail=esc(e.name||'');sub=`${esc(e.date||'')} · vs ${esc(e.vs||'')} · ${esc(e.score||'')}`;
  }else{detail=`${esc(e.home||'')} · ${esc(e.away||'')}`;sub=`${esc(e.date||'')} · ${esc(e.score||'')}`;
  }
  const click=e.gameKey&&e.sid?`onclick="openRecordGame('${esc(e.sid)}','${esc(e.gameKey)}')" `:'';
  return`<div class="rec-entry" ${click}><div class="rec-rank">${rank}</div><div class="rec-val">${val}</div><div><div class="rec-detail">${detail}</div><div class="rec-sub">${sub}</div></div></div>`;
}
async function openRecordGame(sid,gameKey){
  // WAS A SILENT NO-OP. It read `S.games[sid]?.[gameKey]` — flat — while a season
  // file is {games:{...}}, so g was ALWAYS undefined (the only flat read left in
  // this file, against eleven nested ones). `if(g)` then swallowed it, and the
  // dead four-arg call below it was never even reached. Clicking a record did
  // nothing at all and logged nothing.
  // openSheet loads the season file itself and renders "Game not found." when the
  // id really is absent, so there is deliberately no guard here to swallow one.
  openSheet(gameKey,sid);
}

/* ── Player search ── */
async function searchPlayers(q){
  const re=el('res-pl');
  re.style.display='';
  if(q.length<2){re.innerHTML='';return;}
  re.innerHTML='<div class="ri-empty">Searching\u2026</div>';
  // Shard selection v2 (2026-08-02) — EXACT mirror of build-search-index.js
  // shardKey: fold accents to base letters, strip non a-z, first 2 chars,
  // legacy '_' fallback preserved byte-for-byte. The old raw slice fetched
  // shards that never existed ("álvarez" -> 'ál.json', "o'b" -> "o'.json"),
  // so accented and apostrophe-second-char queries found nothing. Requires the
  // v2-rebuilt index — deploy AFTER build-search-index has run.
  const _fold=q.normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');
  const sh=_fold.length>=2?_fold.slice(0,2):(_fold+'_').slice(0,2);
  if(!S.shards[sh]){const d=await gj(BASE+'/search/players/'+sh+'.json');S.shards[sh]=d||{};}
  const hits=[];const seen=new Set();
  for(const[k,arr]of Object.entries(S.shards[sh])){
    if(!tokenMatch(k,q))continue;
    for(const e of arr){if(!seen.has(e.id)){seen.add(e.id);hits.push({k,...e});}}
  }
  if(!hits.length){re.innerHTML='<div class="ri-empty">No players found</div>';return;}
  re.innerHTML=hits.slice(0,40).map(h=>`<div class="ri" data-u="${esc(h.id)}"><div class="ri-name">${esc(h.k)}</div><div class="ri-sub">${esc(h.c||'\u2014')} \u00b7 ${esc(h.t||'')}</div></div>`).join('');
  re.querySelectorAll('.ri').forEach(r=>r.addEventListener('click',()=>{addRecent('players',q);loadPlayer(r.dataset.u);if(window.innerWidth<=768)el('rail').classList.add('mob-hide');}));
}

/* ── Player profile ── */

  showV('view-player');
  const ve=el('view-player');ve.innerHTML='<div class="load-row">Loading\u2026</div>';

    if(!d){ const r=await resolveToFullUuid(uuid); if(r&&r!==key){ key=r; d=S.players[key]||await gj(BASE+'/players/'+key.slice(0,2)+'/'+key+'.json'); } }
    if(d)S.players[key]=d;
