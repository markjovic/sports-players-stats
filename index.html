// ── Grade snapshot helpers ──────────────────────────────────────────────────

function extractGradeLevel(gn){
  if(!gn)return'?';
  const parts=gn.trim().split(/\s+/);
  const last=parts[parts.length-1];
  if(/^[A-E][1-4]?$/.test(last))return last;
  if(/^[A-E]RES$/i.test(last))return last.toUpperCase();
  if(parts.length>=2){
    const s=parts[parts.length-2];
    if(/^(Grade|Pool|Division|Div)$/i.test(s))return s+' '+last;
  }
  return last;
}

function gradeRank(lv){
  return({'A':10,'A1':11,'A2':12,'A3':13,'B':20,'B1':21,'B2':22,'B3':23,
          'C':30,'C1':31,'C2':32,'D':40,'D1':41,'D2':42,'E':50,'E1':51,
          'ARES':15,'BRES':25,'CRES':35,'DRES':45})[( lv||'').toUpperCase()]??999;
}

function ageNum(a){return parseInt((a||'').replace(/\D/g,''))||999;}

function baseLetter(lv){
  // Extract the base grade letter: BRES→B, B1→B, A→A, Pool 2→Pool 2 (unchanged)
  return(lv||'').replace(/RES$/i,'').replace(/[0-9]+$/,'')[0]||lv||'';
}

function buildGradeSnapshot(seasons){
  const map=new Map();
  for(const sn of seasons){
    const si=S.idx?.seasons?.[sn.sid];
    const org=(si?.orgName||'').trim();
    const comp=(si?.compName||'').trim();
    // Fall back to season name if org not found — shouldn't happen but handles gracefully
    const key=org?(org+(comp?' — '+comp:'')):(sn.sn||sn.sid||'Other');
    if(!map.has(key))map.set(key,new Map());
    const ageMap=map.get(key);
    // Within this season: for each age, track grades by base letter
    // Last reg with a given base letter wins (handles BRES→B or B→BRES correctly)
    const ageSel={}; // age → { baseLetter → { idx, lv } }
    for(let i=0;i<(sn.regs||[]).length;i++){
      const reg=sn.regs[i];
      const age=reg.age||'Open';
      const lv=extractGradeLevel(reg.gn);
      const bl=baseLetter(lv);
      if(!ageSel[age])ageSel[age]={};
      // Always overwrite — later index = more recent = wins
      ageSel[age][bl]={idx:i,lv};
    }
    for(const[age,blMap]of Object.entries(ageSel)){
      if(!ageMap.has(age))ageMap.set(age,new Set());
      for(const{lv}of Object.values(blMap))ageMap.get(age).add(lv);
    }
  }
  return map;
}

function renderGradeSnapshot(seasons){
  const snap=buildGradeSnapshot(seasons);
  if(!snap.size)return'';
  let h='<div class="gs-wrap">';
  for(const[orgKey,ageMap]of snap){
    h+=`<div class="gs-org-block"><div class="gs-org-name">${esc(orgKey)}</div><div class="gs-ages">`;
    const ages=[...ageMap.keys()].sort((a,b)=>ageNum(a)-ageNum(b));
    for(const age of ages){
      const grades=[...ageMap.get(age)].sort((a,b)=>gradeRank(a)-gradeRank(b));
      h+=`<span class="gs-pill"><span class="gs-age">${esc(age)}</span><span class="gs-grd">${grades.map(esc).join(' · ')}</span></span>`;
    }
    h+='</div></div>';
  }
  return h+'</div>';
}

// Finals row (StatTrack 0.72). ONE row under the career strip, COLUMN-ALIGNED with
// it: .cstat is flex:1, so alignment is purely a matter of equal cell counts in the
// same order. The career strip's optional cells (FO, record, Finals, GF, GFW, F/Ssn)
// are mirrored here — finals record under the career record, empty placeholder cells
// under columns with no finals equivalent. The caller passes which optional cells the
// strip rendered; change one, change both.
// Gate: renders ONLY when finalsStats.gp > 0 (pipeline also deletes the block at 0,
// so all-forfeit-finals players show nothing). Scoring cells render "\u2014" when no
// box lines exist (boxedGp === 0) — never zeros; PPG divides by boxedGp.
function renderFinalsPanel(cs,cols){
  const f=cs.finalsStats;
  if(!f||!(f.gp>0))return'';
  cols=cols||{};
  const bg=f.boxedGp||0;
  const box=(v)=>bg>0?v:'\u2014';
  const ppg=bg>0?(f.pts/bg).toFixed(1):'\u2014';
  const cell=(v,l,id)=>`<div class="cstat"><div class="csv"${id?` id="${id}"`:''}>${v}</div><div class="csl">${l}</div></div>`;
  const blank='<div class="cstat"></div>';
  const rec=(f.wins||f.losses||f.draws)?`${f.wins?`<span style="color:var(--win)">${f.wins}W</span>`:''}${f.losses?`<span style="color:var(--loss)">${f.losses}L</span>`:''}${f.draws?`<span style="color:var(--draw)">${f.draws}D</span>`:''}`:'\u2014';
  const recCell=`<div class="cstat"><div class="csv" style="font-size:0.75rem;display:flex;gap:4px;justify-content:center;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums">${rec}</div><div class="csl">${(f.wins+f.losses)>0?Math.round(100*f.wins/(f.wins+f.losses))+'%':''}</div></div>`;
  const partial=bg>0&&bg<f.gp?`scoring from ${bg} of ${f.gp} finals with box scores`:'';
  return `<div class="sec-lbl fin-lbl" style="margin-top:2px" onclick="toggleFinals(this)"><span class="chev fin-chev">\u25b6</span> Finals</div><div class="cstats fin-strip">
    ${cell(f.gp,'GP')}${cell(box(f.pts),'PTS','fsv-pts')}${cell(ppg,'PPG','fsv-ppg')}${cell(box(f.threePt||0),'3PT','fsv-3pt')}${cell(box(f.fouls||0),'F','fsv-f')}${cols.fo?blank:''}${cols.rec?recCell:''}${cols.fin?blank:''}${cols.gf?blank:''}${cols.gfw?blank:''}${cols.fssn?blank:''}
  </div><div id="fs-note" class="fin-note" style="padding:2px 2px 0;font-size:0.62rem;color:var(--text3)">${partial}</div>`;
}

// Finals SCORING is hydrated at runtime, not stored. Box lines live in the spectator
// API (proxied by the Worker) and are only persisted for hidden-game reconstructions —
// 10 of 6,501 games in a live season file. build-finals-stats writes the finals GIDS
// onto the player; this fetches exactly those games (5-ish per player, cached in
// S.boxes and shared with the game sheet) and sums the player's own lines. Same
// zero-data-cost pattern as the 0.65/0.66 opposition views.
function toggleFinals(lbl){
  const open=lbl.classList.toggle('open');
  let n=lbl.nextElementSibling;
  if(n&&n.classList.contains('fin-strip')){n.classList.toggle('open',open);n=n.nextElementSibling;}
  if(n&&n.classList.contains('fin-note'))n.classList.toggle('open',open);
}
async function hydrateFinals(uuid,f){
  const gids=f&&f.gids;
  if(!gids||!gids.length)return;
  const note=document.getElementById('fs-note');
  if(note&&!(f.boxedGp>0))note.textContent='loading finals box scores\u2026';
  const boxes=await Promise.all(gids.map(g=>fetchBox(g)));
  if(S.playerUuid!==uuid)return;                       // navigated away mid-fetch
  let n=0,pts=0,tp=0,fl=0;
  for(const bs of boxes){
    if(!bs)continue;
    const mine=[...(bs.h||[]),...(bs.a||[])].find(x=>matchP(x.profileID,uuid));
    if(!mine)continue;
    n++;pts+=mine.pts||0;tp+=mine.pt3||0;fl+=mine.fouls||0;
  }
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  if(!n){if(note)note.textContent='no box scores available for these finals';return;}
  set('fsv-pts',pts);set('fsv-ppg',(pts/n).toFixed(1));set('fsv-3pt',tp);set('fsv-f',fl);
  if(note)note.textContent=n<gids.length?`scoring from ${n} of ${gids.length} finals with box scores`:'';
}

/* ── CLUBS PLAYED FOR (v1.23) ────────────────────────────────────
   "How many games has this player played for each club?" The club is PlayHQ's
   team `organisation`, which nothing else in this repo carries: `season.club`
   is the ASSOCIATION (sports-index orgName) and team-stats meta.club is only
   ever populated for teams that never played. build-club-index.js captures it
   into club-map/bv/{sid}.json as a flat { tid: clubId }. See REPO_MANIFEST
   §6.64 for how that file is built and §6.65 for the Clubs tab it feeds.

   PLAYHQ-HELD DATA ONLY (Mark, 2026-10-12). The figure is reg.stats.gp — what
   PlayHQ itself credits — and NEVER the games[] fallback the season card uses
   to fill a reg PlayHQ left empty. Appearances we hold that PlayHQ does not
   credit are counted and stated beneath the panel; they are never folded into
   a club total, because a club total that mixed the two would reconcile with
   neither PlayHQ's profile nor the "not credited by PlayHQ" line above it.

   ⚠ MAX, NOT SUM (T20). Sibling regs sharing a tid carry IDENTICAL
   season-cumulative stat blocks, so summing them doubles every club total for
   a regraded player (B → BRES). regsPhqGp applies the same MAX the season
   card's `st` reduce does; harness.cjs asserts the two agree group for group.

   ⚠ A SEASON WE COULD NOT LOAD IS NOT A SEASON WITH NO CLUB. gj() returns null
   for a 404 and for a network failure alike, and bucketing those as "club not
   recorded" would invent an answer. They are held in their own row and the
   seasons are named, so a gap reads as a gap. */

const PCLUB_FETCH_BATCH = 6;    // club-map files in flight at once
const PCLUB_NONE  = '~none';    // team carries no club organisation
const PCLUB_UNRES = '~unres';   // this season's club map could not be loaded

/* GP PlayHQ credits for one (sid,tid) group. MAX across siblings — see T20 above. */
function regsPhqGp(regs){
  return (regs||[]).reduce((m,r)=>Math.max(m,(r&&r.stats&&r.stats.gp)||0),0);
}

/* Games WE hold for this group, from games[] via gameTids. Used by the season
   card to fill a reg PlayHQ left empty, and here only to report the shortfall. */
function gamesForGroup(p,regs){
  const gt=(p&&p.gameTids)||{};
  const mine=(p&&Array.isArray(p.games))?p.games:[];
  const tids=new Set((regs||[]).map(r=>r.tid).filter(Boolean));
  let n=0;
  for(const gid of mine) if(tids.has(gt[gid])) n++;
  return n;
}

/* club-map is written for EVERY season into the main repo — archived seasons
   included — so this deliberately does not go through seasonBase()/sgj(). A
   failed fetch is cached as null: a dead season is not re-requested for every
   player, and null stays distinguishable from a loaded-but-empty {}. */
async function clubMapsFor(sids){
  const need=sids.filter(s=>s&&!(s in S.clubMap));
  for(let i=0;i<need.length;i+=PCLUB_FETCH_BATCH){
    await Promise.all(need.slice(i,i+PCLUB_FETCH_BATCH).map(async sid=>{
      S.clubMap[sid]=await gj(BASE+'/club-map/bv/'+sid+'.json');
    }));
  }
  return S.clubMap;
}

/* id -> name, from the same data/club-index.json the Clubs tab searches. NOT
   cached when the index fails to load, so the next player retries rather than
   inheriting an empty map; until it loads, rows fall back to the raw club id,
   which is opaque but true. */
async function clubNameMap(){
  if(S.clubNames) return S.clubNames;
  if(!S.clubIdx){
    const idx=await gj(BASE+'/data/club-index.json');
    if(!idx) return {};
    S.clubIdx=idx;
  }
  const m={}, ty={};
  for(const c of S.clubIdx){ if(!c||!c.id) continue; m[c.id]=c.n||c.id; if(c.ty) ty[c.id]=c.ty; }
  S.clubNames=m;
  S.clubTypes=ty;
  S.clubKeys=buildClubKeys(S.clubIdx);
  return m;
}

/* ── NAME INFERENCE FOR TOURNAMENT-ENTERED TEAMS (v1.24) ──────────────────
   A team entered under a TOURNAMENT carries the tournament as its organisation,
   not the club that owns it — 941 of 1,235 teams in 0869ea69. probe-team-club-fields
   established (§6.67) that PlayHQ holds the owning club on NO other field, so the
   team NAME is the only route, and `ty` (§6.69) is what says which teams need it.

   MEASURED, §6.71. Candidates restricted to `ty === 'CLUB'` and matched on WHOLE
   WORDS, against the control — teams where PlayHQ DID give a club, so the name's
   answer can be checked:  282 decided, 0 wrong.  The earlier 23% error came from
   letting an ASSOCIATION win a match ("Blackburn Vikings Basketball Association"
   beating the Club) and from substring matching (" rocketstars " matching " stars ").

   ⚠️ COVERAGE IS A PROPERTY OF EACH TOURNAMENT'S NAMING, NOT OF THIS CODE.
   Nunawading writes "Spirit Magic U14 Boys" — 75.5% resolve. Eltham-Dandenong
   writes "Westgate B12.1", "Knox G16.9" — 7.6%. Loosening the match to catch the
   abbreviated forms reintroduces the ambiguity the CLUB-only rule removed ("Knox"
   is both an Association and a Club) AND that season has ZERO club-attributed
   teams, so there would be no control to measure the error against. Declining is
   the correct behaviour; 27% overall coverage is the price of 0 errors.

   ⚠️ NO `ty`, NO INFERENCE. Until Deploy Pages has published a club-index that
   carries `ty`, clubKeys is empty, nothing folds, and the panel behaves exactly as
   v1.23 did. A silent half-application would be worse than none. */
function normClubName(x){ return ' '+String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()+' '; }
function clubKeyOf(n){
  return normClubName(n).replace(/ basketball club | basketball association | basketball | club | association | tournament | inc /,' ').trim();
}
function buildClubKeys(idx){
  const out=[];
  for(const c of (idx||[])){
    if(!c||c.ty!=='CLUB'||!c.n||!c.id) continue;
    const k=clubKeyOf(c.n);
    if(k.length>=5) out.push({id:c.id,n:c.n,k:k});
  }
  // Longest key first, so the most specific club wins and the first hit can be
  // returned without scanning the rest.
  return out.sort((a,b)=>b.k.length-a.k.length);
}
/* Whole-word containment — the needle is padded on both sides, so " stars " can
   never match inside " rocketstars ". That was the single residual error. */
function inferClubFromName(teamName, keys){
  if(!teamName||!keys||!keys.length) return null;
  const t=normClubName(teamName);
  for(const c of keys) if(t.indexOf(' '+c.k+' ')!==-1) return c;
  return null;
}

/* Pure: groups + maps + names -> the rows the panel draws. Kept out of the DOM
   so the harness can assert the arithmetic with no browser. */
function buildClubTotals(groups,maps,names,p,types,keys){
  types=types||{}; keys=keys||[];
  const agg=new Map(), unres=new Set(), oursSids=new Set();
  let ours=0;
  for(const g of (groups||[])){
    const sid=g.sn&&g.sn.sid, tid=g.tid;
    const gp=regsPhqGp(g.regs);
    const map=sid?maps[sid]:null;
    let key;
    if(!sid||map==null){ if(sid) unres.add(sid); key=PCLUB_UNRES; }
    else if(tid&&tid!=='_unknown'&&map[tid]) key=map[tid];
    else key=PCLUB_NONE;
    // ── FOLD ── PlayHQ named an ASSOCIATION; the team name may name the club.
    // The registration already carries the team name, so this costs no fetch.
    let foldedFrom=null;
    if(key!==PCLUB_NONE&&key!==PCLUB_UNRES&&types[key]==='ASSOCIATION'){
      let hit=null;
      for(const r of (g.regs||[])){ hit=inferClubFromName(r&&r.tn, keys); if(hit) break; }
      if(hit&&hit.id!==key){ foldedFrom=names[key]||key; key=hit.id; }
    }
    if(!agg.has(key)) agg.set(key,{id:key,gp:0,teams:0,sids:new Set(),folded:new Map(),foldedGp:0});
    const a=agg.get(key);
    if(foldedFrom){ a.folded.set(foldedFrom,(a.folded.get(foldedFrom)||0)+gp); a.foldedGp+=gp; }
    a.gp+=gp; a.teams++; if(sid) a.sids.add(sid);
    // Shortfall is only meaningful where PlayHQ credits NOTHING — that is the
    // one case the season card substitutes our own count for, so it is the one
    // case this panel's figure visibly differs from the row beneath it.
    if(!gp){ const n=gamesForGroup(p,g.regs); if(n){ a.ours=(a.ours||0)+n; ours+=n; if(sid) oursSids.add(sid); } }
  }
  const rows=[...agg.values()].map(a=>({
    id:a.id,
    n:a.id===PCLUB_NONE ?'No club recorded'
     :a.id===PCLUB_UNRES?'Club could not be resolved'
     :(names[a.id]||a.id),
    real:a.id!==PCLUB_NONE&&a.id!==PCLUB_UNRES,
    // The bucket is itself an association/tournament — nothing could be folded out
    // of it, so it is labelled rather than silently reading as a club.
    assoc:types[a.id]==='ASSOCIATION',
    folded:[...(a.folded||new Map())].map(([from,gp])=>({from,gp})).sort((x,y)=>y.gp-x.gp),
    foldedGp:a.foldedGp||0,
    gp:a.gp, ours:a.ours||0, teams:a.teams, seasons:a.sids.size
  }));
  rows.sort((x,y)=>(x.real===y.real?0:x.real?-1:1)||(y.gp-x.gp)||(y.seasons-x.seasons)||natCmp(x.n,y.n));
  return {rows, unresolved:[...unres], ours, oursSeasons:oursSids.size};
}

/* A private profile publishes no statistics, so every GP cell is an em dash
   rather than 0 — the same rule OFF() applies to the career strip. The club,
   season and team counts are still real and still shown. */
/* The eight columns a club row carries, in the same order and the same cell
   count as the season rows below, so every number on the page lines up. */
function clubHdrCells(o,gpFallback){
  if(!o)return '';
  const ppg=o.gp?(o.pts/o.gp).toFixed(1):'\u2014';
  const pc=(o.w+o.l+o.d)>0?Math.round(o.w/(o.w+o.l+o.d)*100)+'%':'';
  const wld=(o.w||o.l||o.d)
    ? `${o.w?`<span style="color:var(--win)">${o.w}W</span>`:''}${o.l?` <span style="color:var(--loss)">${o.l}L</span>`:''}${o.d?` <span style="color:var(--draw)">${o.d}D</span>`:''}`
    : '<span style="color:var(--text3)">\u2014</span>';
  return [[o.gp||gpFallback||0,'GP'],[ppg,'PPG'],[o.pts,'PTS'],[o.fg,'FG'],[o.ft,'FT'],[o.tp,'3PT'],[o.f,'F']]
    .map(([v,l])=>statCell(v,l,false,null)).join('')
   + `<div style="flex:1;text-align:center;padding:6px 4px;min-width:0;overflow:hidden">
        <div style="font-size:0.75rem;font-weight:700;display:flex;gap:3px;justify-content:center;white-space:nowrap;font-variant-numeric:tabular-nums">${wld}</div>
        <div style="font-size:0.58rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-top:1px">${pc}</div></div>`;
}
function renderClubTotals(t,priv){
  if(!t.rows.length) return '';
  let h='<div class="sec-lbl">Clubs</div>';
  for(const r of t.rows){
    const sub=`${r.seasons} season${r.seasons===1?'':'s'} · ${r.teams} team${r.teams===1?'':'s'}`;
    const gp=priv?'—':r.gp.toLocaleString();
    h+=r.real
      ? `<div class="pclub-row" data-cid="${esc(r.id)}" data-cn="${esc(r.n)}" title="Open ${esc(r.n)} in Clubs">`
      : `<div class="pclub-row pclub-na">`;
    // The season card below falls back to OUR count when PlayHQ credits none,
    // so a bare "0 GP" here would read as a contradiction of the card two inches
    // down. The shortfall is shown on the row that owns it rather than left to a
    // footnote, and stays outside the GP figure.
    const extra=(!priv&&r.ours)?`<span class="pclub-x" title="Held here, credited to no club by PlayHQ">+${esc(r.ours)} here</span>`:'';
    const tag=r.assoc?'<span class="pclub-tag">association</span>':'';
    const st=(t.stats&&t.stats[r.id])||null;
    const cells=priv?'':clubHdrCells(st,r.gp);
    h+=`<div class="pclub-tl"><span class="pclub-n">${esc(r.n)}</span>`
     + `<div class="pclub-ts">${tag}${tag?' \u00b7 ':''}${esc(sub)}${extra?' ':''}${extra}</div></div>`
     + (cells?`<div class="pclub-cells">${cells}</div>`:`<span class="pclub-gp">${esc(gp)} GP</span><span class="pclub-s">${esc(sub)}</span>`)
     + `</div>`;
    // Sub-row: the total above INCLUDES these, and this says where they came from
    // and on what basis. Folded games are never invisible inside a club total.
    if(!priv&&r.folded&&r.folded.length){
      for(const f of r.folded)
        h+=`<div class="pclub-sub">\u21b3 includes ${esc(f.gp)} GP matched by team name from `
         + `<span class="pclub-sub-src">${esc(f.from)}</span></div>`;
    }
  }
  const notes=[];
  if(priv) notes.push('This profile is private — PlayHQ publishes no game counts for it. The season and team counts are from its registrations.');
  if(t.unresolved.length) notes.push(`${t.unresolved.length} season${t.unresolved.length===1?'':'s'} could not be mapped to a club (club-map/bv/${esc(t.unresolved[0])}.json${t.unresolved.length>1?' and others':''} did not load) — those registrations are in the unresolved row, not attributed to a club.`);
  if(t.ours&&!priv) notes.push(`“+n here” is an appearance this database holds for a registration PlayHQ credits with no games — ${t.ours} of them across ${t.oursSeasons} season${t.oursSeasons===1?'':'s'}. They are not in the GP totals, which are PlayHQ's own.`);
  if(notes.length) h+=`<div class="pclub-note">${notes.map(esc).join('<br>')}</div>`;
  return h;
}

/* Async, like hydrateFinals: renderPlayer is synchronous and must not wait on a
   network round trip to paint the career strip. Bails if the user has navigated
   to another player while the maps were in flight. */
/* The player's own record at each club, built from the registrations rather
   than from the club bucket, so it uses exactly the figures the season cards
   use: per-stat MAX across siblings sharing a tid (T20), summed across tids. */
function clubRegStats(groups,maps,p,types,keys,names){
  const out={};
  for(const{sn,tid,regs}of groups||[]){
    const sid=sn&&sn.sid; if(!sid||!tid)continue;
    // Same resolution as buildClubTotals, fold and all. Without it this panel
    // totalled 21 GP under a row reading 26: a tournament registration is mapped
    // to the tournament ORGANISATION, and only the name-match fold puts it under
    // the club. Two totals on one row that disagree is worse than either absent.
    let cid=((maps||{})[sid]||{})[tid]; if(!cid)continue;
    let foldedFrom=null;
    if((types||{})[cid]==='ASSOCIATION'){
      let hit=null;
      for(const r of regs){ hit=inferClubFromName(r&&r.tn,keys||[]); if(hit) break; }
      if(hit&&hit.id!==cid){ foldedFrom=(names||{})[cid]||cid; cid=hit.id; }
    }
    const st=regs.reduce((a,r)=>{const q=r.stats||{};return{
      gp:Math.max(a.gp||0,q.gp||0),pts:Math.max(a.pts||0,q.pts||0),fg:Math.max(a.fg||0,q.fg||0),
      ft:Math.max(a.ft||0,q.ft||0),tp:Math.max(a.tp||0,q.threePt||0),f:Math.max(a.f||0,q.fouls||0)};},{});
    const w=regs[0]&&regs[0].stats||{};
    const gp=st.gp||gamesForGroup(p,regs);
    if(!out[cid])out[cid]={gp:0,pts:0,fg:0,ft:0,tp:0,f:0,w:0,l:0,d:0,teams:[]};
    const o=out[cid];
    o.gp+=gp;o.pts+=st.pts;o.fg+=st.fg;o.ft+=st.ft;o.tp+=st.tp;o.f+=st.f;
    o.w+=w.wins||0;o.l+=w.losses||0;o.d+=w.draws||0;
    o.teams.push({sid,tid,tn:(regs[regs.length-1]||{}).tn||tid,season:sn.sn||sid,comp:carComp(sid),
      compFull:carCompFull(sid),grade:abbreviateGrades([...new Set(regs.map(r=>r.gn).filter(Boolean))]),foldedFrom,
      gp,pts:st.pts,fg:st.fg,ft:st.ft,tp:st.tp,f:st.f,w:w.wins||0,l:w.losses||0,d:w.draws||0});
  }
  // Chronological, not by points. groups arrives from groupRegs in
  // sortSeasonsDesc order, so preserving insertion order gives newest first —
  // the same direction as the season history below.
  return out;
}
function clubExpandHtml(o){
  const wl=t=>(t.w||t.l||t.d)
    ? `${t.w?`<span style="color:var(--win)">${t.w}W</span>`:''}${t.l?` <span style="color:var(--loss)">${t.l}L</span>`:''}${t.d?` <span style="color:var(--draw)">${t.d}D</span>`:''}`
    : '<span style="color:var(--text3)">\u2014</span>';
  const cells=t=>{const ppg=t.gp?(t.pts/t.gp).toFixed(1):'\u2014';
    const pc=(t.w+t.l+t.d)>0?Math.round(t.w/(t.w+t.l+t.d)*100)+'%':'';
    return [[t.gp,'GP'],[ppg,'PPG'],[t.pts,'PTS'],[t.fg,'FG'],[t.ft,'FT'],[t.tp,'3PT'],[t.f,'F']]
      .map(([v,l])=>statCell(v,l,false,null)).join('')
     + `<div style="flex:1;text-align:center;padding:6px 4px;min-width:0;overflow:hidden">
          <div style="font-size:0.75rem;font-weight:700;display:flex;gap:3px;justify-content:center;white-space:nowrap;font-variant-numeric:tabular-nums">${wl(t)}</div>
          <div style="font-size:0.58rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-top:1px">${pc}</div></div>`;};
  return o.teams.map(t=>`<div class="pclub-treg" title="${esc([t.tn,t.grade,t.compFull,t.season].filter(Boolean).join(' \u00b7 '))}">
      <div class="pclub-tl">${esc(t.tn)}${t.grade?` <b class="car-gr">${esc(t.grade)}</b>`:''}${
        t.foldedFrom?` <span class="pclub-fold" title="PlayHQ attributed this team to ${esc(t.foldedFrom)}; matched to this club by team name">via ${esc(carTidy(t.foldedFrom))}</span>`:''}
      <div class="pclub-ts">${esc([t.season,t.comp].filter(Boolean).join(' \u00b7 '))}</div></div>
      <div class="pclub-cells">${cells(t)}</div></div>`).join('');
}

async function hydrateClubs(p,groups){
  const uuid=p.uuid;
  if(!document.getElementById('pclub-'+uuid)) return;
  const sids=[...new Set((groups||[]).map(g=>g.sn&&g.sn.sid).filter(Boolean))];
  if(!sids.length) return;
  document.getElementById('pclub-'+uuid).innerHTML='<div class="sec-lbl">Clubs</div><div class="pclub-load">Resolving clubs…</div>';
  const [maps,names]=await Promise.all([clubMapsFor(sids),clubNameMap()]);
  if(S.playerUuid!==uuid) return;
  const host=document.getElementById('pclub-'+uuid);
  if(!host) return;
  const perClub=clubRegStats(groups,maps,p,S.clubTypes,S.clubKeys,names);
  const totals=buildClubTotals(groups,maps,names,p,S.clubTypes,S.clubKeys);
  totals.stats=perClub;
  host.innerHTML=renderClubTotals(totals,isPrivate(p));
  // Listener, not an inline onclick: esc() does not escape an apostrophe, and
  // "St Mary's" inside onclick="loadClub('...')" would end the JS string.
  // Clicking a club used to leave the profile for that club's fixture view,
  // which answers a different question than the one the row asks. It now opens
  // the player's own record at that club in place: a totals strip and a line per
  // registration. The arrow still goes to the club.
  host.querySelectorAll('.pclub-row[data-cid]').forEach(r=>{
    const cid=r.dataset.cid, st=perClub[cid];
    if(!st||!st.teams.length)return;
    const nameEl=r.querySelector('.pclub-n');
    if(nameEl&&!nameEl.querySelector('.pclub-link')){
      const tag=nameEl.querySelector('.pclub-tag');
      const txt=document.createElement('span');
      txt.className='pclub-link';
      txt.title='Open '+r.dataset.cn+' in Clubs';
      txt.textContent=r.dataset.cn;
      nameEl.textContent='';
      nameEl.appendChild(txt);
      if(tag)nameEl.appendChild(tag);
      txt.addEventListener('click',e=>{
        e.stopPropagation();
        loadClub(cid,r.dataset.cn,null);
        if(window.innerWidth<=768) el('rail').classList.add('mob-hide');
      });
    }
    const box=document.createElement('div');
    box.className='pclub-exp';
    r.after(box);
    r.addEventListener('click',()=>{
      const open=box.classList.toggle('open');
      r.classList.toggle('open',open);
      if(open&&!box.dataset.built){
        box.innerHTML=clubExpandHtml(st);
        box.dataset.built='1';
      }
    });
  });
}


/* ── CAREER CARDS (v1.30) ─────────────────────────────────────────────────────
   Replaces the v1.29 movement map, which drew the wrong thing.
   v1.31: season cards keyed on the season PERIOD not the sid; static settings
   bar (the flyout rebuilt itself on every click); open-ended date windows.

   One card per period. The hero number leads, the career is drawn as bars behind
   it with the player's own average marked, and the teams that made up the period
   are listed at the foot of every card.

   THREE GROUPINGS, TWO DATA SOURCES — the distinction matters:

   * Season      from the PlayHQ-credited registration stats already in the
                 player file. Free, instant, and identical to the figures on the
                 season cards below. Several registrations under one tid are a
                 regrade, so per-stat MAX, never a sum (T20); different tids in
                 one season are genuinely different teams and DO sum.

   * Year/Range  summed from the dated per-game lines in games/bv/{sid}.json
                 (g.hp / g.ap, read by storedStats). Exact, not apportioned — a
                 summer season straddling 1 January splits on the real dates.
                 Costs one season game file per season played; they are fetched
                 in the background as soon as a profile opens, and cached in
                 S.games alongside everything else that reads them.

   Games PlayHQ credits where the player is on neither team sheet (`c` games)
   carry no stored line. They are counted and reported on the card rather than
   silently dropped — a year total that quietly omits games is worse than none. */

const CAR={};
function carSt(uuid){
  if(!CAR[uuid])CAR[uuid]={hero:'pts',meas:'T',mode:'S',order:'N',bars:true,range:false,
    a:'',b:'',rows:null,loading:false,missing:[],unlined:0,p:null};
  return CAR[uuid];
}
const CAR_K=['pts','fg','ft','tp','f'];
/* Every counting stat changes meaning per game, not just points, so "per game"
   is a measure applied to whatever the hero is — not a hero of its own. PPG is
   what PTS becomes under it, which is why PPG is no longer in the hero list. */
const CAR_LBL={pts:'PTS',fg:'FG',ft:'FT',tp:'3PT',f:'F'};
const CAR_PG ={pts:'PPG',fg:'FG/PG',ft:'FT/PG',tp:'3PT/PG',f:'F/PG'};
function carLbl(k,meas){return (meas==='G'?CAR_PG:CAR_LBL)[k]||String(k).toUpperCase();}
function carFmtV(v,meas){return meas==='G'?(+v).toFixed(1):v;}
const CAR_BARS=16;            // most bars a card draws; see carCard
const CAR_TEAMS=4;            // team lines shown before a card needs expanding
function carSum(ts,k){return ts.reduce((a,t)=>a+(t[k]||0),0);}
function carFmtD(d){const p=String(d||'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(d||'');}

/* Season totals from registrations.

   Grouped by season NAME, not sid. One season period routinely carries several
   season ids — a domestic comp, a rep comp and a tournament all run inside
   "Summer 2026/27" and each is its own sid. Keying on sid produced three cards
   all headed Summer 2026/27, which is three answers to one question. The period
   is the unit here; the sids inside it become its teams. */
function carSeasonGroups(p){
  const out=[],seen=new Map();
  for(const{sn,tid,regs}of groupRegs(p.seasons||[])){
    const st=regs.reduce((a,r)=>{const s=r.stats||{};const o={
      gp:Math.max(a.gp||0,s.gp||0),pts:Math.max(a.pts||0,s.pts||0),
      fg:Math.max(a.fg||0,s.fg||0),ft:Math.max(a.ft||0,s.ft||0),
      threePt:Math.max(a.threePt||0,s.threePt||0),fouls:Math.max(a.fouls||0,s.fouls||0)};
      // Absent is not zero. A competition that does not record foul-outs must
      // not read as nobody fouling out, so the key only exists where a number did.
      if(typeof s.foulOuts==='number'&&isFinite(s.foulOuts))o.fo=Math.max(a.fo||0,s.foulOuts);
      else if('fo' in a)o.fo=a.fo;
      return o;},{});
    const wld=regs[0]&&regs[0].stats||{};
    const key=sn.sn||sn.sid;
    if(!seen.has(key)){const grp={key,name:key,sids:[],teams:[]};seen.set(key,grp);out.push(grp);}
    const grp=seen.get(key);
    if(grp.sids.indexOf(sn.sid)<0)grp.sids.push(sn.sid);
    grp.teams.push({tid,sid:sn.sid,tn:(regs[regs.length-1]||{}).tn||tid,season:sn.sn||sn.sid,comp:carComp(sn.sid),
      compFull:carCompFull(sn.sid),gradeFull:abbreviateGrades([...new Set(regs.map(r=>r.gn).filter(Boolean))]),
      gp:st.gp||gamesForGroup(p,regs),pts:st.pts||0,fg:st.fg||0,ft:st.ft||0,tp:st.threePt||0,f:st.fouls||0,
      w:wld.wins||0,l:wld.losses||0,d:wld.draws||0,...(('fo' in st)?{fo:st.fo}:{})});
  }
  // "U13 Boys BRES" next to "U13 MMB08" is the age group said twice. Strip the
  // prefix every grade in the period shares, exactly as the season card does
  // with gradeAbbrev, so what is left is the part that differs: BRES, DR / D.
  for(const g of out){
    const all=[...new Set(g.teams.map(t=>t.gradeFull).filter(Boolean))];
    for(const t of g.teams)t.grade=t.gradeFull?gradeAbbrev(t.gradeFull,all):'';
  }
  out.reverse();                       // groupRegs is newest-first; chronological here
  const cst=CAR[p.uuid];
  if(cst&&cst.rows)for(const g of out){   // real date span once the game lines are in
    const mine=cst.rows.filter(r=>g.sids.indexOf(r.sid)>=0);
    const ds=mine.map(r=>r.date).sort();
    if(ds.length){g.from=ds[0];g.to=ds[ds.length-1];}
    if(mine.length){
      g.zeroN=mine.filter(r=>!(r.pts||0)).length;
      g.linesN=mine.length;                 // the games the count is OF, which
    }                                        // is not always the credited GP
  }
  return out;
}

/* Everything else is a slice of the dated game lines. */
function carRow(g,gid,sid,ps,info,uuid){
  const tid=carTid(gid,g,sid,info);
  const ctx=tid?gameCtx(g,tid):null;
  return{date:String(g.d).slice(0,10),gid,sid,tid,
    tn:(info.map[tid]&&info.map[tid].tn)||teamNameFromGame(g,tid)||'Unknown team',
    comp:(info.map[tid]&&info.map[tid].comp)||carComp(sid),
    compFull:(info.map[tid]&&info.map[tid].compFull)||carCompFull(sid),
    grade:(info.map[tid]&&info.map[tid].grade)||'',
    season:(info.map[tid]&&info.map[tid].season)||((S.idx&&S.idx.seasons&&S.idx.seasons[sid]&&S.idx.seasons[sid].name)||sid),
    pts:ps.pts||0,fg:(ps.pt2||0)+(ps.pt3||0),ft:ps.pt1||0,tp:ps.pt3||0,f:ps.fouls||0,
    opp:(ctx&&ctx.oppN)||'',rn:g.rn||'',vn:g.vn||'',ct:g.ct||'',t:g.t||'',
    sc:(ctx&&ctx.myS!=null&&ctx.oppS!=null)?`${ctx.myS}\u2013${ctx.oppS}`:'',
    res:ctx?resLetter(ctx.myS,ctx.oppS):null};
}

/* Box scores, one request per game, through the same Worker and the same
   S.boxes cache the game rows use — so a game fetched here is free when the
   season below is expanded, and the other way round.

   This exists because the season game files turned out NOT to carry hp/ap for
   this dataset: every credited game needs its box score. That is one request
   per game, not one per season, so it is an explicit action with a count on it
   rather than something that happens quietly when a profile opens. */
async function carBuild(uuid,subset){
  const st=carSt(uuid),p=st.p;
  if(!p||st.building)return;
  const pend=subset||st.pend||[];
  if(!pend.length)return;
  st.building=true;st.cancel=false;
  const info=carInfo(p);
  const prog=el('carprog-'+uuid);
  let done=0,got=0;
  const CONC=6;
  const show=()=>{if(prog)prog.textContent=`Reading box scores\u2026 ${done} of ${pend.length}`;};
  show();
  const queue=pend.slice();
  await Promise.all(Array.from({length:Math.min(CONC,queue.length)},async()=>{
    while(queue.length&&!st.cancel){
      const item=queue.shift();
      const bs=await fetchBox(item.gid);
      done++;if(done%5===0)show();
      if(!bs)continue;
      const mine=[...(bs.h||[]),...(bs.a||[])].find(x=>matchP(x.profileID,uuid));
      if(!mine)continue;
      st.rows.push(carRow(item.g,item.gid,item.sid,mine,info,uuid));
      got++;
    }
  }));
  st.rows.sort((a,b)=>a.date.localeCompare(b.date));
  const taken=new Set(pend.map(x=>x.gid));
  st.pend=(st.pend||[]).filter(x=>!taken.has(x.gid)).concat(st.cancel?queue:[]);
  st.unlined=(Array.isArray(p.games)?p.games.length:0)-st.rows.length;
  st.building=false;
  if(prog)prog.textContent='';
  carDraw(uuid);
}
function carScroll(uuid,dir){
  const s=el('carstrip-'+uuid); if(!s)return;
  s.scrollLeft+=dir*(196*Math.max(1,Math.floor(s.clientWidth/196)-1));
}
function carNav(uuid){
  const s=el('carstrip-'+uuid),L=el('carL-'+uuid),R=el('carR-'+uuid);
  if(!s||!L||!R)return;
  const over=s.scrollWidth-s.clientWidth>4;
  L.classList.toggle('show',over&&s.scrollLeft>2);
  R.classList.toggle('show',over&&s.scrollLeft<s.scrollWidth-s.clientWidth-2);
}
function carWheel(uuid){
  const s=el('carstrip-'+uuid); if(!s||s.dataset.wheel)return;
  s.dataset.wheel='1';
  s.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;      // a real sideways gesture: leave it
    if(s.scrollWidth-s.clientWidth<=4)return;              // nothing to scroll: let the page have it
    const at=(e.deltaY<0&&s.scrollLeft<=0)||(e.deltaY>0&&s.scrollLeft>=s.scrollWidth-s.clientWidth-1);
    if(at)return;                                          // at the end: hand the page back
    e.preventDefault(); s.scrollLeft+=e.deltaY;
  },{passive:false});
  s.addEventListener('scroll',()=>carNav(uuid),{passive:true});
}
function carCancel(uuid){const st=carSt(uuid);st.cancel=true;}

function carAgg(rows){
  const m=new Map();
  for(const r of rows){
    const k=r.tid||('?'+r.season);
    if(!m.has(k))m.set(k,{tid:r.tid,sid:r.sid,tn:r.tn,season:r.season,comp:r.comp,compFull:r.compFull,grade:r.grade,gp:0,pts:0,fg:0,ft:0,tp:0,f:0,w:0,l:0,d:0,zero:0});
    const t=m.get(k);t.gp++;CAR_K.forEach(x=>t[x]+=r[x]||0);
    if(!(r.pts||0))t.zero++;
    if(r.res==='W')t.w++;else if(r.res==='L')t.l++;else if(r.res==='D')t.d++;
  }
  return[...m.values()].sort((a,b)=>b.pts-a.pts);
}
function carYearGroups(rows){
  const m=new Map();
  for(const r of rows){const y=r.date.slice(0,4);if(!m.has(y))m.set(y,[]);m.get(y).push(r);}
  return[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([y,rs])=>({name:y,from:rs[0].date,to:rs[rs.length-1].date,teams:carAgg(rs)}));
}
function carRangeGroup(rows,a,b,label){
  const rs=rows.filter(r=>r.date>=a&&r.date<=b);
  if(!rs.length)return null;
  return{name:label||(carFmtD(a)+' – '+carFmtD(b)),from:a,to:b,range:true,n:rs.length,teams:carAgg(rs)};
}


/* One season game file per season played. Cached in S.games like every other
   reader of these files, so a season already opened costs nothing. */
/* The competition and association behind a season id. There is no PlayHQ field
   that says "this is a tournament" — the nearest published signal is a team's
   organisation.type (CLUB vs ASSOCIATION, captured as `ty` on the club index),
   and that marks teams entered under a host organisation rather than seasons.
   But the competition NAME answers the question on sight: "Nunawading Spectres
   Tournament 2026" against "Kilsyth Junior Domestic". So show it and infer
   nothing. */
function carComp(sid){
  const si=(S.idx&&S.idx.seasons&&S.idx.seasons[sid])||null;
  if(!si)return '';
  return carShort((si.compName||'').trim(),(si.orgName||'').trim());
}
/* "Junior Domestic - Saturday Competition (GEBC) - Melbourne East Basketball
   Association (MEBA)" is three lines of a 186px card to say two things. An
   organisation that publishes its own acronym in brackets gets used as that
   acronym; the words every basketball competition carries are dropped; and the
   association is suppressed when the competition name already contains it. The
   full string stays on the row's title attribute, so nothing is lost. */
const CAR_FILLER=/\s*\b(competition|basketball association(?: inc\.?)?|basketball club|basketball|association)\b/gi;
function carAcro(x){
  const m=String(x||'').match(/\(([A-Z][A-Za-z0-9&]{1,9})\)\s*$/);
  return m?m[1]:null;
}
function carTidy(x){
  return String(x||'').replace(/\([^)]*\)/g,' ').replace(CAR_FILLER,' ')
    .replace(/\s{2,}/g,' ').replace(/[\s.,\u2013\u2014-]+$/,'').trim();
}
/* The acronym rule is for the ORGANISATION only. Applied to the competition it
   threw away the half that distinguishes it: "Junior Domestic - Saturday
   Competition (GEBC)" became "GEBC", which says who runs it and not which
   competition it is. */
function carShort(comp,org){
  const c=carTidy(comp), o=carAcro(org)||carTidy(org);
  if(!c)return o;
  if(!o||c.toLowerCase().includes(o.toLowerCase()))return c;
  return c+' \u00b7 '+o;
}
function carCompFull(sid){
  const si=(S.idx&&S.idx.seasons&&S.idx.seasons[sid])||null;
  if(!si)return '';
  const c=(si.compName||'').trim(), o=(si.orgName||'').trim();
  return (!c)?o:(!o||c.toLowerCase().includes(o.toLowerCase()))?c:(c+' \u2014 '+o);
}
/* `u` entries are "gid|sid|tid" for games played with NO registration — the
   fill-in case. Their tid belongs to a team this player never joined, so it is
   recorded separately from `mine`: it resolves the game's team without
   pretending the player was on that team's books. */
function carUnreg(p){
  const bySid={},tidOf={};
  for(const e of (Array.isArray(p&&p.u)?p.u:[])){
    const[gid,sid,tid]=String(e).split('|');
    if(!gid||!sid)continue;
    (bySid[sid]=bySid[sid]||new Set()).add(gid);
    if(tid)tidOf[gid]=tid;
  }
  return{bySid,tidOf};
}
function carInfo(p){
  const map={},tids=(p&&p.gameTids)||{},bySid={},mine=new Set();
  const un=carUnreg(p);
  for(const sn of p.seasons||[])for(const r of sn.regs||[]){
    if(!r.tid)continue;
    map[r.tid]={tn:r.tn||r.tid,season:sn.sn||sn.sid,sid:sn.sid,comp:carComp(sn.sid),compFull:carCompFull(sn.sid),grade:r.gn||''};
    mine.add(r.tid);
    (bySid[sn.sid]=bySid[sn.sid]||new Set()).add(r.tid);
  }
  return{map,tids,bySid,mine,un};
}

/* Which of this player's teams played this game.

   gameTids is the first answer and the best one, but it does not cover every
   gid — and an unresolved tid is not a cosmetic problem: it costs the team
   name AND the result, because gameCtx needs the tid to know which score was
   theirs. That is what produced a wall of "Unknown team" and 0W 0L.

   So: gameTids, then whichever side of the fixture is a team this player is
   registered to, then the season's own registration when it holds exactly one.
   Only past all three is the team genuinely unknown. */
function teamNameFromGame(g,tid){
  if(!tid)return null;
  if(g.h===tid)return g.hn||null;
  if(g.a===tid)return g.an||null;
  if(g.t1===tid)return g.t1n||null;
  if(g.t2===tid)return g.t2n||null;

}
function carTid(gid,g,sid,info){
  const t=info.tids[gid];

  // A fill-in carries its team in `u`; gameTids does not hold it.
  const ut=info.un&&info.un.tidOf[gid];
  if(ut)return ut;
  const h=hTid(g),a=aTid(g);
  if(h&&info.mine.has(h))return h;
  if(a&&info.mine.has(a))return a;

const SEASON_INFLIGHT={};
async function loadSeasonGames(sids,onDone){
  const need=[...new Set(sids.filter(Boolean))].filter(sid=>!S.games[sid]);
  let done=0;
  if(onDone)onDone(0,need.length);
  for(let i=0;i<need.length;i+=6){
    await Promise.all(need.slice(i,i+6).map(async sid=>{
      if(!SEASON_INFLIGHT[sid])SEASON_INFLIGHT[sid]=sgj('games/bv',sid).then(d=>{
        if(d)S.games[sid]=d; delete SEASON_INFLIGHT[sid]; return d;
      }).catch(()=>{delete SEASON_INFLIGHT[sid];return null;});
      await SEASON_INFLIGHT[sid];
      done++;
    }));
    if(onDone)onDone(done,need.length);
  }
  return need.length;
}

async function carLoadRows(p){
  const uuid=p.uuid,st=carSt(uuid);
  if(st.rows||st.loading)return;
  st.loading=true;
  const info=carInfo(p);
  // ⚠️ WAS seasons[] only. games[] holds every credited game, including ones
  // played as a fill-in for a team this player never registered with — those
  // seasons are NOT in seasons[], so their game files were never fetched and
  // every such game was written off as "in no season file held". The season is
  // named in `u`, which renderUnreg has used since 2026-08-21; the game lines
  // just were not asking for it. On a long career that is most of the shortfall.
  const sids=[...new Set([...(p.seasons||[]).map(s=>s.sid),
                          ...Object.keys(info.un.bySid)].filter(Boolean))];
  const credited=Array.isArray(p.games)?p.games:[];
  const rows=[],missing=[],seen=new Set();
  let noDate=0,noLine=0,notInFile=0;
  const pend=[];
  // Six at a time, not one after another. A twenty-season career fetched
  // sequentially is twenty round trips of a season-sized file before anything
  // appears — "Reading season game files..." and then nothing for ages. The
  // clubs panel already fetches its maps this way (PCLUB_FETCH_BATCH).
  await loadSeasonGames(sids,(done,total)=>{
    const e=el('carstrip-'+uuid);
    if(e&&total&&!st.rows)e.innerHTML=`<div class="car-msg">Reading season game files\u2026 ${done} of ${total}</div>`;
  });
  // ⚠️ games[] IS NOT THE WHOLE ANSWER, AND IT IS REBUILT ONLY ONCE A WEEK.
  // build-player-games.js is the only writer of player.games[] (the fold's merge
  // union aside), and its only SCHEDULED run is the player-games job in
  // weekly-indexes.yml — cron '0 2 * * 0', Sunday. A game played during the week
  // is written to games/bv by that night's crawl and its box score is live within
  // a day, but its id is not in games[] until the following Sunday. The season
  // card reads the registration stats the matrix refreshes NIGHTLY, so it counted
  // that game; the year card only ever summed games[], so it did not — for up to
  // seven days. Measured 2026-11-22: MMB08 69 PTS on the season card against 62
  // on the year card, with a 7-point game played that week.
  //
  // Everything needed to close it is already in hand: loadSeasonGames above has
  // just put every relevant games/bv file into S.games. So games[] is the CREDITED
  // list, and it is unioned with every game in those files this player is actually
  // in. The predicate is the one hydrateDiff already applies to the `c` list for
  // the same reason — roster membership OR a stored box line — and matchP is
  // alias-aware across both stored id lengths (T37), with playerIdSet WeakMap-
  // cached, so this costs a Set lookup per roster id, not a rebuild per call.
  //
  // It can only ADD: every gid in games[] stays in `mine` untouched. A game PlayHQ
  // credits that no season file we hold contains is still out of reach — nothing
  // client-side can find a game that is not on disk.
  const have=new Set(credited), rosterOnly=[];
  for(const sid of sids){
    const gf0=S.games[sid]&&S.games[sid].games;
    if(!gf0)continue;
    for(const gid in gf0){
      if(have.has(gid))continue;
      const g0=gf0[gid];
      if(!g0||!g0.d)continue;
      const inIt=(Array.isArray(g0.p)?g0.p:[]).some(e=>matchP(typeof e==='string'?e:(e&&e.id),uuid))
                 ||!!storedStats(g0,uuid);
      if(inIt){have.add(gid);rosterOnly.push(gid);}
    }
  }
  const mine=credited.concat(rosterOnly);
  for(const sid of sids){
    const gf=S.games[sid]&&S.games[sid].games;
    if(!gf){missing.push((S.idx&&S.idx.seasons&&S.idx.seasons[sid]&&S.idx.seasons[sid].name)||sid);continue;}
    for(const gid of mine){
      if(seen.has(gid))continue;
      const g=gf[gid];
      if(!g){notInFile++;continue;}
      if(!g.d){noDate++;seen.add(gid);continue;}
      const ps=storedStats(g,uuid);
      if(!ps){noLine++;seen.add(gid);pend.push({gid,sid,g});continue;}
      seen.add(gid);
      rows.push(carRow(g,gid,sid,ps,info,uuid));
    }
  }
  rows.sort((a,b)=>a.date.localeCompare(b.date));
  st.rows=rows;st.missing=missing;st.unlined=mine.length-rows.length;st.pend=pend;st.loading=false;
  st.scan={seasons:sids.length,filesRead:sids.length-missing.length,credited:credited.length,rosterOnly:rosterOnly.length,considered:mine.length,
           found:rows.length,noDate:noDate,noLine:noLine,
           notInAnyFile:mine.filter(g=>!seen.has(g)).length};
  if(el('carstrip-'+uuid))carDraw(uuid);
}

/* ── view ──────────────────────────────────────────────────────────────────
   The settings bar is built ONCE and never re-rendered. The first cut drew it
   inside the same innerHTML as the cards, so every click rebuilt the control
   that had just been clicked: the flyout shut, and a half-typed date was wiped
   on the change event. Only the strip, the hint and the button states update. */
function carSet(u,k,v){const s=carSt(u);s[k]=v;carDraw(u);}
function carFlag(u,k){const s=carSt(u);s[k]=!s[k];carDraw(u);}
function carDate(u,which,v){const s=carSt(u);s[which]=v;carDraw(u);}
function carToday(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function carHeroVal(g,hero,meas){
  const tot=carSum(g.teams,hero),gp=carSum(g.teams,'gp');

}
/* Totals carry GP because the other five are sums over it. Per game does not:

/* Like the team cards, the extras are decided once for the whole strip and
   passed in, so every card carries the same cells and the row stays in line. */

   comes from the registration totals and is there the moment a profile opens;
   0PT has to be counted from box scores, which only the Games tab pays for. A
   column that appears later looks like a different card — so the cell is there
   from the start holding an em dash, and fills in when the lines are read. */
function carExtras(groups){
  const out=[];

  if(groups.length)out.push('zero');

}
function carZero(g){
  if(g.zeroN!=null)return g.zeroN;

  return null;
}
function carMini(g,hero,meas,extras){
  const dash='\u2014';

  const v=k=>meas==='G'?(gp?(carSum(g.teams,k)/gp).toFixed(1):dash):carSum(g.teams,k);
  const cells=(meas==='G'?[]:[[gp,'GP']])
    .concat(['pts','f','ft','fg','tp'].map(k=>[v(k),carLbl(k,meas)]));
  for(const k of (extras||[])){
    if(k==='fo'){
      const has=g.teams.some(t=>'fo' in t);
      cells.push([has?v('fo'):dash, meas==='G'?'FO/PG':'FO']);
    } else {
      const z=carZero(g);
      cells.push([z==null?dash:(meas==='G'?(gp?(z/gp).toFixed(1):dash):z), meas==='G'?'0PT/PG':'0PT',
                  z==null?'Counted from the game lines \u2014 open the Games tab to read them':
                          (g.linesN&&g.linesN!==gp?('of '+g.linesN+' game lines read'):'')]);

  return cells.map(([x,l,t])=>`<div class="c"${t?` title="${esc(t)}"`:''}><div class="v">${x}</div><div class="l">${labelHTML(l)}</div></div>`).join('');

function carCard(g,ctx){
  const{chron,vals,avg,mx,hero,meas,cur,first}=ctx;
  const i=chron.indexOf(g);
  const v=g.range?carHeroVal(g,hero,meas):vals[i];
  // No cap. A blanket "drop anything over 200%" was meant to mute early-career
  // noise and instead hid the real jumps, which are the interesting part. Only a
  // zero baseline suppresses it, because that division has no answer.
  const dpc=(!g.range&&avg)?Math.round((v-avg)/avg*100):null;
  const dcl=dpc===null?'car-flat':dpc>2?'car-up':dpc<-2?'car-dn':'car-flat';
  const w=carSum(g.teams,'w'),l=carSum(g.teams,'l'),d=carSum(g.teams,'d');
  // The card header names the competition when there is only one team, so the
  // line under the team name would say it twice. Give that line to the grade
  // instead, and drop the chip beside the name that would then repeat it.
  const headComp=!g.range&&g.teams.length===1&&!!g.teams[0].comp;
  const gradeBelow=!ctx.showSeason&&headComp;
  // At most CAR_BARS bars, centred on this card and spread evenly either side
  // until it runs out of career or out of room. Twenty-odd seasons drawn in a
  // 166px strip is a picket fence; the neighbourhood is what carries meaning.
  // Bars run in the same direction as the cards. Reading right-to-left on a
  // newest-first row and left-to-right on an oldest-first one was two
  // chronologies on one screen.
  let ord=chron.map((_,j)=>j);
  if(ctx.rev)ord.reverse();
  if(ord.length>CAR_BARS){
    const at=g.range?Math.round((ord.length-1)/2):ord.indexOf(i);
    const lo=Math.max(0,Math.min(ord.length-CAR_BARS,at-Math.floor(CAR_BARS/2)));
    ord=ord.slice(lo,lo+CAR_BARS);
  }
  const bars=ctx.bars?`<div class="car-spark"><div class="car-avg" style="bottom:${Math.round(avg/mx*100)}%"></div>${first?`<span class="car-avgl">avg ${meas==='G'?avg.toFixed(1):Math.round(avg)}</span>`:''}${
    ord.map(j=>{const c=chron[j];return `<i class="${g.range?((c.from&&c.to&&c.from<=g.to&&c.to>=g.from)?'me':''):(j===i?'me':'')}" style="height:${Math.max(8,Math.round(vals[j]/mx*100))}%"></i>`;}).join('')}</div>`:'';
  return`<div class="car-card${g.range?' rng':''}${ctx.drill===g.name?' open':''}"
     onclick="carDrill('${esc(ctx.uuid)}','${esc(g.name)}')" title="Show this period game by game">
    <div class="car-ch"><div class="car-nm">${esc(g.name)}</div>
      <div class="car-mt" title="${esc(g.teams.length===1?(g.teams[0].compFull||''):'')}">${g.range?`${g.n} game${g.n===1?'':'s'} · `:''}${(!g.range&&g.teams.length===1&&g.teams[0].comp)?esc(g.teams[0].comp):`${g.teams.length} team${g.teams.length===1?'':'s'}`}</div></div>
    <div class="car-hero"><div class="car-big">${carFmtV(v,meas)}</div><div class="car-unit">${esc(carLbl(hero,meas).toLowerCase())}</div>
      ${dpc===null?'':`<div class="car-delta ${dcl}">${dpc>0?'+':''}${dpc}%</div>`}</div>
    ${bars}
    <div class="car-mini">${carMini(g,hero,meas,ctx.extras)}</div>
    <div class="car-wl"><b style="color:var(--win)">${w}W</b> <b style="color:var(--loss)">${l}L</b>${d?` <b style="color:var(--draw)">${d}D</b>`:''}${(w||l)?` · ${Math.round(w/(w+l)*100)}%`:''}</div>
    <div class="car-teams${g.teams.length>CAR_TEAMS?' car-cut':''}" onclick="event.stopPropagation()">
      <div class="car-tlist">${g.teams.map(t=>{const sub=ctx.showSeason?t.season:(gradeBelow?t.grade:t.comp);return `<div class="car-t"${t.tid&&t.sid?` onclick="loadTeam('${esc(t.tid)}','${esc(t.sid)}')"`:''}>
        <span class="car-gp">${t.gp}</span>
        <span class="car-tn" title="${esc([t.tn,t.grade,t.compFull||t.comp,t.season].filter(Boolean).join(' \u00b7 '))}"><em>${esc(t.tn)}${
          (t.grade&&!gradeBelow)?` <b class="car-gr">${esc(t.grade)}</b>`:''}</em>${
          sub?`<i${gradeBelow?' class="car-gb"':''}>${esc(sub)}</i>`:''}</span>
        <span class="car-tp">${meas==='G'?(t.gp?((t[hero]||0)/t.gp).toFixed(1):'\u2014'):(t[hero]||0)}</span></div>`;}).join('')}</div>
      ${g.teams.length>CAR_TEAMS?`<button class="car-more" data-n="${g.teams.length-CAR_TEAMS}" onclick="carMore(this)">+${g.teams.length-CAR_TEAMS} more</button>`:''}

/* A window with one end open: a start alone runs to today, an end alone runs
   back to the first game. The empty field stays empty — filling it in would be
   this code inventing a date the user did not choose. */
function carWindow(st){
  if(!st.a&&!st.b)return null;
  const a=st.a||'0000-01-01', b=st.b||carToday();
  if(a>b)return{err:'Start date is after the end date.'};
  const label=st.a&&st.b?carFmtD(st.a)+' – '+carFmtD(st.b)
            :st.a?'From '+carFmtD(st.a)
            :'Up to '+carFmtD(st.b);
  return{a,b,label};
}

/* Why the game-line scan came back with nothing. A blank panel that says
   "no seasons" when the player plainly has seasons is the silent-failure case:
   name the stage that produced zero so it can be fixed rather than guessed. */
function carWhyEmpty(st,p){
  const n=st.scan||{};
  if(!p||!Array.isArray(p.games)||!p.games.length)
    return{msg:'This profile holds no game list, so year and range totals cannot be built from it. Season totals still work.'};
  if(n.filesRead===0)
    return{msg:'None of the '+n.seasons+' season game files loaded'+(st.missing.length?' ('+st.missing.join(', ')+')':'')+'.'};
  const pend=(st.pend||[]).length;
  if(pend)return{msg:'',build:pend};
  const bits=[n.credited+' credited games'];
  if(n.notInAnyFile)bits.push(n.notInAnyFile+' not present in any season file held');
  if(n.noDate)bits.push(n.noDate+' with no date');
  if(st.missing.length)bits.push(st.missing.length+' season file(s) failed: '+st.missing.join(', '));
  return{msg:'No dated game lines found \u2014 '+bits.join(', ')+'.'};
}
/* A thirteen-team year ran the card down the page and left every other card in
   the row short. The list stops at CAR_TEAMS and says how many it is holding
   back; the cards stay one height until you ask one of them to grow. */
function carMore(btn){
  const box=btn.parentElement, open=box.classList.toggle('open');
  btn.textContent=open?'Show fewer':('+'+btn.dataset.n+' more');
}
/* ── GAME DRILL-DOWN (v1.60) ──────────────────────────────────────────────
   Clicking a period card draws its games as one full-width chart below the
   strip — not a second row of cards. A game has no teams to list and one number
   to show, so a card per game is mostly empty space, while eighteen bars in one
   block answer the question the season total cannot: whether 11.2 a game is
   eleven every week or two 25s and a row of fours.

   The lines come from the same box scores Calendar year uses and the same
   S.boxes cache the season game rows fill, so a season already looked at costs
   nothing, and one looked at here is free afterwards. */
function carGamesOf(st,g){
  const rows=st.rows||[];
  if(g.sids&&g.sids.length)return rows.filter(r=>g.sids.indexOf(r.sid)>=0);
  if(g.from&&g.to)return rows.filter(r=>r.date>=g.from&&r.date<=g.to);
  return [];
}
function carPendOf(st,g){
  const pend=st.pend||[];
  if(g.sids&&g.sids.length)return pend.filter(x=>g.sids.indexOf(x.sid)>=0);
  if(g.from&&g.to)return pend.filter(x=>{const d=String((x.g&&x.g.d)||'').slice(0,10);return d>=g.from&&d<=g.to;});
  return [];
}
async function carDrill(uuid,name){

  st.drilling=true; carDraw(uuid);
  if(!st.rows&&st.p){ await carLoadRows(st.p); carDraw(uuid); }
  const g2=(st.groups||[]).find(x=>x.name===name)||g;
  const pend=carPendOf(st,g2);

function carDraw(uuid){
  const st=carSt(uuid), p=st.p;
  const strip=el('carstrip-'+uuid), hintEl=el('carhint-'+uuid), noteEl=el('carnote-'+uuid), bar=el('carbar-'+uuid);
  if(!strip)return;
  if(bar){
    bar.querySelectorAll('button[data-k]').forEach(btn=>{
      const k=btn.dataset.k, v=btn.dataset.v;
      btn.classList.toggle('on', v===undefined?!!st[k]:st[k]===v);
    });
    const yr=st.mode==='Y';
    const rgw=el('carrgw-'+uuid); if(rgw)rgw.classList.toggle('on',yr);
    const rg=el('carrg-'+uuid); if(rg)rg.classList.toggle('on',yr&&!!st.range);
  }
  const rangeOn=st.range&&st.mode==='Y';   // a date window is a slice of game lines
  const needRows=st.mode==='Y';
  if(needRows&&!st.rows){
    strip.innerHTML=`<div class="car-msg">${st.loading?'Reading season game files…':'Season game files not loaded.'}</div>`;
    if(hintEl)hintEl.textContent='';
    if(noteEl)noteEl.innerHTML='';
    if(!st.loading&&p)carLoadRows(p);
    return;
  }
  // A registration with no games played is not a period in a career — a team
  // entered for next season renders a card of zeros and a -100% against the
  // season before it. Dropped from the cards; the season history below still
  // lists it, which is where an upcoming registration belongs.
  const base=(st.mode==='Y'?carYearGroups(st.rows||[]):carSeasonGroups(p||{seasons:[]}))
    .filter(g=>carSum(g.teams,'gp')>0);
  if(!base.length){
    const why=needRows?carWhyEmpty(st,p):{msg:'No seasons on this profile.'};
    strip.innerHTML=`<div class="car-msg">${esc(why.msg)}</div>`;
    const bEl0=el('carbuild-'+uuid);
    if(bEl0){
      bEl0.classList.toggle('on',!!why.build);
      bEl0.innerHTML=why.build?`<span id="carprog-${esc(uuid)}">Reading ${why.build} box score${why.build===1?'':'s'}\u2026</span>`:'';
      if(why.build&&!st.building)carBuild(uuid);
    }
    if(hintEl)hintEl.textContent='';if(noteEl)noteEl.textContent='';
    return;}

  const chron=base.slice(), hero=st.hero, meas=st.meas||'T';
  const vals=chron.map(g=>carHeroVal(g,hero,meas));
  const mx=Math.max(...vals,1);
  const avg=vals.reduce((a,b)=>a+b,0)/Math.max(1,vals.length);
  const list=st.order==='N'?chron.slice().reverse():chron.slice();
  const cur=st.order==='N'?list[0]:list[list.length-1];

  let hint='';
  if(rangeOn){
    const win=carWindow(st);
    if(!win)hint='Enter a start date, an end date, or both.';
    else if(win.err)hint=win.err;
    else{
      const rg=carRangeGroup(st.rows||[],win.a,win.b,win.label);
      if(rg)list.unshift(rg);else hint='No games in that window.';
    }
  }
  // Year totals built from an incomplete set are a silent wrong answer, so the
  // offer to finish them sits above the cards whenever games are still missing —
  // not only when nothing rendered at all.
  // Calendar year reads the box scores it needs as soon as it is selected. The
  // first build asked first, with a count and a button; the count is not a
  // decision anyone wants to make twice, so now it just says what it is doing.
  const bEl=el('carbuild-'+uuid), pend=(st.pend||[]).length;
  if(bEl){
    const busy=needRows&&(pend>0||st.building);
    bEl.classList.toggle('on',busy);
    bEl.innerHTML=busy?`<span id="carprog-${esc(uuid)}">Reading ${pend} box score${pend===1?'':'s'}\u2026</span>`:'';
    if(needRows&&pend>0&&!st.building)carBuild(uuid);
  }
  const ctx={chron,vals,avg,mx,hero,meas,cur,uuid,extras:carExtras(chron),drill:st.drill,bars:st.bars,rev:st.order==='N',showSeason:st.mode!=='S'};
  st.groups=list.slice();
  const lead=list.find(g=>!g.range);          // leftmost period card carries the avg label
  strip.innerHTML=list.map(g=>carCard(g,{...ctx,first:lead===g})).join('');
  carWheel(uuid);carNav(uuid);
  const dEl=el('cardrill-'+uuid);
  if(dEl){
    const dg=st.drill?list.find(x=>x.name===st.drill):null;
    dEl.innerHTML=dg?carGameChart(uuid,dg,hero):'';   // one game IS one game: the measure has no meaning here
  }
  if(hintEl)hintEl.textContent=hint;

  // Nothing about the fetch belongs on screen. A game whose box score held no
  // line for this player is already counted in the season figures; a season file
  // that would not load is a fault for the console, not a caption under a chart.
  if(noteEl)noteEl.textContent='';
  hydrateHighs(uuid);   // the highs read the same rows; fill them in as they land
  if(needRows&&st.missing.length&&!st._warned){
    st._warned=1;
    console.warn('[career] season game files did not load for '+(p&&p.uuid)+':',st.missing.join(', '),
      '\u2014 sgj returned null from both origins, so either games/bv/{sid}.json does not exist for these seasons or both fetches failed.');
  }
}
