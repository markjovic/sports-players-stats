# .github/workflows/fix-flag-collision.yml
name: Fix Flag Collision

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (sparse — affected season file only)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
          sparse-checkout: |
            games/bv/17120864.json
          sparse-checkout-cone-mode: false

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove legacy flag from game 1d8c31dc
        run: |
          node -e "
            const fs   = require('fs');
            const file = 'games/bv/17120864.json';
            const gf   = JSON.parse(fs.readFileSync(file, 'utf8'));
            const g    = gf.games['1d8c31dc'];
            if (!g) { console.log('Game not found'); process.exit(1); }
            if (!g.legacy) { console.log('legacy flag not set — nothing to do'); process.exit(0); }
            console.log('Before:', JSON.stringify(g));
            delete g.legacy;
            console.log('After: ', JSON.stringify(g));
            fs.writeFileSync(file, JSON.stringify(gf), 'utf8');
          "

      - name: Commit
        run: |
          git add games/bv/17120864.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git fetch origin main
            git merge -X ours FETCH_HEAD --no-edit
            git commit -m "fix: remove legacy flag from forfeit game 1d8c31dc (season 17120864)"
            git push origin main
          fi
