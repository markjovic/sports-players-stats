# .github/workflows/diagnose-season-games.yml
name: Diagnose Season Games

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season ID to inspect'
        required: true
        default: '01621a80'
      sample:
        description: 'Number of sample games per category'
        required: false
        default: '5'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run diagnostic
        run: |
          node diagnose-season-games.js \
            --season=${{ github.event.inputs.season }} \
            --sample=${{ github.event.inputs.sample }}
